let nextRivalId=20, rivalCount=0;
let mouseV={x:-99,y:-99};
let btns=[];

const player = ()=> cars[0];
const heatMul = ()=> 1 + heat/40;
const sectorOf = prog => ((Math.floor(((prog%1)+1)%1 * SECTORS) % SECTORS) + SECTORS) % SECTORS;
const slotAt = (s,lane)=> board[s*4+lane];
function sectorHas(s,key){ for(let l=0;l<4;l++) if(board[s*4+l].key===key) return true; return false; }
function upgCost(u){ return Math.round(u.base * Math.pow(1.7, upgLevel[u.key])); }

// ---------------------------------------------------------------- the board
function makeBoard(){
  board=[];
  for(let s=0;s<SECTORS;s++){
    for(let lane=0;lane<4;lane++){
      const p = trackPoint((s+LANE_FRAC[lane])/SECTORS, LANE_OFF[lane]);
      board.push({ s, lane, x:p.x, y:p.y, key:null, cd:0, crossfire:false, kids:0 });
    }
  }
  recompute();
}

// heat is the single escalation dial: it multiplies every payout and it makes
// every rival that spawns tougher. Safe pieces carry negative heat, so playing
// it safe costs you twice.
function recompute(){
  heat = lapNo*3;
  danger = new Array(SECTORS).fill(0);
  payMul = new Array(SECTORS).fill(1);
  placed = 0;
  for(const sl of board){
    if(!sl.key) continue;
    placed++;
    const d = PIECES[sl.key];
    heat += d.heat;
    if(d.heat>0) danger[sl.s] += d.heat;
  }
  for(const sl of board){
    if(sl.key==='light'){
      for(let k=-1;k<=1;k++) payMul[(sl.s+k+SECTORS)%SECTORS] *= 1.4;
    }
  }
  for(let s=0;s<SECTORS;s++){
    // a ramp over an oil slick is a guaranteed highlight reel
    if(sectorHas(s,'ramp') && sectorHas(s,'oil')) payMul[s] *= 2;
  }
  for(const sl of board){
    // turrets covering both verges of one sector fire twice as fast
    sl.crossfire = sl.key==='turret' && slotAt(sl.s,2).key==='turret' && slotAt(sl.s,3).key==='turret';
  }
  heat = Math.max(0, heat);
}

function canPlace(sl, key){
  if(!sl || !key || sl.key) return false;
  return PIECES[key].road ? isRoadLane(sl.lane) : !isRoadLane(sl.lane);
}

function place(sl, key){
  const d = PIECES[key];
  if(!canPlace(sl,key)){
    if(sl && sl.key) say('THAT SLOT IS TAKEN');
    else say(d.road ? 'THAT ONE BOLTS TO THE ROAD' : 'THAT ONE GOES ON THE VERGE');
    return false;
  }
  if(scrap < d.cost){ say('NOT ENOUGH SCRAP'); return false; }
  scrap -= d.cost;
  sl.key = key; sl.cd = key==='garage' ? 2.5 : 0.6; sl.kids = 0;
  recompute();
  Snd.pickup();
  floater(sl.x, sl.y, '-'+d.cost, '#f0503c');
  return true;
}

function salvage(sl){
  if(!sl || !sl.key) return;
  const back = Math.round(PIECES[sl.key].cost*0.5);
  scrap += back; 
  sl.key = null; sl.cd = 0; sl.kids = 0;
  recompute();
  Snd.hit();
  floater(sl.x, sl.y, '+'+back, '#9d8ea5');
}

// ---------------------------------------------------------------- economy
function pay(amount, x, y, label){
  amount = Math.max(0, Math.round(amount));
  if(amount<=0) return;
  scrap += amount; earned += amount;
  floater(x, y, (label?label+' ':'')+'+'+amount, '#e0b73c');
}
function floater(x,y,text,col){ floaters.push({x,y,text,col,t:0,life:1.1}); }
function say(msg){ toast=msg; toastT=1.6; }

// ---------------------------------------------------------------- rivals
const RIVAL_KIT = [
  { name:'CINDER',  body:'#c23a5a' },
  { name:'HUSK',    body:'#5f8f6a' },
  { name:'TALON',   body:'#9a6bd6' },
  { name:'RATKING', body:'#c98a3a' }
];

function spawnRival(sl, fromGarage){
  if(rivalCount >= 5) return;
  const kit = pick(RIVAL_KIT);
  const c = makeCar(nextRivalId++, false, kit);
  const p = trackPoint((sl.s+0.5)/SECTORS, rnd(-70,70));
  c.x=p.x; c.y=p.y; c.angle=p.ang;
  c.isRival = true; c.home = fromGarage ? sl : null;
  c.model = (nextRivalId+1) % MODELS.length;
  c.maxHp = c.hp = Math.round(45 + heat*1.1);
  c.spdMul = clamp(0.84 + heat*0.004, 0.84, 1.12);
  // gunMul drives both rate and damage, so one number makes early rivals harmless
  c.gunMul = clamp(0.40 + heat*0.004, 0.40, 0.95);
  c.missiles = heat>45 ? 1 : 0;
  c.minesLeft = 0;
  c.invuln = 0.8;
  c.sprite = bakeCarSprites(c);
  cars.push(c); rivalCount++;
  if(fromGarage) sl.kids++;
  particles(c.x,c.y,6,10,{col:['#b05ad6','#e0b73c'],spd0:30,spd1:120,size:2,life0:0.2,life1:0.5});
}

function killRival(c){
  const worth = Math.round(18*heatMul());
  pay(worth, c.x, c.y, 'KILL');
  kills++;
  if(c.home) c.home.kids = Math.max(0, c.home.kids-1);
  rivalCount = Math.max(0, rivalCount-1);
}

// ---------------------------------------------------------------- piece logic
function updatePieces(dt){
  for(const sl of board){
    if(!sl.key) continue;
    const d = PIECES[sl.key];
    sl.cd -= dt * (sl.crossfire ? 2 : 1);
    if(sl.cd > 0) continue;

    if(sl.key==='turret'){
      sl.cd = 1.15;
      let best=null, bd=250;
      for(const c of cars){
        if(c.dead || c.air>0) continue;
        const dd=Math.hypot(c.x-sl.x, c.y-sl.y);
        if(dd<bd){ bd=dd; best=c; }
      }
      if(!best){ sl.cd = 0.25; continue; }
      const lead = bd/420;
      const a = Math.atan2(best.y+best.vy*lead - sl.y, best.x+best.vx*lead - sl.x) + rnd(-0.05,0.05);
      shots.push({ kind:'bullet', x:sl.x, y:sl.y, z:8,
        vx:Math.cos(a)*420, vy:Math.sin(a)*420, life:1.1, owner:-2, dmg:6 });
      Snd.shot();
      particles(sl.x+Math.cos(a)*8, sl.y+Math.sin(a)*8, 10, 2,
        {col:['#ffe9a8'],spd0:10,spd1:40,size:1,life0:0.05,life1:0.12,grav:0});
    }
    else if(sl.key==='garage'){
      sl.cd = clamp(9 - heat*0.06, 4, 9);
      if(sl.kids < 2) spawnRival(sl, true);
    }
    else if(sl.key==='mines'){
      sl.cd = 2.4;
      if(mines.length >= 16) continue;
      const p = trackPoint((sl.s + Math.random())/SECTORS, rnd(-TRK.HW*0.8, TRK.HW*0.8));
      mines.push({ x:p.x, y:p.y, owner:-3, arm:0.5, life:26, blink:0 });
    }
    else sl.cd = 1;
  }
}

// road pieces are zones, checked against every car every frame
function updateZones(dt){
  for(const c of cars){
    if(c.dead || !c.proj) continue;
    const s = sectorOf(c.proj.prog);
    const frac = (((c.proj.prog*SECTORS)%1)+1)%1;
    const sl = slotAt(s, frac<0.5 ? 0 : 1);
    if(c.roadSlot !== sl){ c.roadSlot = sl; c.rampDone = false; }
    const road = sl.key;
    if(road==='oil') c.oilT = 0.3;
    else if(road==='boost') c.boostT = 0.4;
    else if(road==='ramp' && !c.rampDone && c.air<=0 && Math.abs(c.speed||0) > 95){
      c.rampDone = true;
      c.vz = sectorHas(s,'oil') ? 168 : 124;
      c.air = 0.5;
      Snd.crash();
      particles(c.x,c.y,3,8,{col:['#c9a06a','#8a5a3a'],spd0:20,spd1:90,size:2,life0:0.2,life1:0.5});
    }
  }
}

function landCar(c){
  const off = c.proj ? Math.abs(c.proj.off) : 0;
  cam.shake = Math.min(7, cam.shake+2);
  particles(c.x,c.y,3,10,{col:['#9a8aa0','#6b5c72'],spd0:20,spd1:110,size:2,life0:0.15,life1:0.45});
  if(off > TRK.HW*0.92){
    Snd.crash();
    c.vx*=0.3; c.vy*=0.3;
    damage(c, 15, null);
    if(c.isPlayer) pay(16*heatMul(), c.x, c.y, 'WIPEOUT');
  } else {
    c.vx*=0.9; c.vy*=0.9;
    if(c.isPlayer) pay(9*heatMul(), c.x, c.y, 'AIR');
  }
}

// ---------------------------------------------------------------- the lap
function updateDirector(dt){
  const me = player();
  updatePieces(dt);
  updateZones(dt);

  // pay out on leaving a sector, so the money lands where the danger was
  if(me.proj && !me.dead){
    const s = sectorOf(me.proj.prog);
    if(lastSector < 0) lastSector = s;
    else if(s !== lastSector){
      const from = lastSector;
      let amt = (0.6 + danger[from]*0.85) * payMul[from] * heatMul();
      if(sectorHas(from,'scrap')) amt += 8*heatMul();
      const c0 = slotAt(from,0);
      pay(amt, c0.x, c0.y, null);
      if(sectorHas(from,'bay') && me.hp < me.maxHp){
        me.hp = Math.min(me.maxHp, me.hp+11);
        floater(c0.x, c0.y, '+HULL', '#4ade80');
      }
      lastSector = s;
    }
  }

  if(me.lap >= lapNo){
    lapNo = me.lap + 1;
    recompute();
    pay(20*heatMul(), me.x, me.y, 'LAP '+me.lap);
    say('LAP '+me.lap+' CLEAR  -  HEAT '+heat);
    // the show is not allowed to get boring. Past lap 3 the house sends its own
    // cars in whether you built a garage or not, so idling is never a strategy.
    const quota = Math.floor(lapNo/3);
    if(lapNo>=4 && rivalCount < quota){
      const far = (sectorOf(me.proj ? me.proj.prog : 0) + 8) % SECTORS;
      spawnRival(slotAt(far, 2), false);
      say('THE HOUSE SENT ONE IN');
    }
  }

  // rivals die for good, and pay out when they do
  for(let i=cars.length-1;i>0;i--){
    const c=cars[i];
    if(c.isRival && c.dead){ killRival(c); cars.splice(i,1); }
  }
  if(player().dead) endRun('YOUR DRIVER IS SCRAP');

  for(let i=floaters.length-1;i>=0;i--){
    const f=floaters[i]; f.t+=dt;
    if(f.t>=f.life) floaters.splice(i,1);
  }
  if(toastT>0) toastT-=dt;
}

function buyUpgrade(u){
  const cost = upgCost(u);
  if(scrap < cost){ say('NOT ENOUGH SCRAP'); return; }
  const me = player();
  if(u.key==='patch' && me.hp >= me.maxHp){ say('HULL IS ALREADY FULL'); return; }
  scrap -= cost;
  Snd.pickup();
  if(u.key==='armour'){ me.maxHp += 25; me.hp = Math.min(me.maxHp, me.hp+25); }
  if(u.key==='engine'){ me.spdMul = (me.spdMul||1) * 1.08; }
  if(u.key==='guns'){ me.gunMul = (me.gunMul||1) * 1.2; }
  if(u.key==='patch'){ me.hp = Math.min(me.maxHp, me.hp+45); }
  upgLevel[u.key]++;
  floater(me.x, me.y, u.name, '#57b7d6');
}

// ---------------------------------------------------------------- run start / end
function startRun(){
  cars=[]; shots=[]; mines=[]; fx=[]; skids=[]; blocks=[]; hazards=[]; finishOrder=[];
  floaters=[]; runOver=null; toast=null; toastT=0;
  mode='race'; level=1; arenaShape='rect';
  makeTrack(); buildRacePads(); makeBoard();

  scrap=70; earned=0; kills=0; lapNo=1; placed=0;
  lastSector=-1; sel=null; hover=null; rivalCount=0; nextRivalId=20;
  upgLevel={armour:0,engine:0,guns:0,patch:0};
  gameSpeed=1;

  const me = makeCar(0, true, PALETTE[0]);
  me.model = 0;
  me.spdMul = 1; me.gunMul = 1;
  const p = trackPoint(0.03, 0);          // just past the line: lap 1 is a full lap
  me.x=p.x; me.y=p.y; me.angle=p.ang;
  me.lineOff = 0; me.lap = 0;
  const pr = trackProject(me.x, me.y);
  me.prog = pr.prog; me.total = pr.prog;
  me.missiles = 2; me.minesLeft = 1; me.invuln = 2;
  me.sprite = bakeCarSprites(me);
  cars.push(me);

  recompute();
  setCam('board');
  cam.x=0; cam.y=0; cam.shake=0;
  matchTime=0; winner=null; paused=false;
  state='play';
}

function endRun(reason){
  if(state!=='play') return;
  state='over';
  runOver = {
    reason, laps:lapNo-1, earned, kills, placed, heat,
    score: Math.round(earned + (lapNo-1)*40 + kills*12)
  };
  try{
    const prev = +(localStorage.getItem('scrapheap.loop.best')||0);
    runOver.best = Math.max(prev, runOver.score);
    if(runOver.score > prev) localStorage.setItem('scrapheap.loop.best', String(runOver.score));
  }catch(e){ runOver.best = runOver.score; }
  Snd.engineOff();
}

function setCam(m){
  camMode = m;
  setZoom(m==='board' ? ZOOM_BOARD : ZOOM_CHASE);
}

// ---------------------------------------------------------------- mouse
function canvasPos(e){
  const r = cv.getBoundingClientRect();
  return { x:(e.clientX-r.left)*(W/r.width), y:(e.clientY-r.top)*(H/r.height) };
}
function screenToWorld(px,py){
  return { x:(px - W/2)/S + cam.x, y:(py - H/2)/(S*KY) + cam.y };
}
function pickSlot(px,py){
  const w = screenToWorld(px,py);
  let best=null, bd=44;
  for(const sl of board){
    const d = Math.hypot(sl.x-w.x, (sl.y-w.y));
    if(d<bd){ bd=d; best=sl; }
  }
  return best;
}
function hitBtn(px,py){
  const vx=px/PX, vy=py/PX;
  for(const b of btns) if(vx>=b.x && vx<=b.x+b.w && vy>=b.y && vy<=b.y+b.h) return b;
  return null;
}

cv.addEventListener('contextmenu', e=>e.preventDefault());
cv.addEventListener('mousemove', e=>{
  const m = canvasPos(e);
  mouseV.x = m.x/PX; mouseV.y = m.y/PX;
  hover = (state==='play' && !hitBtn(m.x,m.y)) ? pickSlot(m.x,m.y) : null;
});
cv.addEventListener('mouseleave', ()=>{ hover=null; mouseV.x=mouseV.y=-99; });
cv.addEventListener('mousedown', e=>{
  Snd.boot();
  const m = canvasPos(e);
  if(state==='title'){ startRun(); return; }
  if(state==='over'){ state='title'; return; }
  const b = hitBtn(m.x, m.y);
  if(b){ b.act(); return; }
  const sl = pickSlot(m.x, m.y);
  if(!sl) { sel=null; return; }
  if(e.button===2 || e.shiftKey){ salvage(sl); return; }
  if(sel) place(sl, sel);
});

// ---------------------------------------------------------------- board art
const TAGS = { oil:'OIL', ramp:'JMP', mines:'MIN', boost:'BST',
               turret:'GUN', garage:'GAR', scrap:'SCR', light:'LGT', bay:'FIX' };

// the strip of asphalt belonging to one sector, as a path in camera space
function roadBand(t0, t1, halfW){
  const steps=7, p=new Path2D(), a=t0/SECTORS, b=t1/SECTORS, L=[], R=[];
  for(let i=0;i<=steps;i++){
    const t=lerp(a,b,i/steps);
    L.push(trackPoint(t,-halfW)); R.push(trackPoint(t,halfW));
  }
  p.moveTo(L[0].x*S, L[0].y*KY*S);
  for(let i=1;i<=steps;i++) p.lineTo(L[i].x*S, L[i].y*KY*S);
  for(let i=steps;i>=0;i--) p.lineTo(R[i].x*S, R[i].y*KY*S);
  p.closePath();
  return p;
}

function drawRoadPieces(){
  ctx.save(); ctx.translate(camOx(), camOy());
  for(let s=0;s<SECTORS;s++){
    for(let lane=0;lane<2;lane++){
      const sl=slotAt(s,lane);
      if(!sl.key || !inView(sl.x, sl.y, 220)) continue;
      const a = s+lane*0.5, b = a+0.5;
      if(sl.key==='oil'){
        ctx.fillStyle='rgba(22,18,30,.86)'; ctx.fill(roadBand(a,b, TRK.HW-8));
        ctx.fillStyle='rgba(120,96,190,.20)'; ctx.fill(roadBand(a,b, TRK.HW-34));
      } else if(sl.key==='boost'){
        ctx.fillStyle='rgba(62,140,180,.42)'; ctx.fill(roadBand(a,b, TRK.HW-10));
        ctx.fillStyle='rgba(150,230,255,.45)'; ctx.fill(roadBand(a,b, TRK.HW*0.34));
      } else if(sl.key==='mines'){
        ctx.fillStyle='rgba(120,92,20,.34)'; ctx.fill(roadBand(a,b, TRK.HW-8));
        ctx.strokeStyle='rgba(224,183,60,.75)'; ctx.lineWidth=1.6*S;
        ctx.stroke(roadBand(a,b, TRK.HW-8));
      } else if(sl.key==='ramp'){
        ctx.fillStyle='rgba(120,80,44,.92)'; ctx.fill(roadBand(a,b, TRK.HW-6));
        ctx.fillStyle='rgba(214,166,110,.85)'; ctx.fill(roadBand(lerp(a,b,0.55),b, TRK.HW-6));
        ctx.fillStyle='rgba(255,228,170,.9)';  ctx.fill(roadBand(lerp(a,b,0.85),b, TRK.HW-6));
      }
    }
  }
  ctx.restore();
}

function drawSideProp(sl){
  const d = PIECES[sl.key], r = d.r;
  const p = toScreen(sl.x, sl.y, 0);
  drawShadow(sl.x, sl.y, r*2+4, r*1.7+4, 0, 0.45, true);
  const shape = c => { c.beginPath(); c.ellipse(0,0,r,r*0.86,0,0,TAU); c.closePath(); };
  extrude(p.x, p.y, d.h, 0, shape, shade(d.col,0.5), c=>{
    c.fillStyle = d.col; shape(c); c.fill();
    c.fillStyle = shade(d.col,1.4);
    c.beginPath(); c.ellipse(-r*0.16,-r*0.18, r*0.56, r*0.46, 0,0,TAU); c.fill();
    if(sl.key==='turret'){
      c.fillStyle='#241d2c'; c.fillRect(-1.5, -r*0.9, 3, r*1.5);
      c.fillStyle = sl.crossfire ? '#ffe9a8' : '#8f2a20';
      c.beginPath(); c.arc(0,0,r*0.3,0,TAU); c.fill();
    } else if(sl.key==='garage'){
      c.fillStyle='#241d2c'; c.fillRect(-r*0.55, -r*0.2, r*1.1, r*0.6);
    } else if(sl.key==='light'){
      c.fillStyle='#fff6d0'; c.beginPath(); c.arc(0,0,r*0.8,0,TAU); c.fill();
    } else if(sl.key==='bay'){
      c.fillStyle='#0f2a18'; c.fillRect(-r*0.5,-1.6, r, 3.2); c.fillRect(-1.6,-r*0.45, 3.2, r*0.9);
    } else if(sl.key==='scrap'){
      c.fillStyle=shade(d.col,0.7); c.fillRect(-r*0.7,-r*0.35, r*0.6, r*0.5);
      c.fillStyle=shade(d.col,1.15); c.fillRect(r*0.05,-r*0.15, r*0.55, r*0.4);
    }
  });
  // floodlights throw a pool of light back onto the road
  if(sl.key==='light'){
    const road = slotAt(sl.s,0);
    const q = toScreen(road.x, road.y, 0);
    ctx.save(); ctx.globalAlpha=0.13; ctx.fillStyle='#ffe9a8';
    ctx.translate(q.x,q.y); ctx.scale(S,S*KY);
    ctx.beginPath(); ctx.ellipse(0,0,TRK.HW*0.95,TRK.HW*0.8,0,0,TAU); ctx.fill();
    ctx.restore(); ctx.globalAlpha=1;
  }
}

// short screen-space labels keep the board readable when zoomed all the way out
function drawTags(){
  ctx.save();
  ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.font='bold '+Math.round(5*PX)+'px monospace';
  for(const sl of board){
    if(!sl.key || !inView(sl.x, sl.y, 80)) continue;
    const d = PIECES[sl.key];
    const p = toScreen(sl.x, sl.y, d.h + 7);
    ctx.fillStyle='rgba(10,7,14,.8)';
    const w = TAGS[sl.key].length*3.4*PX;
    ctx.fillRect(p.x-w/2-PX, p.y-5*PX, w+2*PX, 6*PX);
    ctx.fillStyle = d.col;
    ctx.fillText(TAGS[sl.key], p.x, p.y+PX);
  }
  ctx.restore();
  ctx.textBaseline='top'; ctx.textAlign='left';
}

// empty slots only appear while you are holding a piece
function drawSlots(){
  if(state!=='play') return;
  ctx.save();
  for(const sl of board){
    const isHover = sl===hover;
    const valid = sel && canPlace(sl, sel);
    if(!valid && !isHover) continue;
    if(isHover && !sl.key && !valid) continue;
    const p = toScreen(sl.x, sl.y, 0);
    ctx.save(); ctx.translate(p.x,p.y); ctx.scale(S,S*KY);
    const rr = isRoadLane(sl.lane) ? 24 : 20;
    ctx.lineWidth = (isHover?3:1.6)/1;
    ctx.strokeStyle = sl.key ? (isHover?'#f0503c':'rgba(240,80,60,.35)')
                             : (isHover?'#ffe9a8':'rgba(224,183,60,.42)');
    ctx.beginPath(); ctx.ellipse(0,0,rr,rr*0.8,0,0,TAU); ctx.stroke();
    ctx.restore();
  }
  // ghost of the piece you are about to drop
  if(sel && hover && canPlace(hover, sel)){
    const d=PIECES[sel];
    const p=toScreen(hover.x,hover.y,0);
    ctx.globalAlpha=0.55;
    ctx.save(); ctx.translate(p.x,p.y - (d.h||0)*S*0.5); ctx.scale(S,S*KY);
    ctx.fillStyle=d.col;
    ctx.beginPath(); ctx.ellipse(0,0,Math.max(8,d.r||14), Math.max(6,(d.r||14)*0.8),0,0,TAU); ctx.fill();
    ctx.restore();
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

function drawFloaters(){
  ctx.save();
  ctx.textAlign='center'; ctx.font='bold '+Math.round(6*PX)+'px monospace';
  for(const f of floaters){
    const k=f.t/f.life;
    const p=toScreen(f.x, f.y, 16 + k*22);
    ctx.globalAlpha=clamp(1-k*k, 0, 1);
    ctx.fillStyle='rgba(10,7,14,.75)';
    ctx.fillText(f.text, p.x+PX, p.y+PX);
    ctx.fillStyle=f.col;
    ctx.fillText(f.text, p.x, p.y);
  }
  ctx.restore();
  ctx.globalAlpha=1; ctx.textAlign='left';
}

// ---------------------------------------------------------------- HUD
function bar(x,y,w,h,v,col,bg){
  ctx.fillStyle=bg||'rgba(10,7,14,.8)'; ctx.fillRect(x-1,y-1,w+2,h+2);
  ctx.fillStyle=col; ctx.fillRect(x,y,Math.round(w*clamp(v,0,1)),h);
}
function centerText(t,col,y,size){
  ctx.textAlign='center'; ctx.font='bold '+(size||10)+'px monospace'; ctx.fillStyle=col;
  ctx.fillText(t, VW/2, y); ctx.textAlign='left';
}
function panel(x,y,w,h,a){
  ctx.fillStyle='rgba(12,9,16,'+(a==null?0.82:a)+')'; ctx.fillRect(x,y,w,h);
  ctx.strokeStyle='rgba(120,100,140,.25)'; ctx.lineWidth=1; ctx.strokeRect(x+0.5,y+0.5,w-1,h-1);
}
function hudBtn(x,y,w,h,act){ btns.push({x,y,w,h,act}); return mouseV.x>=x&&mouseV.x<=x+w&&mouseV.y>=y&&mouseV.y<=y+h; }

function drawLoopHUD(){
  btns=[];
  const me=player();
  ctx.save(); ctx.scale(PX,PX);
  ctx.textBaseline='top'; ctx.textAlign='left'; ctx.font='8px monospace';

  // --- purse, top left
  panel(6,6,116,38);
  ctx.fillStyle='#8a7a92'; ctx.fillText('PURSE', 11, 10);
  ctx.font='bold 16px monospace'; ctx.fillStyle='#e0b73c';
  ctx.fillText(String(Math.floor(scrap)), 11, 20);
  ctx.font='8px monospace';
  ctx.fillStyle='#9d8ea5'; ctx.fillText('LAP '+lapNo, 70, 20);
  ctx.fillStyle= heat>40?'#f0503c':'#c98a3a';
  ctx.fillText('HEAT '+heat, 70, 31);
  ctx.fillStyle='#5a4a5e'; ctx.fillText('x'+heatMul().toFixed(2), 11, 35);

  // --- upgrades
  let uy=48;
  for(const u of UPGRADES){
    const cost=upgCost(u), can=scrap>=cost;
    const hot=hudBtn(6,uy,116,13, ()=>buyUpgrade(u));
    ctx.fillStyle = hot&&can ? 'rgba(60,80,60,.9)' : 'rgba(12,9,16,.82)';
    ctx.fillRect(6,uy,116,13);
    ctx.strokeStyle = can ? 'rgba(150,220,150,.4)' : 'rgba(90,74,94,.3)';
    ctx.strokeRect(6.5,uy+0.5,115,12);
    ctx.fillStyle = can ? '#cfe8cf' : '#5a4a5e';
    ctx.fillText(u.name, 11, uy+3);
    const lv = upgLevel[u.key];
    if(lv && u.key!=='patch'){ ctx.fillStyle='#4ade80'; ctx.fillText('+'+lv, 52, uy+3); }
    ctx.textAlign='right'; ctx.fillStyle = can?'#e0b73c':'#5a4a5e';
    ctx.fillText(String(cost), 117, uy+3); ctx.textAlign='left';
    uy+=16;
  }

  // --- driver plate, top right
  panel(362,6,112,40);
  ctx.fillStyle=me.color; ctx.fillRect(367,10,5,5);
  ctx.fillStyle='#e8d5b0'; ctx.fillText(me.name, 376, 10);
  ctx.textAlign='right'; ctx.fillStyle='#9d8ea5';
  ctx.fillText(Math.ceil(me.hp)+'/'+me.maxHp, 469, 10); ctx.textAlign='left';
  bar(367,21,102,6, me.hp/me.maxHp, me.hp>me.maxHp*0.5?'#4ade80':me.hp>me.maxHp*0.25?'#e0b73c':'#f0503c');
  ctx.fillStyle='#f97362'; ctx.fillText('MSL '+me.missiles, 367, 32);
  ctx.fillStyle='#8a7a92'; ctx.fillText('KILLS '+kills, 412, 32);

  // --- camera / speed
  const camHot=hudBtn(362,50,54,13, ()=>setCam(camMode==='board'?'chase':'board'));
  ctx.fillStyle=camHot?'rgba(60,70,90,.9)':'rgba(12,9,16,.82)'; ctx.fillRect(362,50,54,13);
  ctx.strokeStyle='rgba(120,100,140,.3)'; ctx.strokeRect(362.5,50.5,53,12);
  ctx.fillStyle='#9d8ea5'; ctx.fillText(camMode==='board'?'BOARD':'CHASE', 367, 53);
  const spHot=hudBtn(420,50,54,13, ()=>{ gameSpeed = gameSpeed>=3?1:gameSpeed+1; });
  ctx.fillStyle=spHot?'rgba(60,70,90,.9)':'rgba(12,9,16,.82)'; ctx.fillRect(420,50,54,13);
  ctx.strokeStyle='rgba(120,100,140,.3)'; ctx.strokeRect(420.5,50.5,53,12);
  ctx.fillStyle= gameSpeed>1?'#4ade80':'#9d8ea5'; ctx.fillText('SPEED x'+gameSpeed, 425, 53);

  // --- palette
  const py=232, bw=49, step=51;
  PALETTE_KEYS.forEach((k,i)=>{
    const d=PIECES[k], x=7+i*step, can=scrap>=d.cost, on=sel===k;
    const hot=hudBtn(x,py,bw,32, ()=>{ sel = (sel===k?null:k); });
    ctx.fillStyle = on ? 'rgba(48,40,26,.95)' : (hot?'rgba(30,26,38,.95)':'rgba(12,9,16,.85)');
    ctx.fillRect(x,py,bw,32);
    ctx.strokeStyle = on ? '#e0b73c' : can ? 'rgba(120,100,140,.35)' : 'rgba(70,58,76,.3)';
    ctx.lineWidth=1; ctx.strokeRect(x+0.5,py+0.5,bw-1,31);
    ctx.fillStyle = can ? d.col : shade(d.col,0.42);
    ctx.fillRect(x+4,py+4,7,7);
    ctx.fillStyle = can?'#cfc2d4':'#5a4a5e';
    ctx.font='7px monospace';
    const nm=d.name.split(' ');
    ctx.fillText(nm[0].slice(0,7), x+14, py+4);
    ctx.fillStyle='#6b5c72'; ctx.fillText((nm[1]||'').slice(0,7), x+14, py+12);
    ctx.font='8px monospace';
    ctx.fillStyle = can?'#e0b73c':'#5a4a5e';
    ctx.fillText(String(d.cost), x+4, py+21);
    ctx.fillStyle = d.heat>0?'#a8524a':d.heat<0?'#4a8a5e':'#5a4a5e';
    ctx.textAlign='right'; ctx.fillText((d.heat>0?'+':'')+d.heat, x+bw-4, py+21); ctx.textAlign='left';
    ctx.fillStyle='#3f3448'; ctx.fillText(String(i+1), x+bw-9, py+3);
  });

  // --- info line
  const shown = sel || (hover && hover.key) || null;
  ctx.font='8px monospace';
  if(shown){
    const d=PIECES[shown];
    ctx.fillStyle='#8a7a92';
    ctx.fillText(d.name+' - '+d.info, 8, 221);
  } else {
    ctx.fillStyle='#4a3e50';
    ctx.fillText('click a part, then click a slot on the loop. shift-click or right-click to salvage.', 8, 221);
  }

  // --- toast
  if(toastT>0){
    ctx.globalAlpha=clamp(toastT,0,1);
    centerText(toast, '#e0b73c', 78, 11);
    ctx.globalAlpha=1;
  }
  if(paused) centerText('PAUSED - still placing', '#e8d5b0', 92, 10);

  if(showFps){
    ctx.fillStyle='#4ade80';
    ctx.fillText(fpsVal+' fps  '+W+'x'+H+'  z'+Z.toFixed(2)+'  '+(cars.length+shots.length+fx.length)+' ent', 130, 8);
  }
  ctx.restore();
}

function drawTitle(){
  ctx.fillStyle='#131019'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.save(); ctx.scale(PX,PX);
  ctx.textBaseline='top';
  centerText('SCRAPHEAP LOOP','#e0b73c',44,22);
  centerText('an auto-racer you produce instead of drive','#8a7a92',72,9);

  const lines = [
    'Your driver runs the circuit forever. You never steer.',
    '',
    'Bolt parts onto the loop with the mouse. Dangerous parts raise HEAT,',
    'and HEAT multiplies every payout - and every rival that comes for you.',
    'Safe parts lower it. The purse only counts if the driver survives.',
    '',
    'ENTER or CLICK to start the show',
  ];
  lines.forEach((t,i)=>{
    ctx.textAlign='center'; ctx.font='8px monospace';
    ctx.fillStyle = i===6 ? '#4ade80' : i===0 ? '#cfc2d4' : '#7a6a84';
    ctx.fillText(t, VW/2, 110+i*12);
  });
  ctx.textAlign='left';
  ctx.fillStyle='#3f3448'; ctx.font='8px monospace';
  ctx.fillText('TAB camera  .  SPACE pause  .  T speed  .  1-9 parts  .  ESC cash out', 40, 250);
  ctx.restore();
}

function drawOver(){
  const r=runOver; if(!r) return;
  ctx.fillStyle='rgba(10,7,14,.82)'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.save(); ctx.scale(PX,PX);
  ctx.textBaseline='top';
  centerText(r.reason,'#f0503c',54,16);
  const rows = [
    ['LAPS RUN',   String(r.laps)],
    ['SCRAP EARNED',String(r.earned)],
    ['RIVALS WRECKED',String(r.kills)],
    ['PARTS ON THE LOOP',String(r.placed)],
    ['PEAK HEAT',  String(r.heat)]
  ];
  rows.forEach((row,i)=>{
    const y=92+i*14;
    ctx.font='8px monospace';
    ctx.textAlign='left';  ctx.fillStyle='#7a6a84'; ctx.fillText(row[0], 150, y);
    ctx.textAlign='right'; ctx.fillStyle='#e8d5b0'; ctx.fillText(row[1], 330, y);
  });
  ctx.textAlign='center';
  ctx.font='bold 14px monospace'; ctx.fillStyle='#e0b73c';
  ctx.fillText('SCORE '+r.score, VW/2, 172);
  ctx.font='8px monospace'; ctx.fillStyle='#6b5c72';
  ctx.fillText('best '+r.best, VW/2, 190);
  ctx.fillStyle='#4ade80'; ctx.fillText('ENTER or CLICK for the title card', VW/2, 214);
  ctx.textAlign='left';
  ctx.restore();
}

// ---------------------------------------------------------------- frame
let acc=0, last=performance.now(), fpsVal=60, fpsAcc=0, fpsN=0;

function step(dt){
  matchTime+=dt;
  for(const c of cars) updateCar(c,dt);
  carVsCar(dt);
  updateShots(dt);
  updatePads(dt);
  updateFx(dt);
  updateDirector(dt);

  const me=player();
  if(camMode==='chase'){
    const tx = me.x + clamp(me.vx*0.28,-70,70);
    const ty = me.y + clamp(me.vy*0.28,-70,70);
    cam.x = lerp(cam.x, tx, 1-Math.pow(0.0025, dt));
    cam.y = lerp(cam.y, ty, 1-Math.pow(0.0025, dt));
  } else {
    cam.x = lerp(cam.x, 0, 1-Math.pow(0.02, dt));      // board view sits on the loop
    cam.y = lerp(cam.y, 0, 1-Math.pow(0.02, dt));
  }

  if(!me.dead){
    const rpm = clamp(Math.abs(me.speed||0)/232, 0, 1);
    Snd.engine(rpm, clamp((me.slide||0)/120,0,1));
  } else Snd.engineOff();
}

function inView(x,y,m){
  m=m||40;
  return Math.abs(x-cam.x) < VW/(2*Z)+m && Math.abs(y-cam.y)*KY < VH/(2*Z)+m;
}

function render(){
  const sx = cam.shake ? rnd(-cam.shake,cam.shake)*S : 0;
  const sy = cam.shake ? rnd(-cam.shake,cam.shake)*KY*S : 0;
  ctx.save(); ctx.translate(Math.round(sx), Math.round(sy));

  drawTrack();
  drawRoadPieces();
  const wallO=buildWallPaths(track.outer), wallI=buildWallPaths(track.inner);
  strokeWall(wallO.far, TRK.WALL, '#6a5570');
  strokeWall(wallI.far, TRK.WALL, '#6a5570');

  for(const p of pads) if(inView(p.x,p.y)) drawPad(p);
  for(const m of mines) if(inView(m.x,m.y)) drawMine(m);

  // painter's algorithm on world Y, visible entities only
  const drawables=[];
  for(const sl of board)
    if(sl.key && !isRoadLane(sl.lane) && inView(sl.x,sl.y,60)) drawables.push({y:sl.y, f:()=>drawSideProp(sl)});
  for(const c of cars) if(!c.dead && inView(c.x,c.y)) drawables.push({y:c.y, f:()=>drawCar(c)});
  for(const s of shots) if(inView(s.x,s.y)) drawables.push({y:s.y, f:()=>drawShot(s)});
  drawables.sort((a,b)=>a.y-b.y);
  for(const d of drawables) d.f();

  strokeWall(wallO.near, TRK.WALL, '#6a5570');
  strokeWall(wallI.near, TRK.WALL, '#6a5570');

  drawFx();
  drawTags();
  drawSlots();
  drawFloaters();
  ctx.restore();

  drawLoopHUD();
}

function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000; last=now;
  if(dt>0.25) dt=0.25;
  fpsAcc+=dt; fpsN++;
  if(fpsAcc>0.5){ fpsVal=Math.round(fpsN/fpsAcc); fpsAcc=0; fpsN=0; }

  if(state==='title'){ drawTitle(); return; }

  if(state==='play' && !paused){
    acc += dt*gameSpeed;
    let guard=0;
    while(acc>=DT && guard++<10){ step(DT); acc-=DT; }
    if(acc > DT*10) acc = 0;
  }
  render();
  if(state==='over') drawOver();
}
requestAnimationFrame(frame);
</script>
