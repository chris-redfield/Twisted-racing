// ================================================================ TWO PLAYERS
// Player 1 drives in the axonometric view. Player 2 rides shotgun behind a
// ring-mounted gun and sees a first-person raycast view out of the same car.
// One car, two jobs: P1 has no trigger, P2 has no steering wheel.
//
// The raycaster is segment-based, not grid-based. The track is a smooth
// 72-segment superellipse, and voxelising it into tiles would turn a clean oval
// into a staircase. Projection follows the usual Wolfenstein formulas, lifted
// from the survive2 reference (js/raycaster.js, Andrew Lim's SDL2 port):
//   viewDist = (w/2)/tan(fov/2),  stripAngle = atan(screenX/viewDist),
//   perpendicular distance = dist*cos(stripAngle),  projScale = viewDist/perp.

let LAYOUT = 'stack';              // 'stack' = gunner over driver, 'side' = side by side (per stage)
let ZOOM2D = 0.8;                  // world scale of the driving pane (per stage)

let PANE_P1 = null, PANE_P2 = null;
function layoutPanes(){
  if(numPlayers===1){
    // solo: one full-screen driving view, no gunner pane
    PANE_P1 = { x:0, y:0, w:VW, h:VH };
    PANE_P2 = null;
  } else if(LAYOUT==='side'){
    PANE_P1 = { x:0,      y:0, w:VW/2, h:VH };
    PANE_P2 = { x:VW/2,   y:0, w:VW/2, h:VH };
  } else {
    PANE_P2 = { x:0, y:0,      w:VW, h:VH/2 };
    PANE_P1 = { x:0, y:VH/2,   w:VW, h:VH/2 };
  }
}

// ---------------------------------------------------------------- roadside buildings
// Scenery only. They sit outside the barriers, so nothing collides with them,
// and each one is regenerated from a hash of its slot along the road: the same
// building is always in the same place and nothing is stored. Survival stages
// rebuild the ones near the camera every frame; the loop builds its set once.
//
// Two depth tiers, after ascii-city: a NEAR street frontage just past the
// barrier, a few storeys, that you look along; and a FAR skyline beyond the
// perimeter fence, tall enough to rise over it. The fog in the raycaster does
// the rest - the far tier reads as silhouettes against the sky.
//
// A building is a quad `q` of world corners [innerA, innerB, outerB, outerA]
// (inner = the face towards the road) plus a height. Both views draw from that.
let showBuildings = true;          // B toggles
const BLD_TIERS = [
  { step:118, empty:0.22, in0:212, in1:238, w0:58,  w1:100, d0:44, d1:78,  h0:32,  h1:76  },  // near
  { step:168, empty:0.14, in0:440, in1:540, w0:88,  w1:150, d0:70, d1:130, h0:130, h1:300 }   // far
];
// the loop corridor is narrower and its fence closer, so its tiers sit tighter
// SKYLINE: the giants, P2's view only. ascii-city's far towers are what make its
// city feel huge - you see them from anywhere. Out past the far tier, generated
// much further along the road than the rest (SKY_REACH vs RING_SPAN), and
// dimly lit so they don't bring the noise back. Never drawn in the driving
// pane: they're off its edge anyway, and one 800-tall box drawn top-down
// would cover the whole pane.
const SKY_TIER = 2;
const BLD_SKY      = { step:260, empty:0.30, in0:900, in1:1300, w0:120, w1:220, d0:120, d1:200, h0:380, h1:850 };
const BLD_SKY_LOOP = { every:4, empty:0.20, in0:800, in1:1200, w0:120, w1:220, d0:120, d1:200, h0:380, h1:850 };
const SKY_REACH = 3500;              // how far ahead/behind along the road the giants exist
const SKY_LIT = 0.45;                // their lit-window share, relative to the other tiers
const BLD_TIERS_LOOP = [
  { every:2, empty:0.25, in0:150, in1:168, w0:52, w1:84,  d0:40, d1:66,  h0:30,  h1:70  },
  { every:3, empty:0.10, in0:380, in1:460, w0:90, w1:140, d0:70, d1:120, h0:140, h1:320 }
];
const BLD_COLS = ['#4a3c52','#56463e','#3e4454','#5a4a4c','#48394a','#3c3c4a','#524058'];
const FLOOR_H = 12, WIN_STEP = 13;   // storey height and window pitch, world units

function hash3(a,b,c){
  let h = Math.imul(a|0, 374761393) ^ Math.imul(b|0, 668265263) ^ Math.imul(c|0, 1274126177);
  h = Math.imul(h ^ (h>>>13), 1103515245);
  h ^= h>>>16;
  return (h>>>0)/4294967296;
}

function makeBuilding(cx, cy, tx, ty, nx, ny, inner, w, d, h, tier, seed){
  // (tx,ty) runs along the road, (nx,ny) points away from it
  const ax = cx + nx*inner, ay = cy + ny*inner;
  const bx = ax + nx*d,     by = ay + ny*d;
  const hw = w/2;
  const r = j => hash3(seed, tier*977, j);
  return {
    q: [ { x:ax - tx*hw, y:ay - ty*hw }, { x:ax + tx*hw, y:ay + ty*hw },
         { x:bx + tx*hw, y:by + ty*hw }, { x:bx - tx*hw, y:by - ty*hw } ],
    h, tier, seed,
    nx, ny,
    col: BLD_COLS[(r(11)*BLD_COLS.length)|0],
    lit: (0.18 + r(12)*0.34) * (tier===SKY_TIER ? SKY_LIT : 1)   // share of lit windows
  };
}

// survival: the buildings whose slots fall inside [a0, a1] along the road
let bldList = [];
function survivalBuildings(a0, a1, out){
  out.length = 0;
  for(let ti=0; ti<BLD_TIERS.length; ti++) survivalTier(BLD_TIERS[ti], ti, a0, a1, out);
  return out;
}
// the raycaster's set: the two street tiers plus the skyline, which reaches further
function survivalBuildingsRC(center, out){
  survivalBuildings(center - RING_SPAN, center + RING_SPAN, out);
  survivalTier(BLD_SKY, SKY_TIER, center - SKY_REACH, center + SKY_REACH, out);
  return out;
}
function survivalTier(T, ti, a0, a1, out){
  for(const side of [-1, 1]){
    const k0 = Math.floor(a0/T.step) - 1, k1 = Math.ceil(a1/T.step);
    for(let k=k0; k<=k1; k++){
      const seed = k*2 + (side>0 ? 1 : 0);
      const r = j => hash3(seed, ti*977, j);
      if(r(0) < T.empty) continue;                          // an empty lot
      const w = Math.min(lerp(T.w0, T.w1, r(1)), T.step - 14);
      const c = (k + 0.5)*T.step + (r(2) - 0.5)*(T.step - w - 12);
      if(c + w/2 < a0 || c - w/2 > a1) continue;
      const inner = lerp(T.in0, T.in1, r(3));
      const d = lerp(T.d0, T.d1, r(4));
      const h = lerp(T.h0, T.h1, Math.pow(r(5), 1.3));
      // convoy: along = x, lateral = y.  ascent: along = y, lateral = x.
      out.push(vertical
        ? makeBuilding(0, c, 0, 1, side, 0, inner, w, d, h, ti, seed)
        : makeBuilding(c, 0, 1, 0, 0, side, inner, w, d, h, ti, seed));
    }
  }
}

// loop: once, around the outside of the circuit (the infield pinches on the
// bends, so it stays open ground)
let loopBld = [];
function loopBuildings(){
  loopBld = [];
  const pts = track.pts, n = pts.length, sg = outwardSign();
  const tiers = [...BLD_TIERS_LOOP, BLD_SKY_LOOP];   // index 2 = SKY_TIER
  for(let ti=0; ti<tiers.length; ti++){
    const T = tiers[ti];
    for(let i=0; i<n; i+=T.every){
      const seed = i*2 + 7000;
      const r = j => hash3(seed, ti*977 + 5, j);
      if(r(0) < T.empty) continue;
      const p = pts[i], a = pts[(i+n-1)%n], b = pts[(i+1)%n];
      let tx = b.x - a.x, ty = b.y - a.y; const L = Math.hypot(tx, ty) || 1; tx/=L; ty/=L;
      const nx = p.nx*sg, ny = p.ny*sg;
      loopBld.push(makeBuilding(p.x, p.y, tx, ty, nx, ny,
        lerp(T.in0, T.in1, r(3)), lerp(T.w0, T.w1, r(1)), lerp(T.d0, T.d1, r(4)),
        lerp(T.h0, T.h1, Math.pow(r(5), 1.3)), ti, seed));
    }
  }
}

// raycaster rings for a set of buildings: only the road-facing side and the two
// ends - the back face is never the first thing a ray from the road can hit
function buildingRings(list, out){
  for(const b of list){
    const q = b.q;
    const pts = [ q[3], q[0], q[1], q[2] ];
    const len = [ Math.hypot(q[0].x-q[3].x, q[0].y-q[3].y),
                  Math.hypot(q[1].x-q[0].x, q[1].y-q[0].y),
                  Math.hypot(q[2].x-q[1].x, q[2].y-q[1].y) ];
    out.push({ pts, h:b.h, col:b.col, open:true, bldg:b, len,
               fs:[0.70, 1.0, 0.84] });               // end, front, end: cheap face lighting
  }
}

// ---- the driving pane: extruded boxes with lit windows on the faces you see.
// `front` picks the buildings on the camera's side of the road, which stand in
// front of it on screen: those draw after the cars and see-through, so they
// frame the road instead of hiding it.
function isFrontBuilding(b){ return b.ny > 0.3; }   // outward normal points down-screen
function drawBuildings2D(list, front){
  if(!showBuildings) return;
  const lift = z => z*S;                               // same height scale as extrude()
  for(const b of list){
    if(b.tier === SKY_TIER) continue;                  // the giants are P2's alone
    if(isFrontBuilding(b) !== front) continue;
    const q = b.q;
    let mx=0, my=0; for(const c of q){ mx+=c.x; my+=c.y; } mx/=4; my/=4;
    if(!inView(mx, my, 160)) continue;
    const s = q.map(c => toScreen(c.x, c.y, 0));
    const H = lift(b.h);
    ctx.save();
    if(front) ctx.globalAlpha = 0.42;
    // side faces that face the camera (screen-down), then the roof
    for(let i=0;i<4;i++){
      const a = q[i], c = q[(i+1)%4];
      // outward edge normal, from the centroid
      const ex = c.x-a.x, ey = c.y-a.y, L = Math.hypot(ex,ey) || 1;
      let fx = ey/L, fy = -ex/L;
      if(fx*((a.x+c.x)/2 - mx) + fy*((a.y+c.y)/2 - my) < 0){ fx=-fx; fy=-fy; }
      if(fy <= 0.05) continue;
      const sa = s[i], sc = s[(i+1)%4];
      ctx.fillStyle = shade(b.col, 0.62 + 0.22*fx);
      ctx.beginPath();
      ctx.moveTo(sa.x, sa.y); ctx.lineTo(sc.x, sc.y);
      ctx.lineTo(sc.x, sc.y - H); ctx.lineTo(sa.x, sa.y - H); ctx.closePath(); ctx.fill();
      // windows: one per WIN_STEP along the face, one per storey
      const nw = Math.floor(L / WIN_STEP), nf = Math.floor((b.h - 6) / FLOOR_H);
      const ww = 5/L;
      for(let wi=0; wi<nw; wi++){
        const t0 = (wi + 0.5)/nw - ww/2, t1 = t0 + ww;
        const x0 = sa.x + (sc.x-sa.x)*t0, y0 = sa.y + (sc.y-sa.y)*t0;
        const x1 = sa.x + (sc.x-sa.x)*t1, y1 = sa.y + (sc.y-sa.y)*t1;
        for(let fl=0; fl<nf; fl++){
          const lit = hash3(b.seed*31 + i, wi, fl + b.tier*101) < b.lit;
          ctx.fillStyle = lit ? '#e8b860' : shade(b.col, 0.4);
          const zA = lift(fl*FLOOR_H + 4), zB = lift(fl*FLOOR_H + 9);
          ctx.beginPath();
          ctx.moveTo(x0, y0 - zA); ctx.lineTo(x1, y1 - zA);
          ctx.lineTo(x1, y1 - zB); ctx.lineTo(x0, y0 - zB); ctx.closePath(); ctx.fill();
        }
      }
    }
    ctx.fillStyle = shade(b.col, 1.18);
    ctx.beginPath();
    ctx.moveTo(s[0].x, s[0].y - H);
    for(let i=1;i<4;i++) ctx.lineTo(s[i].x, s[i].y - H);
    ctx.closePath(); ctx.fill();
    // a roof parapet, so the top reads as a flat roof rather than a lid
    ctx.strokeStyle = shade(b.col, 0.8); ctx.lineWidth = Math.max(1, 2*S);
    ctx.stroke();
    ctx.restore();
  }
}
// what the driving pane should draw this frame
function buildings2D(){
  if(race) return loopBld;
  const a = vertical ? cam.y : cam.x, reach = (vertical ? VIEW_HH : VHW) + 200;
  return survivalBuildings(a - reach, a + reach, bld2DScratch);
}
const bld2DScratch = [];

// ---------------------------------------------------------------- raycast view
let   RC_FOV = 95 * Math.PI/180;   // wide: a turret gunner wants peripheral vision (- = to tune)
// EYE_Z matters more than it looks. The tilt of a wall's top edge across the
// screen is (EYE_Z-BARRIER_H)/lateralGap, and that edge pivots about the centre
// of the view - which the eye reads as the camera rotating. At eye 27 the gap
// was 5, so the edge sat on the horizon and swung wildly when you closed in.
// The gun used to sit at 38 (up on a ring mount); he found that too elevated on
// the car, so it now sits lower at 26. To keep the barrier clearly below the
// horizon (and avoid that tilt) the FPS barrier came down with it, staying just
// above car height (~13) so the cheap per-column occlusion still holds. `[` `]`
// still tune EYE_Z live if you want it lower still, down toward the road.
let   EYE_Z  = 26;                 // gunner's eye/gun height above the road ([ ] to tune)
const BARRIER_H = 16;              // still see over it into the corner, still taller than a car
const WALL_T = 9;                  // barrier thickness, for the visible top ribbon
const SHOT_SETTLE = 260;           // units over which the gunner's tracer eases down
const FENCE_H   = 96;
const FENCE_OUT = 210;             // how far outside the barrier the perimeter fence sits

let rcCv=null, rcCtx=null, RC_W=0, RC_H=0, RC_VD=0, RC_HORIZON=0;
let rcStripe=null;
let rcSin=null, rcCos=null, rcInvCos=null, rcTan=null;   // per-column, constant
let rcZ=null, rcImg=null, rcPix=null;
let rings=[];                       // wall rings: {pts, h, col, top, open}
let ringCX=null, ringCY=null;       // ring points in camera space, rebuilt each frame

function rcInit(){
  RC_W = Math.round(PANE_P2.w/2);   // half-res offscreen, blitted 2x: chunky on purpose
  RC_H = Math.round(PANE_P2.h/2);
  rcCv = document.createElement('canvas');
  rcCv.width = RC_W; rcCv.height = RC_H;
  rcCtx = rcCv.getContext('2d', { alpha:false, willReadFrequently:true });   // ascii pass reads it back
  rcCtx.imageSmoothingEnabled = false;
  RC_HORIZON = Math.round(RC_H*0.44);   // more road, less empty sky
  rcZ = new Float32Array(RC_W);
  rcImg = rcCtx.createImageData(RC_W, RC_H);
  rcPix = rcImg.data;
  rcColumns();
}

// per-column angle tables: constant for a given FOV, so rebuilt only on change
function rcColumns(){
  RC_VD = (RC_W/2) / Math.tan(RC_FOV/2);
  rcSin = new Float32Array(RC_W); rcCos = new Float32Array(RC_W);
  rcInvCos = new Float32Array(RC_W); rcTan = new Float32Array(RC_W);
  for(let i=0;i<RC_W;i++){
    const a = Math.atan((i + 0.5 - RC_W/2) / RC_VD);
    rcSin[i]=Math.sin(a); rcCos[i]=Math.cos(a);
    rcInvCos[i]=1/Math.cos(a); rcTan[i]=Math.tan(a);
  }
}
function setFov(deg){ RC_FOV = clamp(deg,50,120) * Math.PI/180; rcColumns(); }

// The corridor walls are straight and infinite, so the raycaster's rings are
// rebuilt each frame as short open polylines spanning the road near the camera.
// `open:true` tells rcWalls not to wrap the last point back to the first (which,
// on a straight run, would lay a spurious segment down the whole wall).
const RING_SPAN = 1500;            // how far ahead/behind the camera the walls reach
const RING_STEP = 50;              // segment length, fine enough for legible banding
let ringCenter = 0;                // forward-axis centre the walls are built around

// `center` is the camera's FORWARD coordinate (camX in convoy, camY in ascent).
// Walls run along the road (varying x in convoy, y in ascent) at a fixed lateral.
function buildConvoyRings(center){
  ringCenter = center;
  const c0 = center - RING_SPAN;
  const n = Math.ceil(2*RING_SPAN/RING_STEP);
  const line = (lat) => {
    const pts=[];
    for(let i=0;i<=n;i++){
      const along = c0 + i*RING_STEP;
      pts.push(vertical ? { x:lat, y:along } : { x:along, y:lat });
    }
    return pts;
  };
  const flat = ROAD_HW + FENCE_OUT_C;
  rings = [
    { pts:line(-ROAD_HW), h:BARRIER_H, col:'#6a5570', top:'#a894b0', open:true },
    { pts:line( ROAD_HW), h:BARRIER_H, col:'#6a5570', top:'#a894b0', open:true },
    { pts:line(-flat),    h:FENCE_H,   col:'#2e2536', top:'#463a50', open:true },
    { pts:line( flat),    h:FENCE_H,   col:'#2e2536', top:'#463a50', open:true }
  ];
  if(showBuildings) buildingRings(survivalBuildingsRC(center, bldList), rings);
  let nn=0; for(const r of rings) nn += r.pts.length;
  if(!ringCX || ringCX.length < nn){ ringCX = new Float32Array(nn); ringCY = new Float32Array(nn); }
  let o=0; for(const r of rings){ r.off = o; o += r.pts.length; }
}
function buildRings(){ buildConvoyRings(0); }   // race-era name kept for the boot path

// which way is "away from the middle of the loop"? work the sign out from the normal
function outwardSign(){
  const p = track.pts[0];
  return Math.abs(p.x + p.nx*100) > Math.abs(p.x) ? 1 : -1;
}
// LOOP walls: two closed barrier rings plus a tall perimeter fence for the horizon
function buildRingsLoop(){
  const sg = outwardSign();
  const fence = track.pts.map(p=>({ x:p.x + p.nx*sg*(LOOP.HW+FENCE_OUT_C),
                                    y:p.y + p.ny*sg*(LOOP.HW+FENCE_OUT_C) }));
  rings = [
    { pts:track.outer, h:BARRIER_H, col:'#6a5570', top:'#a894b0' },
    { pts:track.inner, h:BARRIER_H, col:'#6a5570', top:'#a894b0' },
    { pts:fence,       h:FENCE_H,   col:'#2e2536', top:'#463a50' }
  ];
  loopBuildings();
  if(showBuildings) buildingRings(loopBld, rings);
  let nn=0; for(const r of rings) nn += r.pts.length;
  if(!ringCX || ringCX.length < nn){ ringCX = new Float32Array(nn); ringCY = new Float32Array(nn); }
  let o=0; for(const r of rings){ r.off = o; o += r.pts.length; }
}

// coarse "is this world point on the asphalt" lookup for the LOOP's first-person floor
let trackMask=null, MASK_N=0, MASK_SPAN=0;
function buildTrackMask(){
  MASK_N = 384; MASK_SPAN = 2300;
  trackMask = new Uint8Array(MASK_N*MASK_N);
  const step = MASK_SPAN/MASK_N;
  for(let j=0;j<MASK_N;j++){
    const wy = -MASK_SPAN/2 + (j+0.5)*step;
    for(let i=0;i<MASK_N;i++){
      const wx = -MASK_SPAN/2 + (i+0.5)*step;
      trackMask[j*MASK_N+i] = trackProject(wx,wy).d < TRK.HW ? 1 : 0;
    }
  }
}

function onAsphalt(x,y){
  if(race){
    const i = ((x + MASK_SPAN/2)/MASK_SPAN*MASK_N)|0;
    const j = ((y + MASK_SPAN/2)/MASK_SPAN*MASK_N)|0;
    if(i<0||j<0||i>=MASK_N||j>=MASK_N) return 0;
    return trackMask[j*MASK_N+i];
  }
  return Math.abs(vertical ? x : y) < ROAD_HW ? 1 : 0;
}

// ---- sky and floor, written straight into the image buffer
const SKY_TOP=[26,20,34], SKY_HORIZ=[74,54,66];
const ASPH=[43,36,48], ASPH_FAR=[30,25,36];
const DIRT=[58,43,38], DIRT_FAR=[34,27,28];

function rcBackground(camX, camY, bearing){
  const fwx=Math.cos(bearing), fwy=Math.sin(bearing);
  const rgx=-fwy, rgy=fwx;
  let p=0;
  for(let y=0;y<RC_H;y++){
    if(y < RC_HORIZON){
      const t = y/Math.max(1,RC_HORIZON);
      const r=(SKY_TOP[0]+(SKY_HORIZ[0]-SKY_TOP[0])*t)|0;
      const g=(SKY_TOP[1]+(SKY_HORIZ[1]-SKY_TOP[1])*t)|0;
      const b=(SKY_TOP[2]+(SKY_HORIZ[2]-SKY_TOP[2])*t)|0;
      for(let x=0;x<RC_W;x++){ rcPix[p]=r; rcPix[p+1]=g; rcPix[p+2]=b; rcPix[p+3]=255; p+=4; }
      continue;
    }
    // floor: one perpendicular distance per row, then step across the row
    const perp = EYE_Z*RC_VD/Math.max(0.5, y-RC_HORIZON+0.5);
    const fog = Math.min(1, perp/900);
    const ar=(ASPH[0]+(ASPH_FAR[0]-ASPH[0])*fog)|0, ag=(ASPH[1]+(ASPH_FAR[1]-ASPH[1])*fog)|0,
          ab=(ASPH[2]+(ASPH_FAR[2]-ASPH[2])*fog)|0;
      const dr=(DIRT[0]+(DIRT_FAR[0]-DIRT[0])*fog)|0, dg=(DIRT[1]+(DIRT_FAR[1]-DIRT[1])*fog)|0,
          db=(DIRT[2]+(DIRT_FAR[2]-DIRT[2])*fog)|0;
    // sample every other column and hold
    let onRoad = 0;
    for(let x=0;x<RC_W;x++){
      if((x & 1)===0){
        const r4 = perp*rcInvCos[x];
        const wx = camX + (fwx*rcCos[x] + rgx*rcSin[x])*r4;
        const wy = camY + (fwy*rcCos[x] + rgy*rcSin[x])*r4;
        onRoad = onAsphalt(wx,wy);
      }
      if(onRoad){ rcPix[p]=ar; rcPix[p+1]=ag; rcPix[p+2]=ab; }
      else      { rcPix[p]=dr; rcPix[p+1]=dg; rcPix[p+2]=db; }
      rcPix[p+3]=255; p+=4;
    }
  }
  rcCtx.putImageData(rcImg, 0, 0);
}

// ---- walls
// Every ring point is transformed into camera space once per frame, then each
// column is a ray-vs-segment solve. A column can hit several walls (the barrier
// is low, so the fence shows above it), so hits are drawn far to near.
const RC_HITS_MAX = 64;          // a grazing ray can cross a lot of one ring
const rcHitD = new Float32Array(RC_HITS_MAX);
const rcHitR = new Int32Array(RC_HITS_MAX);
const rcHitU = new Float32Array(RC_HITS_MAX);     // distance along the wall, for banding
const rcHitK = new Float32Array(RC_HITS_MAX);     // |segment|/|den|, for the top ribbon
const rcHitOrder = new Int32Array(RC_HITS_MAX);
const rcHitHide  = new Uint8Array(RC_HITS_MAX);     // fully covered by a nearer wall

function rcWalls(camX, camY, bearing){
  const cb=Math.cos(-bearing), sb=Math.sin(-bearing);
  for(const r of rings){
    const pts=r.pts, off=r.off;
    for(let i=0;i<pts.length;i++){
      const dx=pts[i].x-camX, dy=pts[i].y-camY;
      // camera space: +y forward, +x right
      ringCX[off+i] = dx*cb - dy*sb;
      ringCY[off+i] = dx*sb + dy*cb;
    }
  }
  // camera looks along world `bearing`; rotating by -bearing puts forward on +x,
  // so swap into (right, forward) = (-y, x)
  for(let x=0;x<RC_W;x++) rcZ[x]=1e9;

  for(let x=0;x<RC_W;x++){
    const drx=rcSin[x], dry=rcCos[x];      // ray dir in (right, forward)
    let nh=0;
    for(let ri=0; ri<rings.length; ri++){
      const r=rings[ri], pts=r.pts, off=r.off, n=pts.length;
      const last = r.open ? n-1 : n;
      for(let i=0;i<last;i++){
        const j=r.open ? i+1 : (i+1)%n;
        // (right, forward): a point at relative angle +a sits right of centre,
        // matching the billboard and floor projections
        const axr=ringCY[off+i], axf=ringCX[off+i];
        const bxr=ringCY[off+j], bxf=ringCX[off+j];
        if(axf<=0.5 && bxf<=0.5) continue;              // wholly behind the camera
        const ex=bxr-axr, ey=bxf-axf;
        const den=drx*ey - dry*ex;
        if(den>-1e-9 && den<1e-9) continue;
        // solving t*d = A + u*E for u gives this sign; getting it backwards
        // accepts hits on the segment's backward extension, which on a closed
        // ring of similar segments still looks plausible
        const u=(dry*axr - drx*axf)/den;
        if(u<0 || u>1) continue;
        const t = Math.abs(drx)>Math.abs(dry) ? (axr+u*ex)/drx : (axf+u*ey)/dry;
        if(t<=0.5) continue;
        if(nh<RC_HITS_MAX){
          rcHitD[nh]=t; rcHitR[nh]=ri;
          rcHitU[nh]=i+u;                                  // which bit of wall this is
          rcHitK[nh]=Math.sqrt(ex*ex+ey*ey)/Math.abs(den); // 1/|dot(dir, wallNormal)|
          nh++;
        }
      }
    }
    if(!nh) continue;
    for(let i=0;i<nh;i++) rcHitOrder[i]=i;
    // track the nearest separately: the draw buffer can overflow, occlusion can't
    let near=1e9;
    for(let i=0;i<nh;i++) if(rcHitD[i]<near) near=rcHitD[i];
    const nearPerp=near*rcCos[x];
    if(nearPerp>0.6) rcZ[x]=nearPerp;
    // insertion sort, far to near. nh is small.
    for(let i=1;i<nh;i++){
      const k=rcHitOrder[i]; const d=rcHitD[k]; let j=i-1;
      while(j>=0 && rcHitD[rcHitOrder[j]]<d){ rcHitOrder[j+1]=rcHitOrder[j]; j--; }
      rcHitOrder[j+1]=k;
    }
    const cosA=rcCos[x];
    // Occlusion, nearest first: every wall runs from its top down to its base,
    // and a farther wall's base is always higher on screen, so a farther wall
    // whose top is below a nearer wall's top is entirely hidden. Skipping those
    // matters now that far buildings draw a light per storey.
    let minTop=1e9;
    for(let hi=nh-1; hi>=0; hi--){
      const k=rcHitOrder[hi], perp=rcHitD[k]*cosA;
      if(perp<0.6){ rcHitHide[hi]=1; continue; }
      const top=RC_HORIZON + (EYE_Z-rings[rcHitR[k]].h)*RC_VD/perp;
      rcHitHide[hi] = top>=minTop ? 1 : 0;
      if(top<minTop) minTop=top;
    }
    for(let hi=0; hi<nh; hi++){
      if(rcHitHide[hi]) continue;
      const k=rcHitOrder[hi];
      const perp=rcHitD[k]*cosA;
      if(perp<0.6) continue;
      const r=rings[rcHitR[k]];
      const scale=RC_VD/perp;
      const base=RC_HORIZON + EYE_Z*scale;
      const top =RC_HORIZON + (EYE_Z-r.h)*scale;
      let y0=top|0, y1=base|0;
      if(y1<0 || y0>=RC_H) continue;
      if(y0<0) y0=0; if(y1>RC_H) y1=RC_H;
      if(y1<=y0) continue;
      const fog=Math.min(0.82, perp/1100);

      if(r.bldg){ rcBuildingColumn(x, r, rcHitU[k], perp, scale, y0, y1, fog, cosA*rcHitK[k]); continue; }

      // Vertical banding from the along-wall coordinate. This is the important
      // one: an untextured face shows nothing at all when you slide toward it,
      // so the only thing that moves is the silhouette - and a tilting
      // silhouette reads as rotation. Bands give honest lateral parallax.
      const band = (rcHitU[k]*2.6)|0;
      let f = 1 - fog*0.72;
      if(band & 1) f *= 0.80;
      // barrier posts anchored to the WORLD along-wall coordinate, so they stream
      // past as you drive forward (works for either orientation).
      if(!race){   // survival walls carry world-anchored posts; the loop uses plain banding
        const alongWall = ringCenter - RING_SPAN + rcHitU[k]*RING_STEP;
        const postPhase = ((alongWall % POST_STEP)+POST_STEP) % POST_STEP;
        if(postPhase < 5) f *= 0.55;
      }
      rcCtx.fillStyle = shade(r.col, f);
      rcCtx.fillRect(x, y0, 1, y1-y0);

      // a kerb at the foot of the wall, so the base edge is legible too
      const kerb = Math.max(1, Math.round((y1-y0)*0.18));
      if(y1-kerb > y0){
        rcCtx.fillStyle = shade(r.col, f*0.55);
        rcCtx.fillRect(x, y1-kerb, 1, kerb);
      }

      // The top surface, when the wall is shorter than the gunner. Its far edge
      // is one wall-thickness further along the ray, which is what turns a low
      // barrier into something you can see you are looking down onto.
      if(r.h < EYE_Z){
        const dFar = perp + WALL_T*cosA*rcHitK[k];
        const yFar = RC_HORIZON + (EYE_Z-r.h)*RC_VD/dFar;
        let r0=yFar|0, r1=top|0;
        if(r0<0) r0=0; if(r1>RC_H) r1=RC_H;
        if(r1>r0){
          rcCtx.fillStyle = shade(r.top, (1 - fog*0.6) * ((band & 1) ? 0.88 : 1));
          rcCtx.fillRect(x, r0, 1, r1-r0);
        }
      }
    }
  }
}

// One column of a building face: the wall, then its windows. Windows are what
// make a facade legible at all - and in the ascii view the lit ones are the
// brightest cells, so they become the '@'s.
//
// Lit windows are lights, so they have to survive distance. Two levels of
// detail, after ascii-city's near/far tiers:
//  - NEAR: this column covers less than a window pitch of wall, so it draws
//    real windows (lit and dark), and a window counts as hit if it overlaps the
//    strip of wall the column covers - point-sampling missed them on faces seen
//    at an angle, which is why lights only showed when looking square on.
//  - FAR: the column spans a window or more (distance or a grazing angle), so
//    it just asks "is the window here lit?" and draws only the lights, at least
//    one pixel each - far buildings become a speckle of city lights.
// Fog barely touches the lights: they glow, the wall around them doesn't.
// `slant` = cos(ray angle) / |cos(incidence)|: wall length per unit of
// perpendicular distance, per column, times RC_VD.
const WIN_A = 4, WIN_B = 9;          // window span inside each WIN_STEP of wall
// How loud the city lights are, 0..1: 0 = the original (no far lights, fog
// dims them 55%, ascii averages them away), 1 = every far light at full glow.
// All the light dials below hang off this one number.
let   LIGHTS_MIX = 0.5;
let   LIT_COLS = null;               // lit window colour by fog, rebuilt when the mix changes
let   litColsMix = -1;
function litCols(){
  if(litColsMix !== LIGHTS_MIX){
    const dim = lerp(0.55, 0.2, LIGHTS_MIX);        // how much full fog dims a light
    LIT_COLS = Array.from({length:32}, (_,i) => shade('#e8b860', 1 - (i/32)*dim));
    litColsMix = LIGHTS_MIX;
  }
  return LIT_COLS;
}
function rcBuildingColumn(x, r, hu, perp, scale, y0, y1, fog, slant){
  const seg = hu|0, along = (hu - seg)*r.len[seg];
  const f = (1 - fog*0.8) * r.fs[seg];
  rcCtx.fillStyle = shade(r.col, f);
  rcCtx.fillRect(x, y0, 1, y1-y0);
  // a darker plinth at street level, like the barrier's kerb
  const plinth = Math.max(1, Math.round(5*scale));
  if(y1-plinth > y0){ rcCtx.fillStyle = shade(r.col, f*0.6); rcCtx.fillRect(x, y1-plinth, 1, plinth); }

  const pitch = scale*FLOOR_H;                       // storey height in pixels
  if(pitch < 0.35) return;                           // storeys packed 3 to a pixel: silhouette
  const step = perp*slant/RC_VD;                     // wall length this column covers
  const far = step > WIN_STEP*0.6 || pitch < 3;
  const b = r.bldg, wp = along % WIN_STEP;
  let wi = (along / WIN_STEP)|0;
  if(!far){
    // does [along - step/2, along + step/2] touch this pitch's window?
    const h = step/2;
    if(wp + h < WIN_A || wp - h > WIN_B){
      // not this one - but the strip may reach into a neighbour's window
      if(wp - h < WIN_B - WIN_STEP) wi -= 1;
      else if(wp + h > WIN_STEP + WIN_A) wi += 1;
      else return;                                   // between windows
    }
  }
  const nf = Math.floor((r.h - 6) / FLOOR_H);
  const litCol = litCols()[(fog*31.99)|0], darkCol = far ? null : shade(r.col, f*0.45);
  const stride = pitch < 1 ? Math.ceil(1/pitch) : 1; // one storey per pixel row, at most
  for(let fl=0; fl<nf; fl+=stride){
    const lit = hash3(b.seed*31 + seg, wi, fl + b.tier*101) < b.lit;
    if(far && !lit) continue;                        // far away only the lights read
    // ...and only a LIGHTS_MIX share of them, picked by hash so it never flickers
    if(far && hash3(b.seed*17 + seg, wi*3 + 1, fl) >= LIGHTS_MIX) continue;
    const zA = fl*FLOOR_H + WIN_A, zB = fl*FLOOR_H + WIN_B;
    let ya = (RC_HORIZON + (EYE_Z - zB)*scale)|0, yb = (RC_HORIZON + (EYE_Z - zA)*scale)|0;
    if(yb <= ya) yb = ya + 1;                        // a light is never thinner than a pixel
    if(yb <= 0) break;                               // storeys above the top of the view
    if(ya >= RC_H) continue;
    if(ya < y0) ya = y0; if(yb > y1) yb = y1;
    if(yb <= ya) continue;
    rcCtx.fillStyle = lit ? litCol : darkCol;
    rcCtx.fillRect(x, ya, 1, yb-ya);
  }
}

// ---- billboards
// Cars reuse the same low-poly meshes as the 2D half, re-baked at eye level
// instead of the axonometric angle, so both halves show the same vehicles.
const KY_FPS = 0.16, KZ_FPS = Math.sqrt(1 - 0.16*0.16);
const FPS_SHEETS = new Map();

function bakeFpsSprites(c){
  const key = (c.model||0)+'|'+c.color;
  const hit = FPS_SHEETS.get(key);
  if(hit) return hit;
  const n=32, fw=52, fh=52, ax=fw/2, ay=Math.round(fh*0.62);
  const mesh = MODELS[(c.model||0) % MODELS.length];
  const cvs=document.createElement('canvas');
  cvs.width=fw*n; cvs.height=fh*2;
  const g=cvs.getContext('2d');
  const scratch=document.createElement('canvas');
  scratch.width=fw*SS; scratch.height=fh*SS;
  const sctx=scratch.getContext('2d');
  for(let f=0;f<n;f++){
    for(let row=0;row<2;row++){
      sctx.putImageData(rasterCar(sctx, mesh, f/n*Math.PI*2, c.color, row===1,
                                  fw, fh, ax, ay, KY_FPS, KZ_FPS, 1), 0, 0);
      g.drawImage(scratch, 0,0,scratch.width,scratch.height, f*fw, row*fh, fw, fh);
    }
  }
  const sheet={ cv:cvs, n, fw, fh, ax, ay };
  FPS_SHEETS.set(key, sheet);
  return sheet;
}

// ---- enemy cars in the gunner's pane
// Two numbers tie P2's view of an enemy to P1's, because the gunner was losing
// cars long before the driver did and ended up reading the bottom half of the
// screen instead of his own:
//
//  - WHEN it vanishes. The raycaster used to carry a car out to 1500 units,
//    far past the edge of the driving pane, so most of what P2 could see was
//    too small to shoot and nothing P1 could see was worth calling out. A car
//    now leaves the gunner's view at the frame edge of the driving pane, and
//    fades out over the last sliver rather than popping.
//  - HOW BIG it is until then. Angular size falls as 1/d and the ascii pass
//    then averages 2x3 pixels into one glyph, so at the far edge of the frame
//    a car was ~9 cells of mush. Distant cars are drawn larger than
//    perspective says - the same exaggeration a gun sight makes - easing in
//    from CAR_MAG_NEAR so nothing pops as a car closes. Nearer is still
//    bigger, just on a compressed curve.
const CAR_VIEW_M   = 28;    // half a car: P2 keeps it until P1 has fully lost it
const CAR_FADE     = 0.12;  // share of the frame, at the edge, spent fading out
const CAR_MAG_NEAR = 70;    // inside this, honest perspective
let   CAR_MAG_MAX  = 2.2;   // exaggeration at the frame edge (`,` `.` to tune)

// how far the driving pane sees, and where a point sits in it: 0 at the camera,
// 1 at the edge of the frame. Same extents inView uses to cull the 2D half.
function p1Reach(){ return Math.max(VHW, vertical ? VIEW_HH : VHH/KY); }
function p1Edge(x, y){
  const dx = Math.abs(x-cam.x), dy = Math.abs(y-cam.y);
  return vertical
    ? Math.max(dx/(VHW+CAR_VIEW_M), dy/(VIEW_HH+CAR_VIEW_M))
    : Math.max(dx/(VHW+CAR_VIEW_M), dy*KY/(VHH+CAR_VIEW_M));
}
function carMag(perp){
  const far = Math.max(CAR_MAG_NEAR+1, p1Reach());
  const t = clamp((perp - CAR_MAG_NEAR)/(far - CAR_MAG_NEAR), 0, 1);
  return 1 + (CAR_MAG_MAX - 1)*t*t*(3 - 2*t);      // smoothstep: no kink at either end
}

let bbList=[];
function gatherBillboards(camX, camY, bearing){
  bbList.length=0;
  const lim = RC_FOV*0.5 + 0.30;
  const add=(x,y,z,kind,ref,e)=>{
    const dx=x-camX, dy=y-camY;
    const d=Math.sqrt(dx*dx+dy*dy);
    if(d<6 || d>1500) return;
    let b=Math.atan2(dy,dx)-bearing;
    b=((b+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;
    if(b<-lim || b>lim) return;
    bbList.push({d,b,z,kind,ref,e:e||0});
  };
  for(let i=1;i<cars.length;i++){
    const c=cars[i]; if(c.dead) continue;
    const e = p1Edge(c.x, c.y);
    if(e > 1) continue;                           // off the driving pane: off this one too
    add(c.x, c.y, 0, 'car', c, e);
  }
  for(const p of pads) if(p.item) add(p.x,p.y,4,'pad',p);
  for(const m of mines) add(m.x,m.y,2,'mine',m);
  for(const s of shots) add(s.x,s.y,s.z,'shot',s);
  for(const p of fx) add(p.x,p.y,p.z, p.ring?'ring':'spark', p);
  bbList.sort((a,b)=>b.d-a.d);
  return bbList;
}

function rcSprites(camX, camY, bearing){
  const list=gatherBillboards(camX, camY, bearing);
  for(const bb of list){
    const perp=bb.d*Math.cos(bb.b);
    if(perp<3) continue;
    const scale=RC_VD/perp;
    const sx=RC_W/2 + Math.tan(bb.b)*RC_VD;
    const ground=RC_HORIZON + EYE_Z*scale;
    const col=Math.round(sx);
    if(col<0 || col>=RC_W) continue;
    if(perp > rcZ[col]) continue;                 // behind a barrier
    const fog=Math.min(0.78, perp/1100);

    if(bb.kind==='car'){
      const c=bb.ref;
      const sp=c.fps || (c.fps=bakeFpsSprites(c));
      // pick the frame from the car's heading relative to the line of sight.
      // The bake's camera looks along -y, hence the quarter turn.
      const look=Math.atan2(bb.ref.y-camY, bb.ref.x-camX);
      const TAU=Math.PI*2;
      let yaw=c.angle - look - Math.PI/2;
      yaw=((yaw%TAU)+TAU)%TAU;
      const f=Math.round(yaw/TAU*sp.n)%sp.n;
      const row=c.hurtFlash>0 ? sp.fh : 0;
      // magnified about the anchor (ax, 0.62*fh), which is the contact patch, so
      // the wheels stay on the true ground line and the sprite still sits at the
      // column the gun is actually pointing down
      const s3=scale*carMag(perp);
      const w=sp.fw*s3, h=sp.fh*s3;
      rcCtx.globalAlpha=(1-fog*0.55) * clamp((1-bb.e)/CAR_FADE, 0, 1);
      rcCtx.drawImage(sp.cv, f*sp.fw, row, sp.fw, sp.fh,
        sx-sp.ax*s3, ground-sp.ay*s3, w, h);
      rcCtx.globalAlpha=1;
    } else if(bb.kind==='pad'){
      const s2=Math.max(1, 13*scale);
      rcCtx.fillStyle=ITEMS[bb.ref.item].col;
      rcCtx.globalAlpha=(1-fog)*0.9;
      rcCtx.fillRect(sx-s2/2, ground - bb.z*scale - s2, s2, s2);
      rcCtx.globalAlpha=1;
    } else if(bb.kind==='mine'){
      const s2=Math.max(1, 9*scale);
      rcCtx.fillStyle = (Math.floor(bb.ref.blink*6)%2 && bb.ref.arm<=0) ? '#f0503c' : '#3a3040';
      rcCtx.fillRect(sx-s2/2, ground-s2*0.6, s2, s2*0.6);
    } else if(bb.kind==='shot'){
      // cannon tracer halved (3 -> 1.5): leaving the gun, 8 units out, it was 55px
      // of a 90px pane. Missiles keep their size.
      const s2=Math.max(1, (bb.ref.kind==='missile'?8:1.5)*scale);
      // The player's own tracer is drawn leaving the gun rather than the
      // bodywork - the gun really is up on the ring mount, and at road height it
      // starts below the bottom of this pane and reads as a third of a second of
      // delay. This is a RENDER offset only: the shot's world z stays at the
      // front of the car, which is where the driving pane needs to draw it.
      // Easing linearly in distance keeps the tracer at a constant height below
      // the horizon, so it never outruns the visible band and blinks out.
      let bz = bb.z;
      if(bb.ref.owner===0)
        bz += (EYE_Z - bb.z) * clamp(1 - bb.d/SHOT_SETTLE, 0, 1);
      rcCtx.fillStyle = bb.ref.kind==='missile' ? '#ffcf6a' : '#ffe9a8';
      rcCtx.fillRect(sx-s2/2, ground - bz*scale - s2/2, s2, s2);
    } else if(bb.kind==='ring'){
      const p=bb.ref, k=p.t/p.life;
      const rr=lerp(p.r0,p.r1,k)*scale;
      rcCtx.globalAlpha=(1-k)*0.5;
      rcCtx.fillStyle='#ff9d3d';
      rcCtx.fillRect(sx-rr, ground - p.z*scale - rr*0.5, rr*2, rr);
      rcCtx.globalAlpha=1;
    } else {
      const p=bb.ref, k=p.t/p.life;
      const s2=Math.max(1, p.size*scale);
      rcCtx.globalAlpha=clamp(1-k,0,1)*(1-fog*0.5);
      rcCtx.fillStyle = Array.isArray(p.col) ? p.col[(p.x*7+p.y*3|0)%p.col.length] : p.col;
      rcCtx.fillRect(sx-s2/2, ground - p.z*scale - s2/2, s2, s2);
      rcCtx.globalAlpha=1;
    }
  }
}

function drawGunnerView(){
  const me=cars[0];
  const bearing = me.angle + me.turret;
  // the gun sits just behind the cabin, so the muzzle is not inside the bodywork
  const camX = me.x - Math.cos(me.angle)*4;
  const camY = me.y - Math.sin(me.angle)*4;
  // survival walls follow the camera; the loop's rings are static (built at start)
  if(!race) buildConvoyRings(vertical ? camY : camX);
  rcBackground(camX, camY, bearing);
  rcWalls(camX, camY, bearing);
  rcSprites(camX, camY, bearing);

  const p=PANE_P2;
  ctx.save();
  ctx.imageSmoothingEnabled=false;
  const sh = cam.shake ? rnd(-cam.shake,cam.shake)*0.4*PX : 0;
  if(asciiMode) asciiBlit(p.x*PX, p.y*PX + sh);
  else ctx.drawImage(rcCv, 0,0,RC_W,RC_H, p.x*PX, p.y*PX + sh, p.w*PX, p.h*PX);
  ctx.restore();
}

// ---------------------------------------------------------------- ascii gunner view
// The trick from C:\proj\ascii-city: it draws into a character grid and blits
// every glyph from a pre-rendered atlas rather than calling fillText per cell.
// Here it runs as a post-process. The raycaster renders exactly as before, then
// its buffer is read back and averaged into cells, and each cell becomes one
// glyph: the glyph's density carries the brightness, its tint carries the
// colour. Render path only - nothing in the world knows this exists.
//
// Compositing, so the tint costs no per-cell work: glyphs are drawn WHITE on
// black, then a tiny cols x rows "tint" image is scaled over them with
// `multiply` (white x tint = tint, black x tint = black). Mode 2 adds
// ascii-city's "solid glyphs": the tint, dimmed, as a background behind each cell.
let asciiMode = 2;                  // 0 off, 1 ascii, 2 ascii on solid cells (G cycles)
const ASC_NAMES = ['NORMAL','ASCII','ASCII SOLID'];
const ASC_RAMP  = ' .:-=+*%#@';     // sparse -> dense
const ASC_CW = 2, ASC_CH = 3;       // raycaster pixels per character cell
// fitted to a measured convoy frame: median luminance 37, 90th pct 55, 99th 83,
// lit windows ~150. The old 14..150 span put 80% of cells on the two faintest glyphs.
let   ASC_LO = 16, ASC_HI = 100, ASC_GAMMA = 1.0;   // luminance -> ramp tone curve
const ASC_LIFT = 2.6;               // max tint boost; the glyph, not the tint, says how dark
const ASC_SOLID = 0.24;             // mode 2 background strength
const ASC_LIGHT_R = 120, ASC_LIGHT_WARM = 60;   // a pixel this red and this warm is a lit window
let ascKey='', ascCols=0, ascRows=0, ascGW=0, ascGH=0;
let ascAtlas=null, ascCv=null, ascCtx=null, ascTint=null, ascTintCtx=null, ascTintImg=null;
let ascLast = null;                 // last frame's glyph indices, for the harness

function ascInit(){
  ascCols = Math.floor(RC_W/ASC_CW); ascRows = Math.floor(RC_H/ASC_CH);
  // device pixels per cell: RC is half the pane, so a cell is 2*ASC_CW*PX wide
  ascGW = Math.round(PANE_P2.w*PX/ascCols); ascGH = Math.round(PANE_P2.h*PX/ascRows);
  ascAtlas = document.createElement('canvas');
  ascAtlas.width = ascGW*ASC_RAMP.length; ascAtlas.height = ascGH;
  const a = ascAtlas.getContext('2d');
  a.fillStyle = '#fff'; a.textAlign = 'center'; a.textBaseline = 'middle';
  a.font = 'bold ' + ascGH + 'px ui-monospace,"DejaVu Sans Mono",monospace';
  for(let i=1;i<ASC_RAMP.length;i++) a.fillText(ASC_RAMP[i], (i+0.5)*ascGW, ascGH*0.55);
  ascCv = document.createElement('canvas');
  ascCv.width = ascCols*ascGW; ascCv.height = ascRows*ascGH;
  ascCtx = ascCv.getContext('2d', { alpha:false });
  ascTint = document.createElement('canvas');
  ascTint.width = ascCols; ascTint.height = ascRows;
  ascTintCtx = ascTint.getContext('2d');
  ascTintImg = ascTintCtx.createImageData(ascCols, ascRows);
  ascLast = new Uint8Array(ascCols*ascRows);
  ascKey = RC_W+'x'+RC_H+'@'+PX;
}

function asciiBlit(dx, dy){
  if(ascKey !== RC_W+'x'+RC_H+'@'+PX) ascInit();
  const src = rcCtx.getImageData(0, 0, RC_W, RC_H).data;
  const tp = ascTintImg.data, n = ASC_RAMP.length - 1;
  const inv = 1/(ASC_CW*ASC_CH), span = 1/(ASC_HI - ASC_LO);
  ascCtx.globalCompositeOperation = 'source-over';
  ascCtx.fillStyle = '#000'; ascCtx.fillRect(0, 0, ascCv.width, ascCv.height);
  for(let cy=0; cy<ascRows; cy++){
    for(let cx=0; cx<ascCols; cx++){
      let r=0, g=0, b=0, nl=0, lr=0, lg=0, lb=0;
      for(let yy=0; yy<ASC_CH; yy++){
        let o = ((cy*ASC_CH + yy)*RC_W + cx*ASC_CW)*4;
        for(let xx=0; xx<ASC_CW; xx++){
          const pr=src[o], pg=src[o+1], pb=src[o+2];
          r+=pr; g+=pg; b+=pb;
          if(pr > ASC_LIGHT_R && pr - pb > ASC_LIGHT_WARM){ nl++; lr+=pr; lg+=pg; lb+=pb; }
          o+=4;
        }
      }
      r*=inv; g*=inv; b*=inv;
      const lum = 0.299*r + 0.587*g + 0.114*b;
      let t = (lum - ASC_LO)*span; t = t<0 ? 0 : t>1 ? 1 : t;
      let gi = Math.round(Math.pow(t, ASC_GAMMA)*n);
      // A light wins its cell. Averaged, one lit pixel among five dark ones is
      // a dim '=' and the skyline goes out; instead the cell takes the light's
      // colour and a bright glyph - '*' for one lit pixel at LIGHTS_MIX 1, '+'
      // at 0.5 - rising to '@' as more of the cell is lit.
      if(nl){ r=lr/nl; g=lg/nl; b=lb/nl; gi = Math.max(gi, Math.min(n, Math.round(3 + LIGHTS_MIX*2) + nl)); }
      const q = cy*ascCols + cx;
      ascLast[q] = gi;
      const m = Math.max(r, g, b, 1), lift = Math.min(ASC_LIFT, 235/m);
      tp[q*4] = r*lift; tp[q*4+1] = g*lift; tp[q*4+2] = b*lift; tp[q*4+3] = 255;
      if(gi) ascCtx.drawImage(ascAtlas, gi*ascGW, 0, ascGW, ascGH, cx*ascGW, cy*ascGH, ascGW, ascGH);
    }
  }
  ascTintCtx.putImageData(ascTintImg, 0, 0);
  ascCtx.imageSmoothingEnabled = false;
  ascCtx.globalCompositeOperation = 'multiply';
  ascCtx.drawImage(ascTint, 0, 0, ascCols, ascRows, 0, 0, ascCv.width, ascCv.height);
  ascCtx.globalCompositeOperation = 'source-over';

  const w = ascCv.width, h = ascCv.height;
  if(asciiMode === 2){
    ctx.globalAlpha = ASC_SOLID;
    ctx.drawImage(ascTint, 0, 0, ascCols, ascRows, dx, dy, w, h);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'lighter';       // black adds nothing: only glyphs land
    ctx.drawImage(ascCv, dx, dy);
    ctx.globalCompositeOperation = 'source-over';
  } else {
    ctx.drawImage(ascCv, dx, dy);
  }
}

// ---------------------------------------------------------------- the turret
// Two aim models, one per mode:
//  - 2P is first-person, so the mouse turns the gun by its *movement* (locked
//    pointer, like Counter-Strike): move and it turns, stop and it holds. No drift.
//  - 1P is top-down, so the mouse is twin-stick: the gun points straight at the
//    cursor's world position. Keyboard arrows are the rate-based fallback for both.
const TURRET_RATE = 2.3;           // rad/s, keyboard traverse
const FPS_SENS = 0.0042;           // radians of gun traverse per unit of mouse movement (2P)
function updateTurret(c, dt){
  const TAU=Math.PI*2;
  if(numPlayers===1 && mouseIn && !c.dead){
    // twin-stick: aim the gun at the world point under the cursor (z=0 ground)
    const wx = (mouseSX - VCX)/S + cam.x;
    const wy = (mouseSY - VCY)/(S*KY) + cam.y;
    c.turret = Math.atan2(wy - c.y, wx - c.x) - c.angle;
  } else {
    let t=0;
    if(held('ArrowLeft'))  t-=1;
    if(held('ArrowRight')) t+=1;
    c.turret = (c.turret||0) + t*TURRET_RATE*dt;
    if(numPlayers===2){ c.turret += aimDX*FPS_SENS; aimDX=0; }   // locked-mouse traverse
  }
  c.turret = ((c.turret%TAU)+TAU)%TAU;
  if(c.turret>Math.PI) c.turret -= TAU;
  if(held('ArrowUp') || mouseFire) fireCannon(c);
  if(held('ArrowDown') || mouseFire2) fireMissile(c);
}

let aimDX=0, mouseSX=0, mouseSY=0, mouseIn=false, mouseFire=false, mouseFire2=false;
function pointerLocked(){ return typeof document!=='undefined' && document.pointerLockElement===cv; }
function bindGunnerMouse(){
  cv.addEventListener('contextmenu', e=>e.preventDefault());
  cv.addEventListener('mousemove', e=>{
    const r=cv.getBoundingClientRect();
    mouseSX=(e.clientX-r.left)*(W/r.width);
    mouseSY=(e.clientY-r.top)*(H/r.height);
    mouseIn=true;
    // 2P: accumulate raw mouse movement while the pointer is locked (FPS aim)
    if(numPlayers===2 && pointerLocked()) aimDX += e.movementX||0;
  });
  cv.addEventListener('mouseleave', ()=>{ mouseIn=false; mouseFire=false; mouseFire2=false; });
  cv.addEventListener('mousedown', e=>{
    Snd.boot();
    // menus are keyboard-driven; a click just advances (title -> setup -> play)
    if(state!=='play'){
      if(state==='title') state='setup';
      else if(state==='setup') startMatch(numPlayers);
      else if(state==='over') state='title';
      return;
    }
    // 2P grabs the pointer on first click, then clicks fire; 1P keeps the cursor visible
    if(numPlayers===2 && cv.requestPointerLock && !pointerLocked()){ cv.requestPointerLock(); }
    if(e.button===2) mouseFire2=true; else mouseFire=true;
  });
  cv.addEventListener('mouseup', e=>{ if(e.button===2) mouseFire2=false; else mouseFire=false; });
}

layoutPanes();
rcInit();
bindGunnerMouse();
rescale();

// ---------------------------------------------------------------- HUD
let gunnerHit=0, gunnerKill=0;

function bar(x,y,w,h,v,col,bg){
  ctx.fillStyle=bg||'rgba(10,7,14,.8)'; ctx.fillRect(x-1,y-1,w+2,h+2);
  ctx.fillStyle=col; ctx.fillRect(x,y,Math.round(w*clamp(v,0,1)),h);
}
function centerText(t,col,y,size,cx){
  ctx.textAlign='center'; ctx.font='bold '+(size||10)+'px monospace'; ctx.fillStyle=col;
  ctx.fillText(t, cx==null?VW/2:cx, y); ctx.textAlign='left';
}
function plate(x,y,w,h){
  ctx.fillStyle='rgba(12,9,16,.74)'; ctx.fillRect(x,y,w,h);
  ctx.strokeStyle='rgba(120,100,140,.22)'; ctx.lineWidth=1; ctx.strokeRect(x+0.5,y+0.5,w-1,h-1);
}

// ---- player 2: crosshair, ammo, radar
function drawGunnerHUD(){
  const p=PANE_P2, me=cars[0];
  const cx=p.x+p.w/2, cy=p.y+p.h*(RC_HORIZON/RC_H);

  // is anything actually under the gun right now?
  let onTarget=false;
  const bearing=me.angle+(me.turret||0);
  for(let i=1;i<cars.length;i++){
    const o=cars[i]; if(o.dead) continue;
    const d=Math.hypot(o.x-me.x,o.y-me.y);
    if(d>420) continue;
    if(Math.abs(angDiff(bearing, Math.atan2(o.y-me.y,o.x-me.x))) < 0.06 + 18/d) { onTarget=true; break; }
  }

  // FPS aim needs the pointer locked; prompt for the click that grabs it
  if(!pointerLocked() && !me.dead){
    ctx.font='8px monospace'; ctx.textAlign='center';
    ctx.fillStyle='rgba(224,183,60,'+(0.55+0.35*Math.abs(Math.sin(matchTime*4)))+')';
    ctx.fillText('CLICK TO AIM', cx, p.y+18); ctx.textAlign='left';
  }

  // The gun mount, fixed to the pane. A foreground that never moves is the
  // strongest cue there is that the camera itself is not rotating. And since
  // hit detection in this engine is purely horizontal, a tall bearing line is
  // also an honest reticle: only the column you point at matters, not elevation.
  const my=p.y+p.h;
  ctx.fillStyle='rgba(232,213,176,.10)';
  ctx.fillRect(cx-0.5, cy+6, 1, my-20-cy-6);
  ctx.fillStyle='#16121c';
  ctx.beginPath();
  ctx.moveTo(p.x, my); ctx.lineTo(p.x, my-7);
  ctx.quadraticCurveTo(cx, my-21, p.x+p.w, my-7);
  ctx.lineTo(p.x+p.w, my); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#2a2333';
  ctx.beginPath();
  ctx.moveTo(cx-13, my-9); ctx.lineTo(cx-4, my-20);
  ctx.lineTo(cx+4, my-20); ctx.lineTo(cx+13, my-9); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#3d3448'; ctx.fillRect(cx-2.5, my-23, 5, 5);
  if(me.cool>0.09){
    ctx.fillStyle='#ffe9a8';
    ctx.beginPath(); ctx.arc(cx, my-25, 3+Math.random()*2, 0, Math.PI*2); ctx.fill();
  }

  const col = gunnerHit>0 ? '#ffffff' : onTarget ? '#f0503c' : 'rgba(232,213,176,.65)';
  ctx.strokeStyle=col; ctx.lineWidth=1;
  const g=onTarget?7:5;
  ctx.beginPath();
  ctx.moveTo(cx-g-4,cy); ctx.lineTo(cx-g,cy);
  ctx.moveTo(cx+g,cy);   ctx.lineTo(cx+g+4,cy);
  ctx.moveTo(cx,cy-g-4); ctx.lineTo(cx,cy-g);
  ctx.moveTo(cx,cy+g);   ctx.lineTo(cx,cy+g+4);
  ctx.stroke();
  if(gunnerHit>0){
    ctx.strokeStyle='#fff'; ctx.beginPath();
    ctx.moveTo(cx-5,cy-5); ctx.lineTo(cx+5,cy+5);
    ctx.moveTo(cx+5,cy-5); ctx.lineTo(cx-5,cy+5); ctx.stroke();
  }

  // role tag and ammo
  plate(p.x+6, p.y+6, 92, 34);
  ctx.font='8px monospace'; ctx.textBaseline='top';
  ctx.fillStyle='#9d8ea5'; ctx.fillText('P2 GUNNER', p.x+11, p.y+10);
  ctx.fillStyle='#f97362'; ctx.fillText('MSL '+me.missiles, p.x+11, p.y+21);
  ctx.fillStyle= me.cool>0 ? '#5a4a5e' : '#e0b73c';
  ctx.fillText('CANNON', p.x+50, p.y+21);
  ctx.fillStyle='#5a4a5e';
  ctx.fillText((me.turret>=0?'R':'L')+Math.abs(Math.round(me.turret*57))+'°', p.x+11, p.y+31);

  if(gunnerKill>0){
    ctx.globalAlpha=clamp(gunnerKill*2,0,1);
    centerText('WRECKED HIM','#ffe9a8', p.y+p.h*0.30, 11, cx);
    ctx.globalAlpha=1;
  }

  // radar: car-relative, with the turret's arc of fire drawn on it
  const rx=p.x+p.w-46, ry=p.y+40, rr=32;
  ctx.fillStyle='rgba(10,7,14,.7)';
  ctx.beginPath(); ctx.arc(rx,ry,rr,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='rgba(120,100,140,.3)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(rx,ry,rr,0,Math.PI*2); ctx.stroke();
  // up on the radar is the car's nose
  ctx.fillStyle='rgba(224,183,60,.16)';
  ctx.beginPath(); ctx.moveTo(rx,ry);
  ctx.arc(rx,ry,rr, (me.turret||0)-Math.PI/2-RC_FOV/2, (me.turret||0)-Math.PI/2+RC_FOV/2);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#e0b73c';
  ctx.beginPath(); ctx.moveTo(rx,ry);
  ctx.lineTo(rx+Math.cos((me.turret||0)-Math.PI/2)*rr, ry+Math.sin((me.turret||0)-Math.PI/2)*rr);
  ctx.stroke();
  const RAD_RANGE=620;
  for(let i=1;i<cars.length;i++){
    const o=cars[i]; if(o.dead) continue;
    const dx=o.x-me.x, dy=o.y-me.y, d=Math.hypot(dx,dy);
    if(d>RAD_RANGE) continue;
    const rel=Math.atan2(dy,dx)-me.angle-Math.PI/2;
    const k=d/RAD_RANGE*rr;
    ctx.fillStyle=o.color;
    ctx.fillRect(rx+Math.cos(rel)*k-1.5, ry+Math.sin(rel)*k-1.5, 3, 3);
  }
  ctx.fillStyle='#fff'; ctx.fillRect(rx-1,ry-1,2,2);
}

// ---- player 1: the driving instruments
function drawDriverHUD(){
  const p=PANE_P1, me=cars[0];
  ctx.font='8px monospace'; ctx.textBaseline='top'; ctx.textAlign='left';

  // hull + speed, bottom-left
  plate(p.x+6, p.y+p.h-42, 118, 36);
  ctx.fillStyle='#9d8ea5'; ctx.fillText(numPlayers===2?'P1 DRIVER':'DRIVER / GUNNER', p.x+11, p.y+p.h-38);
  // the hull bar never moves in dev mode, so say why rather than let it look broken
  if(devMode){ ctx.textAlign='right'; ctx.fillStyle='#e0b73c';
    ctx.fillText('DEV', p.x+119, p.y+p.h-38); ctx.textAlign='left'; }
  bar(p.x+11, p.y+p.h-27, 100, 6, me.hp/me.maxHp,
      me.hp>me.maxHp*0.5?'#4ade80':me.hp>me.maxHp*0.25?'#e0b73c':'#f0503c');
  bar(p.x+11, p.y+p.h-17, 100, 4, clamp(Math.abs(me.speed||0)/232,0,1), '#57b7d6');
  // solo carries its own gun readout (in convoy this lives in the gunner pane)
  if(numPlayers===1){
    plate(p.x+p.w-70, p.y+p.h-42, 64, 36);
    ctx.fillStyle='#9d8ea5'; ctx.fillText('GUN', p.x+p.w-64, p.y+p.h-38);
    ctx.fillStyle= me.cool>0 ? '#5a4a5e' : '#e0b73c'; ctx.fillText('CANNON', p.x+p.w-64, p.y+p.h-27);
    ctx.fillStyle='#f97362'; ctx.fillText('MSL '+me.missiles, p.x+p.w-64, p.y+p.h-16);
  }

  if(race){
    // place + lap, top-left; standings, top-right
    const ord=['1st','2nd','3rd','4th'][clamp(me.place-1,0,3)];
    plate(p.x+6, p.y+6, 62, 28);
    ctx.font='bold 14px monospace'; ctx.fillStyle= me.place===1?'#e0b73c':'#e8d5b0';
    ctx.fillText(ord, p.x+11, p.y+9);
    ctx.font='8px monospace'; ctx.fillStyle='#9d8ea5';
    ctx.fillText('LAP '+clamp(me.lap+1,1,LAPS)+'/'+LAPS, p.x+11, p.y+24);
    const bx=p.x+p.w-96;
    plate(bx-5, p.y+6, 95, 6+cars.length*10);
    [...cars].sort((a,b)=>a.place-b.place).forEach((c,i)=>{
      const y=p.y+10+i*10;
      ctx.fillStyle=c.color; ctx.fillRect(bx,y+1,5,5);
      ctx.fillStyle=c.isPlayer?'#fff':'#9d8ea5'; ctx.fillText(c.name, bx+9, y);
      ctx.textAlign='right'; ctx.fillStyle='#e8d5b0';
      ctx.fillText(c.finished?'FIN':'L'+clamp(c.lap+1,1,LAPS), p.x+p.w-8, y);
      ctx.textAlign='left';
    });
  } else {
    // distance survived (the score) + wave, top-left
    plate(p.x+6, p.y+6, 96, 28);
    ctx.font='bold 14px monospace'; ctx.fillStyle='#e0b73c';
    ctx.fillText(Math.floor(distance)+'m', p.x+11, p.y+9);
    ctx.font='8px monospace'; ctx.fillStyle='#9d8ea5';
    ctx.fillText('WAVE '+wave+'   KILLS '+convoyKills, p.x+11, p.y+24);
  }

  // low-hp vignette so you feel the danger
  if(me.hp < me.maxHp*0.3 && !me.dead){
    ctx.globalAlpha = 0.10 + 0.12*Math.abs(Math.sin(matchTime*6));
    ctx.fillStyle='#f0503c'; ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.globalAlpha=1;
  }
}

function drawHUD(){
  ctx.save(); ctx.scale(PX,PX);
  ctx.textBaseline='top'; ctx.textAlign='left';
  if(numPlayers===2){
    drawGunnerHUD();
    // seam between the two seats
    ctx.fillStyle='#0b0810';
    if(LAYOUT==='side') ctx.fillRect(VW/2-1, 0, 2, VH);
    else ctx.fillRect(0, VH/2-1, VW, 2);
  }
  drawDriverHUD();

  if(showFps){
    ctx.fillStyle='#4ade80'; ctx.font='8px monospace';
    ctx.fillText(fpsVal+' fps  '+W+'x'+H+'  rc '+RC_W+'x'+RC_H+
      '  eye '+EYE_Z+'  fov '+Math.round(RC_FOV*180/Math.PI)+
      '  carmag '+CAR_MAG_MAX.toFixed(1)+(devMode?'  DEV':'')+
      '  '+(cars.length+shots.length+fx.length)+' ent  '+bbList.length+' bb', 132, 8);
  }
  if(paused) centerText('PAUSED','#e8d5b0', VH/2+20, 12);
  ctx.restore();
}

// ---------------------------------------------------------------- frame
let acc=0, last=performance.now(), fpsVal=60, fpsAcc=0, fpsN=0;

function step(dt){
  matchTime+=dt;
  const me=cars[0];

  if(race){
    // a race: no forced scroll, no spawner. The camera just chases the player and
    // laps/positions are handled in updateCar/updatePlaces (state->over on finish).
    for(const c of cars) updateCar(c,dt);
    carVsCar(dt);
    updateShots(dt);
    updatePads(dt);
    updateFx(dt);
    updatePlaces();
    gunnerHit=Math.max(0,gunnerHit-dt);
    gunnerKill=Math.max(0,gunnerKill-dt);
    const tx = me.x + clamp(me.vx*0.28,-70,70), ty = me.y + clamp(me.vy*0.28,-70,70);
    cam.x = lerp(cam.x, tx, 1-Math.pow(0.0025, dt));
    cam.y = lerp(cam.y, ty, 1-Math.pow(0.0025, dt));
    if(!me.dead){ const rpm=clamp(Math.abs(me.speed||0)/232,0,1); Snd.engine(rpm, clamp((me.slide||0)/120,0,1)); }
    else Snd.engineOff();
    return;
  }

  // ---- survival stages (convoy / ascent) ----
  // forced scroll: the camera drags the whole field forward at an escalating pace,
  // and distance survived is the score. This runs even while the player is dying.
  camV = Math.min(CAM_VMAX, camV + CAM_RAMP*dt);
  // forced scroll along the forward axis: +x (convoy) or -y (ascent)
  if(vertical) cam.y -= camV*dt; else cam.x += camV*dt;
  distance += camV*dt;
  updateSpawner(dt);

  for(const c of cars) updateCar(c,dt);
  carVsCar(dt);
  updateShots(dt);
  updatePads(dt);
  updateFx(dt);
  gunnerHit=Math.max(0,gunnerHit-dt);
  gunnerKill=Math.max(0,gunnerKill-dt);

  // keep the player inside the frame with soft walls ahead and behind (no damage -
  // the "keep moving" pressure comes from the enemies)
  if(!me.dead){
    if(vertical){
      // forward is -y; camera climbs at -camV, so holding station means vy ~= -camV
      const rel = me.y - cam.y;
      if(rel < -FRONT_MAX){ me.y = cam.y - FRONT_MAX; if(me.vy < -camV) me.vy = -camV; }
      if(rel >  BACK_EDGE){ me.y = cam.y + BACK_EDGE; if(me.vy > -camV) me.vy = -camV*0.6 + me.vy*0.4; }
    } else {
      const rel = me.x - cam.x;
      if(rel > FRONT_MAX){ me.x = cam.x + FRONT_MAX; if(me.vx>camV) me.vx = camV; }
      if(rel < -BACK_EDGE){ me.x = cam.x - BACK_EDGE; if(me.vx < camV) me.vx = camV*0.6 + me.vx*0.4; }
    }
  }

  // camera tracks the player on the LATERAL axis, gently, staying in the corridor
  const latFollow = clamp((vertical?me.x:me.y)*0.5, -ROAD_HW*0.4, ROAD_HW*0.4);
  if(vertical) cam.x = lerp(cam.x, latFollow, 1-Math.pow(0.02, dt));
  else         cam.y = lerp(cam.y, latFollow, 1-Math.pow(0.02, dt));

  // the player run ends a beat after the wreck, so the explosion gets to play
  if(me.dead){
    Snd.engineOff();
    if(me.respawn < 1.4 && state==='play'){
      bestDist = Math.max(bestDist, Math.floor(distance));
      winner=null; state='over';
    }
  } else {
    const rpm = clamp(Math.abs(me.speed||0)/232, 0, 1);
    Snd.engine(rpm, clamp((me.slide||0)/120,0,1));
  }
}

function inView(x,y,m){
  m=m||40;
  // vertical uses VIEW_HH (covers the biased look-ahead); horizontal uses the
  // foreshortened lateral extent, exactly as convoy did
  return vertical
    ? (Math.abs(x-cam.x) < VHW+m && Math.abs(y-cam.y) < VIEW_HH+m)
    : (Math.abs(x-cam.x) < VHW+m && Math.abs(y-cam.y)*KY < VHH+m);
}

// the gunner's aim, drawn into the driving pane so P1 can see where P2 is looking
function drawAimLine(){
  const me=cars[0];
  if(me.dead) return;
  const a=aimAngle(me);
  const p0=toScreen(me.x,me.y,7);
  const reach=numPlayers===1?170:150;
  const p1=toScreen(me.x+Math.cos(a)*reach, me.y+Math.sin(a)*reach, 7);
  ctx.save();
  ctx.globalAlpha=0.35; ctx.strokeStyle='#f0503c'; ctx.lineWidth=Math.max(1,S);
  ctx.setLineDash([4*S,4*S]);
  ctx.beginPath(); ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y); ctx.stroke();
  // a reticle at the tip so the solo player (who is also the gunner) can read the aim
  ctx.setLineDash([]); ctx.globalAlpha=0.8;
  const g=5*S;
  ctx.beginPath();
  ctx.moveTo(p1.x-g,p1.y); ctx.lineTo(p1.x+g,p1.y);
  ctx.moveTo(p1.x,p1.y-g); ctx.lineTo(p1.x,p1.y+g);
  ctx.stroke();
  ctx.restore();
}

function render(){
  ctx.fillStyle='#0b0810'; ctx.fillRect(0,0,W,H);

  // ---- player 2: first person, out of the gun ring (only in a two-player run)
  if(numPlayers===2) drawGunnerView();

  // ---- player 1: the axonometric view, clipped to its own pane
  const p=PANE_P1;
  ctx.save();
  ctx.beginPath(); ctx.rect(p.x*PX, p.y*PX, p.w*PX, p.h*PX); ctx.clip();
  const sx = cam.shake ? rnd(-cam.shake,cam.shake)*S : 0;
  const sy = cam.shake ? rnd(-cam.shake,cam.shake)*KY*S : 0;
  ctx.translate(Math.round(sx), Math.round(sy));

  drawTrack();
  const bl = buildings2D();
  drawBuildings2D(bl, false);        // behind the road: before the far walls
  // Walls. LOOP: the two closed barrier rings, split far/near so cars sit between.
  // CONVOY: top/bottom shoulders, far behind the cars, near in front. ASCENT: the
  // left/right barriers run the depth of the road, so both draw behind the cars.
  let raceW=null;
  if(race){
    raceW = { o:buildWallPaths(track.outer), i:buildWallPaths(track.inner) };
    strokeWall(raceW.o.far, TRK.WALL, '#6a5570');
    strokeWall(raceW.i.far, TRK.WALL, '#6a5570');
  } else if(vertical){
    strokeWall(convoyWallPath(-ROAD_HW), TRK.WALL, '#6a5570'); drawWallPosts(-ROAD_HW);
    strokeWall(convoyWallPath( ROAD_HW), TRK.WALL, '#6a5570'); drawWallPosts( ROAD_HW);
  } else {
    strokeWall(convoyWallPath(-ROAD_HW), TRK.WALL, '#6a5570'); drawWallPosts(-ROAD_HW);
  }

  for(const pd of pads) if(inView(pd.x,pd.y)) drawPad(pd);
  for(const m of mines) if(inView(m.x,m.y)) drawMine(m);

  // painter's algorithm on world Y (depth), visible entities only
  const drawables=[];
  for(const c of cars) if(!c.dead && (c.isPlayer || inView(c.x,c.y))) drawables.push({y:c.y, f:()=>drawCar(c)});
  for(const s of shots) if(inView(s.x,s.y)) drawables.push({y:s.y, f:()=>drawShot(s)});
  drawables.sort((a,b)=>a.y-b.y);
  for(const d of drawables) d.f();

  if(race){ strokeWall(raceW.o.near, TRK.WALL, '#6a5570'); strokeWall(raceW.i.near, TRK.WALL, '#6a5570'); }
  else if(!vertical){ strokeWall(convoyWallPath(ROAD_HW), TRK.WALL, '#6a5570'); drawWallPosts(ROAD_HW); }
  drawBuildings2D(bl, true);         // in front of the road: after everything, see-through
  drawAimLine();                       // the gun exists in every stage now
  drawFx();
  ctx.restore();

  drawHUD();
}

function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000; last=now;
  if(dt>0.25) dt=0.25;
  fpsAcc+=dt; fpsN++;
  if(fpsAcc>0.5){ fpsVal=Math.round(fpsN/fpsAcc); fpsAcc=0; fpsN=0; }

  if(state==='title'){ drawTitle(); return; }
  if(state==='setup'){ drawSetup(); return; }

  if(state==='play' && !paused){
    acc+=dt;
    let guard=0;
    while(acc>=DT && guard++<5){ step(DT); acc-=DT; }
  }
  render();
  if(state==='over') drawOver();
}
requestAnimationFrame(frame);
</script>
</body>
</html>
