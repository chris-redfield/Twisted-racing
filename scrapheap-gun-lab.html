  // purpose - the gun turns 360 on its own, so there is no reason to turn the car
  // around - which is what keeps ordinary weaving and dodging unassisted.
  // STREET is free drive - turning round and parking across the road is the
  // point - so the latch stays out of it.
  if(c.isPlayer && !race && !street){
    const qa = roadProject(c.x, c.y);
    const toAxis = angDiff(c.angle, Math.atan2(qa.ty, qa.tx));   // off the road's heading
    const off = Math.abs(toAxis), sgn = toAxis<0 ? -1 : 1;
    // A LATCH, not a permanent assist. Going past SPIN_FREE arms it; from then on
    // it rights the car all the way home and only then lets go. Below the
    // threshold with the latch clear it does nothing whatsoever, which is what
    // keeps ordinary driving bit-for-bit the way it always was - no self-centring
    // under your hands, no resistance to a turn.
    //
    // Righting all the way home is what makes the rest unnecessary. An earlier
    // version eased out AT the threshold and parked the car there driving
    // diagonally, which cost half its road speed; chasing that crawl is what led
    // to re-modelling the throttle, and re-modelling the throttle is what made
    // the driving feel wrong. Fix the heading properly and the throttle never
    // needs touching.
    if(off > SPIN_FREE) c.spinFix = 1;
    if(c.spinFix){
      if(off < 0.15) c.spinFix = 0;                      // home: hand it back
      else c.angle += sgn * Math.min(SPIN_RIGHT*dt, off);
    }
  }

  c.vx = fx0*fwd - fy0*lat;
  c.vy = fy0*fwd + fx0*lat;
  c.x += c.vx*dt; c.y += c.vy*dt;

  const impact = blockCollide(c, c.rad||14, true);
  if(impact>140){ Snd.crash(); damage(c, impact*0.035, null);
    particles(c.x,c.y,6,4,{col:['#ffe9a8','#9a8aa0'],spd0:20,spd1:90,size:2,life0:0.1,life1:0.3}); }
  if(c.hitBlock && c.hitBlock.type==='barrel'){ c.hitBlock.hp-=impact*0.2; if(c.hitBlock.hp<=0) popBarrel(c.hitBlock,c.id); c.hitBlock=null; }

  // skid marks when sliding
  const slide = Math.abs(lat);
  c.skidT -= dt;
  if(slide>55 && c.skidT<=0){
    c.skidT=0.03;
    skids.push({x:c.x,y:c.y,a:c.angle,t:0});
    if(skids.length>260) skids.shift();
  }
  c.speed = fwd; c.slide = slide;

  // stuck detector: if a bot has barely moved for half a second, back it out
  c.contactT = c.contact ? 0.5 : Math.max(0, (c.contactT||0)-dt);

  if(c.hp < c.maxHp*0.4){
    c.smokeT=(c.smokeT||0)-dt;
    if(c.smokeT<=0){
      c.smokeT = 0.04 + (c.hp/c.maxHp)*0.14;
      particles(c.x-Math.cos(c.angle)*12, c.y-Math.sin(c.angle)*12, 8, 1,
        { col:c.hp<c.maxHp*0.2?['#3a3040','#6b5c72','#8a5a3a']:['#4a3f50','#6b5c72'],
          spd0:2, spd1:16, size:2, life0:0.5, life1:1.1, grav:-14, up0:6, up1:22 });
    }
  }
  // boost flame out of the back while it burns. Blue-white at the head so it does
  // not read as the damage smoke or as a hit.
  if(c.boostT>0 && !c.dead){
    particles(c.x-Math.cos(c.angle)*15, c.y-Math.sin(c.angle)*15, 5, 2,
      { col:['#bfe8ff','#ffe9a8','#ff9d3d'], spd0:10, spd1:60, size:2,
        life0:0.1, life1:0.28, grav:0, up0:2, up1:16 });
  }

  if(!c.isPlayer){
    c.moveCheck -= dt;
    if(c.moveCheck<=0){
      const moved=Math.hypot(c.x-c.lastX, c.y-c.lastY);
      if(c.lastX!==0 && moved<24 && c.contactT>0 && c.reverseT<=0){
        beginRecovery(c, 0.9);
      }
      c.lastX=c.x; c.lastY=c.y; c.moveCheck=0.5;
    }
  }

  if(mode==='race' && c.proj){
    const p=c.proj.prog;
    if(c.prog!=null){
      const d=p-c.prog;
      if(d<-0.5) c.lap++;
      else if(d>0.5) c.lap--;
    }
    c.prog=p; c.total=c.lap+p;
    if(c.lap>=LAPS && !c.finished){
      c.finished=true; c.finishTime=matchTime; finishOrder.push(c);
      if(c.isPlayer || finishOrder.length>=3){ winner=finishOrder[0]; state='over'; }
    }
  }
}

function updatePlaces(){
  const order=[...cars].sort((a,b)=>{
    if(a.finished&&b.finished) return a.finishTime-b.finishTime;
    if(a.finished) return -1;
    if(b.finished) return 1;
    return b.total-a.total;
  });
  order.forEach((c,i)=>c.place=i+1);
}

// A contact never takes the player's speed, and a shunt from behind adds to it.
// Only the component along the nose is touched - the sideways half of the impulse
// lands in full, so a hit still shoves you across the lane and a side-swipe feels
// exactly as it did. Enemies are unaffected: they still get the whole impulse,
// and damage is untouched either way.
// `ram` marks a car-on-car shunt, which is the only thing that ADDS speed. Gunfire
// just stops costing it: a stream of bullets opening the coast window over and
// over would hold the cruise control off for as long as someone was shooting you.
function playerImpulse(c, ix, iy, ram){
  const fx=Math.cos(c.angle), fy=Math.sin(c.angle);
  const along = ix*fx + iy*fy;
  if(along <= 0) return [ix - along*fx, iy - along*fy];     // frontal: drop it, keep the sideways
  if(!ram) return [ix, iy];                                  // gunfire from behind: as it was
  c.ramT = RAM_COAST;                                        // a shunt from behind: let it run
  const add = along*(RAM_GAIN-1);
  return [ix + add*fx, iy + add*fy];
}

function carVsCar(dt){
  for(let i=0;i<cars.length;i++) for(let j=i+1;j<cars.length;j++){
    const a=cars[i], b=cars[j];
    if(a.dead||b.dead) continue;
    const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy);
    // contact distance is the two cars' own sizes now, not a flat 26 (which is
    // what the -2 keeps it at for a pair of standard ones)
    const touch = (a.rad||14)+(b.rad||14)-2;
    if(d<touch && d>0.01){
      const nx=dx/d, ny=dy/d, push=(touch-d)/2;
      a.x-=nx*push; a.y-=ny*push; b.x+=nx*push; b.y+=ny*push;
      const rel=(b.vx-a.vx)*nx + (b.vy-a.vy)*ny;
      if(rel<0){
        const imp=-rel*0.7;
        let aix=-nx*imp, aiy=-ny*imp, bix=nx*imp, biy=ny*imp;
        if(a.isPlayer) [aix,aiy]=playerImpulse(a,aix,aiy,true);
        if(b.isPlayer) [bix,biy]=playerImpulse(b,bix,biy,true);
        a.vx+=aix; a.vy+=aiy; b.vx+=bix; b.vy+=biy;
        // touching the player sets the bomb truck off where it stands
        const bt = a.etype==='tanque' ? a : b.etype==='tanque' ? b : null;
        if(bt && (a.isPlayer || b.isPlayer) && !bt.dead) damage(bt, 9999, null);
        if(-rel>150){
          Snd.crash(); cam.shake=Math.min(6,cam.shake+1.5);
          // ramming damage favours whoever was moving into the hit
          const aInto = (a.vx*nx+a.vy*ny), bInto = -(b.vx*nx+b.vy*ny);
          damage(a, (-rel)*0.020*(bInto>aInto?1.5:0.6), b.id);
          damage(b, (-rel)*0.020*(aInto>bInto?1.5:0.6), a.id);
          particles((a.x+b.x)/2,(a.y+b.y)/2,7,6,{col:['#ffe9a8','#fff'],spd0:30,spd1:120,size:2,life0:0.1,life1:0.3});
        }
      }
    }
  }
}

// ---------------------------------------------------------------- AI
function aiThink(c, dt){
  c.wander += dt;
  if(c.reverseT>0){
    c.reverseT -= dt;
    // steer the nose toward open space; reversing inverts the steering sign
    const diff = angDiff(c.angle, c.escapeAng);
    const s = clamp(diff*2.0, -1, 1);
    c.aiThrottle = c.revDir;
    c.aiSteer = c.revDir<0 ? -s : s;
    c.aiBrake = false;
    return;
  }
  if(street && stage==='run'){ if(onFoot) aiCruise(c, dt); else aiCity(c, dt); return; }
  if(mode==='convoy'){
    if(c.etype==='batedor') aiFlank(c, dt);
    else if(c.role==='charger') aiCharge(c, dt);
    else aiPursue(c, dt);
    return;
  }
  if(mode==='race') aiRace(c, dt);
  else aiCombat(c, dt);
}

// charger: oncoming traffic. It holds the lane it spawned in and barrels straight
// back down the road so you can weave between them, drifting only slightly toward
// you. It is meant to pass through and exit behind, not to hunt you down.
function aiCharge(c, dt){
  const me = cars[0];
  // straight down the road, with a small lean toward the player's lane (dodgeable).
  // heading is toward -x (convoy) or +y (ascent); lateral is y (convoy) or x (ascent).
  const q = roadProject(c.x, c.y);
  const base = Math.atan2(-q.ty + 0, -q.tx + 0);          // back down the road
  const lat = q.lat;
  let want = base + clamp(angDiff(base, Math.atan2(me.y-c.y, me.x-c.x)), -0.16, 0.16);
  if(lat >  ROAD_HW*0.78) want = base + 0.35;
  if(lat < -ROAD_HW*0.78) want = base - 0.35;
  c.aiSteer = clamp(angDiff(c.angle, want)*2.0, -1, 1);
  // and it fishtails as it comes, so its line is never quite the one you read
  if(c.etype==='tanque') c.aiSteer = clamp(c.aiSteer + Math.sin(c.wander*2.3)*0.55, -1, 1);
  c.aiThrottle = 1;
  c.aiBrake = false;
  const aim = angDiff(c.angle, Math.atan2(me.y-c.y, me.x-c.x));
  const dist = Math.hypot(me.x-c.x, me.y-c.y);
  if(Math.abs(aim)<0.14 && dist<320 && Math.random()<0.25) fireCannon(c);
}

// batedor: comes up from behind, but it will not sit on your bumper. It picks a
// side, runs past you down that side - it has the legs for it, being the quick one
// - and only once it is level or ahead does it turn in and work you over. Being
// overtaken and then met head-on is the shape of it.
function aiFlank(c, dt){
  const me = cars[0];
  // forward and lateral unit vectors for this stage
  const q = roadProject(c.x, c.y);
  const fx = q.tx, fy = q.ty;
  const sx = q.nx, sy = q.ny;
  // which side to go round; swap if this one is running out of road
  if(!c.flankSide) c.flankSide = Math.random()<0.5 ? -1 : 1;
  const lat = q.lat;
  if(lat*c.flankSide > ROAD_HW*0.72) c.flankSide = -c.flankSide;

  const gap = (me.x-c.x)*fx + (me.y-c.y)*fy;     // + while the player is still ahead
  // Latched, with a wide gap between the two thresholds. Without that it flipped
  // state every time the gap crossed one number and just weaved around him
  // forever, never settling into either job.
  if(gap < 30)  c.flankDone = 1;                 // through - stop overtaking
  if(gap > 220) c.flankDone = 0;                 // lost him again - go round afresh
  const passing = !c.flankDone;

  let tx, ty, thr = 1;
  if(passing){
    // aim past him, out on our side: it has the legs to get there
    const lead = gap + 150;
    tx = me.x + fx*lead + sx*c.flankSide*FLANK_OFF;
    ty = me.y + fy*lead + sy*c.flankSide*FLANK_OFF;
  } else {
    // through, so now shut the door: sit in his lane just ahead and come off the
    // throttle, which is the "fecha voce pela frente" half of it
    tx = me.x + fx*BLOCK_LEAD;
    ty = me.y + fy*BLOCK_LEAD;
    thr = 0.82;
  }
  let want = Math.atan2(ty-c.y, tx-c.x);
  if(lat >  ROAD_HW*0.82) want -= 0.4;
  if(lat < -ROAD_HW*0.82) want += 0.4;
  const diff = angDiff(c.angle, want);
  c.aiSteer = clamp(diff*2.3, -1, 1);
  c.aiThrottle = thr;
  c.aiBrake = false;
  // It takes any shot it gets, in either phase. Gating this on having finished the
  // overtake meant it never fired at all: once it is in front and shutting the
  // door, the player is behind it, and the gun only points down the nose.
  const dist = Math.hypot(me.x-c.x, me.y-c.y);
  const aim  = angDiff(c.angle, Math.atan2(me.y-c.y, me.x-c.x));
  if(Math.abs(aim)<0.5 && dist<300 && Math.random()<0.45) fireCannon(c);
}

// pursuer: run the player down from behind and ram or shoot. Reuses the arena
// hunter's ramming arc, but locked onto the player and always driving forward.
function aiPursue(c, dt){
  const me = cars[0];
  const dx=me.x-c.x, dy=me.y-c.y, dist=Math.hypot(dx,dy);
  const lead=clamp(dist/430,0,1);
  let want=Math.atan2(me.y+me.vy*0.3*lead - c.y, me.x+me.vx*0.3*lead - c.x);
  // Past the first PURSUE_SQUAD of them (ranked by who is closest) a green stops
  // working the player and forms up in its own pack further back, spread across
  // the road, waiting for a place to open. You get waves rather than a scrum on
  // the bumper, and the ones holding back still read as hunting you.
  if(c.squad > 0){
    const back = 200 + c.squad*150, side = ((c.rank % PURSUE_SQUAD) - 1.5)*60;
    const qm = roadProject(me.x, me.y);           // form up behind him, along the road
    const hx = me.x + (-qm.tx*back + qm.nx*side);
    const hy = me.y + (-qm.ty*back + qm.ny*side);
    want = Math.atan2(hy - c.y, hx - c.x);
  }
  if(dist<130){
    c.closeT=(c.closeT||0)+dt;
    if(c.closeT>3.0){ c.closeT=0; c.orbitDir=-(c.orbitDir||1); }
    if(c.closeT>1.7) want += (c.orbitDir||1)*1.2;
  } else c.closeT=0;
  // steer away from the barriers
  const lat = roadProject(c.x, c.y).lat;
  if(lat >  ROAD_HW*0.8) want -= 0.5;
  if(lat < -ROAD_HW*0.8) want += 0.5;
  let diff=angDiff(c.angle, want) + Math.sin(c.wander*1.7)*0.08;
  c.aiSteer=clamp(diff*2.2,-1,1);
  c.aiThrottle=1;                                   // a pursuer never coasts; it must keep up
  c.aiBrake = Math.abs(diff)>1.3 && Math.abs(c.speed||0)>160;
  const aim=angDiff(c.angle, Math.atan2(dy,dx));
  if(Math.abs(aim)<0.22 && dist<340 && Math.random()<0.5) fireCannon(c);
  if(Math.abs(aim)<0.3 && dist<380 && c.missiles>0 && c.mcool<=0 && Math.random()<0.02) fireMissile(c);
}

function beginRecovery(c, secs){
  const push = openDirection(c);
  c.escapeAng = push.mag>0.05 ? Math.atan2(push.py, push.px) : Math.atan2(-c.y, -c.x);
  const backClear = !blockHitPoint(c.x-Math.cos(c.angle)*76, c.y-Math.sin(c.angle)*76, 16);
  const frontClear = !blockHitPoint(c.x+Math.cos(c.angle)*76, c.y+Math.sin(c.angle)*76, 16);
  // reverse only if there is room behind, otherwise claw forward
  c.revDir = (backClear && !frontClear) ? -1 : (frontClear ? 1 : (backClear ? -1 : 1));
  c.reverseT = secs;
}

// unit vector pointing away from nearby walls and blocks
function openDirection(c){
  let px=0, py=0;
  if(mode!=='race'){
    if(arenaShape==='oval'){
      const A=ARENA_W/2, B=ARENA_H/2;
      const k=Math.hypot(c.x/A, c.y/B);
      if(k>0.76){
        const f=(k-0.76)/0.24, L=Math.hypot(c.x,c.y)||1;
        px -= c.x/L*f*1.6; py -= c.y/L*f*1.6;
      }
    } else {
      const m=150;
      const dL=c.x+ARENA_W/2, dR=ARENA_W/2-c.x, dT=c.y+ARENA_H/2, dB=ARENA_H/2-c.y;
      if(dL<m) px += (m-dL)/m;
      if(dR<m) px -= (m-dR)/m;
      if(dT<m) py += (m-dT)/m;
      if(dB<m) py -= (m-dB)/m;
    }
    for(const b of blocks){
      const dx=c.x-b.x, dy=c.y-b.y;
      let d;
      if(b.type==='barrel' || b.type==='mound'){
        d=Math.max(0, Math.hypot(dx,dy)-b.w/2);
      } else {
        const ex=Math.max(0,Math.abs(dx)-b.w/2), ey=Math.max(0,Math.abs(dy)-b.h/2);
        d=Math.hypot(ex,ey);
      }
      if(d<100){ const f=(100-d)/100, L=Math.hypot(dx,dy)||1; px+=dx/L*f*1.1; py+=dy/L*f*1.1; }
    }
    for(const h of hazards){
      const dx=c.x-h.x, dy=c.y-h.y, L=Math.hypot(dx,dy)||1;
      const reach=h.r+110;
      if(L<reach){ const f=(reach-L)/reach*2.6; px+=dx/L*f; py+=dy/L*f; }
    }
  }
  return { px, py, mag:Math.hypot(px,py) };
}

// five feelers ahead of the car; reach grows with speed so it commits earlier
function whiskers(c){
  const spd = Math.abs(c.speed||0);
  const reach = 48 + spd*0.36;
  const probes = [[0,reach,1.0],[0.40,reach*0.82,0.65],[-0.40,reach*0.82,0.65],[0.85,reach*0.55,0.35],[-0.85,reach*0.55,0.35]];
  let left=0, right=0, front=0;
  for(const p of probes){
    const a=c.angle+p[0];
    const hx=c.x+Math.cos(a)*p[1], hy=c.y+Math.sin(a)*p[1];
    if(blockHitPoint(hx, hy, 15) || hazardAt(hx, hy, 12)){
      if(p[0]>0.05) right+=p[2];
      else if(p[0]<-0.05) left+=p[2];
      else front+=p[2];
    }
  }
  return { left, right, front, total:left+right+front };
}

function aiCombat(c, dt){
  let target=null, bd=1e9;
  for(const o of cars){
    if(o===c||o.dead) continue;
    let d=Math.hypot(o.x-c.x,o.y-c.y);
    if(o.isPlayer) d*=0.72;              // mild aggro bias toward the player
    if(d<bd){ bd=d; target=o; }
  }
  if(!target){ c.aiThrottle=0; c.aiSteer=0; c.aiBrake=false; return; }

  const dist=Math.hypot(target.x-c.x, target.y-c.y);
  const lead=clamp(dist/430,0,1);
  const straight=Math.atan2(target.y+target.vy*0.35*lead - c.y, target.x+target.vx*0.35*lead - c.x);
  let want=straight, throttle=1;

  // inside knife range, alternate a ramming run with an arc back out.
  // keeps them moving, which is both better looking and far harder to wedge.
  if(dist<135){
    c.closeT=(c.closeT||0)+dt;
    if(c.closeT>3.4){ c.closeT=0; c.orbitDir=-(c.orbitDir||1); }
    if(c.closeT>1.9) want = straight + (c.orbitDir||1)*1.35;
  } else {
    c.closeT=0;
  }

  // steer out of corners before they become a problem
  const push=openDirection(c);
  if(push.mag>0.12){
    const wx=Math.cos(want)+push.px*1.7, wy=Math.sin(want)+push.py*1.7;
    want=Math.atan2(wy,wx);
  }

  let diff=angDiff(c.angle, want) + Math.sin(c.wander*1.7)*0.10;
  let steer=clamp(diff*2.2,-1,1);
  if(Math.abs(diff)>1.9 && Math.abs(c.speed||0)<70) throttle=-0.8;   // three-point turn
  c.aiBrake = Math.abs(diff)>1.3 && Math.abs(c.speed||0)>150;

  // obstacle avoidance overrides the pursuit heading
  const w=whiskers(c);
  if(w.total>0){
    if(w.left>w.right+0.01) c.avoidDir=1;
    else if(w.right>w.left+0.01) c.avoidDir=-1;
    steer = c.avoidDir*clamp(0.55+w.total*0.55, 0, 1);
    if(w.front>0) throttle=Math.min(throttle,0.55);
    if(w.front>0.9 && Math.abs(c.speed||0)<55){ beginRecovery(c, 0.7); }
    c.blockedT=(c.blockedT||0)+dt;
    if(c.blockedT>1.2){ c.blockedT=0; beginRecovery(c, 0.85); }
  } else c.blockedT=0;

  c.aiSteer=steer; c.aiThrottle=throttle;

  const aimDiff=angDiff(c.angle, straight);
  const aligned=Math.abs(aimDiff)<0.22 && w.front===0;
  if(aligned && dist<330 && !blockHitPoint(c.x+Math.cos(c.angle)*Math.min(dist,120), c.y+Math.sin(c.angle)*Math.min(dist,120), 6)){
    if(Math.random()<0.55) fireCannon(c);
  }
  if(aligned && dist<420 && c.missiles>0 && c.mcool<=0 && Math.random()<0.02) fireMissile(c);
  if(dist<90 && c.minesLeft>0 && Math.random()<0.01) dropMine(c);
}

function aiRace(c, dt){
  const pr = c.proj || trackProject(c.x,c.y);
  const spd = Math.abs(c.speed||0);
  const look = 0.014 + (spd/232)*0.030;
  const aim = trackPoint(pr.prog+look, c.lineOff);
  let want = Math.atan2(aim.y-c.y, aim.x-c.x);

  // nudge around whoever is right in front
  for(const o of cars){
    if(o===c||o.dead) continue;
    const d=Math.hypot(o.x-c.x,o.y-c.y);
    if(d<62 && Math.abs(angDiff(c.angle, Math.atan2(o.y-c.y,o.x-c.x)))<0.65){
      const oo = o.proj ? o.proj.off : 0;
      want += (oo>pr.off ? -0.55 : 0.55);
    }
  }

  let diff=angDiff(c.angle, want);
  let steer=clamp(diff*2.4,-1,1);
  // scraping a wall, pull back toward the racing line
  if(Math.abs(pr.off) > TRK.HW*0.7) steer=clamp(steer + (pr.off>0?-0.55:0.55), -1, 1);
  c.aiSteer=steer;

  const bend = trackPoint(pr.prog+look*2.0, 0);
  const corner = clamp((bend.curve||0)*3.4, 0, 1);
  c.aiThrottle = c.finished ? 0.3 : clamp(1 - corner*0.34 - Math.abs(diff)*0.5, 0.3, 1);
  c.aiBrake = Math.abs(diff)>0.9 && spd>170;

  // combat while racing: shoot forward, mine whoever is on your bumper
  let front=null, back=null, fd=1e9, bkd=1e9;
  for(const o of cars){
    if(o===c||o.dead) continue;
    const d=Math.hypot(o.x-c.x,o.y-c.y);
    const rel=Math.abs(angDiff(c.angle, Math.atan2(o.y-c.y,o.x-c.x)));
    if(rel<0.42 && d<fd){ fd=d; front=o; }
    if(rel>2.4 && d<bkd){ bkd=d; back=o; }
  }
  if(front && fd<330){
    if(Math.random()<0.35) fireCannon(c);
    if(c.missiles>0 && c.mcool<=0 && fd<300 && Math.random()<0.03) fireMissile(c);
  }
  if(back && bkd<115 && c.minesLeft>0 && Math.random()<0.02) dropMine(c);
}

// ---------------------------------------------------------------- projectiles
function updateShots(dt){
  for(let i=shots.length-1;i>=0;i--){
    const s=shots[i];
    s.life-=dt;
    if(s.kind==='missile'){
      // soft homing on nearest enemy in a forward cone
      let best=null,bd=1e9;
      for(const c of cars){
        if(c.dead||c.id===s.owner) continue;
        const d=Math.hypot(c.x-s.x,c.y-s.y);
        const a=Math.atan2(c.y-s.y,c.x-s.x);
        if(d<bd && Math.abs(angDiff(s.angle,a))<0.9){ bd=d; best=c; }
      }
      if(best){
        const want=Math.atan2(best.y-s.y,best.x-s.x);
        s.angle += clamp(angDiff(s.angle,want), -2.2*dt, 2.2*dt);
      }
      const sp=Math.min(400, Math.hypot(s.vx,s.vy)+260*dt);
      s.vx=Math.cos(s.angle)*sp; s.vy=Math.sin(s.angle)*sp;
      s.smoke-=dt;
      if(s.smoke<=0){ s.smoke=0.02;
        particles(s.x,s.y,s.z,1,{col:['#6b5c72','#4a3f50'],spd0:2,spd1:14,size:2,life0:0.3,life1:0.6,grav:-8,up0:0,up1:6}); }
    }
    s.x+=s.vx*dt; s.y+=s.vy*dt;
    let gone = s.life<=0;
    if(!gone && blockHitPoint(s.x,s.y,3)){
      if(s.kind==='missile') explode(s.x,s.y,1,s.owner,s.dmg,62);
      else particles(s.x,s.y,s.z,3,{col:['#ffe9a8','#9a8aa0'],spd0:20,spd1:70,size:1,life0:0.08,life1:0.2});
      gone=true;
    }
    if(!gone) for(const c of cars){
      if(c.dead||c.id===s.owner||c.invuln>0) continue;
      if(Math.hypot(c.x-s.x,c.y-s.y)<15){
        if(s.kind==='missile') explode(s.x,s.y,1,s.owner,s.dmg,62);
        else {
          damage(c,s.dmg,s.owner);
          // a bullet shoves along its own flight, so fire taken head-on used to
          // scrub the player's speed off a round at a time. It still knocks you
          // about sideways; it just cannot slow you down any more.
          let kx=s.vx*0.03, ky=s.vy*0.03;
          if(c.isPlayer) [kx,ky]=playerImpulse(c,kx,ky);
          c.vx+=kx; c.vy+=ky;
          particles(s.x,s.y,7,3,{col:['#ffe9a8','#ff8a4a'],spd0:20,spd1:80,size:1,life0:0.08,life1:0.22});
        }
        gone=true; break;
      }
    }
    // ...and the sentries, with their own radius: a sentry is about 12 wide
    // where a car is 38 long, so the cars' 15 would hit from a body's width away.
    if(!gone && foes.length) for(const f of foes){
      if(f.dead) continue;
      if(Math.hypot(f.x-s.x,f.y-s.y)<FOE.SHOT_R){
        // a missile does its damage through the blast (see explode), a round directly
        if(s.kind==='missile') explode(s.x,s.y,1,s.owner,s.dmg,62);
        else {
          foeDamage(f,s.dmg,s.owner);
          particles(s.x,s.y,10,3,{col:['#ffe9a8','#ff8a4a'],spd0:20,spd1:80,size:1,life0:0.08,life1:0.22});
        }
        gone=true; break;
      }
    }
    if(!gone && onFoot && s.owner !== 0 && Math.hypot(walker.x-s.x, walker.y-s.y) < 9){
      hurtWalker(WALK_SHOT_DMG); gone = true;
    }
    if(gone) shots.splice(i,1);
  }

  for(let i=mines.length-1;i>=0;i--){
    const m=mines[i];
    m.arm-=dt; m.life-=dt; m.blink+=dt;
    let boom = m.life<=0;
    if(m.arm<=0) for(const c of cars){
      if(c.dead) continue;
      if(c.id===m.owner && m.life>14) continue;
      if(Math.hypot(c.x-m.x,c.y-m.y)<22){ boom=true; break; }
    }
    if(boom){ explode(m.x,m.y,1.1,m.owner,40,72); mines.splice(i,1); }
  }
}

// ---------------------------------------------------------------- hazards
function updateHazards(dt){
  for(const h of hazards){
    if(h.type!=='pit') continue;
    for(const c of cars){
      if(c.dead||c.pitT>0||untouchable(c)) continue;
      if(Math.hypot(c.x-h.x,c.y-h.y) < h.r*0.7){
        c.pitT=0.75; c.pitX=h.x; c.pitY=h.y; c.pitR=h.r;
      }
    }
    for(let i=shots.length-1;i>=0;i--){
      const sh=shots[i];
      if(Math.hypot(sh.x-h.x,sh.y-h.y) < h.r*0.55 && sh.z<5) shots.splice(i,1);
    }
  }
}

// ---------------------------------------------------------------- pickups
const ITEMS = {
  health:  { col:'#4ade80', label:'+' },
  missile: { col:'#f97362', label:'M' },
  mine:    { col:'#e0b73c', label:'*' }
};
// pads drift down the road; when one falls behind, it re-seeds ahead with a fresh
// item, so ammo drops keep coming toward you.
function recycleAhead(p){
  const lat = rnd(-ROAD_HW+30, ROAD_HW-30);
  const at = roadPoint(camS + halfExtent(roadFrame(camS)) + rnd(80,360), lat);
  p.x = at.x; p.y = at.y;
  p.item = pick(['health','missile','missile','mine']);
  p.bob = 0;
}
function padBehind(p){ return roadProject(p.x, p.y).s - camS < -(halfExtent(roadFrame(camS)) + 120); }
function updatePads(dt){
  const me=cars[0];
  if(race){
    // LOOP pads are fixed around the track, refill on a timer, any racer can grab them
    for(const p of pads){
      if(!p.item){ p.timer-=dt; if(p.timer<=0){ p.item=pick(['health','missile','mine','missile']); p.bob=0; } continue; }
      p.bob=(p.bob||0)+dt;
      for(const c of cars){
        if(c.dead || Math.hypot(c.x-p.x,c.y-p.y)>=22) continue;
        if(p.item==='health') c.hp=Math.min(c.maxHp,c.hp+35);
        if(p.item==='missile') c.missiles=Math.min(5,c.missiles+2);
        if(p.item==='mine') c.minesLeft=Math.min(3,c.minesLeft+1);
        p.item=null; p.timer=rnd(7,11);
        if(c.isPlayer) Snd.pickup();
        particles(p.x,p.y,8,8,{col:['#fff','#9be7c4'],spd0:20,spd1:70,size:1,life0:0.2,life1:0.4});
        break;
      }
    }
    return;
  }
  for(const p of pads){
    if(padBehind(p)){ recycleAhead(p); continue; }
    if(!p.item){ p.timer-=dt; if(p.timer<=0) recycleAhead(p); continue; }
    p.bob=(p.bob||0)+dt;
    if(!me.dead && Math.hypot(me.x-p.x, me.y-p.y)<24){
      if(p.item==='health') me.hp=Math.min(me.maxHp, me.hp + healPickup(me));
      if(p.item==='missile') me.missiles=Math.min(5,me.missiles+2);
      if(p.item==='mine') me.minesLeft=Math.min(3,me.minesLeft+1);
      p.item=null; p.timer=rnd(0.5,1.5);
      Snd.pickup();
      particles(p.x,p.y,8,8,{col:['#fff','#9be7c4'],spd0:20,spd1:70,size:1,life0:0.2,life1:0.4});
    }
  }
}

// ---------------------------------------------------------------- fx update
function updateFx(dt){
  for(let i=fx.length-1;i>=0;i--){
    const p=fx[i]; p.t+=dt;
    if(p.t>=p.life){ fx.splice(i,1); continue; }
    if(p.ring) continue;
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt; p.vz-=p.grav*dt;
    const fl=p.floor||0;
    if(p.z<fl){ p.z=fl; p.vz*=-0.35; p.vx*=0.7; p.vy*=0.7; }
  }
  for(let i=skids.length-1;i>=0;i--){ skids[i].t+=dt; if(skids[i].t>4) skids.splice(i,1); }
  cam.shake=Math.max(0, cam.shake - dt*14);
}

// ---------------------------------------------------------------- drawing
function drawBowlGround(){
  const ox=camOx(), oy=camOy();
  ctx.fillStyle='#120e14'; ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.translate(ox,oy);
  ctx.fillStyle=dirtTile; ctx.fillRect(-ox,-oy,W,H);
  // the groove the field has been worn into
  ctx.globalAlpha=0.16;
  ctx.strokeStyle='#6b4c38'; ctx.lineWidth=120*S;
  ctx.beginPath();
  ctx.ellipse(0,0,(ARENA_W/2-190)*S,(ARENA_H/2-170)*KY*S,0,0,Math.PI*2);
  ctx.stroke();
  ctx.globalAlpha=0.18;
  ctx.strokeStyle='#5a4136'; ctx.lineWidth=5*S;
  ctx.beginPath();
  ctx.ellipse(0,0,(ARENA_W/2-150)*S,(ARENA_H/2-136)*KY*S,0,0,Math.PI*2);
  ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(0,0,(ARENA_W/2-238)*S,(ARENA_H/2-208)*KY*S,0,0,Math.PI*2);
  ctx.stroke();
  ctx.globalAlpha=1;
  ctx.restore();
  drawHazards();
  drawSkids();
}

// A pit is a real hole cut through the floor plane. A second plane sits
// PIT_DEPTH below it; because the projection maps height to -z*KZ on screen,
// that lower plane simply draws PIT_DEPTH*KZ further down. Clipping to the
// opening means the far shaft wall and the lower floor are what you see
// through it, which is what the camera would actually show.
const PIT_DEPTH = 58;

function drawPit(h){
  const p = toScreen(h.x, h.y, 0);
  const rx = h.r*S, ry = h.r*KY*S;
  const drop = PIT_DEPTH*KZ*S;

  ctx.save();
  ctx.beginPath(); ctx.ellipse(p.x, p.y, rx, ry, 0, 0, Math.PI*2); ctx.clip();

  // shaft wall, lit just under the cut edge and falling into shadow
  const g = ctx.createLinearGradient(0, p.y-ry, 0, p.y+drop);
  g.addColorStop(0,    '#583c2a');
  g.addColorStop(0.18, '#33231f');
  g.addColorStop(0.60, '#150f18');
  g.addColorStop(1,    '#0b0810');
  ctx.fillStyle = g;
  ctx.fillRect(p.x-rx-2, p.y-ry-2, rx*2+4, ry*2+drop+4);

  // the lower plane
  ctx.fillStyle = '#39384a';
  ctx.beginPath(); ctx.ellipse(p.x, p.y+drop, rx, ry, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(102,104,132,.28)';
  ctx.beginPath(); ctx.ellipse(p.x, p.y+drop-ry*0.16, rx*0.74, ry*0.62, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(12,9,18,.34)';
  ctx.beginPath(); ctx.ellipse(p.x, p.y+drop+ry*0.30, rx*0.96, ry*0.55, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  // cut edge of the upper plane
  ctx.save();
  ctx.lineWidth = 2*S;
  ctx.strokeStyle = 'rgba(168,124,86,.6)';
  ctx.beginPath(); ctx.ellipse(p.x, p.y, rx, ry, 0, Math.PI, Math.PI*2); ctx.stroke();
  ctx.strokeStyle = 'rgba(16,11,16,.55)';
  ctx.beginPath(); ctx.ellipse(p.x, p.y, rx, ry, 0, 0, Math.PI); ctx.stroke();
  ctx.restore();
}

function drawHazards(){
  for(const h of hazards){
    if(!inView(h.x, h.y, h.r+PIT_DEPTH+40)) continue;
    if(h.type==='pit') drawPit(h);
  }
}

function drawGround(){
  if(level===2){ drawBowlGround(); return; }
  ctx.save();
  ctx.fillStyle='#171320'; ctx.fillRect(0,0,W,H);
  const ox = camOx(), oy = camOy();
  ctx.translate(ox, oy);
  ctx.fillStyle = groundTile;
  const x0 = -ox, y0 = -oy;
  ctx.fillRect(x0, y0, W, H);
  ctx.restore();

  // arena floor boundary glow
  const tl=toScreen(-ARENA_W/2,-ARENA_H/2,0), br=toScreen(ARENA_W/2,ARENA_H/2,0);
  ctx.save();
  ctx.beginPath(); ctx.rect(tl.x,tl.y,br.x-tl.x,br.y-tl.y);
  ctx.strokeStyle='#3f3448'; ctx.lineWidth=2; ctx.stroke();
  ctx.restore();

  // hazard stripes at the centre
  const c0=toScreen(-140,-16,0);
  ctx.save(); ctx.globalAlpha=0.25;
  for(let i=0;i<14;i++){
    ctx.fillStyle = i%2 ? '#e0b73c' : '#241a26';
    ctx.fillRect(c0.x+i*20*S, c0.y, 20*S, 20*KY*S);
  }
  ctx.restore();

  drawSkids();
}

function drawSkids(){
  ctx.save();
  for(const s of skids){
    const p=toScreen(s.x,s.y,0);
    ctx.globalAlpha=0.35*(1-s.t/4);
    ctx.fillStyle='#120f18';
    ctx.translate(p.x,p.y); ctx.scale(S,S*KY); ctx.rotate(s.a);
    ctx.fillRect(-7,-7,10,2); ctx.fillRect(-7,5,10,2);
    ctx.setTransform(1,0,0,1,0,0);
  }
  ctx.restore();
  ctx.globalAlpha=1;
}

// the straight road: dirt wasteland, an asphalt band, and lane lines that stream
// past as you drive. CONVOY runs it horizontally (band along x), ASCENT vertically
// (band along y). The dash phase is tied to the camera so the markings never freeze.
// while the zoom eases the tiles are scaled rather than rebuilt (a rebuild
// re-rolls their noise, which would shimmer)
let patK = 1;
function scalePatterns(){
  const k = S/patS;
  if(k === patK || typeof DOMMatrix === 'undefined' || !groundTile.setTransform) return;
  const m = new DOMMatrix([k, 0, 0, k, 0, 0]);
  groundTile.setTransform(m); dirtTile.setTransform(m); patK = k;
}
function drawTrack(){
  scalePatterns();
  const ox=camOx(), oy=camOy();
  ctx.fillStyle='#141020'; ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.translate(ox,oy);
  ctx.fillStyle=dirtTile; ctx.fillRect(-ox,-oy,W,H);

  if(race){
    // the closed loop: fill the road ring, dashed rumble strips, start/finish line
    ctx.fillStyle=groundTile; ctx.fill(track.road,'evenodd');
    ctx.lineWidth=6*S; ctx.setLineDash([13*S,13*S]);
    ctx.strokeStyle='#ddd3c6'; ctx.lineDashOffset=0;
    ctx.stroke(track.roPath); ctx.stroke(track.riPath);
    ctx.strokeStyle='#a33a2a'; ctx.lineDashOffset=13*S;
    ctx.stroke(track.roPath); ctx.stroke(track.riPath);
    ctx.setLineDash([]); ctx.lineDashOffset=0;
    ctx.restore();
    drawStartLine();
    drawSkids();
    return;
  }

  if(stage === 'run'){ drawOutskirtsGround(); drawRoadPath(); drawCityGround(); }
  else if(!street) drawRoadPath();
  else {
    drawCityGround();
    const fwd = VHH/KY, y0 = cam.y - fwd - 120, y1 = cam.y + fwd + 120;
    ctx.fillStyle=groundTile;
    ctx.fillRect(-ROAD_HW*S, y0*KY*S, 2*ROAD_HW*S, (y1-y0)*KY*S);
    const scroll = cam.y*KY*S;                              // screen-px phase for vertical lines
    ctx.setLineDash([13*S,13*S]);
    for(const sx of [-(ROAD_HW-9), (ROAD_HW-9)]){
      ctx.lineWidth=5*S;
      ctx.strokeStyle='#ddd3c6'; ctx.lineDashOffset = scroll % (26*S);
      ctx.beginPath(); ctx.moveTo(sx*S, y0*KY*S); ctx.lineTo(sx*S, y1*KY*S); ctx.stroke();
      ctx.strokeStyle='#a33a2a'; ctx.lineDashOffset = (scroll + 13*S) % (26*S);
      ctx.beginPath(); ctx.moveTo(sx*S, y0*KY*S); ctx.lineTo(sx*S, y1*KY*S); ctx.stroke();
    }
    ctx.setLineDash([26*S,22*S]); ctx.lineWidth=3*S; ctx.strokeStyle='rgba(221,211,198,.5)';
    ctx.lineDashOffset = scroll % (48*S);
    for(const lx of [-ROAD_HW*0.5, 0, ROAD_HW*0.5]){
      ctx.beginPath(); ctx.moveTo(lx*S, y0*KY*S); ctx.lineTo(lx*S, y1*KY*S); ctx.stroke();
    }
  }
  ctx.setLineDash([]); ctx.lineDashOffset=0;
  ctx.restore();
  drawSkids();
}

// the LOOP's start/finish line: a checkered band across the road near progress 0
function drawStartLine(){
  const n=track.pts[0], rows=3, steps=12, band=0.006;
  ctx.save(); ctx.translate(camOx(), camOy());
  for(let r=0;r<rows;r++){
    const a=trackPoint(r*band,0), b=trackPoint((r+1)*band,0);
    for(let i=0;i<steps;i++){
      const l0=-TRK.HW+(i/steps)*TRK.HW*2, l1=-TRK.HW+((i+1)/steps)*TRK.HW*2;
      ctx.fillStyle = ((i+r)%2) ? '#ddd3c6' : '#241a26';
      ctx.beginPath();
      ctx.moveTo((a.x+n.nx*l0)*S, (a.y+n.ny*l0)*KY*S);
      ctx.lineTo((a.x+n.nx*l1)*S, (a.y+n.ny*l1)*KY*S);
      ctx.lineTo((b.x+n.nx*l1)*S, (b.y+n.ny*l1)*KY*S);
      ctx.lineTo((b.x+n.nx*l0)*S, (b.y+n.ny*l0)*KY*S);
      ctx.closePath(); ctx.fill();
    }
  }
  ctx.restore();
}

// ---- the survival road, drawn along its path (any mix of straights and bends)
// the stretch of road worth drawing around the camera, as an s range
function roadSpan(){
  let D = Math.max(VHW, VHH/KY) + Math.abs(lookAhead) + 160;
  if(ROAD.kind === 'run' && Math.abs(camS - (ROAD.bendS0 + ROAD.bendS1)/2) < 2200) D *= 2;
  return [camS - D, camS + D];
}
// world points of the lane at `lat` between s = a and b: straights are just their
// ends, bends are sampled. ny = the road normal's y at each point (wall facing).
function roadLane(lat, a, b){
  const xs = [], ys = [], ny = [], P = ROAD.pieces;
  const add = q => { const f = roadFrame(q); xs.push(f.x + f.nx*lat); ys.push(f.y + f.ny*lat); ny.push(f.ny); };
  add(a);
  for(let i=0;i<P.length;i++){
    const p = P[i], e = i===P.length-1 ? Infinity : p.s0 + p.len;
    const p0 = Math.max(a, i===0 ? -Infinity : p.s0), p1 = Math.min(b, e);
    if(p1 <= p0) continue;
    if(!p.line){
      const n = Math.max(2, Math.ceil((p1-p0)*(1 + Math.abs(lat)/p.r)/12));
      for(let j=1;j<n;j++) add(p0 + (p1-p0)*j/n);
    }
    if(p1 < b) add(p1);
  }
  add(b);
  return { xs, ys, ny };
}
function lanePath(ln){
  const path = new Path2D();
  path.moveTo(ln.xs[0]*S, ln.ys[0]*KY*S);
  for(let i=1;i<ln.xs.length;i++) path.lineTo(ln.xs[i]*S, ln.ys[i]*KY*S);
  return path;
}
// on-screen length (unscaled by S) of the lane at `lat` from s = 0 to s. Dash
// offsets use it so lane markings stay painted on the road, bends included.
function laneScreenLen(lat, s){
  const P = ROAD.pieces;
  if(s < P[0].s0) return (s - P[0].s0)*Math.hypot(P[0].tx, KY*P[0].ty);
  let L = 0;
  for(let i=0;i<P.length;i++){
    const p = P[i], e = i===P.length-1 ? Infinity : p.s0 + p.len, q = Math.min(s, e);
    if(p.line) L += (q - p.s0)*Math.hypot(p.tx, KY*p.ty);
    else {
      const sc = 1 + (-p.dir/p.r)*lat, n = 64, du = (q - p.s0)/n;
      for(let j=0;j<n;j++){
        const th = p.th0 + p.dir*(j + 0.5)*du/p.r;
        L += du*sc*Math.hypot(Math.sin(th), KY*Math.cos(th));
      }
    }
    if(s <= e) break;
  }
  return L;
}
function drawRoadPath(){
  const [a, b] = roadSpan();
  const R = roadLane(ROAD_HW, a, b), L = roadLane(-ROAD_HW, a, b);
  const band = new Path2D();
  band.moveTo(R.xs[0]*S, R.ys[0]*KY*S);
  for(let i=1;i<R.xs.length;i++) band.lineTo(R.xs[i]*S, R.ys[i]*KY*S);
  for(let i=L.xs.length-1;i>=0;i--) band.lineTo(L.xs[i]*S, L.ys[i]*KY*S);
  band.closePath();
  ctx.fillStyle = groundTile; ctx.fill(band);
  // rumble strips, then the lane dashes; offsets keep them fixed to the road
  ctx.setLineDash([13*S,13*S]); ctx.lineWidth = 5*S;
  for(const lat of [-(ROAD_HW-9), (ROAD_HW-9)]){
    const path = lanePath(roadLane(lat, a, b)), off = laneScreenLen(lat, a)*S;
    ctx.strokeStyle='#ddd3c6'; ctx.lineDashOffset = off % (26*S);         ctx.stroke(path);
    ctx.strokeStyle='#a33a2a'; ctx.lineDashOffset = (off + 13*S) % (26*S); ctx.stroke(path);
  }
  ctx.setLineDash([26*S,22*S]); ctx.lineWidth=3*S; ctx.strokeStyle='rgba(221,211,198,.5)';
  for(const lat of [-ROAD_HW*0.5, 0, ROAD_HW*0.5]){
    ctx.lineDashOffset = (laneScreenLen(lat, a)*S) % (48*S);
    ctx.stroke(lanePath(roadLane(lat, a, b)));
  }
}
// the two barriers. A stretch whose outward side faces down the screen stands in
// front of the cars (CONVOY's near wall); the rest stand behind them. Through the
// bend the outer wall hands over from one to the other on its own.
function drawRoadWalls(front){
  const [a, b0] = roadSpan();
  const b = ROAD.kind === 'run' ? Math.min(b0, ROAD.gateS) : b0;
  if(b <= a) return;
  for(const side of [-1, 1]){
    const lat = side*ROAD_HW, ln = roadLane(lat, a, b);
    const path = new Path2D(); let any = false;
    for(let i=0;i<ln.xs.length-1;i++){
      if((side*(ln.ny[i] + ln.ny[i+1])/2 > 0.5) !== front) continue;
      path.moveTo(ln.xs[i]*S, ln.ys[i]*KY*S); path.lineTo(ln.xs[i+1]*S, ln.ys[i+1]*KY*S); any = true;
    }
    if(any) strokeWall(path, TRK.WALL, '#6a5570');
    // posts every POST_STEP of this lane's own length, so the bend doesn't bunch them
    const P = ROAD.pieces;
    for(let i=0;i<P.length;i++){
      const p = P[i], e = i===P.length-1 ? Infinity : p.s0 + p.len;
      const p0 = Math.max(a, i===0 ? -Infinity : p.s0), p1 = Math.min(b, e);
      if(p1 <= p0) continue;
      const step = POST_STEP/(p.line ? 1 : 1 + (-p.dir/p.r)*lat);
      for(let q = p.s0 + Math.ceil((p0 - p.s0)/step)*step; q < p1; q += step){
        const f = roadFrame(q);
        if((side*f.ny > 0.5) !== front) continue;
        drawPost(f.x + f.nx*lat, f.y + f.ny*lat);
      }
    }
  }
}

// the run's city walls: the barrier in pieces (open where streets come in), the
// city wall each side, the south edge and, once you're in, the gate behind you.
// Horizontal stretches south of the car stand in front of it (front = true).
function drawCityWalls(front){
  const L = cityLimitY, me = cars[0];
  const ya = cam.y - VIEW_HH - 160, yb = Math.min(cam.y + VIEW_HH + 160, L);
  if(!front && yb > ya) for(const side of [-1, 1]){
    const lat = side*ROAD_HW, p = new Path2D();
    const spans = barrierSpans(side, ya, yb);
    for(const sp of spans){ p.moveTo(lat*S, sp[0]*KY*S); p.lineTo(lat*S, sp[1]*KY*S); }
    strokeWall(p, TRK.WALL, '#6a5570');
    for(const sp of spans)
      for(let py = Math.ceil(sp[0]/POST_STEP)*POST_STEP; py <= sp[1]; py += POST_STEP) drawPost(lat, py);
    const w = new Path2D(); w.moveTo(side*CITY_W*S, ya*KY*S); w.lineTo(side*CITY_W*S, yb*KY*S);
    strokeWall(w, 22, '#2e2536');
  }
  const seeY = y => Math.abs(y - cam.y) < VIEW_HH + 300;
  if(seeY(L) && ((me.y < L) === front)){
    const p = new Path2D();
    for(const side of [-1, 1]){ p.moveTo(side*ROAD_HW*S, L*KY*S); p.lineTo(side*CITY_W*S, L*KY*S); }
    strokeWall(p, 22, '#2e2536');
  }
  if(street && front && seeY(L + CITY_BACK)){
    const p = new Path2D();
    p.moveTo(-ROAD_HW*S, (L + CITY_BACK)*KY*S); p.lineTo(ROAD_HW*S, (L + CITY_BACK)*KY*S);
    strokeWall(p, 22, '#2e2536');
  }
}

// a straight barrier at lateral coordinate `lat`, spanning the visible road, as a
// strokeable path. CONVOY: a horizontal line at y=lat. ASCENT: a vertical line at x=lat.
function convoyWallPath(lat){
  const p=new Path2D();
  if(street){
    const y0 = cam.y - VIEW_HH - 120, y1 = cam.y + VIEW_HH + 120;
    if(Math.abs(lat) >= CITY_W){ p.moveTo(lat*S, y0*KY*S); p.lineTo(lat*S, y1*KY*S); return p; }
    for(const sp of barrierSpans(lat < 0 ? -1 : 1, y0, y1)){
      p.moveTo(lat*S, sp[0]*KY*S); p.lineTo(lat*S, sp[1]*KY*S);
    }
  } else if(vertical){
    const fwd = VHH/KY, y0 = cam.y - fwd - 120, y1 = cam.y + fwd + 120;
    p.moveTo(lat*S, y0*KY*S); p.lineTo(lat*S, y1*KY*S);
  } else {
    const x0 = cam.x - VHW - 120, x1 = cam.x + VHW + 120;
    p.moveTo(x0*S, lat*KY*S); p.lineTo(x1*S, lat*KY*S);
  }
  return p;
}

// posts along a barrier at fixed WORLD intervals along the road, so they slide past
// as the camera advances - the wall's motion cue.
const POST_STEP = 44;
function drawPost(x, y){
  const w = 3*S;
  const b = toScreen(x, y, 0), t = toScreen(x, y, TRK.WALL+3);
  ctx.fillStyle = '#3c2f44';
  ctx.fillRect(Math.round(b.x - w/2), Math.round(t.y), Math.round(w), Math.round(b.y - t.y));
  ctx.fillStyle = '#a894b0';
  ctx.fillRect(Math.round(b.x - w/2), Math.round(t.y), Math.round(w), Math.max(1,Math.round(2*S)));
}
function drawWallPosts(lat){
  const post = drawPost;
  if(street){
    const y0 = cam.y - VIEW_HH - 120, y1 = cam.y + VIEW_HH + 120;
    for(const sp of barrierSpans(lat < 0 ? -1 : 1, y0, y1))
      for(let py = Math.ceil(sp[0]/POST_STEP)*POST_STEP; py<=sp[1]; py+=POST_STEP) post(lat, py);
  } else if(vertical){
    const fwd = VHH/KY, y0 = cam.y - fwd - 120, y1 = cam.y + fwd + 120;
    for(let py = Math.ceil(y0/POST_STEP)*POST_STEP; py<=y1; py+=POST_STEP) post(lat, py);
  } else {
    const x0 = cam.x - VHW - 120, x1 = cam.x + VHW + 120;
    for(let px = Math.ceil(x0/POST_STEP)*POST_STEP; px<=x1; px+=POST_STEP) post(px, lat);
  }
}

// walls are split into far/near halves each frame so cars draw between them
function buildWallPaths(arr){
  const far=new Path2D(), near=new Path2D(), N=arr.length;
  for(let i=0;i<N;i++){
    const a=arr[i], b=arr[(i+1)%N];
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    if(!inView(mx,my,140)) continue;
    const t = my<cam.y ? far : near;
    t.moveTo(a.x*S, a.y*KY*S); t.lineTo(b.x*S, b.y*KY*S);
  }
  return { far, near };
}

function strokeWall(path, h, col){
  ctx.save(); ctx.translate(camOx(), camOy());
  ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.lineWidth=8*S;
  const layers=Math.round(h*S);
  for(let i=0;i<layers;i++){
    ctx.strokeStyle = i<2*S ? shade(col,0.5) : shade(col,0.78);
    ctx.stroke(path);
    ctx.translate(0,-1);
  }
  ctx.lineWidth=7*S; ctx.strokeStyle=col; ctx.stroke(path);
  ctx.lineWidth=2*S; ctx.strokeStyle=shade(col,1.45); ctx.stroke(path);
  ctx.restore();
}

function extrude(sx, sy, h, angle, shapeFn, sideCol, topFn){
  const layers=Math.round(h*S);
  for(let i=0;i<layers;i++){
    ctx.save();
    ctx.translate(sx, sy-i); ctx.scale(S,S*KY); if(angle) ctx.rotate(angle);
    ctx.fillStyle = i<2*S ? shade(sideCol,0.6) : sideCol;
    shapeFn(ctx); ctx.fill();
    ctx.restore();
  }
  ctx.save();
  ctx.translate(sx, sy-layers); ctx.scale(S,S*KY); if(angle) ctx.rotate(angle);
  topFn(ctx);
  ctx.restore();
}

function drawShadow(x,y,w,h,angle,alpha,round){
  const p=toScreen(x,y,0);
  ctx.save();
  ctx.translate(p.x+3*S,p.y+2*S); ctx.scale(S,S*KY); if(angle) ctx.rotate(angle);
  ctx.fillStyle='rgba(8,5,12,'+(alpha||0.4)+')';
  if(round){ ctx.beginPath(); ctx.ellipse(0,0,w/2,h/2,0,0,Math.PI*2); ctx.fill(); }
  else { rrect(ctx,-w/2,-h/2,w,h,3); ctx.fill(); }
  ctx.restore();
}

// dirt mounds get a dome profile rather than a flat-topped cylinder
function drawMound(b){
  drawShadow(b.x,b.y,b.w+4,b.h+4,0,0.42,true);
  const p=toScreen(b.x,b.y,0);
  const base='#6b4c33';
  const H=Math.round(15*S);
  for(let i=0;i<=H;i++){
    const t=i/H, k=Math.sqrt(Math.max(0.04, 1-t*t*0.88));
    ctx.save();
    ctx.translate(p.x, p.y-i); ctx.scale(S,S*KY);
    ctx.fillStyle = shade(base, 0.58 + 0.62*t);
    ctx.beginPath(); ctx.ellipse(0,0,b.w/2*k,b.h/2*k,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  ctx.save();
  ctx.translate(p.x-b.w*0.10*S, p.y-H-b.h*0.10*KY*S); ctx.scale(S,S*KY);
  ctx.fillStyle='rgba(230,196,150,.16)';
  ctx.beginPath(); ctx.ellipse(0,0,b.w*0.17,b.h*0.17,0,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

const BLOCK_H = { barrel:13, core:22, mound:15, wreck:14, crate:16 };
const BLOCK_C = { barrel:'#b8532f', core:'#4a3f58', mound:'#7a5a3e', wreck:'#4e4a52', crate:'#6b5a48' };

function drawBlock(b){
  if(b.type==='mound'){ drawMound(b); return; }
  const h = BLOCK_H[b.type] || 16;
  const round = b.type==='barrel';
  drawShadow(b.x,b.y,b.w+3,b.h+3,0,0.45,round);
  const p=toScreen(b.x,b.y,0);
  const base = BLOCK_C[b.type] || '#6b5a48';
  const shape = c=>{
    if(round){ c.beginPath(); c.ellipse(0,0,b.w/2,b.h/2,0,0,Math.PI*2); c.closePath(); }
    else rrect(c,-b.w/2,-b.h/2,b.w,b.h,2);
  };
  extrude(p.x,p.y,h,0,shape,shade(base,0.55), c=>{
    c.fillStyle=base; shape(c); c.fill();
    if(b.type==='barrel'){
      c.fillStyle=shade(base,1.25);
      c.beginPath(); c.arc(0,0,b.w/2-4,0,Math.PI*2); c.fill();
    } else if(b.type==='mound'){
      c.fillStyle=shade(base,1.2);
      c.beginPath(); c.ellipse(-b.w*0.08,-b.h*0.1,b.w/2-7,b.h/2-7,0,0,Math.PI*2); c.fill();
      c.fillStyle=shade(base,1.35);
      c.beginPath(); c.ellipse(-b.w*0.14,-b.h*0.18,b.w/2-15,b.h/2-15,0,0,Math.PI*2); c.fill();
    } else if(b.type==='wreck'){
      c.fillStyle=shade(base,1.3); c.fillRect(-b.w/2+3,-b.h/2+3,b.w-6,3);
      c.fillStyle='rgba(0,0,0,.34)';
      c.fillRect(-b.w/2+5,-b.h/2+8,b.w-10,b.h*0.3);
      c.fillStyle=shade('#8a3a2a',1.0);
      c.fillRect(-b.w/2+4,b.h/2-9,b.w-8,4);
    } else {
      c.fillStyle=shade(base,1.25);
      c.fillRect(-b.w/2+3,-b.h/2+3,b.w-6,2);
      c.fillStyle='rgba(0,0,0,.22)';
      c.fillRect(-b.w/2+3,-b.h/2+7,b.w-6,b.h-10);
    }
  });
}

// Low-poly meshes in car space: +x nose, +y right flank, +z up.
// Rendered offline into sprite strips at startup (see bakeCarSprites).
const KZ = Math.sqrt(1 - KY*KY);        // height foreshortening, 0.785 at 38.3 deg
const LIGHT = (function(){ const v=[-0.42,-0.58,0.70], L=Math.hypot(v[0],v[1],v[2]); return [v[0]/L,v[1]/L,v[2]/L]; })();

function hexShade(hex,f){
  const n=parseInt(hex.slice(1),16);
  const r=clamp(((n>>16)&255)*f,0,255)|0, g=clamp(((n>>8)&255)*f,0,255)|0, b=clamp((n&255)*f,0,255)|0;
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

// extrude a ground-plane outline between two heights, optionally tapering the top
function prism(outline, z0, z1, role, inset){
  inset = inset||0;
  let o = outline.map(p=>p.slice());
  let area=0;
  for(let i=0;i<o.length;i++){ const a=o[i], b=o[(i+1)%o.length]; area += a[0]*b[1]-b[0]*a[1]; }
  if(area<0) o.reverse();                       // force counter-clockwise
  let cx=0, cy=0;
  for(const p of o){ cx+=p[0]; cy+=p[1]; }
  cx/=o.length; cy/=o.length;
  const top = o.map(([x,y])=>{
    const dx=x-cx, dy=y-cy, L=Math.hypot(dx,dy)||1, k=Math.max(0.05, L-inset)/L;
    return [cx+dx*k, cy+dy*k];
  });
  const faces=[];
  faces.push({ v: top.map(([x,y])=>[x,y,z1]), c:role });
  for(let i=0;i<o.length;i++){
    const j=(i+1)%o.length;
    faces.push({ v:[ [o[i][0],o[i][1],z0], [o[j][0],o[j][1],z0],
                     [top[j][0],top[j][1],z1], [top[i][0],top[i][1],z1] ], c:role });
  }
  return faces;
}

// wheel: cylinder lying on its side, axis along y
function wheelMesh(cx, cy, r, halfW, role, seg){
  seg = seg||9;
  const faces=[], ring=[];
  for(let i=0;i<seg;i++){
    const a=i/seg*Math.PI*2;
    ring.push([cx+Math.cos(a)*r, r+Math.sin(a)*r]);   // sits on the ground
  }
  for(let i=0;i<seg;i++){
    const p=ring[i], q=ring[(i+1)%seg];
    faces.push({ v:[[p[0],cy-halfW,p[1]],[q[0],cy-halfW,q[1]],[q[0],cy+halfW,q[1]],[p[0],cy+halfW,p[1]]], c:role, noCull:true });
  }
  faces.push({ v: ring.map(p=>[p[0],cy+halfW,p[1]]), c:role, noCull:true });
  faces.push({ v: ring.map(p=>[p[0],cy-halfW,p[1]]), c:role, noCull:true });
  return faces;
}

// ---- voxel cars (GARAGE). Each VOXCARS entry is integer-grid quads + origin/scale;
// voxMesh turns it into the same {v, c:role} faces as the hand-built models, so both
// bakes, the flash row, first person and ASCII draw it with no other change.
function voxMesh(d){
  const out=[], f=d.f, lo=d.lo, s=d.vox;
  for(let i=0;i<f.length;i+=13){
    const v=[]; for(let k=0;k<4;k++){ const o=i+1+k*3; v.push([lo[0]+f[o]*s, lo[1]+f[o+1]*s, lo[2]+f[o+2]*s]); }
    out.push({ v, c:d.roles[f[i]] });
  }
  return out;
}
// GARAGE_CARS (config.js) -> MODELS index: classic = 0 (the muscle car), voxel cars are
// appended. -1 = its data file didn't load, so the garage skips it.
const GARAGE_MESH = GARAGE_CARS.map(g => !g.vox ? 0
  : (typeof VOXCARS !== 'undefined' && VOXCARS[g.vox]) ? MODELS.push(voxMesh(VOXCARS[g.vox])) - 1 : -1);
let garageSel = 0;                  // the car you drive (index into GARAGE_CARS), remembered
try { const v = parseInt(localStorage.getItem('scrapheap.car'), 10); if(GARAGE_MESH[v] >= 0) garageSel = v; } catch(e){}
function playerMesh(){ return Math.max(0, GARAGE_MESH[garageSel]); }

// rasterise one rotation frame. A depth buffer rather than a painter's sort:
// average-depth sorting puts a car's large flat body top in front of small
// raised faces like the windshield, whatever order the model is authored in.
const SS = 2;                       // supersample, downscaled on composite
let ZBUF = null;

function shadeRGB(hex, f){
  const n=parseInt(hex.slice(1),16);
  return [ clamp(((n>>16)&255)*f,0,255)|0, clamp(((n>>8)&255)*f,0,255)|0, clamp((n&255)*f,0,255)|0 ];
}

function triangle(px, zb, w, h, a, b, c, r, g, bl){
  const den = (b[1]-c[1])*(a[0]-c[0]) + (c[0]-b[0])*(a[1]-c[1]);
  if(Math.abs(den) < 1e-9) return;
  const inv = 1/den;
  let x0=Math.max(0, Math.floor(Math.min(a[0],b[0],c[0]))),
      x1=Math.min(w-1, Math.ceil (Math.max(a[0],b[0],c[0]))),
      y0=Math.max(0, Math.floor(Math.min(a[1],b[1],c[1]))),
      y1=Math.min(h-1, Math.ceil (Math.max(a[1],b[1],c[1])));
  for(let y=y0;y<=y1;y++){
    const cy=y+0.5;
    for(let x=x0;x<=x1;x++){
      const cx=x+0.5;
      const l0 = ((b[1]-c[1])*(cx-c[0]) + (c[0]-b[0])*(cy-c[1])) * inv;
      if(l0<0) continue;
      const l1 = ((c[1]-a[1])*(cx-c[0]) + (a[0]-c[0])*(cy-c[1])) * inv;
      if(l1<0) continue;
      const l2 = 1-l0-l1;
      if(l2<0) continue;
      const d = l0*a[2] + l1*b[2] + l2*c[2];
      const i = y*w+x;
      if(d <= zb[i]) continue;
      zb[i]=d;
      const p=i*4;
      px[p]=r; px[p+1]=g; px[p+2]=bl; px[p+3]=255;
    }
  }
}

// ky/kz pick the viewing angle: the 2D half bakes at the axonometric KY, the
// gunner's first-person half re-bakes the same meshes at eye level.
function rasterCar(sctx, mesh, yaw, col, flash, fw, fh, ax, ay, ky, kz, vsc){
  ky = ky==null ? KY : ky;
  kz = kz==null ? KZ : kz;
  vsc = vsc==null ? S : vsc;
  const w=fw*SS, h=fh*SS;
  if(!ZBUF || ZBUF.length!==w*h) ZBUF = new Float32Array(w*h);
  ZBUF.fill(-1e9);
  const img = sctx.createImageData(w,h);
  const px = img.data;

  const cy=Math.cos(yaw), sy=Math.sin(yaw);
  const roles = flash ? null : {
    body: col,
    accent: hexShade(col,1.32),
    shadowed: hexShade(col,0.62),
    dark: '#241d2c',
    glass: '#241d38',
    tyre: '#14111a',
    metal: '#585265',
    lamp: '#ffe7a0',     // voxel cars: headlights
    tail: '#d8343c'      // ...and tail lights
  };
  const ox = ax*SS, oy = ay*SS, scl = vsc*SS;

  for(const f of mesh){
    const v=f.v.map(p=>[p[0]*cy - p[1]*sy, p[0]*sy + p[1]*cy, p[2]]);
    const ax1=v[1][0]-v[0][0], ay1=v[1][1]-v[0][1], az1=v[1][2]-v[0][2];
    const bx1=v[2][0]-v[0][0], by1=v[2][1]-v[0][1], bz1=v[2][2]-v[0][2];
    let nx=ay1*bz1-az1*by1, ny=az1*bx1-ax1*bz1, nz=ax1*by1-ay1*bx1;
    const nl=Math.hypot(nx,ny,nz)||1; nx/=nl; ny/=nl; nz/=nl;
    if(!f.noCull && (ny*kz + nz*ky) <= 0.001) continue;
    const lam = Math.max(0, nx*LIGHT[0] + ny*LIGHT[1] + nz*LIGHT[2]);
    const rgb = shadeRGB(flash ? '#ffffff' : roles[f.c], 0.44 + 0.72*lam);
    // project: x across, y foreshortened, z raised; depth grows toward the camera
    const s = v.map(p=>[ ox + p[0]*scl, oy + (p[1]*ky - p[2]*kz)*scl, p[1]*kz + p[2]*ky ]);
    for(let i=1;i+1<s.length;i++) triangle(px, ZBUF, w, h, s[0], s[i], s[i+1], rgb[0], rgb[1], rgb[2]);
  }
  return img;
}

// 32 rotation frames per car, plus a white damage-flash row. Sheets are cached by
// model+colour (not id) so the many enemies a convoy spawns share bitmaps and the
// bake happens once per look; the cache is cleared on rescale so it re-bakes at S.
let CAR2D = new Map();
// the zoom a car sheet is baked at: the nearer of the two legs' framings. A bake
// costs ~30 ms a sheet, so the bend's zoom ease draws these scaled instead.
function homeZoom(){
  if(race || street) return ZOOM2D;
  return Math.abs(ZOOM2D - RUN.ZOOM_H) <= Math.abs(ZOOM2D - RUN.ZOOM_V) ? RUN.ZOOM_H : RUN.ZOOM_V;
}
function bakeCarSprites(c){
  const S0 = S; S = PX*homeZoom();
  try { return bakeCarSheet(c); } finally { S = S0; }
}
function bakeCarSheet(c){
  const n = 32;
  const sc = c.scale || 1;
  const fw = Math.ceil(52*S*sc), fh = Math.ceil(52*S*sc);
  const ax = Math.round(fw/2), ay = Math.round(fh*0.62);
  const key = (c.mesh ?? c.model ?? 0)+'|'+c.color+'|'+S;
  const cached = CAR2D.get(key);
  if(cached) return cached;
  const mesh = MODELS[(c.mesh ?? c.model ?? 0) % MODELS.length];

  const cvs = document.createElement('canvas');
  cvs.width = fw*n; cvs.height = fh*2;
  const g = cvs.getContext('2d');
  g.imageSmoothingEnabled = true;

  const scratch = document.createElement('canvas');
  scratch.width = fw*SS; scratch.height = fh*SS;
  const sctx = scratch.getContext('2d');

  for(let f=0;f<n;f++){
    const yaw = f/n*Math.PI*2;
    for(let row=0;row<2;row++){
      g.save();
      g.translate(f*fw+ax+3*S, row*fh+ay+2*S); g.scale(S,S*KY);
      g.fillStyle='rgba(8,5,12,.40)';
      g.beginPath(); g.ellipse(0,0,15,8,yaw,0,Math.PI*2); g.fill();
      g.restore();
      sctx.putImageData(rasterCar(sctx, mesh, yaw, c.color, row===1, fw, fh, ax, ay), 0, 0);
      g.drawImage(scratch, 0,0,scratch.width,scratch.height, f*fw, row*fh, fw, fh);
    }
  }
  const sheet = { cv:cvs, n, fw, fh, ax, ay, S };
  CAR2D.set(key, sheet);
  return sheet;
}

function drawCar(c){
  if(c.dead) return;
  if(c.invuln>0 && Math.floor(c.invuln*14)%2===0) return;
  const sp = bakeCarSprites(c);                  // a cache hit unless the zoom just settled
  if(!sp) return;
  const zk = S/sp.S;                               // 1 except while the zoom eases
  const p=toScreen(c.x,c.y,0);
  const TAU=Math.PI*2;
  const a=((c.angle%TAU)+TAU)%TAU;
  const f=Math.round(a/TAU*sp.n)%sp.n;
  const row = c.hurtFlash>0 ? sp.fh : 0;
  if(c.pitT>0){
    // ride the car down to the lower plane, clipped by the mouth of the hole
    const fall = 1-clamp(c.pitT/0.75,0,1);
    const q = toScreen(c.x, c.y, -fall*PIT_DEPTH);
    const k = 1-0.22*fall;
    const rp = toScreen(c.pitX, c.pitY, 0);
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(rp.x, rp.y, c.pitR*S, c.pitR*KY*S, 0, 0, Math.PI*2);
    ctx.clip();
    ctx.globalAlpha = 1-0.45*fall;
    ctx.drawImage(sp.cv, f*sp.fw, row, sp.fw, sp.fh,
      Math.round(q.x-sp.ax*k*zk), Math.round(q.y-sp.ay*k*zk), sp.fw*k*zk, sp.fh*k*zk);
    ctx.restore();
    return;
  }
  if(zk === 1) ctx.drawImage(sp.cv, f*sp.fw, row, sp.fw, sp.fh,
    Math.round(p.x-sp.ax), Math.round(p.y-sp.ay), sp.fw, sp.fh);
  else ctx.drawImage(sp.cv, f*sp.fw, row, sp.fw, sp.fh,
    Math.round(p.x-sp.ax*zk), Math.round(p.y-sp.ay*zk), Math.round(sp.fw*zk), Math.round(sp.fh*zk));

  // health pip above the car
  const w=20*S, hpw=Math.round(w*(c.hp/c.maxHp));
  ctx.fillStyle='rgba(10,7,14,.75)'; ctx.fillRect(p.x-w/2-S, p.y-24*S, w+2*S, 4*S);
  ctx.fillStyle = c.hp>50?'#4ade80':c.hp>25?'#e0b73c':'#f0503c';
  ctx.fillRect(p.x-w/2, p.y-23*S, hpw, 2*S);
  // dev mode: say out loud which type each car actually is, so a disagreement
  // about which colour is which can be settled by looking instead of guessing
  if(devMode && !c.isPlayer && c.etype){
    ctx.save();
    ctx.font='bold '+Math.round(7*S)+'px monospace'; ctx.textAlign='center'; ctx.textBaseline='bottom';
    ctx.fillStyle='rgba(10,7,14,.8)'; ctx.fillRect(p.x-20*S, p.y-34*S, 40*S, 9*S);
    ctx.fillStyle=c.color; ctx.fillText(c.etype.toUpperCase(), p.x, p.y-26*S);
    ctx.restore();
  }
  if(c.isPlayer){
    ctx.fillStyle='#fff';
    ctx.beginPath();
    ctx.moveTo(p.x, p.y-27*S); ctx.lineTo(p.x-3*S, p.y-32*S); ctx.lineTo(p.x+3*S, p.y-32*S);
    ctx.closePath(); ctx.fill();
  }
}

function drawPad(p){
  const s=toScreen(p.x,p.y,0);
  ctx.save();
  ctx.translate(s.x,s.y); ctx.scale(S,S*KY);
  ctx.strokeStyle= p.item? '#5d6b84' : '#3a3448'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(0,0,16,0,Math.PI*2); ctx.stroke();
  ctx.restore();
  if(!p.item) return;
  const it=ITEMS[p.item];
  const bob = Math.sin(p.bob*3)*3;
  const q=toScreen(p.x,p.y,10+bob);
  ctx.save();
  ctx.translate(q.x,q.y); ctx.scale(S,S);
  ctx.fillStyle=shade(it.col,0.4); ctx.fillRect(-6,-6,12,12);
  ctx.fillStyle=it.col; ctx.fillRect(-5,-5,10,10);
  ctx.fillStyle=shade(it.col,1.4); ctx.fillRect(-5,-5,10,1.5);
  ctx.fillStyle='#12101a'; ctx.font='bold 8px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(it.label,0,0.5);
  ctx.restore();
}

function drawShot(s){
  const p=toScreen(s.x,s.y,s.z);
  if(s.kind==='missile'){
    drawShadow(s.x,s.y,8,5,Math.atan2(s.vy,s.vx),0.3);
    ctx.save(); ctx.translate(p.x,p.y); ctx.scale(S,S*KY); ctx.rotate(s.angle);
    ctx.fillStyle='#d8d2dc'; ctx.fillRect(-5,-2,10,4);
    ctx.fillStyle='#8f8898'; ctx.fillRect(-5,0.6,10,1.4);
    ctx.fillStyle='#f0503c'; ctx.fillRect(3,-2,3,4);
    ctx.fillStyle='#ffcf6a'; ctx.fillRect(-8,-1,3,2);
    ctx.restore();
  } else {
    ctx.fillStyle='#ffe9a8'; ctx.fillRect(p.x-S, p.y-S, 3*S, 2*S);
    ctx.fillStyle='rgba(255,180,90,.5)'; ctx.fillRect(p.x-3*S, p.y, 2*S, S);
  }
}

function drawMine(m){
  const p=toScreen(m.x,m.y,2);
  ctx.save(); ctx.translate(p.x,p.y); ctx.scale(S,S*KY);
  ctx.fillStyle='#3a3040'; ctx.beginPath(); ctx.arc(0,0,6,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#4a4050'; ctx.beginPath(); ctx.arc(0,-1,4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = (Math.floor(m.blink*6)%2 && m.arm<=0) ? '#f0503c' : '#7a2a20';
  ctx.beginPath(); ctx.arc(0,0,2.5,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawFx(){
  let clipOn=null;
  const setClip = c=>{
    if(c===clipOn) return;
    if(clipOn){ ctx.restore(); clipOn=null; }
    if(c){
      ctx.save();
      const cp=toScreen(c.x,c.y,0);
      ctx.beginPath();
      ctx.ellipse(cp.x,cp.y,c.r*S,c.r*KY*S,0,0,Math.PI*2);
      ctx.clip();
      clipOn=c;
    }
  };
  for(const p of fx){
    setClip(p.clip||null);
    const k=p.t/p.life;
    if(p.ring){
      const s=toScreen(p.x,p.y,p.z);
      const r=lerp(p.r0,p.r1,k);
      ctx.save(); ctx.translate(s.x,s.y); ctx.scale(S,S*KY);
      ctx.globalAlpha=1-k; ctx.strokeStyle='#ffd88a'; ctx.lineWidth=(3-2*k)/KY;
      ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.stroke();
      ctx.globalAlpha=(1-k)*0.35; ctx.fillStyle='#ff8a3d';
      ctx.beginPath(); ctx.arc(0,0,r*0.7,0,Math.PI*2); ctx.fill();
      ctx.restore(); ctx.globalAlpha=1;
      continue;
    }
    const s=toScreen(p.x,p.y,p.z);
    ctx.globalAlpha=clamp(1-k,0,1);
    ctx.fillStyle = Array.isArray(p.col) ? p.col[(p.x*7+p.y*3|0)%p.col.length] : p.col;
    const sz=Math.max(1, p.size*(1-k*0.5))*S;
    ctx.fillRect(s.x-sz/2, s.y-sz/2, sz, sz);
    ctx.globalAlpha=1;
  }
  setClip(null);
}

// ================================================================ TWO PLAYERS
// Player 1 drives in the axonometric view. Player 2 rides shotgun behind a
// ring-mounted gun and sees a first-person raycast view out of the same car.
// One car, two jobs: P1 has no trigger, P2 has no steering wheel.
//
// The raycaster is segment-based, not grid-based. The track is a smooth
// 72-segment superellipse, and voxelising it into tiles would turn a clean oval
// into a staircase. Projection follows the usual Wolfenstein formulas, lifted
// from the survive2 reference (js/raycaster.js, Andrew Lim's SDL2 port):
//   viewDist = (w/2)/tan(fov/2),  stripAngle = atan(screenX/viewDist),
//   perpendicular distance = dist*cos(stripAngle),  projScale = viewDist/perp.

let LAYOUT = 'stack';              // 'stack' = gunner over driver, 'side' = side by side (per stage)
let ZOOM2D = 0.8;                  // world scale of the driving pane (per stage)

let PANE_P1 = null, PANE_P2 = null;
const PANE_FULL = { x:0, y:0, w:VW, h:VH };   // STREET on foot: first person, whole screen
function layoutPanes(){
  if(numPlayers===1){
    // solo: one full-screen driving view, no gunner pane
    PANE_P1 = { x:0, y:0, w:VW, h:VH };
    PANE_P2 = null;
  } else if(LAYOUT==='side'){
    PANE_P1 = { x:0,      y:0, w:VW/2, h:VH };
    PANE_P2 = { x:VW/2,   y:0, w:VW/2, h:VH };
  } else {
    PANE_P2 = { x:0, y:0,      w:VW, h:VH/2 };
    PANE_P1 = { x:0, y:VH/2,   w:VW, h:VH/2 };
  }
}

// ---------------------------------------------------------------- roadside buildings
// Scenery only. They sit outside the barriers, so nothing collides with them,
// and each one is regenerated from a hash of its slot along the road: the same
// building is always in the same place and nothing is stored. Survival stages
// rebuild the ones near the camera every frame; the loop builds its set once.
//
// Two depth tiers, after ascii-city: a NEAR street frontage just past the
// barrier, a few storeys, that you look along; and a FAR skyline beyond the
// perimeter fence, tall enough to rise over it. The fog in the raycaster does
// the rest - the far tier reads as silhouettes against the sky.
//
// A building is a quad `q` of world corners [innerA, innerB, outerB, outerA]
// (inner = the face towards the road) plus a height. Both views draw from that.
let showBuildings = true;          // B toggles
// the loop corridor is narrower and its fence closer, so its tiers sit tighter
// SKYLINE: the giants, P2's view only. ascii-city's far towers are what make its
// city feel huge - you see them from anywhere. Out past the far tier, generated
// much further along the road than the rest (SKY_REACH vs RING_SPAN), and
// dimly lit so they don't bring the noise back. Never drawn in the driving
// pane: they're off its edge anyway, and one 800-tall box drawn top-down
// would cover the whole pane.
const SKY_TIER = 2;
const BLD_SKY_LOOP = { every:4, empty:0.20, in0:800, in1:1200, w0:120, w1:220, d0:120, d1:200, h0:380, h1:850 };
const BLD_TIERS_LOOP = [
  { every:2, empty:0.25, in0:150, in1:168, w0:52, w1:84,  d0:40, d1:66,  h0:30,  h1:70  },
  { every:3, empty:0.10, in0:380, in1:460, w0:90, w1:140, d0:70, d1:120, h0:140, h1:320 }
];

function hash3(a,b,c){
  let h = Math.imul(a|0, 374761393) ^ Math.imul(b|0, 668265263) ^ Math.imul(c|0, 1274126177);
  h = Math.imul(h ^ (h>>>13), 1103515245);
  h ^= h>>>16;
  return (h>>>0)/4294967296;
}

function makeBuilding(cx, cy, tx, ty, nx, ny, inner, w, d, h, tier, seed){
  // (tx,ty) runs along the road, (nx,ny) points away from it
  const ax = cx + nx*inner, ay = cy + ny*inner;
  const bx = ax + nx*d,     by = ay + ny*d;
  const hw = w/2;
  const r = j => hash3(seed, tier*977, j);
  return {
    q: [ { x:ax - tx*hw, y:ay - ty*hw }, { x:ax + tx*hw, y:ay + ty*hw },
         { x:bx + tx*hw, y:by + ty*hw }, { x:bx - tx*hw, y:by - ty*hw } ],
    h, tier, seed,
    nx, ny,
    col: BLD_COLS[(r(11)*BLD_COLS.length)|0],
    lit: (0.18 + r(12)*0.34) * (tier===SKY_TIER ? SKY_LIT : 1)   // share of lit windows
  };
}

// survival: the buildings whose slots fall inside [a0, a1] along the road
let bldList = [];
function survivalBuildings(a0, a1, out){
  out.length = 0;
  if(ROAD.kind === 'run'){
    // the bend keeps its rows of lots; the rest of the run is the outskirts' cut
    const b0 = Math.max(a0, ROAD.bendS0 - OUT_M), b1 = Math.min(a1, ROAD.bendS1 + OUT_M);
    if(b1 > b0) for(let ti=0; ti<BLD_TIERS.length; ti++) survivalTier(BLD_TIERS[ti], ti, b0, b1, out);
    outskirtsBuildings(a0, a1, out);
    return out;
  }
  for(let ti=0; ti<BLD_TIERS.length; ti++) survivalTier(BLD_TIERS[ti], ti, a0, a1, out);
  return out;
}
// the raycaster's set: the two street tiers plus the skyline, which reaches further
function survivalBuildingsRC(center, out){
  survivalBuildings(center - RING_SPAN, center + RING_SPAN, out);
  survivalTier(BLD_SKY, SKY_TIER, center - SKY_REACH, center + SKY_REACH, out);
  return out;
}
function survivalTier(T, ti, a0, a1, out){
  for(const side of [-1, 1]){
    const k0 = Math.floor(a0/T.step) - 1, k1 = Math.ceil(a1/T.step);
    for(let k=k0; k<=k1; k++){
      const seed = k*2 + (side>0 ? 1 : 0);
      const r = j => hash3(seed, ti*977, j);
      if(r(0) < T.empty) continue;                          // an empty lot
      const w = Math.min(lerp(T.w0, T.w1, r(1)), T.step - 14);
      const c = (k + 0.5)*T.step + (r(2) - 0.5)*(T.step - w - 12);
      if(c + w/2 < a0 || c - w/2 > a1) continue;
      const inner = lerp(T.in0, T.in1, r(3));
      const d = lerp(T.d0, T.d1, r(4));
      const h = lerp(T.h0, T.h1, Math.pow(r(5), 1.3));
      // the inside of the run's bend has no room for a row of lots
      if(ROAD.kind === 'run' && side === -1 && c > ROAD.bendS0 - (T.in1 + T.d1 + T.w1)
         && c < ROAD.bendS1 + (T.in1 + T.d1 + T.w1)) continue;
      if(ROAD.kind === 'run' && c + w/2 > ROAD.gateS - 40) continue;   // the city takes over
      // the run's rows only fill the bend; they stop short of the outskirts
      if(ROAD.kind === 'run' && T !== BLD_SKY &&
         (c - w/2 < ROAD.bendS0 - OUT_M || c + w/2 > ROAD.bendS1 + OUT_M)) continue;
      const f = roadFrame(c);                      // the lot faces the road at its slot
      out.push(makeBuilding(f.x, f.y, f.tx, f.ty, side*f.nx + 0, side*f.ny + 0, inner, w, d, h, ti, seed));
    }
  }
}

// loop: once, around the outside of the circuit (the infield pinches on the
// bends, so it stays open ground)
let loopBld = [];
function loopBuildings(){
  loopBld = [];
  const pts = track.pts, n = pts.length, sg = outwardSign();
  const tiers = [...BLD_TIERS_LOOP, BLD_SKY_LOOP];   // index 2 = SKY_TIER
  for(let ti=0; ti<tiers.length; ti++){
    const T = tiers[ti];
    for(let i=0; i<n; i+=T.every){
      const seed = i*2 + 7000;
      const r = j => hash3(seed, ti*977 + 5, j);
      if(r(0) < T.empty) continue;
      const p = pts[i], a = pts[(i+n-1)%n], b = pts[(i+1)%n];
      let tx = b.x - a.x, ty = b.y - a.y; const L = Math.hypot(tx, ty) || 1; tx/=L; ty/=L;
      const nx = p.nx*sg, ny = p.ny*sg;
      loopBld.push(makeBuilding(p.x, p.y, tx, ty, nx, ny,

// raycaster rings for a set of buildings: all four walls, closed. It used to

// ---- the driving pane: extruded boxes with lit windows on the faces you see.

// frame the road instead of hiding it.

function drawBuildings2D(list, front){
  if(!showBuildings) return;
  for(const b of list){
    if(b.tier === SKY_TIER) continue;                  // the giants are P2's alone
    if(isFrontBuilding(b) !== front) continue;
    const q = b.q;
    let mx=0, my=0; for(const c of q){ mx+=c.x; my+=c.y; } mx/=4; my/=4;

function drawBuilding2D(b, alpha){
  const lift = z => z*S;                               // same height scale as extrude()
  const q = b.q;
  let mx=0, my=0; for(const c of q){ mx+=c.x; my+=c.y; } mx/=4; my/=4;
  const s = q.map(c => toScreen(c.x, c.y, 0));

  // side faces that face the camera (screen-down), then the roof

      const x1 = sa.x + (sc.x-sa.x)*t1, y1 = sa.y + (sc.y-sa.y)*t1;

        const lit = hash3(b.seed*31 + i, wi, fl + b.tier*101) < b.lit;

  ctx.moveTo(s[0].x, s[0].y - H);

  ctx.strokeStyle = shade(b.col, 0.8); ctx.lineWidth = Math.max(1, 2*S);
  ctx.stroke();
  ctx.restore();
}
// what the driving pane should draw this frame
function buildings2D(){

const bld2DScratch = [], cityBldScratch = [];

// ---------------------------------------------------------------- the outskirts (legs 1-2)
// The edge of the city, along the run's two straight legs: the city's own BSP
// cut (cityCut / cityPlots) with sparser numbers (OUTSKIRTS*), done in ROAD
// coordinates - x = u, distance out from the road's middle, y = s, distance
// along it - and laid onto the road with roadPoint. On a straight leg that is
// exact: every lot and street stays a rectangle, running along the road
// whichever way the road runs. The bend can't take a rectangle, so within
// OUT_M of it the old rows of lots carry on (survivalTier).
// Scenery only: the barrier never opens and nothing here collides.
const OUT_M = OUTSKIRTS.W + 60;
function outZone(s){
  return s < ROAD.bendS0 - OUT_M || (s > ROAD.bendS1 + OUT_M && s < ROAD.gateS - 40);
}
// each leg is cut in its own style (CITY_LOOK): leg 1 before the bend, leg 2 after.
// A chunk can't straddle the two - the bend's OUT_M margin either side is wider.
const OUT_STYLE = {};
for(const leg of ['LEG1', 'LEG2']){
  const st = CITY_STYLES[CITY_LOOK[leg]];
  OUT_STYLE[leg] = { st, cut:styleCut(st), plot:stylePlot(st) };
}
function makeOutChunk(k, side){
  const O = OUTSKIRTS, rng = cityRng(hash3(k, side > 0 ? 1 : 2, O.SEED)*4294967296);
  const S0 = k*O.CH, S1 = S0 + O.CH;
  const L = OUT_STYLE[S0 < ROAD.bendS0 ? 'LEG1' : 'LEG2'], st = L.st, XST = st.XST, PV = st.PAVE;
  const roads = [];
  const lots = cityCut(rng, { x0:O.IN, y0:S0 + XST, x1:O.W, y1:S1, pad:{ n:XST, s:0, w:0, e:0 } },
                       0, roads, L.cut);
  roads.push({ axis:'h', w:XST, x0:O.IN, x1:O.W, y0:S0, y1:S0 + XST });   // a cross street per chunk
  // every block is built on, sparsely; more of each block as you near the city
  const built = lerp(O.BUILT0, O.BUILT1, clamp((S0 + S1)/2/ROAD.gateS, 0, 1));
  // a rectangle in (u, s) as a world quad; null if it isn't wholly in the zone
  const quad = r => {
    if(!outZone(r.y0) || !outZone(r.y1)) return null;
    return [roadPoint(r.y0, side*r.x0), roadPoint(r.y0, side*r.x1),
            roadPoint(r.y1, side*r.x1), roadPoint(r.y1, side*r.x0)];
  };
  const out = { k, side, roads:[], blocks:[], bld:[] };
  for(const r of roads){ const q = quad(r); if(q) out.roads.push(q); }
  for(const lot of lots){
    const core = { x0:lot.x0 + PV, y0:lot.y0 + PV, x1:lot.x1 - PV, y1:lot.y1 - PV };
    const plots = cityPlots(rng, core, [], L.plot);
    const bq = quad(lot); if(bq) out.blocks.push(bq);
    const keep = (rng.next()*plots.length)|0;                  // never a block left bare
    for(let pi=0; pi<plots.length; pi++){
      const pl = plots[pi];
      const up = rng.chance(built) || pi === keep;
      const h = styleHeight(st, rng);
      const seed = (rng.next()*1e9)|0, col = BLD_COLS[(rng.next()*BLD_COLS.length)|0];
      const lit = (0.16 + rng.next()*0.36)*O.LIT;

      // see-through): its roof may reach at most FRONT_REACH into the road on screen
      const hh = side*f.ny > 0.3 ? Math.min(h, (pl.x0 - ROAD_HW)*KY + O.FRONT_REACH) : h;
      out.bld.push({ q, h:hh, tier:0, seed, col, lit, out:true, s0:pl.y0, s1:pl.y1, fsc:st.FLOOR,

}
const outCache = new Map();
function outChunk(k, side){
  const key = k*2 + (side > 0 ? 1 : 0);

  if(!c){
    c = makeOutChunk(k, side); outCache.set(key, c);
    if(outCache.size > 40){
      const kn = Math.floor(camS/OUTSKIRTS.CH);
      for(const [kk, v] of outCache) if(Math.abs(v.k - kn) > 6) outCache.delete(kk);

function outChunks(a0, a1, fn){
  for(let k = Math.floor(a0/OUTSKIRTS.CH); k <= Math.floor(a1/OUTSKIRTS.CH); k++)
    for(const side of [-1, 1]) fn(outChunk(k, side));

function outskirtsBuildings(a0, a1, out){

// the ground: dim unmarked streets, and pavement where a lot is built on
// (vacant lots are left as the wasteland under everything)
function drawOutskirtsGround(){
  const [a, b] = roadSpan();
  const poly = q => { ctx.beginPath(); ctx.moveTo(q[0].x*S, q[0].y*KY*S);
    for(let i=1;i<4;i++) ctx.lineTo(q[i].x*S, q[i].y*KY*S); ctx.closePath(); };

// ---------------------------------------------------------------- the city (STREET)
// After C:\proj\the-party's src/city.js: the city is CUT, not ruled. A piece
// of ground is halved, and each half halved, until no piece is big enough to
// cut again - binary space partitioning - and every cut leaves a road behind
// it. The pieces that survive are the blocks. Coming back up the tree some
// cuts are undone (both halves came out whole), which is where the big blocks
// come from; and a block's core is cut again WITHOUT roads into plots, one
// building each, wall to wall, each with its own height and colour.
//
// The party cuts one finite square. Here the highway is endless, so the city
// is an endless STRIP either side of it, cut a chunk at a time: chunk k on
// side s covers y in [k*CITY_CH, (k+1)*CITY_CH) and |x| from the barrier out
// to CITY_W. Every chunk opens with a cross street along its top edge and has
// an outer road down its far edge, so neighbouring chunks always join up; and
// any street whose cut reaches the highway opens a gap in the barrier, which
// is how the car gets in and out. A chunk is cut from a seed made of (k, s),
// so the same stretch of road is always the same city and nothing is saved.
//
// Generated in u-space (u = |x|, distance out from the centre line), mirrored
// into world x at the end.
// Street widths come from the style's ROADS by depth of cut, never under its
// ROAD_MIN (in SLUMS the 50s and 58s were too tight to drive, measured, so they
// come out at 70).
const CITY_CELL = 8;                // ground lookup resolution
const CITY_MCOLS = Math.ceil((CITY_W - ROAD_HW)/CITY_CELL), CITY_MROWS = Math.ceil(CITY_CH/CITY_CELL);
// the skyline giants, pushed out past the city wall so they stay a backdrop
const PAVE_COL = '#4a4250', KERB_COL = '#6e6274';

function cityRng(seed){
  let a = seed >>> 0;
  const next = () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  return { next, chance: p => next() < p, range: (a0, a1) => a0 + (a1 - a0)*next(),
           pick: arr => arr[(next()*arr.length)|0] };
}
const snap4 = v => Math.round(v/4)*4;
// a style (config 5a) as the cut's and the plots' number sets, so the city and
// each leg's outskirts cut the same way at their own scale
function styleCut(st){
  return { LOT_MIN:st.LOT_MIN, LOT_MAX:st.LOT_MAX, LOT_STOP:st.LOT_STOP, LOT_JITTER:st.LOT_JITTER,
           LOT_ASPECT:st.LOT_ASPECT, LOT_MERGE:st.LOT_MERGE, LOT_MERGE_MAX:st.LOT_MERGE_MAX,
           roadW: d => Math.max(st.ROAD_MIN, st.ROADS[Math.min(d, st.ROADS.length - 1)]) };
}
function stylePlot(st){
  return { PLOT_MIN:st.PLOT_MIN, PLOT_MAX:st.PLOT_MAX, PLOT_DEEP:st.PLOT_DEEP, PLOT_DEEP_MAX:st.PLOT_DEEP_MAX, PLOT_STOP:st.PLOT_STOP };
}
// a building's height in a style: mostly walk-ups with a skyline, now and then a tower
function styleHeight(st, rng){
  return rng.chance(st.TOWER) ? rng.range(st.TOWER_H[0], st.TOWER_H[1]) : rng.range(st.H[0], st.H[1])*(0.6 + 0.4*rng.next());
}
const CITY_CUT = styleCut(CITY_STYLE), CITY_PLOT = stylePlot(CITY_STYLE);

// the party's cut(), with x = u. `pad` is the road width on each side of the
// piece, so a road laid across it runs into the roads at both ends.
function cityCut(rng, node, depth, roads, P = CITY_CUT){
  const w = node.x1 - node.x0, h = node.y1 - node.y0;
  const rw = P.roadW(depth);
  const canV = w >= 2*P.LOT_MIN + rw, canH = h >= 2*P.LOT_MIN + rw;
  const must = w > P.LOT_MAX || h > P.LOT_MAX;
  if((!canV && !canH) || (!must && rng.chance(P.LOT_STOP))) return [node];
  let v;
  if(canV && !canH) v = true;
  else if(canH && !canV) v = false;
  else if(w > P.LOT_MAX && h <= P.LOT_MAX) v = true;
  else if(h > P.LOT_MAX && w <= P.LOT_MAX) v = false;
  else if(w > h*P.LOT_ASPECT) v = true;
  else if(h > w*P.LOT_ASPECT) v = false;
  else v = rng.chance(0.5);
  const a0 = v ? node.x0 : node.y0, a1 = v ? node.x1 : node.y1;
  const lo = a0 + P.LOT_MIN + rw/2, hi = a1 - P.LOT_MIN - rw/2;
  const pos = snap4((lo + hi)/2 + rng.range(-1, 1)*((hi - lo)/2)*P.LOT_JITTER);
  const b0 = pos - rw/2, b1 = pos + rw/2, p = node.pad;

    ? { axis:'v', w:rw, x0:b0, x1:b1, y0:node.y0 - p.n, y1:node.y1 + p.s }
    : { axis:'h', w:rw, x0:node.x0 - p.w, x1:node.x1 + p.e, y0:b0, y1:b1 };
  const lhs = v ? { x0:node.x0, y0:node.y0, x1:b0, y1:node.y1, pad:{ n:p.n, s:p.s, w:p.w, e:rw } }
                : { x0:node.x0, y0:node.y0, x1:node.x1, y1:b0, pad:{ n:p.n, s:rw, w:p.w, e:p.e } };
  const rhs = v ? { x0:b1, y0:node.y0, x1:node.x1, y1:node.y1, pad:{ n:p.n, s:p.s, w:rw, e:p.e } }
                : { x0:node.x0, y0:b1, x1:node.x1, y1:node.y1, pad:{ n:rw, s:p.s, w:p.w, e:p.e } };
  const A = cityCut(rng, lhs, depth + 1, roads, P), B = cityCut(rng, rhs, depth + 1, roads, P);

  if(A.length===1 && B.length===1 && w <= P.LOT_MERGE_MAX && h <= P.LOT_MERGE_MAX && rng.chance(P.LOT_MERGE))
    return [{ x0:node.x0, y0:node.y0, x1:node.x1, y1:node.y1, pad:p, merged:true }];
  roads.push(road);
  return [...A, ...B];
}

// a block's core into plots: the same cut, no roads, buildings wall to wall
function cityPlots(rng, r, out, P = CITY_PLOT){
  const w = r.x1 - r.x0, h = r.y1 - r.y0;
  const canV = w >= 2*P.PLOT_MIN, canH = h >= 2*P.PLOT_DEEP;
  const must = w > P.PLOT_MAX || h > P.PLOT_DEEP_MAX;
  if((!canV && !canH) || (!must && rng.chance(P.PLOT_STOP))){ out.push(r); return out; }
  let v;
  if(canV && !canH) v = true;
  else if(canH && !canV) v = false;
  else if(w > P.PLOT_MAX && h <= P.PLOT_DEEP_MAX) v = true;
  else if(h > P.PLOT_DEEP_MAX && w <= P.PLOT_MAX) v = false;
  else v = rng.chance(0.5);
  const mn = v ? P.PLOT_MIN : P.PLOT_DEEP;
  const a0 = v ? r.x0 : r.y0, a1 = v ? r.x1 : r.y1;
  const pos = snap4((a0 + a1)/2 + rng.range(-1, 1)*((a1 - a0 - 2*mn)/2)*0.9);
  cityPlots(rng, v ? { x0:r.x0, y0:r.y0, x1:pos, y1:r.y1 } : { x0:r.x0, y0:r.y0, x1:r.x1, y1:pos }, out, P);
  cityPlots(rng, v ? { x0:pos, y0:r.y0, x1:r.x1, y1:r.y1 } : { x0:r.x0, y0:pos, x1:r.x1, y1:r.y1 }, out, P);

// the stretches of each road another road runs through: no centre line there
function cityMarkGaps(roads){

    const vt = r.axis==='v', gaps = [];
    for(const o of roads){
      if(o===r || o.x1 <= r.x0 || o.x0 >= r.x1 || o.y1 <= r.y0 || o.y0 >= r.y1) continue;
      gaps.push(vt ? [Math.max(r.y0, o.y0), Math.min(r.y1, o.y1)] : [Math.max(r.x0, o.x0), Math.min(r.x1, o.x1)]);
    }
    gaps.sort((a, b) => a[0] - b[0]);
    const m = [];
    for(const g of gaps){ const l = m[m.length-1]; if(l && g[0] <= l[1]) l[1] = Math.max(l[1], g[1]); else m.push(g); }
    r.gaps = m;
  }
}

function makeCityChunk(k, side){
