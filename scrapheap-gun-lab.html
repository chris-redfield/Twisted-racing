    centerText(msg, msg==='E  GET IN' ? '#4ade80' : '#e8d5b0', VH - 48, 8);
  }
  ctx.fillStyle='#5a4a5e';
  centerText('WASD walk  .  MOUSE / ARROWS look (up too)  .  SHIFT run  .  E get in'+(pointerLocked()?'':'  .  click for mouse-look'),
             '#6a5a72', VH - 14, 8);
  // view distance: shown for a moment after 9 / 0, and always with F
  if(walkViewMsgT > 0 || showFps){
    const segs = rings.reduce((a, r) => a + r.pts.length, 0);
    const t = 'VIEW '+VIEW_D+'   '+walkMs.toFixed(1)+' ms   '+rings.length+' walls / '+segs+' pts   (9 nearer . 0 further)';
    plate(VW - t.length*5 - 20, 6, t.length*5 + 14, 14);
    ctx.textAlign='right'; ctx.fillStyle = walkMs > 12 ? '#f0503c' : walkMs > 8 ? '#e0b73c' : '#4ade80';
    ctx.fillText(t, VW - 13, 9); ctx.textAlign='left';
  }
  if(showFps){
    ctx.fillStyle='#4ade80';
    ctx.fillText(fpsVal+' fps  rc '+RC_W+'x'+RC_H+'  eye '+WALK_EYE+'  x '+Math.round(walker.x)+' y '+Math.round(walker.y), 132, 24);
  }
  if(paused){ centerText('PAUSED','#e8d5b0', VH/2+20, 12); centerText('P / ESC  resume      BACKSPACE  quit to menu','#8a7a90', VH/2+34, 8); }
  ctx.restore();
}

// ---------------------------------------------------------------- HUD
let gunnerHit=0, gunnerKill=0;

// Segmented, not continuous: pips with a hairline between them, so a glance
// reads "three left" rather than "about a third". Spent pips stay as faint
// ghosts so the full capacity is still legible. `ceil` keeps the last pip lit
// until the value is actually zero - alive should never look empty.
const BAR_PIPS = 20;               // a pip is maxHp/20: 10 hull at the base 200
function bar(x,y,w,h,v,col,bg,n){
  n = n || BAR_PIPS;
  ctx.fillStyle=bg||'rgba(10,7,14,.8)'; ctx.fillRect(x-1,y-1,w+2,h+2);
  const gap=1, lit=Math.ceil(clamp(v,0,1)*n);
  for(let i=0;i<n;i++){
    // Both edges are rounded from the exact split. Rounding a single pip width
    // and stepping by it instead lets the error accumulate until it tips over,
    // which opened a double-width seam in the middle of the bar.
    const x0=Math.round(x+i*w/n), x1=Math.round(x+(i+1)*w/n);
    ctx.fillStyle = i<lit ? col : 'rgba(255,255,255,.07)';
    ctx.fillRect(x0, y, x1-x0-gap, h);
  }
}
function centerText(t,col,y,size,cx){
  ctx.textAlign='center'; ctx.font='bold '+(size||10)+'px monospace'; ctx.fillStyle=col;
  ctx.fillText(t, cx==null?VW/2:cx, y); ctx.textAlign='left';
}
function plate(x,y,w,h){
  ctx.fillStyle='rgba(12,9,16,.74)'; ctx.fillRect(x,y,w,h);
  ctx.strokeStyle='rgba(120,100,140,.22)'; ctx.lineWidth=1; ctx.strokeRect(x+0.5,y+0.5,w-1,h-1);
}

// ---- player 2: crosshair and ammo
function drawGunnerHUD(){
  const p=PANE_P2, me=cars[0];
  const cx=p.x+p.w/2, cy=p.y+p.h*(RC_HORIZON/RC_H);

  // is anything actually under the gun right now?
  let onTarget=false;
  const bearing=me.angle+(me.turret||0);
  for(let i=1;i<cars.length;i++){
    const o=cars[i]; if(o.dead) continue;
    const d=Math.hypot(o.x-me.x,o.y-me.y);
    if(d>420) continue;
    if(Math.abs(angDiff(bearing, Math.atan2(o.y-me.y,o.x-me.x))) < 0.06 + 18/d) { onTarget=true; break; }
  }

  // FPS aim needs the pointer locked; prompt for the click that grabs it
  if(!pointerLocked() && !me.dead){
    ctx.font='8px monospace'; ctx.textAlign='center';
    ctx.fillStyle='rgba(224,183,60,'+(0.55+0.35*Math.abs(Math.sin(matchTime*4)))+')';
    ctx.fillText('CLICK TO AIM', cx, p.y+18); ctx.textAlign='left';
  }

  // The gun mount, fixed to the pane. A foreground that never moves is the
  // strongest cue there is that the camera itself is not rotating. And since
  // hit detection in this engine is purely horizontal, a tall bearing line is
  // also an honest reticle: only the column you point at matters, not elevation.
  const my=p.y+p.h;
  ctx.fillStyle='rgba(232,213,176,.10)';
  ctx.fillRect(cx-0.5, cy+6, 1, my-20-cy-6);
  ctx.fillStyle='#16121c';
  ctx.beginPath();
  ctx.moveTo(p.x, my); ctx.lineTo(p.x, my-7);
  ctx.quadraticCurveTo(cx, my-21, p.x+p.w, my-7);
  ctx.lineTo(p.x+p.w, my); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#2a2333';
  ctx.beginPath();
  ctx.moveTo(cx-13, my-9); ctx.lineTo(cx-4, my-20);
  ctx.lineTo(cx+4, my-20); ctx.lineTo(cx+13, my-9); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#3d3448'; ctx.fillRect(cx-2.5, my-23, 5, 5);
  if(me.cool>0.09){
    ctx.fillStyle='#ffe9a8';
    ctx.beginPath(); ctx.arc(cx, my-25, 3+Math.random()*2, 0, Math.PI*2); ctx.fill();
  }

  const col = gunnerHit>0 ? '#ffffff' : onTarget ? '#f0503c' : 'rgba(232,213,176,.65)';
  ctx.strokeStyle=col; ctx.lineWidth=1;
  const g=onTarget?7:5;
  ctx.beginPath();
  ctx.moveTo(cx-g-4,cy); ctx.lineTo(cx-g,cy);
  ctx.moveTo(cx+g,cy);   ctx.lineTo(cx+g+4,cy);
  ctx.moveTo(cx,cy-g-4); ctx.lineTo(cx,cy-g);
  ctx.moveTo(cx,cy+g);   ctx.lineTo(cx,cy+g+4);
  ctx.stroke();
  if(gunnerHit>0){
    ctx.strokeStyle='#fff'; ctx.beginPath();
    ctx.moveTo(cx-5,cy-5); ctx.lineTo(cx+5,cy+5);
    ctx.moveTo(cx+5,cy-5); ctx.lineTo(cx-5,cy+5); ctx.stroke();
  }

  // role tag and ammo, top right - the corner the radar used to occupy.
  // Everything inside is placed off gx so the box stays one piece.
  const gx = p.x + p.w - 98;
  plate(gx, p.y+6, 92, 45);
  ctx.font='8px monospace'; ctx.textBaseline='top';
  ctx.fillStyle='#9d8ea5'; ctx.fillText('P2 GUNNER', gx+5, p.y+10);
  ctx.fillStyle='#f97362'; ctx.fillText('MSL '+me.missiles, gx+5, p.y+21);
  ctx.fillStyle= me.cool>0 ? '#5a4a5e' : '#e0b73c';
  ctx.fillText('CANNON', gx+44, p.y+21);
  ctx.fillStyle= me.minesLeft>0 ? '#e0b73c' : '#5a4a5e'; ctx.fillText('MINE '+me.minesLeft+' (Q)', gx+5, p.y+32);
  ctx.fillStyle='#5a4a5e';
  ctx.fillText((me.turret>=0?'R':'L')+Math.abs(Math.round(me.turret*57))+'°', gx+5, p.y+31);

  if(gunnerKill>0){
    ctx.globalAlpha=clamp(gunnerKill*2,0,1);
    centerText('WRECKED HIM','#ffe9a8', p.y+p.h*0.30, 11, cx);
    ctx.globalAlpha=1;
  }

}

// ---- player 1: the driving instruments
function drawDriverHUD(){
  const p=PANE_P1, me=cars[0];
  ctx.font='8px monospace'; ctx.textBaseline='top'; ctx.textAlign='left';

  // hull, centred across the driving pane and lifted clear of the bottom edge.
  // Everything inside is placed off hx/hy so the box moves as one piece.
  const HUD_LIFT = 6;                 // how far off the bottom edge the box sits
  const HW_ = 118, hx = Math.round(p.x + (p.w - HW_)/2), hy = p.y + p.h - 40 - HUD_LIFT;
  plate(hx, hy, HW_, 34);
  ctx.fillStyle='#9d8ea5'; ctx.fillText(numPlayers===2?'P1 DRIVER':'DRIVER / GUNNER', hx+5, hy+4);
  // the hull bar never moves in dev mode, so say why rather than let it look broken
  if(devMode){ ctx.textAlign='right'; ctx.fillStyle='#e0b73c';
    ctx.fillText('DEV', hx+113, hy+4); ctx.textAlign='left'; }
  bar(hx+5, hy+15, 100, 6, me.hp/me.maxHp,
      me.hp>me.maxHp*0.5?'#4ade80':me.hp>me.maxHp*0.25?'#e0b73c':'#f0503c');
  // BOOST. One continuous read of one number: it drains hot while the charge is
  // being spent, then fills cool over the recharge. Full and cyan = press SPACE.
  const burning = me.boostT>0;
  const bv  = burning ? me.boostT/BOOST_TIME : 1 - me.boostCD/boostCool();
  const bcol = burning ? '#ffe9a8' : me.boostCD>0 ? '#3f6a80' : '#7fd4ff';
  ctx.fillStyle = burning ? '#ffe9a8' : me.boostCD>0 ? '#5a4a5e' : '#7fd4ff';
  ctx.fillText('BST', hx+5, hy+24);
  bar(hx+24, hy+25, 81, 4, bv, bcol, null, 10);
  // solo carries its own gun readout (in 2P this lives in the gunner pane), top
  // right to match it. In the loop race the standings board already owns that
  // corner, so it drops in just below rather than overlapping.
  if(numPlayers===1){
    const gy = race ? p.y+16+cars.length*10 : p.y+6;
    plate(p.x+p.w-70, gy, 64, 47);
    ctx.fillStyle='#9d8ea5'; ctx.fillText('GUN', p.x+p.w-64, gy+4);
    ctx.fillStyle= me.cool>0 ? '#5a4a5e' : '#e0b73c'; ctx.fillText('CANNON', p.x+p.w-64, gy+15);
    ctx.fillStyle='#f97362'; ctx.fillText('MSL '+me.missiles, p.x+p.w-64, gy+26);
    ctx.fillStyle= me.minesLeft>0 ? '#e0b73c' : '#5a4a5e'; ctx.fillText('MINE '+me.minesLeft+' (Q)', p.x+p.w-64, gy+37);
  }

  if(race){
    // place + lap, top-left; standings, top-right
    const ord=['1st','2nd','3rd','4th'][clamp(me.place-1,0,3)];
    plate(p.x+6, p.y+6, 62, 28);
    ctx.font='bold 14px monospace'; ctx.fillStyle= me.place===1?'#e0b73c':'#e8d5b0';
    ctx.fillText(ord, p.x+11, p.y+9);
    ctx.font='8px monospace'; ctx.fillStyle='#9d8ea5';
    ctx.fillText('LAP '+clamp(me.lap+1,1,LAPS)+'/'+LAPS, p.x+11, p.y+24);
    const bx=p.x+p.w-96;
    plate(bx-5, p.y+6, 95, 6+cars.length*10);
    [...cars].sort((a,b)=>a.place-b.place).forEach((c,i)=>{
      const y=p.y+10+i*10;
      ctx.fillStyle=c.color; ctx.fillRect(bx,y+1,5,5);
      ctx.fillStyle=c.isPlayer?'#fff':'#9d8ea5'; ctx.fillText(c.name, bx+9, y);
      ctx.textAlign='right'; ctx.fillStyle='#e8d5b0';
      ctx.fillText(c.finished?'FIN':'L'+clamp(c.lap+1,1,LAPS), p.x+p.w-8, y);
      ctx.textAlign='left';
    });
  } else if(street && stage!=='run'){
    // how far up the road, and the one thing to know about this stage
    plate(p.x+6, p.y+6, 96, 28);
    ctx.font='bold 14px monospace'; ctx.fillStyle='#e0b73c';
    ctx.fillText(Math.floor(distance)+'m', p.x+11, p.y+9);
    ctx.font='8px monospace'; ctx.fillStyle='#9d8ea5';
    ctx.fillText('STREET  free drive', p.x+11, p.y+24);
    const slow = Math.abs(me.speed||0) <= EXIT_SPEED;
    const msg = walkMsgT>0 && walkMsg ? walkMsg : slow ? 'E  GET OUT' : '';
    if(msg && !me.dead){
      const tw = msg.length*5 + 16, ty = p.y + p.h - 64 - HUD_LIFT;
      plate(p.x + p.w/2 - tw/2, ty, tw, 16);
      centerText(msg, msg==='E  GET OUT' ? '#4ade80' : '#e8d5b0', ty+4, 8, p.x + p.w/2);
    }
  } else if(stage==='run' && street){
    plate(p.x+6, p.y+6, 112, 28);
    ctx.font='bold 14px monospace'; ctx.fillStyle=NEON.MAGENTA;
    ctx.fillText('THE CITY', p.x+11, p.y+9);
    ctx.font='8px monospace'; ctx.fillStyle='#9d8ea5';
    ctx.fillText('KILLS '+convoyKills+'   '+(enemiesOn ? 'HUNTERS '+(cars.length-1) : 'NO ENEMIES'), p.x+11, p.y+24);
    const slow = Math.abs(me.speed||0) <= EXIT_SPEED;
    const msg = walkMsgT>0 && walkMsg ? walkMsg : slow ? 'E  GET OUT' : '';
    if(msg && !me.dead){
      const tw = msg.length*5 + 16, ty = p.y + p.h - 64 - HUD_LIFT;
      plate(p.x + p.w/2 - tw/2, ty, tw, 16);
      centerText(msg, msg==='E  GET OUT' ? NEON.CYAN : '#e8d5b0', ty+4, 8, p.x + p.w/2);
    }
  } else if(stage==='run'){
    // how far along the run, which leg, and a bar to the next landmark
    const km = camS/RUN.UNITS_PER_M/1000;
    const leg = camS < ROAD.bendS0 ? 1 : 2;
    const a = leg===1 ? 0 : ROAD.bendS1, b = leg===1 ? ROAD.bendS0 : ROAD.gateS;
    plate(p.x+6, p.y+6, 112, 38);
    ctx.font='bold 14px monospace'; ctx.fillStyle=NEON.CYAN;
    ctx.fillText(km.toFixed(2)+' km', p.x+11, p.y+9);
    ctx.font='8px monospace'; ctx.fillStyle='#9d8ea5';
    ctx.fillText('LEG '+leg+'  WAVE '+wave+'  KILLS '+convoyKills, p.x+11, p.y+24);
    bar(p.x+11, p.y+35, 100, 4, clamp((camS-a)/(b-a),0,1), NEON.MAGENTA, null, 10);
  } else {
    // distance survived (the score) + wave, top-left
    plate(p.x+6, p.y+6, 96, 28);
    ctx.font='bold 14px monospace'; ctx.fillStyle='#e0b73c';
    ctx.fillText(Math.floor(distance)+'m', p.x+11, p.y+9);
    ctx.font='8px monospace'; ctx.fillStyle='#9d8ea5';
    ctx.fillText('WAVE '+wave+'   KILLS '+convoyKills, p.x+11, p.y+24);
  }

  // Scrap Saints cash, under the run's plate, with a "+$" toast for each payout
  if(stage==='run'){
    const cy = p.y + (street ? 38 : 48);
    plate(p.x+6, cy, 112, 16);
    ctx.font='bold 10px monospace'; ctx.fillStyle='#e0b73c'; ctx.textAlign='left';
    ctx.fillText('$'+cash, p.x+11, cy+4);
    if(saintsPay){
      ctx.globalAlpha = Math.min(1, saintsPay.t*1.5);
      ctx.font='8px monospace'; ctx.fillStyle=NEON.MAGENTA;
      ctx.fillText('+$'+saintsPay.amt+' SCRAP SAINTS', p.x+11 + (String(cash).length+1)*6 + 6, cy+5);
      ctx.globalAlpha = 1;
    }
  }

  // low-hp vignette so you feel the danger
  if(me.hp < me.maxHp*0.3 && !me.dead){
    ctx.globalAlpha = 0.10 + 0.12*Math.abs(Math.sin(matchTime*6));
    ctx.fillStyle='#f0503c'; ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.globalAlpha=1;
  }
}

// the big neon line (CHECKPOINT, THE CITY, ENEMIES OFF): in fast, hold, fade out.
// Expects the PX-scaled context, like the rest of the HUD.
function drawBanner(){
  if(!(bannerT > 0 && state==='play')) return;
  const t = 2.6 - bannerT, a = Math.min(1, t/0.15, bannerT/0.6);
  ctx.save(); ctx.globalAlpha = a;
  ctx.font = 'bold 28px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = NEON.CYAN; ctx.shadowBlur = 12;
  ctx.fillStyle = NEON.CYAN; ctx.fillText(bannerText, VW/2, VH*0.3);
  ctx.shadowBlur = 0; ctx.font = '8px monospace'; ctx.fillStyle = NEON.INK;
  ctx.fillText(bannerSub, VW/2, VH*0.3 + 22);
  ctx.restore();
}
function drawHUD(){
  ctx.save(); ctx.scale(PX,PX);
  ctx.textBaseline='top'; ctx.textAlign='left';
  if(numPlayers===2){
    drawGunnerHUD();
    // seam between the two seats
    ctx.fillStyle='#0b0810';
    if(LAYOUT==='side') ctx.fillRect(VW/2-1, 0, 2, VH);
    else ctx.fillRect(0, VH/2-1, VW, 2);
  }
  drawDriverHUD();

  if(showFps){
    ctx.fillStyle='#4ade80'; ctx.font='8px monospace';
    ctx.fillText(fpsVal+' fps  '+W+'x'+H+'  rc '+RC_W+'x'+RC_H+
      '  eye '+EYE_Z+'  fov '+Math.round(RC_FOV*180/Math.PI)+
      '  carmag '+CAR_MAG_MAX.toFixed(1)+(devMode?'  DEV':'')+
      '  '+(cars.length+shots.length+fx.length)+' ent  '+bbList.length+' bb', 132, 8);
  }
  if(paused){ centerText('PAUSED','#e8d5b0', VH/2+20, 12); centerText('P / ESC  resume      BACKSPACE  quit to menu','#8a7a90', VH/2+34, 8); }
  drawBanner();
  ctx.restore();
}

// shown on both menus: dev mode is on by default, so it has to be impossible to
// start a run without knowing the damage is switched off
function devLine(y){
  if(devMode) centerText('I  DEV MODE: your car takes no damage  .  press I for a real run','#e0b73c',y,8);
  else        centerText('I  dev mode: off','#3f3448',y,8);

// ---- title: pick the STAGE
// ---------------------------------------------------------------- the map (M)
// After the-party's minimap, without its paper skin: the city is drawn SHRUNK -
// every block a flat shape at its real size and place - and the streets are not
// drawn at all: they are the floor showing between the blocks. North is up and
// it's a true plan (no axonometric squash). Left: around you. Right: the whole
// run as a strip, the driven part lit, you on it.
let mapOpen = false;
const mapBld = [];
function toggleMap(){ mapOpen = !mapOpen; if(mapOpen && MAP_PAUSES) Snd.engineOff(); }
function mapFocus(){ return onFoot ? walker : cars[0]; }
// a pointed marker at (x, y) facing a, `r` in screen px (drawn under a world transform of scale k)
function mapPip(x, y, a, r, k, col, glow){
  const s = r/k, c = Math.cos(a), n = Math.sin(a);
  ctx.beginPath();
  ctx.moveTo(x + c*s*1.3, y + n*s*1.3);
  ctx.lineTo(x - c*s*0.8 - n*s*0.8, y - n*s*0.8 + c*s*0.8);
  ctx.lineTo(x - c*s*0.4, y - n*s*0.4);
  ctx.lineTo(x - c*s*0.8 + n*s*0.8, y - n*s*0.8 - c*s*0.8);
  ctx.closePath();
  if(glow){ ctx.shadowColor = col; ctx.shadowBlur = glow; }
  ctx.fillStyle = col; ctx.fill(); ctx.shadowBlur = 0;
}
function drawMap(){
  const me = cars[0], F = mapFocus(), run = stage === 'run';
  ctx.save(); ctx.scale(PX, PX);
  ctx.fillStyle = 'rgba(7,4,15,.95)'; ctx.fillRect(0, 0, VW, VH);

  // ---- the local map
  const P = { x:22, y:34, w:300, h:300 };
  const R = MAP_RADII[MAP_ZOOM], k = (P.w/2)/R, lw = 1/k;
  const xa = F.x - R*1.1, xb = F.x + R*1.1, ya = F.y - R*1.1, yb = F.y + R*1.1;
  ctx.save();
  ctx.beginPath(); ctx.rect(P.x, P.y, P.w, P.h); ctx.clip();
  ctx.fillStyle = MAP_COL.GROUND; ctx.fillRect(P.x, P.y, P.w, P.h);
  ctx.translate(P.x + P.w/2, P.y + P.h/2); ctx.scale(k, k); ctx.translate(-F.x, -F.y);
  const legs = !race && !(street && !run);           // a survival road to draw
  let ra = 0, rb = 0;
  if(legs){
    const q = roadProject(F.x, F.y);
    ra = q.s - R*2.2; rb = q.s + R*2.2;
    const Rl = roadLane(ROAD_HW, ra, rb), Ll = roadLane(-ROAD_HW, ra, rb);
    ctx.beginPath(); ctx.moveTo(Rl.xs[0], Rl.ys[0]);
    for(let i=1;i<Rl.xs.length;i++) ctx.lineTo(Rl.xs[i], Rl.ys[i]);
    for(let i=Ll.xs.length-1;i>=0;i--) ctx.lineTo(Ll.xs[i], Ll.ys[i]);
    ctx.closePath(); ctx.fillStyle = MAP_COL.STREET; ctx.fill();
    // the outskirts' little streets, then the lots, flat
    if(run){
      ctx.fillStyle = MAP_COL.STREET;
      outChunks(ra, rb, c => { for(const q of c.roads){ ctx.beginPath(); ctx.moveTo(q[0].x, q[0].y);
        for(let i=1;i<4;i++) ctx.lineTo(q[i].x, q[i].y); ctx.closePath(); ctx.fill(); } });
    }
    ctx.fillStyle = MAP_COL.BLOCK;
    for(const b of survivalBuildings(ra, rb, mapBld)){
      ctx.beginPath(); ctx.moveTo(b.q[0].x, b.q[0].y);
      for(let i=1;i<4;i++) ctx.lineTo(b.q[i].x, b.q[i].y);
      ctx.closePath(); ctx.fill();
    }
  } else if(street){
    ctx.fillStyle = MAP_COL.STREET; ctx.fillRect(-ROAD_HW, ya, 2*ROAD_HW, yb - ya);
  }
  // the city: its floor, then the blocks on it - the gaps are the streets
  const cityOn = street || cityLimitY < Infinity;
  const L = cityLimitY, cy1 = Math.min(yb, L);
  if(cityOn && cy1 > ya){
    ctx.fillStyle = MAP_COL.STREET; ctx.fillRect(-CITY_W, ya, 2*CITY_W, cy1 - ya);
    ctx.fillStyle = MAP_COL.BLOCK; ctx.strokeStyle = MAP_COL.BLOCK_EDGE; ctx.lineWidth = lw;
    for(const c of cityChunks(ya, cy1)) for(const b of c.blocks){
      if(b.x1 < xa || b.x0 > xb) continue;
      ctx.fillRect(b.x0, b.y0, b.x1 - b.x0, b.y1 - b.y0);
      if(k > 0.08) ctx.strokeRect(b.x0, b.y0, b.x1 - b.x0, b.y1 - b.y0);
    }
  }
  // barriers and walls, thin and bright
  ctx.strokeStyle = MAP_COL.WALL; ctx.lineWidth = 1.2*lw; ctx.globalAlpha = 0.75;
  ctx.beginPath();
  if(legs) for(const side of [-1, 1]){
    const b = run ? Math.min(rb, ROAD.gateS) : rb;
    if(b > ra){ const ln = roadLane(side*ROAD_HW, ra, b);
      ctx.moveTo(ln.xs[0], ln.ys[0]); for(let i=1;i<ln.xs.length;i++) ctx.lineTo(ln.xs[i], ln.ys[i]); }
  }
  if(cityOn && cy1 > ya) for(const side of [-1, 1]){
    ctx.moveTo(side*CITY_W, ya); ctx.lineTo(side*CITY_W, cy1);
    for(const sp of barrierSpans(side, ya, cy1)){ ctx.moveTo(side*ROAD_HW, sp[0]); ctx.lineTo(side*ROAD_HW, sp[1]); }
  }
  if(cityOn && L < Infinity && L > ya && L < yb){
    ctx.moveTo(-CITY_W, L); ctx.lineTo(-ROAD_HW, L); ctx.moveTo(ROAD_HW, L); ctx.lineTo(CITY_W, L);
    if(street){ ctx.moveTo(-ROAD_HW, L + CITY_BACK); ctx.lineTo(ROAD_HW, L + CITY_BACK); }
  }
  ctx.stroke(); ctx.globalAlpha = 1;
  // pickups, hunters, your car, you
  ctx.fillStyle = MAP_COL.PAD;
  for(const pd of pads) if(pd.item) ctx.fillRect(pd.x - 1.5*lw, pd.y - 1.5*lw, 3*lw, 3*lw);
  if(MAP_SHOW_ENEMIES) for(const c of cars) if(!c.isPlayer && !c.dead) mapPip(c.x, c.y, c.angle, 3.2, k, MAP_COL.HUNTER, 0);
  if(onFoot && !me.dead){
    ctx.save(); ctx.translate(me.x, me.y); ctx.rotate(me.angle);
    ctx.strokeStyle = MAP_COL.CAR; ctx.lineWidth = 1.2*lw; ctx.strokeRect(-5*lw, -3*lw, 10*lw, 6*lw);
    ctx.restore();
  }
  mapPip(F.x, F.y, onFoot ? walker.a : me.angle, 5, k, MAP_COL.YOU, 8);
  ctx.restore();
  // the frame, a north mark and the scale
  ctx.strokeStyle = MAP_COL.WALL; ctx.globalAlpha = 0.6; ctx.lineWidth = 1;
  ctx.strokeRect(P.x + 0.5, P.y + 0.5, P.w - 1, P.h - 1); ctx.globalAlpha = 1;
  ctx.font = '8px monospace'; ctx.textBaseline = 'top'; ctx.textAlign = 'center';
  ctx.fillStyle = MAP_COL.WALL; ctx.fillText('N', P.x + P.w/2, P.y + 4);
  const m100 = Math.round(R/RUN.UNITS_PER_M/50)*50 || 50;     // a round number of metres
  const barW = m100*RUN.UNITS_PER_M*k;
  ctx.fillStyle = NEON.DIM; ctx.fillRect(P.x + 8, P.y + P.h - 10, barW, 1);
  ctx.textAlign = 'left'; ctx.fillText(m100+' m', P.x + 10 + barW, P.y + P.h - 14);

  // ---- heading
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.font = 'bold 16px monospace'; ctx.fillStyle = NEON.MAGENTA;
  ctx.shadowColor = NEON.CYAN; ctx.shadowBlur = 8; ctx.fillText('MAP', P.x, 26); ctx.shadowBlur = 0;

  // ---- the route (the run only)
  const Q = { x:344, y:34, w:274, h:222 };
  if(run && street){ if(MAP_CITY_OVERVIEW) drawCityOverview(Q, F, R); }
  else if(run){
    const Rr = RUN.CORNER_R, top = ROAD.gateY - 2*CITY_CH;
    const bx0 = -Rr - RUN.LEG1 - 400, bx1 = CITY_W + 400, by0 = top - 300, by1 = ROAD_HW + 400;
    const kk = Math.min(Q.w/(bx1 - bx0), Q.h/(by1 - by0));
    const ox = Q.x + (Q.w - (bx1 - bx0)*kk)/2 - bx0*kk, oy = Q.y + (Q.h - (by1 - by0)*kk)/2 - by0*kk;
    const X = x => ox + x*kk, Y = y => oy + y*kk;
    ctx.fillStyle = MAP_COL.GROUND; ctx.fillRect(Q.x, Q.y, Q.w, Q.h);
    ctx.strokeStyle = MAP_COL.WALL; ctx.globalAlpha = 0.35; ctx.strokeRect(Q.x + 0.5, Q.y + 0.5, Q.w - 1, Q.h - 1); ctx.globalAlpha = 1;
    // the city, a block of floor at the top
    ctx.fillStyle = MAP_COL.BLOCK; ctx.fillRect(X(-CITY_W), Y(top), (2*CITY_W)*kk, (ROAD.gateY - top)*kk);
    const line = (a, b, col, w) => {
      const ln = roadLane(0, a, b);
      ctx.beginPath(); ctx.moveTo(X(ln.xs[0]), Y(ln.ys[0]));
      for(let i=1;i<ln.xs.length;i++) ctx.lineTo(X(ln.xs[i]), Y(ln.ys[i]));
      ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.stroke();
    };
    const sNow = street ? ROAD.gateS : clamp(roadProject(me.x, me.y).s, 0, ROAD.gateS);
    line(0, ROAD.gateS, MAP_COL.STREET, 4);
    if(sNow > 0) line(0, sNow, MAP_COL.YOU, 2);
    // the checkpoint at the bend: hollow until you've earned it
    const bp = roadPoint(ROAD.bendS0, 0);
    ctx.strokeStyle = MAP_COL.WALL; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(X(bp.x), Y(bp.y), 4, 0, Math.PI*2);
    if(checkpoint){ ctx.fillStyle = MAP_COL.WALL; ctx.fill(); } else ctx.stroke();
    // you
    const yx = street ? F.x : roadPoint(sNow, 0).x, yy = street ? F.y : roadPoint(sNow, 0).y;
    ctx.fillStyle = MAP_COL.YOU; ctx.shadowColor = MAP_COL.YOU; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(X(yx), Y(yy), 3.2, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
    // labels
    ctx.font = '8px monospace'; ctx.fillStyle = NEON.DIM; ctx.textBaseline = 'top';
    const s0 = roadPoint(0, 0); ctx.textAlign = 'left'; ctx.fillText('START', X(s0.x), Y(s0.y) + 6);
    ctx.textAlign = 'right'; ctx.fillText('CHECKPOINT', X(bp.x) - 6, Y(bp.y) + 6);
    ctx.textAlign = 'center'; ctx.fillStyle = NEON.INK; ctx.fillText('THE CITY', X(0), Y(top) + 6);
  }

  // ---- what to know, under the route
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  let ty = run && !(street && !MAP_CITY_OVERVIEW) ? Q.y + Q.h + 12 : Q.y;
  const say = (t, col, big) => { ctx.font = (big ? 'bold 12px' : '8px')+' monospace'; ctx.fillStyle = col; ctx.fillText(t, Q.x, ty); ty += big ? 16 : 12; };
  if(run && !street){
    const s = roadProject(me.x, me.y).s, leg = s < ROAD.bendS0 ? 1 : 2;
    say('LEG '+leg, NEON.CYAN, true);
    const to = leg === 1 ? ROAD.bendS0 : ROAD.gateS;
    say(((to - s)/RUN.UNITS_PER_M/1000).toFixed(2)+' km to '+(leg === 1 ? 'the checkpoint' : 'the city'), NEON.INK);
  } else if(street){
    say(run ? 'THE CITY' : 'STREET', NEON.CYAN, true);
    if(onFoot) say('your car: '+Math.round(Math.hypot(me.x - walker.x, me.y - walker.y)/RUN.UNITS_PER_M)+' m', NEON.INK);
  }
  const hunters = cars.length - 1;
  say(!enemiesOn ? 'enemies off (N)' : MAP_SHOW_ENEMIES ? hunters+' hunters on the road' : '', MAP_COL.HUNTER);
  ty = P.y + P.h - 12;
  say('M / ESC  close     -  =  zoom', NEON.DIM);
  ctx.restore();
}

// the right panel once you're in the city: the city round you, zoomed out, with
// the left panel's reach marked on it - where the pack is, which way is clear
function drawCityOverview(Q, F, R){
  const me = cars[0], RO = MAP_OVERVIEW_R, k = Math.min(Q.w, Q.h)/2/RO, lw = 1/k;
  ctx.save();
  ctx.beginPath(); ctx.rect(Q.x, Q.y, Q.w, Q.h); ctx.clip();
  ctx.fillStyle = MAP_COL.GROUND; ctx.fillRect(Q.x, Q.y, Q.w, Q.h);
  ctx.translate(Q.x + Q.w/2, Q.y + Q.h/2); ctx.scale(k, k); ctx.translate(-F.x, -F.y);
  const ya = F.y - RO*1.4, yb = Math.min(F.y + RO*1.4, cityLimitY);
  // leg 2's road running off the bottom, then the city's floor and blocks
  ctx.fillStyle = MAP_COL.STREET;
  ctx.fillRect(-ROAD_HW, ya, 2*ROAD_HW, F.y + RO*1.4 - ya);
  if(yb > ya){
    ctx.fillRect(-CITY_W, ya, 2*CITY_W, yb - ya);
    ctx.fillStyle = MAP_COL.BLOCK;
    for(const c of cityChunks(ya, yb)) for(const b of c.blocks) ctx.fillRect(b.x0, b.y0, b.x1 - b.x0, b.y1 - b.y0);
    ctx.strokeStyle = MAP_COL.WALL; ctx.globalAlpha = 0.7; ctx.lineWidth = 1.2*lw;
    ctx.beginPath();
    for(const side of [-1, 1]){ ctx.moveTo(side*CITY_W, ya); ctx.lineTo(side*CITY_W, yb); }
    if(cityLimitY < F.y + RO*1.4){ ctx.moveTo(-CITY_W, cityLimitY); ctx.lineTo(CITY_W, cityLimitY); }
    ctx.stroke(); ctx.globalAlpha = 1;
  }
  // what the left panel shows
  ctx.strokeStyle = NEON.INK; ctx.globalAlpha = 0.55; ctx.lineWidth = lw;
  ctx.strokeRect(F.x - R, F.y - R, 2*R, 2*R); ctx.globalAlpha = 1;
  if(MAP_SHOW_ENEMIES){
    ctx.fillStyle = MAP_COL.HUNTER;
    for(const c of cars) if(!c.isPlayer && !c.dead){ ctx.beginPath(); ctx.arc(c.x, c.y, 2.4*lw, 0, Math.PI*2); ctx.fill(); }
  }
  if(onFoot && !me.dead){ ctx.fillStyle = MAP_COL.CAR; ctx.fillRect(me.x - 2*lw, me.y - 2*lw, 4*lw, 4*lw); }
  mapPip(F.x, F.y, onFoot ? walker.a : me.angle, 4.5, k, MAP_COL.YOU, 8);
  ctx.restore();
  ctx.strokeStyle = MAP_COL.WALL; ctx.globalAlpha = 0.35; ctx.strokeRect(Q.x + 0.5, Q.y + 0.5, Q.w - 1, Q.h - 1); ctx.globalAlpha = 1;
  ctx.font = '8px monospace'; ctx.textBaseline = 'top'; ctx.textAlign = 'left'; ctx.fillStyle = NEON.DIM;
  ctx.fillText('THE CITY, ZOOMED OUT', Q.x + 6, Q.y + 5);
}

// ---------------------------------------------------------------- the intro comic
// COMIC.PAGES (config.js) as comic pages: a 2x2 grid of 3:2 panels, revealed one
// at a time in reading order, each with its caption typed into a yellow box.
const comicImgs = COMIC.PAGES.map(pg => pg.map(p => {
  const r = { ok:false, bad:false, img:null };
  if(typeof Image !== 'undefined' && p.img){
    r.img = new Image();
    r.img.onload = () => { r.ok = true; };
    r.img.onerror = () => { r.bad = true; };
    r.img.src = p.img;
  } else r.bad = true;
  return r;
}));
const comic = { pages:[], page:0, shown:0, t:0, typed:0 };
const hintEl = (typeof document !== 'undefined' && document.getElementById) ? document.getElementById('hint') : null;
// the controls line under the canvas follows whichever device OPTIONS picked
const HINT_MOUSE = 'WASD drive · ARROWS or mouse aim/fire · SPACE boost · Q mine · SHIFT drift · P / ESC pause · M map · O sound · I dev mode';
const HINT_PAD   = 'L-STICK drive · R-STICK aim · R1 gun · R2 missile · SQUARE mine · L2 drift · L1 boost · OPTIONS pause · M map · O sound';
function syncHint(){ if(hintEl) hintEl.textContent = (inputMode === 'pad') ? HINT_PAD : HINT_MOUSE; }
syncHint();
// pages with at least one image that has loaded (or is still loading)
function comicPages(){
  const out = [];
  COMIC.PAGES.forEach((pg, i) => { if(comicImgs[i].some(r => !r.bad)) out.push(i); });
  return out;
}
function startComic(){
  stage = 'run';
  comic.pages = COMIC.ENABLED ? comicPages() : [];
  if(!comic.pages.length){ startMatch(1); return; }
  comic.page = 0; comic.shown = 1; comic.t = 0; comic.typed = 0;
  state = 'comic';
}
function comicEnd(){ startMatch(1); }
function comicPanel(){ return COMIC.PAGES[comic.pages[comic.page]][comic.shown - 1]; }
function comicTick(dt){
  comic.t += dt;
  if(comic.t > COMIC.PANEL_FADE) comic.typed += COMIC.TYPE_SPEED*dt;
}
function comicAdvance(){
  const cap = comicPanel().caption || '';
  // first press finishes the panel (fade + typing), the next one moves on
  if(comic.t < COMIC.PANEL_FADE || comic.typed < cap.length){ comic.t = COMIC.PANEL_FADE; comic.typed = cap.length; return; }
  const n = COMIC.PAGES[comic.pages[comic.page]].length;
  if(comic.shown < n){ comic.shown++; comic.t = 0; comic.typed = 0; return; }
  if(comic.page < comic.pages.length - 1){ comic.page++; comic.shown = 1; comic.t = 0; comic.typed = 0; return; }
  comicEnd();
}
// where panel i (0..3) of a 2x2 page sits, in VW x VH units
function comicRect(i){
  const G = 8, top = 12, bottom = 26;
  const h = (VH - top - bottom - G)/2, w = h*1.5;
  const x0 = (VW - (2*w + G))/2;
  return { x: x0 + (i % 2)*(w + G), y: top + ((i/2)|0)*(h + G), w, h };
}
// break a caption into lines that fit `maxW` at the current font
function comicWrap(text, maxW){
  const words = text.split(' '), lines = [];
  let line = '';
  for(const w of words){
    const t = line ? line + ' ' + w : w;
    if(ctx.measureText(t).width > maxW && line){ lines.push(line); line = w; } else line = t;
  }
  if(line) lines.push(line);
  return lines;
}
function drawComic(){
  ctx.fillStyle = NEON.BG; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.save(); ctx.scale(PX, PX);
  const pi = comic.pages[comic.page], pg = COMIC.PAGES[pi];
  for(let i=0; i<comic.shown; i++){
    const R = comicRect(i), p = pg[i], im = comicImgs[pi][i];
    const cur = i === comic.shown - 1;
    const a = cur ? clamp(comic.t/COMIC.PANEL_FADE, 0, 1) : 1;
    const k = 0.96 + 0.04*(1 - Math.pow(1 - a, 3));      // settles in, very slightly
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(R.x + R.w/2, R.y + R.h/2); ctx.scale(k, k); ctx.translate(-R.w/2, -R.h/2);
    // the panel, its art cropped to fill (cover), and an ink border
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, R.w, R.h); ctx.clip();
    if(im.ok){
      const iw = im.img.naturalWidth, ih = im.img.naturalHeight;
      const sc = Math.max(R.w/iw, R.h/ih), dw = iw*sc, dh = ih*sc;
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(im.img, (R.w - dw)/2, (R.h - dh)/2, dw, dh);
      ctx.imageSmoothingEnabled = false;
    } else {
      // not drawn yet: an empty frame that says what goes here
      ctx.fillStyle = '#120c20'; ctx.fillRect(0, 0, R.w, R.h);
      ctx.strokeStyle = NEON.DIM; ctx.setLineDash([4, 4]); ctx.strokeRect(6, 6, R.w - 12, R.h - 12); ctx.setLineDash([]);
      ctx.font = '8px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = NEON.DIM;
      ctx.fillText(im.bad ? (p.img || '').split('/').pop() + '  (not drawn yet)' : 'loading...', R.w/2, R.h/2);
    }
    ctx.restore();
    ctx.lineWidth = 2.5; ctx.strokeStyle = COMIC.GUTTER_INK; ctx.strokeRect(0, 0, R.w, R.h);
    ctx.lineWidth = 0.6; ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.strokeRect(1.6, 1.6, R.w - 3.2, R.h - 3.2);
    // the caption, typed in once the panel is in
    const cap = p.caption || '';
    const nTyped = cur ? Math.floor(comic.typed) : cap.length;
    if(cap && (nTyped > 0 || !cur)){
      const fs = p.size || 8, lh = fs*1.25;               // per-panel text size (config: size)
      ctx.font = 'bold '+fs+'px "Trebuchet MS", Verdana, sans-serif';
      const lines = comicWrap(cap.toUpperCase(), R.w*0.62);
      const bw = Math.max(...lines.map(l => ctx.measureText(l).width)) + 10, bh = lines.length*lh + 6;
      // at: t/b (top/bottom) + l/c/r (left/centre/right)
      const at = p.at || 'tl', bottom = at[0] === 'b', hz = at[1] || 'l';
      const bx = hz === 'r' ? R.w - bw - 6 : hz === 'c' ? (R.w - bw)/2 : 6;
      const by = bottom ? R.h - bh - 6 : 6;
      ctx.fillStyle = COMIC.CAPTION_BG; ctx.fillRect(bx, by, bw, bh);
      ctx.lineWidth = 1; ctx.strokeStyle = COMIC.CAPTION_INK; ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, bh - 1);
      ctx.fillStyle = COMIC.CAPTION_INK; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      let left = nTyped;
      lines.forEach((l, li) => {
        if(left <= 0) return;
        ctx.fillText(l.slice(0, left), bx + 5, by + 4 + li*lh);
        left -= l.length + 1;
      });
    }
    ctx.restore();
  }
  // what ENTER does next
  const n = pg.length, last = comic.page === comic.pages.length - 1;
  const done = comic.t >= COMIC.PANEL_FADE && comic.typed >= (comicPanel().caption || '').length;
  ctx.font = '9px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = NEON.CYAN; ctx.globalAlpha = done ? 0.6 + 0.4*Math.sin(menuT*4 + comic.t*4)**2 : 0.35;
  ctx.fillText(comic.shown < n ? 'ENTER  next' : last ? 'ENTER  start' : 'ENTER  turn the page', VW/2, VH - 9);
  ctx.globalAlpha = 1; ctx.fillStyle = NEON.DIM; ctx.textAlign = 'right';
  ctx.fillText('ESC  skip', VW - 10, VH - 9);
  ctx.textAlign = 'left'; ctx.fillText('PAGE ' + (comic.page + 1) + ' / ' + comic.pages.length, 10, VH - 9);
  ctx.restore();
}

// ---------------------------------------------------------------- the menu
// After the-party's front door (src/hud.js drawMenu): the name, the items under
// it, the chosen one lit and the rest taken most of the way to black. Choosing
// "pops" the line - swell, overshoot, settle - and the screen holds a beat so the
// punch is seen before it changes. Cyberpunk colours instead of the blood.
const MENU = [['START GAME', 'play'], ['GARAGE', 'garage'], ['OPTIONS', 'options']];
const MENU_POP = { amount:0.10, ms:0.26, hold:0.30 };
// MENU_TOP came down from 0.62 when OPTIONS made it a three-item menu: the
// 'driving:' line under the list had landed on top of the ENTER prompt at 0.9.
// The logo above reaches ~VH*0.52, so this is the lowest the list can start.
const MENU_TOP = 0.56, MENU_SIZE = 22, MENU_PITCH = 1.6, MENU_DIM = 0.55;
let menuIdx = 0, menuPop = null, menuT = 0;
// the logo: loaded once; if the file isn't there the menu just uses the text
const logoImg = (typeof Image !== 'undefined') ? new Image() : { complete:false, naturalWidth:0 };
if(LOGO_IMAGE && typeof Image !== 'undefined') logoImg.src = LOGO_IMAGE;
const easeOutBack = p => { const c = 1.70158; return 1 + (c+1)*Math.pow(p-1,3) + c*Math.pow(p-1,2); };
function popScale(pop){
  if(pop == null) return 1;
  const p = Math.min(1, pop/MENU_POP.ms);
  return 1 + MENU_POP.amount*(1 - easeOutBack(p));
}
function menuChoose(){ if(menuPop == null){ menuPop = 0; Snd.boot(); Snd.pickup(); } }
function menuTick(dt){
  menuPop += dt;
  if(menuPop >= MENU_POP.hold){
    menuPop = null;
    if(MENU[menuIdx][1] === 'play') startComic();
    else if(MENU[menuIdx][1] === 'garage') openGarage();
    else if(MENU[menuIdx][1] === 'options') openOptions();
  }
}

// ---------------------------------------------------------------- OPTIONS
// One setting that changes how the game is played - which device drives it - and
// a way back. Kept deliberately small; the dev keys stay on the keyboard and off
// this screen. The choice is remembered (localStorage), so it is made once.
const OPT_ROWS = ['input', 'back'];
let optIdx = 0, optMsg = '', optMsgT = 0;
function openOptions(){ state = 'options'; optIdx = 0; optMsg = ''; optMsgT = 0; }
function optSay(m){ optMsg = m; optMsgT = 1.8; }
function optMove(d){ optIdx = (optIdx + OPT_ROWS.length + d) % OPT_ROWS.length; }
// INPUT at the top, then the controller legend, then BACK under it (the way out
// belongs below the reference block, not above it)
function optRowY(i){ return OPT_ROWS[i] === 'back' ? 40 + 222 : 40 + 62 + i*28; }
function optChoose(){
  const row = OPT_ROWS[optIdx];
  if(row === 'back'){ state = 'title'; Snd.pickup(); return; }
  if(row === 'input'){
    // switching TO the pad needs one plugged in; switching back to the mouse is
    // always allowed, so an unplugged pad can never trap you on this screen
    if(inputMode === 'mouse' && !padConnected()){ optSay('no controller connected'); Snd.hit(); return; }
    setInputMode(inputMode === 'mouse' ? 'pad' : 'mouse');

}

function drawOptions(){
  ctx.fillStyle = NEON.BG; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.save(); ctx.scale(PX, PX);
  ctx.globalAlpha = 0.06; ctx.fillStyle = NEON.CYAN;
  for(let y = (menuT*12)%4; y < VH; y += 4) ctx.fillRect(0, y, VW, 1);
  ctx.globalAlpha = 1;
  const X = 110, Y = 40, W = 420, H = 280;
  ctx.fillStyle = 'rgba(18,10,32,.92)'; ctx.fillRect(X, Y, W, H);
  ctx.strokeStyle = 'rgba(34,240,255,.45)'; ctx.lineWidth = 1; ctx.strokeRect(X+0.5, Y+0.5, W-1, H-1);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';

    ctx.fillStyle = !pad ? NEON.CYAN : NEON.DIM; ctx.fillText('MOUSE', X + 120, y + 2);
    ctx.fillStyle = pad ? NEON.CYAN : NEON.DIM;  ctx.fillText('CONTROLLER', X + 180, y + 2);

  PAD_LEGEND.forEach(([btn, what], i) => {

  ctx.textAlign = 'center'; ctx.font = '9px monospace';
  if(optMsgT > 0){ ctx.fillStyle = '#e0b73c'; ctx.fillText(optMsg, X + W/2, Y + H - 28); }
  ctx.fillStyle = NEON.DIM;

  ctx.restore();
}
function lerpHex(a, b, t){
  const pa = parseInt(a.slice(1),16), pb = parseInt(b.slice(1),16);

}
function drawMenu(){
  ctx.fillStyle = NEON.BG; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.save(); ctx.scale(PX,PX);
  // a slow scanline drift, the only thing moving on the screen
  ctx.globalAlpha = 0.06; ctx.fillStyle = NEON.CYAN;
  for(let y = (menuT*12)%4; y < VH; y += 4) ctx.fillRect(0, y, VW, 1);
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  // the name: the logo image if there is one (LOGO_IMAGE), else neon text
  if(logoImg.complete && logoImg.naturalWidth > 0){
    // LOGO_CROP picks the part of the image with the wordmark in it (fractions)
    const [cx, cy, cw, ch] = LOGO_CROP;
    const sx = cx*logoImg.naturalWidth, sy = cy*logoImg.naturalHeight;
    const sw = cw*logoImg.naturalWidth, sh = ch*logoImg.naturalHeight;
    // with LOGO_WITH_TITLE the image is a symbol and the game writes the name
    // under it (so a rename is one line in config.js, not a new image)
    const boxH = LOGO_WITH_TITLE ? VH*0.30 : VH*0.42, ly = LOGO_WITH_TITLE ? VH*0.23 : VH*0.31;

// ---------------------------------------------------------------- the Scrap Saints' garage (the store)
// Opens at the checkpoint (runEvents) over the frozen road: spend bounty cash on
// upgrade levels (config 3b) or a repair, then CONTINUE into leg 2. Prices and
// bounties are SAINTS in config.js. Leaving writes cash + levels into the
// checkpoint, so a wreck on leg 2 restarts with what you bought.
const STORE_ROWS = ['armor', 'health', 'boost', 'gun', 'missile', 'repair', 'continue'];
const STORE_LABEL = { armor:'ARMOR', health:'HEALTH', boost:'BOOST', gun:'MACHINE GUN', missile:'MISSILE', repair:'REPAIR', continue:'CONTINUE' };
let storeIdx = 0, storeMsg = '', storeMsgT = 0;
// every purchase is two steps: ENTER/click selects a row and asks, a second
// ENTER/click on that same row confirms. ESC or moving away cancels.
let storeArmed = false, storeOpenAt = 0;
const STORE_LOCK = 0.5;          // s after opening when input is ignored (held fire/ENTER)
function storeLocked(){ return performance.now() - storeOpenAt < STORE_LOCK*1000; }

function openStore(){
  if(state !== 'play') return;
  state = 'store'; storeIdx = 0; storeMsg = ''; storeMsgT = 0; storeArmed = false; storeOpenAt = performance.now();
  Snd.engineOff();
}
function closeStore(){
  // the checkpoint keeps what you leave with
  if(checkpoint){ checkpoint.cash = cash; checkpoint.up = Object.assign({}, runUp); }
  state = 'play';
  Snd.pickup();
}
function upgradePrice(k){ return SAINTS.PRICE0 + SAINTS.PRICE_STEP*upgradeLv(k); }
function repairPrice(){ return SAINTS.REPAIR0 + SAINTS.REPAIR_PER_LV*upgradeTotal(); }
function storeSay(m){ storeMsg = m; storeMsgT = 1.6; }
function storeMove(d){
  storeIdx = (storeIdx + STORE_ROWS.length + d) % STORE_ROWS.length; storeArmed = false;
}
// what the confirm line asks for the selected row
function storeQuestion(){
  const row = STORE_ROWS[storeIdx];
  if(row === 'continue') return 'LEAVE THE GARAGE?  you cannot come back';
  if(row === 'repair')   return 'REPAIR FOR $' + repairPrice() + '?';
  return 'BUY ' + STORE_LABEL[row] + ' LV ' + (upgradeLv(row) + 1) + ' FOR $' + upgradePrice(row) + '?';
}
// why the selected row can't be bought right now (null = it can)
function storeBlocked(){
  const row = STORE_ROWS[storeIdx], me = cars[0];
  if(row === 'continue') return null;
  if(row === 'repair'){
    if(me.hp >= me.maxHp) return 'the hull is already whole';
    return cash < repairPrice() ? 'not enough cash' : null;
  }
  if(upgradeLv(row) >= UPGRADE_MAX) return STORE_LABEL[row] + ' is maxed out';
  return cash < upgradePrice(row) ? 'not enough cash' : null;
}
function storeChoose(){
  const no = storeBlocked();
  if(no){ storeArmed = false; storeSay(no); if(no === 'not enough cash') Snd.hit(); return; }
  if(!storeArmed){ storeArmed = true; return; }
  storeArmed = false;
  storeBuy();
}
// a click picks the row under the pointer; a second click on it confirms
function storeClick(){
  if(storeLocked()) return;
  const vx = mouseSX / PX, vy = mouseSY / PX;
  const i = STORE_ROWS.findIndex((r, k) => { const y = storeRowY(k); return vx >= 118 && vx <= 522 && vy >= y - 4 && vy < y + 18; });
  if(i < 0) return;                                    // clicks off the rows do nothing
  if(i !== storeIdx){ storeIdx = i; storeArmed = false; }
  storeChoose();
}
// pitch 26, not 28: the BOOST row made seven, and at 28 CONTINUE collided with the
// confirm line at the foot of the panel
function storeRowY(i){ return 40 + 62 + i*26 + (STORE_ROWS[i] === 'continue' ? 8 : 0); }
function storeBuy(){
  const row = STORE_ROWS[storeIdx], me = cars[0];
  if(row === 'continue'){ closeStore(); return; }
  if(row === 'repair'){
    if(me.hp >= me.maxHp){ storeSay('the hull is already whole'); return; }
    const p = repairPrice();
    if(cash < p){ storeSay('not enough cash'); Snd.hit(); return; }
    cash -= p; me.hp = me.maxHp; Snd.pickup(); storeSay('repaired');
    return;
  }
  if(upgradeLv(row) >= UPGRADE_MAX){ storeSay(STORE_LABEL[row] + ' is maxed out'); return; }
  const p = upgradePrice(row);
  if(cash < p){ storeSay('not enough cash'); Snd.hit(); return; }
  cash -= p; runUp[row] = upgradeLv(row) + 1;
  // more hull now, and the new 40 comes filled in
  if(row === 'health'){ me.maxHp = playerMaxHp(); me.hp = Math.min(me.maxHp, me.hp + HEALTH_PER_LEVEL); }
  Snd.pickup(); storeSay(STORE_LABEL[row] + ' level ' + upgradeLv(row));
}
const fmt1 = v => (Math.round(v*10)/10).toString();
// "now -> next" for a row (or just "now" when it is maxed)
function storeEffect(row){
  const me = cars[0], lv = upgradeLv(row), max = lv >= UPGRADE_MAX;
  const nx = max ? lv : lv + 1;
  const pair = (a, b, unit) => max ? a + unit + '  (max)' : a + ' -> ' + b + unit;
  if(row === 'armor')   return pair(Math.round(armorCutAt(lv)*100) + '%', Math.round(armorCutAt(nx)*100) + '%', ' less damage');
  if(row === 'health')  return pair(me.maxHp, me.maxHp + HEALTH_PER_LEVEL, ' hull');
  if(row === 'boost')   return pair(fmt1(boostCoolAt(lv)) + 's', fmt1(boostCoolAt(nx)) + 's', ' recharge');
  if(row === 'gun')     return pair(fmt1(gunDmgAt(lv)), fmt1(gunDmgAt(nx)), ' per bullet');
  if(row === 'missile') return pair(Math.round(missileDmgAt(lv)), Math.round(missileDmgAt(nx)), ' per hit');
  if(row === 'repair')  return 'hull ' + Math.ceil(me.hp) + '/' + me.maxHp + (me.hp < me.maxHp ? ' -> full' : '');
  return street ? 'into the city' : 'on to leg 2';
}
function drawStore(){
  const me = cars[0];
  ctx.save(); ctx.scale(PX, PX);
  ctx.fillStyle = 'rgba(7,4,15,.78)'; ctx.fillRect(0, 0, VW, VH);
  const X = 110, Y = 40, W = 420, H = 300;      // H 280 -> 300 for the seventh row
  ctx.fillStyle = 'rgba(18,10,32,.92)'; ctx.fillRect(X, Y, W, H);
  ctx.strokeStyle = 'rgba(34,240,255,.45)'; ctx.lineWidth = 1; ctx.strokeRect(X + 0.5, Y + 0.5, W - 1, H - 1);
  // the name
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  ctx.font = 'bold 20px monospace';
  ctx.shadowColor = NEON.MAGENTA; ctx.shadowBlur = 10 + 3*Math.sin(menuT*3);
  ctx.fillStyle = NEON.MAGENTA; ctx.fillText('THE SCRAP SAINTS', X + 16, Y + 30);
  ctx.shadowBlur = 0;
  ctx.font = '9px monospace'; ctx.fillStyle = NEON.DIM; ctx.fillText(street ? 'GARAGE  ·  CITY GATE' : 'GARAGE  ·  CHECKPOINT', X + 18, Y + 44);
  ctx.textAlign = 'right'; ctx.font = 'bold 16px monospace'; ctx.fillStyle = '#e0b73c';
  ctx.fillText('$' + cash, X + W - 16, Y + 30);
  ctx.font = '8px monospace'; ctx.fillStyle = NEON.DIM; ctx.fillText(convoyKills + ' kills paid out', X + W - 16, Y + 44);

  STORE_ROWS.forEach((row, i) => {
    const y = storeRowY(i), on = i === storeIdx;
    const isUp = row !== 'repair' && row !== 'continue';
    const lv = isUp ? upgradeLv(row) : 0, maxed = isUp && lv >= UPGRADE_MAX;
    const price = row === 'repair' ? repairPrice() : isUp ? upgradePrice(row) : 0;
    const full = row === 'repair' && me.hp >= me.maxHp;
    const can = row === 'continue' || (!maxed && !full && cash >= price);
    if(on){
      const arm = storeArmed;
      ctx.fillStyle = arm ? 'rgba(224,183,60,.18)' : 'rgba(34,240,255,.12)'; ctx.fillRect(X + 8, y - 4, W - 16, 22);
      if(arm){ ctx.strokeStyle = 'rgba(224,183,60,' + (0.6 + 0.4*Math.sin(menuT*8)) + ')'; ctx.strokeRect(X + 8.5, y - 3.5, W - 17, 21); }
    }
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    if(on){ ctx.fillStyle = NEON.CYAN; ctx.font = 'bold 11px monospace'; ctx.fillText('>', X + 12, y + 2); }
    ctx.font = 'bold 11px monospace';
    ctx.fillStyle = row === 'continue' ? NEON.MAGENTA : can ? NEON.INK : NEON.DIM;
    ctx.fillText(STORE_LABEL[row], X + 24, y + 2);
    // level pips
    if(isUp) for(let k=0;k<UPGRADE_MAX;k++){
      ctx.fillStyle = k < lv ? NEON.CYAN : 'rgba(90,74,122,.6)';
      ctx.fillRect(X + 120 + k*9, y + 4, 7, 8);
    }
    ctx.font = '9px monospace'; ctx.fillStyle = can || row === 'continue' ? '#c8bedc' : NEON.DIM;
    ctx.fillText(storeEffect(row), X + (isUp ? 180 : 120), y + 3);
    if(row !== 'continue'){
      ctx.textAlign = 'right'; ctx.font = 'bold 11px monospace';
      ctx.fillStyle = maxed ? NEON.DIM : full ? NEON.DIM : cash >= price ? '#e0b73c' : '#a0525a';
      ctx.fillText(maxed ? 'MAX' : full ? '-' : '$' + price, X + W - 16, y + 2);
    }
  });
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  if(storeArmed){
    ctx.font = 'bold 10px monospace'; ctx.fillStyle = '#e0b73c';
    ctx.fillText(storeQuestion() + '   ENTER  yes   ESC  no', X + W/2, Y + H - 22);
  } else if(storeMsgT > 0){
    ctx.globalAlpha = Math.min(1, storeMsgT*2); ctx.font = '9px monospace'; ctx.fillStyle = NEON.CYAN;
    ctx.fillText(storeMsg, X + W/2, Y + H - 22); ctx.globalAlpha = 1;
  }
  ctx.font = '8px monospace'; ctx.fillStyle = NEON.DIM;
  ctx.fillText('UP / DOWN  choose      ENTER  select, ENTER again  confirm      ESC  cancel', X + W/2, Y + H - 8);
  ctx.restore();
}

// ---------------------------------------------------------------- the garage
// Menu -> GARAGE: pick the car you drive (GARAGE_CARS in config.js). The chosen car
// spins in both of the game's visions: the driving camera (left) and first person
// through the ASCII filter (right), using the same rasterCar the bakes use.
// LEFT/RIGHT browse, ENTER takes it (remembered), ESC leaves it as it was.
let garageIdx = 0, garageYaw = 0;
const garageBgImg = (GARAGE_BG && typeof Image !== 'undefined') ? new Image() : null;
if(garageBgImg) garageBgImg.src = GARAGE_BG;
const GARAGE_TOP = { x:14,  y:62, w:240, h:214 };   // virtual px: the driving-camera panel
const GARAGE_FP  = { x:266, y:62, w:360, h:214 };   // ...and the first-person ASCII panel
let garageCv = null, garageRc = null, garageAscCv = null, garageAscMask = null, garageAscKey = '';

function openGarage(){ garageIdx = garageSel; state = 'garage'; }
function garageStep(d){
  const n = GARAGE_CARS.length;
  for(let k=0;k<n;k++){ garageIdx = (garageIdx + d + n) % n; if(GARAGE_MESH[garageIdx] >= 0) break; }
}
function garagePick(){
  garageSel = garageIdx;
  try { localStorage.setItem('scrapheap.car', String(garageSel)); } catch(e){}
  Snd.boot(); Snd.pickup();
  state = 'title';
}

// one frame of a mesh at device resolution: same call the sprite bakes make
function garageRaster(mesh, yaw, col, fw, fh, ax, ay, ky, kz, vsc){
  if(!garageCv) garageCv = document.createElement('canvas');
  garageCv.width = fw*SS; garageCv.height = fh*SS;
  const g = garageCv.getContext('2d');
  g.putImageData(rasterCar(g, mesh, yaw, col, false, fw, fh, ax, ay, ky, kz, vsc), 0, 0);
  return garageCv;
}

// The in-game asciiBlit is tied to the raycaster's frame and the screen; this is the
// same per-cell arithmetic (luminance -> glyph, lights win their cell, tint lift,
// solid background) over a small offscreen frame, so the garage shows what the
// street will. Kept separate so the game's ASCII path is untouched.
function garageAscii(src, W, H, GW, GH, solid){
  const cols = Math.floor(W/ASC_CW), rows = Math.floor(H/ASC_CH), n = ASC_RAMP.length - 1;
  const key = GW+'x'+GH;
  if(garageAscKey !== key){
    const at = document.createElement('canvas'); at.width = GW*ASC_RAMP.length; at.height = GH;
    const a = at.getContext('2d', { willReadFrequently:true });
    a.fillStyle = '#fff'; a.textAlign = 'center'; a.textBaseline = 'middle';
    a.font = 'bold ' + GH + 'px ui-monospace,"DejaVu Sans Mono",monospace';
    for(let i=1;i<ASC_RAMP.length;i++) a.fillText(ASC_RAMP[i], (i+0.5)*GW, GH*0.55);
    const ad = a.getImageData(0, 0, at.width, GH).data;
    garageAscMask = new Uint8Array(ASC_RAMP.length*GW*GH);
    for(let gi=0; gi<ASC_RAMP.length; gi++) for(let y=0;y<GH;y++) for(let x=0;x<GW;x++)
      garageAscMask[(gi*GH + y)*GW + x] = ad[(y*at.width + gi*GW + x)*4 + 3];
    garageAscKey = key;
  }
  if(!garageAscCv) garageAscCv = document.createElement('canvas');
  garageAscCv.width = cols*GW; garageAscCv.height = rows*GH;
  const og = garageAscCv.getContext('2d');
  const img = og.createImageData(cols*GW, rows*GH), out = new Uint32Array(img.data.buffer), OW = cols*GW;
  const inv = 1/(ASC_CW*ASC_CH), span = 1/(ASC_HI - ASC_LO), keep = 1 - ASC_SOLID, mask = garageAscMask;
  for(let cy=0; cy<rows; cy++) for(let cx=0; cx<cols; cx++){
    let r=0, g=0, b=0, nl=0, lr=0, lg=0, lb=0;
    for(let yy=0; yy<ASC_CH; yy++){
      let o = ((cy*ASC_CH + yy)*W + cx*ASC_CW)*4;
      for(let xx=0; xx<ASC_CW; xx++){
        const pr=src[o], pg=src[o+1], pb=src[o+2]; r+=pr; g+=pg; b+=pb;
        if(pr > ASC_LIGHT_R && pr - pb > ASC_LIGHT_WARM){ nl++; lr+=pr; lg+=pg; lb+=pb; }
        o+=4;
      }
    }
    r*=inv; g*=inv; b*=inv;
    let t = (0.299*r + 0.587*g + 0.114*b - ASC_LO)*span; t = t<0 ? 0 : t>1 ? 1 : t;
    let gi = Math.round(Math.pow(t, ASC_GAMMA)*n);
    if(nl){ r=lr/nl; g=lg/nl; b=lb/nl; gi = Math.max(gi, Math.min(n, Math.round(3 + LIGHTS_MIX*2) + nl)); }
    const m = Math.max(r, g, b, 1), lift = Math.min(ASC_LIFT, 235/m);
    const tr = Math.min(255, Math.round(r*lift)), tg = Math.min(255, Math.round(g*lift)), tb = Math.min(255, Math.round(b*lift));
    const br = solid ? Math.round(ASC_BG[0]*keep + tr*ASC_SOLID) : 0;
    const bgc = solid ? Math.round(ASC_BG[1]*keep + tg*ASC_SOLID) : 0;
    const bb = solid ? Math.round(ASC_BG[2]*keep + tb*ASC_SOLID) : 0;
    const bgPix = 0xff000000 | (bb<<16) | (bgc<<8) | br;
    let p = cy*GH*OW + cx*GW, k = gi*GW*GH;
    for(let yy=0; yy<GH; yy++, p+=OW) for(let xx=0; xx<GW; xx++, k++){
      const cov = gi ? mask[k] : 0;
      if(!cov){ out[p+xx] = bgPix; continue; }
      const R = Math.min(255, br + ((tr*cov + 127)/255|0)), G = Math.min(255, bgc + ((tg*cov + 127)/255|0)), B = Math.min(255, bb + ((tb*cov + 127)/255|0));
      out[p+xx] = 0xff000000 | (B<<16) | (G<<8) | R;
    }
  }
  og.putImageData(img, 0, 0);
  return garageAscCv;
}

// the workshop, drawn in code until GARAGE_BG names a painted one
function drawGarageBg(){
  if(garageBgImg && garageBgImg.complete && garageBgImg.naturalWidth > 0){
    const iw = garageBgImg.naturalWidth, ih = garageBgImg.naturalHeight, k = Math.max(VW/iw, VH/ih);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(garageBgImg, (VW - iw*k)/2, (VH - ih*k)/2, iw*k, ih*k);
    ctx.imageSmoothingEnabled = false;
    return;
  }
  const floorY = VH*0.70;
  // back wall: corrugated sheet metal under a violet dusk
  const wall = ctx.createLinearGradient(0, 0, 0, floorY);
  wall.addColorStop(0, '#0d0818'); wall.addColorStop(1, '#1d1430');
  ctx.fillStyle = wall; ctx.fillRect(0, 0, VW, floorY);
  for(let x=0; x<VW; x+=6){ ctx.fillStyle = (x/6)%2 ? 'rgba(255,255,255,.025)' : 'rgba(0,0,0,.18)'; ctx.fillRect(x, 0, 3, floorY); }
  // tool wall: a pegboard strip and shelves either side
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0, floorY - 6, VW, 6);
  // floor: concrete with a vanishing grid
  const fl = ctx.createLinearGradient(0, floorY, 0, VH);
  fl.addColorStop(0, '#191320'); fl.addColorStop(1, '#2b2233');
  ctx.fillStyle = fl; ctx.fillRect(0, floorY, VW, VH - floorY);
  ctx.strokeStyle = 'rgba(34,240,255,.07)'; ctx.lineWidth = 1;
  for(let i=-12; i<=12; i++){ ctx.beginPath(); ctx.moveTo(VW/2 + i*14, floorY); ctx.lineTo(VW/2 + i*90, VH); ctx.stroke(); }
  for(let k=1; k<7; k++){ const y = floorY + (VH - floorY)*Math.pow(k/7, 1.8); ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(VW, y); ctx.stroke(); }
  // hazard stripe along the wall foot
  for(let x=-10; x<VW; x+=16){
    ctx.fillStyle = '#e0b73c'; ctx.beginPath();
    ctx.moveTo(x, floorY); ctx.lineTo(x+8, floorY); ctx.lineTo(x+12, floorY+4); ctx.lineTo(x+4, floorY+4); ctx.fill();
  }
  // two hanging lamps throwing cones onto the panels, flickering a little
  const flick = 0.9 + 0.1*Math.sin(menuT*23)*Math.sin(menuT*7);
  for(const lx of [GARAGE_TOP.x + GARAGE_TOP.w/2, GARAGE_FP.x + GARAGE_FP.w/2]){
    const cone = ctx.createRadialGradient(lx, 30, 4, lx, 30, 260);
    cone.addColorStop(0, 'rgba(255,214,150,' + (0.16*flick) + ')'); cone.addColorStop(1, 'rgba(255,214,150,0)');
    ctx.fillStyle = cone; ctx.fillRect(lx - 260, 0, 520, VH);
    ctx.fillStyle = '#3a2f44'; ctx.fillRect(lx - 1, 0, 2, 24);
    ctx.fillStyle = '#ffd696'; ctx.fillRect(lx - 9, 24, 18, 4);
  }
}

function drawGarage(){
  ctx.fillStyle = NEON.BG; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.save(); ctx.scale(PX, PX);
  drawGarageBg();
  // the neon sign
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.font = 'bold 30px monospace';
  ctx.shadowColor = NEON.MAGENTA; ctx.shadowBlur = 14 + 4*Math.sin(menuT*3);
  ctx.fillStyle = NEON.MAGENTA; ctx.fillText('GARAGE', VW/2, 44);
  ctx.shadowBlur = 0;

  const ok = GARAGE_MESH[garageIdx] >= 0;
  const mesh = MODELS[ok ? GARAGE_MESH[garageIdx] : 0], col = PALETTE[0].body;

  // panels: dark glass with a thin cyan frame
  for(const R of [GARAGE_TOP, GARAGE_FP]){
    ctx.fillStyle = 'rgba(7,4,15,.62)'; ctx.fillRect(R.x, R.y, R.w, R.h);
    ctx.strokeStyle = 'rgba(34,240,255,.35)'; ctx.lineWidth = 1; ctx.strokeRect(R.x + 0.5, R.y + 0.5, R.w - 1, R.h - 1);
  }
  ctx.font = '8px monospace'; ctx.textAlign = 'left'; ctx.fillStyle = NEON.DIM;
  ctx.fillText('DRIVING CAMERA', GARAGE_TOP.x + 6, GARAGE_TOP.y + 11);
  ctx.fillText('FIRST PERSON  ·  ASCII', GARAGE_FP.x + 6, GARAGE_FP.y + 11);

  // left: the driving camera's view, big. Units -> virtual px so the car fills ~65% of the panel
  {
    const R = GARAGE_TOP, vs = R.w*0.62/32;
    const fw = Math.round(R.w*PX), fh = Math.round((R.h - 16)*PX), ax = fw/2, ay = fh*0.6;
    // its shadow, as the bake draws it
    ctx.save(); ctx.translate(R.x + R.w/2 + 3*vs, R.y + 16 + (R.h - 16)*0.6 + 2*vs); ctx.scale(vs, vs*KY);
    ctx.fillStyle = 'rgba(8,5,12,.45)'; ctx.beginPath(); ctx.ellipse(0, 0, 16, 9, garageYaw, 0, Math.PI*2); ctx.fill(); ctx.restore();
    const img = garageRaster(mesh, garageYaw, col, fw, fh, ax, ay, KY, KZ, vs*PX);

    ctx.imageSmoothingEnabled = false;
  }
  // right: the street camera's view into a small frame, then the ASCII filter.
  // Cells match the game's: ASC_CW x ASC_CH frame px, drawn 2x (the raycaster runs at half res).
  {
    const R = GARAGE_FP, ih = R.h - 16;

    const sky = g.createLinearGradient(0, 0, 0, hor); sky.addColorStop(0, '#120c1c'); sky.addColorStop(1, '#2a1a2e');
    g.fillStyle = sky; g.fillRect(0, 0, W, hor);
    const gr = g.createLinearGradient(0, hor, 0, H); gr.addColorStop(0, '#1c1620'); gr.addColorStop(1, '#3a3040');
    g.fillStyle = gr; g.fillRect(0, hor, W, H - hor);
    const vs = W*0.6/32, fw = W, fh = H, ax = W/2, ay = Math.min(H - 3, hor + (H - hor)*0.62);

// ---------------------------------------------------------------- frame
let acc=0, last=performance.now(), fpsVal=60, fpsAcc=0, fpsN=0;

function step(dt){
  matchTime+=dt;
  const me=cars[0];
  updateFoes(dt);                 // foe.js - one place, so every stage gets it

  if(race){
    // a race: no forced scroll, no spawner. The camera just chases the player and
    // laps/positions are handled in updateCar/updatePlaces (state->over on finish).
    for(const c of cars) updateCar(c,dt);
    carVsCar(dt);
    updateShots(dt);
    updatePads(dt);
    updateFx(dt);
    updatePlaces();
    gunnerHit=Math.max(0,gunnerHit-dt);
    gunnerKill=Math.max(0,gunnerKill-dt);
    const tx = me.x + clamp(me.vx*0.28,-70,70), ty = me.y + clamp(me.vy*0.28,-70,70);
    cam.x = lerp(cam.x, tx, 1-Math.pow(0.0025, dt));
    cam.y = lerp(cam.y, ty, 1-Math.pow(0.0025, dt));
    if(!me.dead){ const rpm=clamp(Math.abs(me.speed||0)/232,0,1); Snd.engine(rpm, clamp((me.slide||0)/120,0,1)); }
    else Snd.engineOff();
    return;
  }

  if(street){
    // free drive: no forced scroll, and no spawner unless STREET_ENEMIES. The
    // camera chases the car the way the race camera does, along the road.
    if(stage==='run') cityStep(dt);
    else if(STREET_ENEMIES){ distance = Math.max(distance, -me.y); updateSpawner(dt); }
    for(const c of cars) updateCar(c,dt);
    carVsCar(dt);
    updateShots(dt);
    updatePads(dt);
    updateFx(dt);
    if(onFoot) updateWalker(dt); else walkMsgT = Math.max(0, walkMsgT - dt);
  walkViewMsgT = Math.max(0, walkViewMsgT - dt);
    gunnerHit=Math.max(0,gunnerHit-dt);
    gunnerKill=Math.max(0,gunnerKill-dt);
    distance = Math.max(distance, -me.y);
    // the run keeps its look-ahead up the road (STREET does it with VCY_BIAS)
    const ty = me.y + clamp(me.vy*0.25, -60, 60) - (stage==='run' ? lookAhead : 0);
    // the car can be anywhere in the city now, so the camera follows it all the way
    const tx = me.x + clamp(me.vx*0.25, -60, 60);
    if(stage==='run'){
      // STREET's lagging follow, kept as its own point (F), plus the handover
      // from the scroll: wherever the scroll left the camera, that offset eases
      // out over CITY_CAM_EASE. F starts at the lag it would already have at
      // this speed, so the camera's speed carries straight on - no lurch at the
      // start, no stall at the end.
      const f = 1-Math.pow(0.004, dt);
      if(cityCamT === 0){
        const lag = (1 - f)/f*dt;                      // steady lag, seconds of travel
        cityCamF.x = tx - me.vx*lag; cityCamF.y = ty - me.vy*lag;
        cityCamOff.x = cam.x - cityCamF.x; cityCamOff.y = cam.y - cityCamF.y;
      }
      cityCamT = Math.min(CITY_CAM_EASE, cityCamT + dt);
      cityCamF.x = lerp(cityCamF.x, tx, f); cityCamF.y = lerp(cityCamF.y, ty, f);
      const u = cityCamT/CITY_CAM_EASE, k = 1 - u*u*(3 - 2*u);
      cam.x = cityCamF.x + cityCamOff.x*k; cam.y = cityCamF.y + cityCamOff.y*k;
    } else {
      cam.y = lerp(cam.y, ty, 1-Math.pow(0.004, dt));
      cam.x = lerp(cam.x, tx, 1-Math.pow(0.004, dt));
    }
    if(stage==='run') camS = roadProject(cam.x, cam.y).s;   // keeps the leg-2 scenery placed
    if(me.dead){
      Snd.engineOff();
      if(me.respawn < 1.4 && state==='play'){ walkReset(); winner=null; state='over'; }
    } else if(onFoot) Snd.engineOff();
    else Snd.engine(clamp(Math.abs(me.speed||0)/232, 0, 1), clamp((me.slide||0)/120,0,1));
    return;
  }

  // ---- survival stages (convoy / ascent) ----
  // forced scroll: the camera drags the whole field forward at an escalating pace,
  // and distance survived is the score. This runs even while the player is dying.
  camV = Math.min(CAM_VMAX, camV + CAM_RAMP*dt);
  // forced scroll along the forward axis: +x (convoy) or -y (ascent)
  // along the road. In the bend the scroll is measured in YOUR lane, so the
  // outside line isn't (R+HW)/R times as far to drive as the inside one.
  const lane = laneScale(roadFrame(camS).k, roadProject(me.x, me.y).lat);
  camS += camV*dt/lane;
  distance += camV*dt/lane;
  placeCam();
  if(ROAD.kind === 'run') runEvents();
  bannerT = Math.max(0, bannerT - dt);
  updateSpawner(dt);

  for(const c of cars) updateCar(c,dt);
  carVsCar(dt);
  updateShots(dt);
  updatePads(dt);
  updateFx(dt);
  gunnerHit=Math.max(0,gunnerHit-dt);
  gunnerKill=Math.max(0,gunnerKill-dt);

  // Keep the player inside the frame, softly (no damage - the "keep moving"
  // pressure comes from the enemies). This used to stop the car dead on the line
  // and rewrite its velocity, which felt like hitting a wall. Now the line is a
  // spring: you overshoot it a little and it eases you back.
  //
  // It being a FORCE rather than a teleport is the other half of the point. The
  // old version wrote position and velocity straight into the car after the
  // physics had run, which is what left a spun car with a velocity it had never
  // earned and no way to drive out of - see the stuck-car notes. The car's
  // velocity is its own now; the frame only ever pushes on it.
  if(!me.dead){
    // measured along the road, in the car's own lane
    const q = roadProject(me.x, me.y), ls = laneScale(q.k, q.lat);
    const rel  = (q.s - camS)*ls;                               // + = ahead of the camera
    const relV = me.vx*q.tx + me.vy*q.ty - camV;                // how fast that gap is opening
    // the front line gives while the boost burns, and eases back afterwards
    const front = FRONT_MAX + BOOST_ROOM*(me.boostEase||0);
    const over = rel >  front ? rel - front
               : rel < -BACK_EDGE ? rel + BACK_EDGE : 0;        // signed, 0 while inside
    if(over){
      // The spring stiffens the further out you are. A flat rate loses its tug of
      // war with the speed controller - hold S and you would slide the whole way
      // to the backstop and sit on it, which is the hard stop all over again. This
      // way the first few units are soft and it firms up until nothing gets there.
      const t = Math.abs(over)/WALL_MAX;
      let a = -WALL_K*(1 + 6*t*t)*over - WALL_C*relV;
      // front only: never push the car below camV - WALL_REEL. See WALL_REEL.
      if(over > 0) a = Math.max(a, Math.min(0, (-WALL_REEL - relV)/dt));
      me.vx += a*dt*q.tx; me.vy += a*dt*q.ty;
      if(Math.abs(over) > WALL_MAX){            // backstop, far past where the spring turns you
        const cap = over > 0 ? front + WALL_MAX : -BACK_EDGE - WALL_MAX;
        const bp = roadPoint(camS + cap/ls, q.lat); me.x = bp.x; me.y = bp.y;
      }
    }
  }

  // camera tracks the player on the LATERAL axis, gently, staying in the corridor
  const latFollow = clamp(roadProject(me.x, me.y).lat*0.5, -ROAD_HW*0.4, ROAD_HW*0.4);
  camLat = lerp(camLat, latFollow, 1-Math.pow(0.02, dt));
  placeCam();

  // the player run ends a beat after the wreck, so the explosion gets to play
  if(me.dead){
    Snd.engineOff();
    if(me.respawn < 1.4 && state==='play'){
      bestDist = Math.max(bestDist, Math.floor(distance));
      winner=null; state='over';
    }
  } else {
    const rpm = clamp(Math.abs(me.speed||0)/232, 0, 1);
    Snd.engine(rpm, clamp((me.slide||0)/120,0,1));
  }
}

function inView(x,y,m){
  m=m||40;
  // vertical uses VIEW_HH (covers the biased look-ahead); horizontal uses the
  // foreshortened lateral extent, exactly as convoy did
  if(street && stage !== 'run') return Math.abs(x-cam.x) < VHW+m && Math.abs(y-cam.y) < VIEW_HH+m;
  return Math.abs(x-cam.x) < VHW+m && Math.abs(y-cam.y)*KY < VHH+m;
}

// the gunner's aim, drawn into the driving pane so P1 can see where P2 is looking
function drawAimLine(){
  const me=cars[0];
  if(me.dead) return;
  const a=aimAngle(me);
  const p0=toScreen(me.x,me.y,7);
  const reach=numPlayers===1?170:150;
  const p1=toScreen(me.x+Math.cos(a)*reach, me.y+Math.sin(a)*reach, 7);
  ctx.save();
  ctx.globalAlpha=0.35; ctx.strokeStyle='#f0503c'; ctx.lineWidth=Math.max(1,S);
  ctx.setLineDash([4*S,4*S]);
  ctx.beginPath(); ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y); ctx.stroke();
  // a reticle at the tip so the solo player (who is also the gunner) can read the aim
  ctx.setLineDash([]); ctx.globalAlpha=0.8;
  const g=5*S;
  ctx.beginPath();
  ctx.moveTo(p1.x-g,p1.y); ctx.lineTo(p1.x+g,p1.y);
  ctx.moveTo(p1.x,p1.y-g); ctx.lineTo(p1.x,p1.y+g);
  ctx.stroke();
  ctx.restore();
}

function render(){
  ctx.fillStyle='#0b0810'; ctx.fillRect(0,0,W,H);
  if(onFoot){ drawWalkView(); drawWalkHUD(); return; }   // STREET, out of the car

  // ---- player 2: first person, out of the gun ring (only in a two-player run)
  if(numPlayers===2) drawGunnerView();

  // ---- player 1: the axonometric view, clipped to its own pane
  const p=PANE_P1;
  ctx.save();
  ctx.beginPath(); ctx.rect(p.x*PX, p.y*PX, p.w*PX, p.h*PX); ctx.clip();
  const sx = cam.shake ? rnd(-cam.shake,cam.shake)*S : 0;
  const sy = cam.shake ? rnd(-cam.shake,cam.shake)*KY*S : 0;
  ctx.translate(Math.round(sx), Math.round(sy));

  drawTrack();
  const run = stage === 'run', cityView = street && !run;
  const bl = cityView ? cityBuildings2D(bld2DScratch) : buildings2D();
  const cb = run ? cityBuildings2D(cityBldScratch) : null;   // the run sees both
  if(!cityView) drawBuildings2D(bl, false);      // behind the road: before the far walls
  // Walls. LOOP: the two closed barrier rings, split far/near so cars sit between.
  // CONVOY: top/bottom shoulders, far behind the cars, near in front. ASCENT: the
  // left/right barriers run the depth of the road, so both draw behind the cars.
  let raceW=null;
  if(race){
    raceW = { o:buildWallPaths(track.outer), i:buildWallPaths(track.inner) };
    strokeWall(raceW.o.far, TRK.WALL, '#6a5570');
    strokeWall(raceW.i.far, TRK.WALL, '#6a5570');
  } else if(cityView){
    strokeWall(convoyWallPath(-ROAD_HW), TRK.WALL, '#6a5570'); drawWallPosts(-ROAD_HW);
    strokeWall(convoyWallPath( ROAD_HW), TRK.WALL, '#6a5570'); drawWallPosts( ROAD_HW);
    strokeWall(convoyWallPath(-CITY_W), 22, '#2e2536'); strokeWall(convoyWallPath(CITY_W), 22, '#2e2536');
  } else { drawRoadWalls(false); if(run) drawCityWalls(false); }

  for(const pd of pads) if(inView(pd.x,pd.y)) drawPad(pd);
  for(const m of mines) if(inView(m.x,m.y)) drawMine(m);

  // painter's algorithm on world Y (depth), visible entities only
  const drawables=[];
  for(const c of cars) if(!c.dead && (c.isPlayer || inView(c.x,c.y))) drawables.push({y:c.y, f:()=>drawCar(c)});
  for(const e of foes) if(!e.dead && inView(e.x,e.y)) drawables.push({y:e.y, f:()=>drawFoe2D(e)});
  for(const s of shots) if(inView(s.x,s.y)) drawables.push({y:s.y, f:()=>drawShot(s)});
  // in the city a building is just another thing in the depth sort, keyed on
  // its street face: what is south of your car stands in front of it
  if(cityView && showBuildings) for(const b of bl) drawables.push({y:b.y1, f:()=>drawBuilding2D(b, cityGhost(b))});
  if(cb && showBuildings) for(const b of cb) drawables.push({y:b.y1, f:()=>drawBuilding2D(b, cityGhost(b))});
  drawables.sort((a,b)=>a.y-b.y);
  for(const d of drawables) d.f();

  if(race){ strokeWall(raceW.o.near, TRK.WALL, '#6a5570'); strokeWall(raceW.i.near, TRK.WALL, '#6a5570'); }
  else if(!cityView){ drawRoadWalls(true); if(run) drawCityWalls(true); }
  if(!cityView) drawBuildings2D(bl, true);       // in front of the road: after everything, see-through
  drawAimLine();                       // the gun exists in every stage now
  drawFx();
  ctx.restore();

  drawHUD();
}

function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000; last=now;
  if(dt>0.25) dt=0.25;
  padTick(dt);                       // before anything looks at the input
  fpsAcc+=dt; fpsN++;
  if(fpsAcc>0.5){ fpsVal=Math.round(fpsN/fpsAcc); fpsAcc=0; fpsN=0; }

  // the soundtrack runs with the run itself: up on the menus, playing from the
  // moment a match starts and on through the wreck screen
  Snd.music(state==='play' || state==='over' || state==='store');

  if(state==='title' && gunLabBoot()){ labSpawnFoes(); return; }
  if(state==='title'){ menuT += dt; if(menuPop!=null) menuTick(dt); drawMenu(); return; }
  if(state==='options'){ menuT += dt; optMsgT = Math.max(0, optMsgT - dt); drawOptions(); return; }
  // the controls line under the canvas is noise over a comic page
  if(hintEl) hintEl.style.display = (state==='comic' || state==='garage') ? 'none' : '';
  if(state==='comic'){ comicTick(dt); drawComic(); return; }
  if(state==='garage'){ menuT += dt; garageYaw += dt*0.9; drawGarage(); return; }
  if(state==='setup'){ drawSetup(); return; }

  if(state==='play' && !paused && !(mapOpen && MAP_PAUSES)){
    acc+=dt;
    let guard=0;
    while(acc>=DT && guard++<5 && state==='play'){ step(DT); acc-=DT; }   // stop the moment a screen (store, wreck) takes over
  }
  render();
  if(mapOpen && state==='play') drawMap();
  if(state==='over') drawOver();
  if(state==='store'){ menuT += dt; storeMsgT = Math.max(0, storeMsgT - dt); drawStore(); }
  if(saintsPay && state==='play'){ saintsPay.t -= dt; if(saintsPay.t <= 0) saintsPay = null; }
}
requestAnimationFrame(frame);
</script>
