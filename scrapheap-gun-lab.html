    }
  }
  const wroads = roads.map(r => {
    const m = mir(r);
    // gaps along a 'h' road are in u; mirror them with it
    const gaps = r.axis==='h' && side < 0 ? r.gaps.map(g => [-g[1], -g[0]]).reverse() : r.gaps;
    return { axis:r.axis, w:r.w, x0:m.x0, x1:m.x1, y0:r.y0, y1:r.y1, gaps, cross:!!r.cross };
  });
  return { k, side, Y0, Y1, roads:wroads, blocks, cores, bld, gaps, mask };
}

// south of this y there is no city (the run's leg 2); STREET's city is endless
let cityLimitY = Infinity;
const cityCache = new Map();
function cityChunk(k, side){
  const key = k*2 + (side > 0 ? 1 : 0);
  let c = cityCache.get(key);
  if(!c){
    c = makeCityChunk(k, side);
    cityCache.set(key, c);
    if(cityCache.size > 48){            // forget the far ones; they regenerate identically
      const kn = Math.floor(cam.y/CITY_CH);
      for(const [kk, v] of cityCache) if(Math.abs(v.k - kn) > 6) cityCache.delete(kk);
    }
  }
  return c;
}
// every chunk (both sides unless one is given) overlapping [y0, y1]
const cityScratch = [];
function cityChunks(y0, y1, side){
  cityScratch.length = 0;
  const kEnd = Math.min(Math.floor(y1/CITY_CH), Math.floor(cityLimitY/CITY_CH) - 1);
  for(let k = Math.floor(y0/CITY_CH); k <= kEnd; k++){
    if(side !== -1) cityScratch.push(cityChunk(k, 1));
    if(side !== 1)  cityScratch.push(cityChunk(k, -1));
  }
  return cityScratch;
}

// 0 wasteland, 1 road, 2 pavement, 3 building footprint
let cgLast = null;
function cityGround(x, y){
  const ax = x < 0 ? -x : x;
  if(ax < ROAD_HW) return 1;
  if(ax >= CITY_W || y >= cityLimitY) return 0;
  // the floor asks this per pixel, mostly of the same chunk: keep the last one
  let c = cgLast;
  if(!c || y < c.Y0 || y >= c.Y1 || (x < 0) !== (c.side < 0)) c = cgLast = cityChunk(Math.floor(y/CITY_CH), x < 0 ? -1 : 1);
  const i = ((ax - ROAD_HW)/CITY_CELL)|0, j = ((y - c.Y0)/CITY_CELL)|0;
  return c.mask[j*CITY_MCOLS + i];
}

// where the barrier stands on one side, within [ya, yb]: the complement of the gaps
function barrierSpans(side, ya, yb){
  const g = [];
  for(const c of cityChunks(ya, yb, side)) for(const q of c.gaps) if(q[1] > ya && q[0] < yb) g.push(q);
  g.sort((a, b) => a[0] - b[0]);
  const out = [];
  let y = ya;
  for(const q of g){ if(q[0] > y) out.push([y, q[0]]); y = Math.max(y, q[1]); }
  if(y < yb) out.push([y, yb]);
  return out;
}

// circle against an axis-aligned box, with an optional bounce. Returns the
// closing speed it absorbed (0 = no contact, >0 = contact).
function circleBox(e, x0, y0, x1, y1, r, bounce){
  const cx = clamp(e.x, x0, x1), cy = clamp(e.y, y0, y1);
  let nx = e.x - cx, ny = e.y - cy, d = Math.hypot(nx, ny);
  if(d >= r) return 0;
  if(d < 1e-6){
    // centre inside: out through the nearest face
    const l = e.x - x0, rr = x1 - e.x, t = e.y - y0, b = y1 - e.y, m = Math.min(l, rr, t, b);
    nx = m===l ? -1 : m===rr ? 1 : 0; ny = m===t ? -1 : m===b ? 1 : 0;
    if(nx && ny) ny = 0;
    e.x = nx<0 ? x0 - r : nx>0 ? x1 + r : e.x;
    e.y = ny<0 ? y0 - r : ny>0 ? y1 + r : e.y;
  } else {
    nx /= d; ny /= d;
    e.x = cx + nx*r; e.y = cy + ny*r;
  }
  if(!bounce) return 1e-3;
  const vn = e.vx*nx + e.vy*ny;
  if(vn >= 0) return 1e-3;
  e.vx -= nx*vn*1.35; e.vy -= ny*vn*1.35; e.vx *= 0.9; e.vy *= 0.9;
  return Math.abs(vn);
}

// cars in STREET: the barrier (but not its gaps), the building cores, the city wall
function cityCollide(e, r, bounce){
  e.contact = false;
  let hit = 0;
  const T = WALL_T/2;
  for(const side of [-1, 1]){
    const bx = side*ROAD_HW;
    if(Math.abs(e.x - bx) > r + T + 2) continue;
    for(const s of barrierSpans(side, e.y - r - 4, e.y + r + 4)){
      // the barrier as a thin box, so its ends round off like a capsule's
      const h = circleBox(e, bx - T, s[0], bx + T, s[1], r, bounce);
      if(h){ hit = Math.max(hit, h); e.contact = true; }
    }
  }
  for(const c of cityChunks(e.y - r, e.y + r, e.x < 0 ? -1 : 1)){
    for(const b of c.cores){
      if(e.x + r < b.x0 || e.x - r > b.x1 || e.y + r < b.y0 || e.y - r > b.y1) continue;
      const h = circleBox(e, b.x0, b.y0, b.x1, b.y1, r, bounce);
      if(h){ hit = Math.max(hit, h); e.contact = true; }
    }
  }
  if(cityLimitY < Infinity){
    // the run's city: a wall along its south edge, and the highway shut behind you
    const L = cityLimitY;
    if(Math.abs(e.y - L) < r + T + 2) for(const sd of [-1, 1]){
      const h = circleBox(e, sd > 0 ? ROAD_HW : -CITY_W, L - T, sd > 0 ? CITY_W : -ROAD_HW, L + T, r, bounce);
      if(h){ hit = Math.max(hit, h); e.contact = true; }
    }
    if(Math.abs(e.y - (L + CITY_BACK)) < r + T + 2){
      const h = circleBox(e, -ROAD_HW, L + CITY_BACK - T, ROAD_HW, L + CITY_BACK + T, r, bounce);
      if(h){ hit = Math.max(hit, h); e.contact = true; }
    }
  }
  const lim = CITY_W - r;
  if(Math.abs(e.x) > lim){
    const s = e.x < 0 ? -1 : 1;
    e.x = s*lim; e.contact = true;
    if(bounce && e.vx*s > 0){ hit = Math.max(hit, Math.abs(e.vx)); e.vx *= -0.4; }
  }
  return hit;
}

// shots stop on buildings and the city wall; they fly over the barrier
function cityHitPoint(x, y){
  if(Math.abs(x) >= CITY_W) return true;
  return cityGround(x, y) === 3 ? true : null;
}

// ---- the driving pane
// The blocks are pavement, everything else in the strip is road; the centre
// lines are dashed on the wider streets and stop at every junction.
function drawCityGround(){
  const ya = cam.y - VIEW_HH - 160, yb = Math.min(cam.y + VIEW_HH + 160, cityLimitY);
  if(yb <= ya) return;
  const xa = cam.x - VHW - 60, xb = cam.x + VHW + 60;
  // the strip is road edge to edge, then the blocks go down on top of it
  ctx.fillStyle = groundTile;
  for(const side of [-1, 1]){
    const x0 = side > 0 ? ROAD_HW : -CITY_W, x1 = side > 0 ? CITY_W : -ROAD_HW;
    if(x1 < xa || x0 > xb) continue;
    ctx.fillRect(x0*S, ya*KY*S, (x1 - x0)*S, (yb - ya)*KY*S);
  }
  const kerb = Math.max(1, Math.round(2*S));
  for(const c of cityChunks(ya, yb)){
    for(const b of c.blocks){
      if(b.x1 < xa || b.x0 > xb || b.y1 < ya || b.y0 > yb) continue;
      ctx.fillStyle = KERB_COL;
      ctx.fillRect(b.x0*S, b.y0*KY*S, (b.x1-b.x0)*S, (b.y1-b.y0)*KY*S);
      ctx.fillStyle = PAVE_COL;
      ctx.fillRect(b.x0*S + kerb, b.y0*KY*S + kerb, (b.x1-b.x0)*S - 2*kerb, (b.y1-b.y0)*KY*S - 2*kerb);
    }
  }
  // offset 0: every dash run starts at a fixed world point (a road end or a
  // junction), so the dashes stay painted on. Whatever drew before may have left
  // a camera-dependent offset (the run's highway does) - that made them crawl.
  ctx.lineDashOffset = 0;
  ctx.setLineDash([16*S, 14*S]); ctx.lineWidth = 2*S; ctx.strokeStyle = 'rgba(221,211,198,.45)';
  for(const c of cityChunks(ya, yb)){
    for(const r of c.roads){
      if(r.w < 66 || r.x1 < xa || r.x0 > xb || r.y1 < ya || r.y0 > yb) continue;
      const vt = r.axis==='v', a0 = vt ? r.y0 : r.x0, a1 = vt ? r.y1 : r.x1;
      const m = vt ? (r.x0 + r.x1)/2 : (r.y0 + r.y1)/2;
      let a = a0;
      ctx.beginPath();
      const seg = (p, q) => { if(q - p < 8) return;
        if(vt){ ctx.moveTo(m*S, p*KY*S); ctx.lineTo(m*S, q*KY*S); }
        else  { ctx.moveTo(p*S, m*KY*S); ctx.lineTo(q*S, m*KY*S); } };
      for(const g of r.gaps){ seg(a, g[0]); a = Math.max(a, g[1]); }
      seg(a, a1);
      ctx.stroke();
    }
  }
  ctx.setLineDash([]);
}

// the plots the driving pane should draw: tall ones south of the view still
// reach up into it, so the window runs well past the bottom edge
function cityBuildings2D(out){
  out.length = 0;
  const ya = cam.y - VIEW_HH - 60, yb = cam.y + VIEW_HH + 520;
  const xa = cam.x - VHW - 40, xb = cam.x + VHW + 40;
  for(const c of cityChunks(ya, yb))
    for(const b of c.bld) if(b.x1 > xa && b.x0 < xb && b.y1 > ya && b.y0 < yb) out.push(b);
  return out;
}

// how see-through a building is drawn: solid, unless it stands in front of
// (south of) your car and its face covers it on screen
function cityGhost(b){
  const me = cars[0];
  if(!me || me.dead || b.y1 <= me.y) return 1;
  if(me.x < b.x0 - 16 || me.x > b.x1 + 16) return 1;
  const sy = me.y*KY, top = b.y0*KY - b.h - 12;
  return (sy > top && sy < b.y1*KY + 4) ? 0.32 : 1;
}

// ---- the raycaster: every plot near you, all four walls, inside the view cone
// VIEW_D is how far the walker sees the city (9 / 0 on foot step it through
// VIEW_STEPS). It used to be a fixed 1150, which is the wall you hit looking up
// or down the road. Past VIEW_LOD a plot only gets in if it stands at least
// VIEW_LOD_PX tall on screen: at 3000 out a 40-tall walk-up is under two
// pixels and the street in front would hide it anyway, so what is left out
// there is the skyline - the towers - which is the bit worth seeing.
function cityRings(camX, camY, bearing, out){
  const half = RC_FOV/2;
  for(const c of cityChunks(camY - VIEW_D, camY + VIEW_D)){
    for(const b of c.bld){
      const mx = (b.x0 + b.x1)/2, my = (b.y0 + b.y1)/2;
      const dx = mx - camX, dy = my - camY, d = Math.hypot(dx, dy);
      const rad = Math.hypot(b.x1 - b.x0, b.y1 - b.y0)/2;
      if(d - rad > VIEW_D) continue;
      if(d > VIEW_LOD && (b.h - EYE_Z)*RC_VD/d < VIEW_LOD_PX) continue;
      if(d > rad){
        let a = Math.atan2(dy, dx) - bearing;
        a = ((a + Math.PI) % (Math.PI*2) + Math.PI*2) % (Math.PI*2) - Math.PI;
        if(Math.abs(a) > half + Math.asin(Math.min(1, rad/d)) + 0.05) continue;
      }
      out.push(cityRing(b));
    }
  }
}
function cityRing(b){
  if(!b.ring){
    const w = b.x1 - b.x0, h = b.y1 - b.y0;
    // north, east, south, west - lit roughly from the south-east
    b.ring = { pts:b.q, h:b.h, col:b.col, open:false, bldg:b, len:[w, h, w, h], fs:[0.66, 0.86, 1.0, 0.74] };
  }
  return b.ring;
}

// ---------------------------------------------------------------- raycast view
// EYE_Z matters more than it looks. The tilt of a wall's top edge across the
// screen is (EYE_Z-BARRIER_H)/lateralGap, and that edge pivots about the centre
// of the view - which the eye reads as the camera rotating. At eye 27 the gap
// was 5, so the edge sat on the horizon and swung wildly when you closed in.
// The gun used to sit at 38 (up on a ring mount); he found that too elevated on
// the car, so it now sits lower at 26. To keep the barrier clearly below the
// horizon (and avoid that tilt) the FPS barrier came down with it, staying just
// above car height (~13) so the cheap per-column occlusion still holds. `[` `]`
// still tune EYE_Z live if you want it lower still, down toward the road.
const BARRIER_H = 16;              // still see over it into the corner, still taller than a car
const WALL_T = 9;                  // barrier thickness, for the visible top ribbon
const SHOT_SETTLE = 260;           // units over which the gunner's tracer eases down
const FENCE_H   = 96;
const FENCE_OUT = 210;             // how far outside the barrier the perimeter fence sits
// The perimeter fence is a continuous 96-tall wall at ROAD_HW+210 = 390 out, and
// the building tiers grew up on either side of it (near 212-238, far 440-540) -
// so it reads as a blank wall ruled between the street frontage and the skyline
// rather than as a horizon. Off while we look at the city without it; `H` puts
// it back. It is P2's view only - it was never drawn in the driving pane.
let showFence = false;

let rcCv=null, rcCtx=null, RC_W=0, RC_H=0, RC_VD=0, RC_HORIZON=0;
let RC_PANE=null;                   // the pane the raycaster is sized for (P2's, or PANE_FULL)
let rcStripe=null;
let rcSin=null, rcCos=null, rcInvCos=null, rcTan=null;   // per-column, constant
let rcZ=null, rcImg=null, rcPix=null, rcPix32=null;
// The front of the nearest LOW wall in each column - its depth, and the topmost
// screen row it covers. Low walls stay out of rcZ (see rcWalls), so this is what
// lets a knee-high kerb hide the BOTTOM of a billboard standing behind it.
let rcLowD=null, rcLowY=null, rcLowAny=false;
// Two switches for the walk view's cost (benchmarked 2026-11-05, see PROJECT.md):
//  RC_DIRECT  - walls and windows are written straight into rcPix, like the
//               floor, instead of one fillStyle+fillRect per strip (~4000 a
//               frame, each building and parsing a colour string). One
//               putImageData at the end of rcWalls instead of rcBackground's.
//  RC_OCCLUDE - whole buildings that can't show are dropped before any ray is
//               tested against them (rcOcclude). Most of the city is behind
//               the street in front of you.
// Both are pixel-identical to the old path; they only change the cost.
let RC_DIRECT = true, RC_OCCLUDE = true;
let rings=[];                       // wall rings: {pts, h, col, top, open}
let ringCX=null, ringCY=null;       // ring points in camera space, rebuilt each frame

function rcInit(pane){
  RC_PANE = pane || PANE_P2;
  RC_W = Math.round(RC_PANE.w/2);   // half-res offscreen, blitted 2x: chunky on purpose
  RC_H = Math.round(RC_PANE.h/2);
  rcCv = document.createElement('canvas');
  rcCv.width = RC_W; rcCv.height = RC_H;
  rcCtx = rcCv.getContext('2d', { alpha:false, willReadFrequently:true });   // ascii pass reads it back
  rcCtx.imageSmoothingEnabled = false;
  RC_HORIZON = Math.round(RC_H*0.44);   // more road, less empty sky
  rcZ = new Float32Array(RC_W);
  rcLowD = new Float32Array(RC_W); rcLowY = new Float32Array(RC_W);
  rcImg = rcCtx.createImageData(RC_W, RC_H);
  rcPix = rcImg.data;
  rcPix32 = new Uint32Array(rcPix.buffer);
  rcColumns();
}

// per-column angle tables: constant for a given FOV, so rebuilt only on change
function rcColumns(){
  RC_VD = (RC_W/2) / Math.tan(RC_FOV/2);
  rcSin = new Float32Array(RC_W); rcCos = new Float32Array(RC_W);
  rcInvCos = new Float32Array(RC_W); rcTan = new Float32Array(RC_W);
  for(let i=0;i<RC_W;i++){
    const a = Math.atan((i + 0.5 - RC_W/2) / RC_VD);
    rcSin[i]=Math.sin(a); rcCos[i]=Math.cos(a);
    rcInvCos[i]=1/Math.cos(a); rcTan[i]=Math.tan(a);
  }
}
function setFov(deg){ RC_FOV = clamp(deg,50,120) * Math.PI/180; rcColumns(); }

// The corridor walls are straight and infinite, so the raycaster's rings are
// rebuilt each frame as short open polylines spanning the road near the camera.
// `open:true` tells rcWalls not to wrap the last point back to the first (which,
// on a straight run, would lay a spurious segment down the whole wall).
const RING_SPAN = 1500;            // how far ahead/behind the camera the walls reach
const RING_STEP = 50;              // segment length, fine enough for legible banding
let ringCenter = 0;                // forward-axis centre the walls are built around

// `center` is the camera's FORWARD coordinate (camX in convoy, camY in ascent).
// Walls run along the road (varying x in convoy, y in ascent) at a fixed lateral.
function buildConvoyRings(center, camX, camY, bearing){
  ringCenter = center;
  if(street){ buildCityRings(center, camX, camY, bearing); return; }
  const c0 = center - RING_SPAN;
  const n = Math.ceil(2*RING_SPAN/RING_STEP);
  const line = (lat) => {
    const pts=[];
    for(let i=0;i<=n;i++){
      const along = c0 + i*RING_STEP;
      pts.push(roadPoint(along, lat));
    }
    return pts;
  };
  const flat = ROAD_HW + FENCE_OUT_C;
  // On foot the barrier is drawn knee-high (WALK_BARRIER_H), because you step
  // over it: at the gunner's 16 it stood above a person's eye and read as a wall.
  // Render only - the driving pane and the car's collision never read this. A
  // `low` ring does not hide billboards, so the parked car still shows over it.
  const bh = onFoot ? WALK_BARRIER_H : BARRIER_H;
  rings = [
    { pts:line(-ROAD_HW), h:bh, col:'#6a5570', top:'#a894b0', open:true, low:onFoot },
    { pts:line( ROAD_HW), h:bh, col:'#6a5570', top:'#a894b0', open:true, low:onFoot }
  ];
  if(showFence) rings.push(
    { pts:line(-flat),    h:FENCE_H,   col:'#2e2536', top:'#463a50', open:true },
    { pts:line( flat),    h:FENCE_H,   col:'#2e2536', top:'#463a50', open:true });
  if(showBuildings) buildingRings(survivalBuildingsRC(center, bldList), rings);
  let nn=0; for(const r of rings) nn += r.pts.length;
  if(!ringCX || ringCX.length < nn){ ringCX = new Float32Array(nn); ringCY = new Float32Array(nn); }
  let o=0; for(const r of rings){ r.off = o; o += r.pts.length; }
}
function buildRings(){ buildConvoyRings(0); }

// STREET: the barrier in pieces (it opens where the streets come in), the city
// wall at the edge of the strip, the city's plots near you, and the skyline
function buildCityRings(center, camX, camY, bearing){
  const bh = onFoot ? WALK_BARRIER_H : BARRIER_H;
  const span = Math.max(RING_SPAN, VIEW_D + 200), sky = Math.max(SKY_REACH, VIEW_D + 1500);
  rings = [];
  for(const side of [-1, 1]){
    for(const sp of barrierSpans(side, center - span, center + span)){
      const pts = [];
      for(let y = sp[0]; y < sp[1]; y += RING_STEP) pts.push({ x:side*ROAD_HW, y });
      pts.push({ x:side*ROAD_HW, y:sp[1] });
      if(pts.length < 2) continue;
      rings.push({ pts, h:bh, col:'#6a5570', top:'#a894b0', open:true, low:onFoot, u0:sp[0] });
    }
    const wall = [];
    const n = Math.ceil(2*span/RING_STEP);
    for(let i=0;i<=n;i++) wall.push({ x:side*CITY_W, y:center - span + i*RING_STEP });
    rings.push({ pts:wall, h:CITY_WALL_H, col:'#2e2536', top:'#463a50', open:true, u0:center - span });
  }
  if(showBuildings){
    cityRings(camX, camY, bearing, rings);
    bldList.length = 0;
    survivalTier(BLD_SKY_CITY, SKY_TIER, center - sky, center + sky, bldList);
    buildingRings(bldList, rings);
  }
  let nn=0; for(const r of rings) nn += r.pts.length;
  if(!ringCX || ringCX.length < nn){ ringCX = new Float32Array(nn); ringCY = new Float32Array(nn); }
  let o=0; for(const r of rings){ r.off = o; o += r.pts.length; }
}   // race-era name kept for the boot path

// which way is "away from the middle of the loop"? work the sign out from the normal
function outwardSign(){
  const p = track.pts[0];
  return Math.abs(p.x + p.nx*100) > Math.abs(p.x) ? 1 : -1;
}
// LOOP walls: two closed barrier rings plus a tall perimeter fence for the horizon
function buildRingsLoop(){
  const sg = outwardSign();
  const fence = track.pts.map(p=>({ x:p.x + p.nx*sg*(LOOP.HW+FENCE_OUT_C),
                                    y:p.y + p.ny*sg*(LOOP.HW+FENCE_OUT_C) }));
  rings = [
    { pts:track.outer, h:BARRIER_H, col:'#6a5570', top:'#a894b0' },
    { pts:track.inner, h:BARRIER_H, col:'#6a5570', top:'#a894b0' }
  ];
  if(showFence) rings.push({ pts:fence, h:FENCE_H, col:'#2e2536', top:'#463a50' });
  loopBuildings();
  if(showBuildings) buildingRings(loopBld, rings);
  let nn=0; for(const r of rings) nn += r.pts.length;
  if(!ringCX || ringCX.length < nn){ ringCX = new Float32Array(nn); ringCY = new Float32Array(nn); }
  let o=0; for(const r of rings){ r.off = o; o += r.pts.length; }
}

// coarse "is this world point on the asphalt" lookup for the LOOP's first-person floor
let trackMask=null, MASK_N=0, MASK_SPAN=0;
function buildTrackMask(){
  MASK_N = 384; MASK_SPAN = 2300;
  trackMask = new Uint8Array(MASK_N*MASK_N);
  const step = MASK_SPAN/MASK_N;
  for(let j=0;j<MASK_N;j++){
    const wy = -MASK_SPAN/2 + (j+0.5)*step;
    for(let i=0;i<MASK_N;i++){
      const wx = -MASK_SPAN/2 + (i+0.5)*step;
      trackMask[j*MASK_N+i] = trackProject(wx,wy).d < TRK.HW ? 1 : 0;
    }
  }
}

function onAsphalt(x,y){
  if(race){
    const i = ((x + MASK_SPAN/2)/MASK_SPAN*MASK_N)|0;
    const j = ((y + MASK_SPAN/2)/MASK_SPAN*MASK_N)|0;
    if(i<0||j<0||i>=MASK_N||j>=MASK_N) return 0;
    return trackMask[j*MASK_N+i];
  }
  if(street) return cityGround(x, y);      // 1 road, 2 pavement, 3 under a building, 0 beyond
  return Math.abs(roadProject(x, y).lat) < ROAD_HW ? 1 : 0;
}

// ---- sky and floor, written straight into the image buffer
const SKY_TOP=[26,20,34], SKY_HORIZ=[74,54,66];
const ASPH=[43,36,48], ASPH_FAR=[30,25,36];
const DIRT=[58,43,38], DIRT_FAR=[34,27,28];
const PAVE_RGB=[74,66,80], PAVE_FAR=[40,34,46];

function rcBackground(camX, camY, bearing){
  const fwx=Math.cos(bearing), fwy=Math.sin(bearing);
  const rgx=-fwy, rgy=fwx;
  let p=0;
  for(let y=0;y<RC_H;y++){
    if(y < RC_HORIZON){
      const t = y/Math.max(1,RC_HORIZON);
      const r=(SKY_TOP[0]+(SKY_HORIZ[0]-SKY_TOP[0])*t)|0;
      const g=(SKY_TOP[1]+(SKY_HORIZ[1]-SKY_TOP[1])*t)|0;
      const b=(SKY_TOP[2]+(SKY_HORIZ[2]-SKY_TOP[2])*t)|0;
      for(let x=0;x<RC_W;x++){ rcPix[p]=r; rcPix[p+1]=g; rcPix[p+2]=b; rcPix[p+3]=255; p+=4; }
      continue;
    }
    // floor: one perpendicular distance per row, then step across the row
    const perp = EYE_Z*RC_VD/Math.max(0.5, y-RC_HORIZON+0.5);
    const fog = Math.min(1, perp/900);
    const ar=(ASPH[0]+(ASPH_FAR[0]-ASPH[0])*fog)|0, ag=(ASPH[1]+(ASPH_FAR[1]-ASPH[1])*fog)|0,
          ab=(ASPH[2]+(ASPH_FAR[2]-ASPH[2])*fog)|0;
      const dr=(DIRT[0]+(DIRT_FAR[0]-DIRT[0])*fog)|0, dg=(DIRT[1]+(DIRT_FAR[1]-DIRT[1])*fog)|0,
          db=(DIRT[2]+(DIRT_FAR[2]-DIRT[2])*fog)|0;
    const pr=(PAVE_RGB[0]+(PAVE_FAR[0]-PAVE_RGB[0])*fog)|0, pg=(PAVE_RGB[1]+(PAVE_FAR[1]-PAVE_RGB[1])*fog)|0,
          pb=(PAVE_RGB[2]+(PAVE_FAR[2]-PAVE_RGB[2])*fog)|0;
    // sample every other column and hold
    let onRoad = 0;
    for(let x=0;x<RC_W;x++){
      if((x & 1)===0){
        const r4 = perp*rcInvCos[x];
        const wx = camX + (fwx*rcCos[x] + rgx*rcSin[x])*r4;
        const wy = camY + (fwy*rcCos[x] + rgy*rcSin[x])*r4;
        onRoad = onAsphalt(wx,wy);
      }
      if(onRoad===1){ rcPix[p]=ar; rcPix[p+1]=ag; rcPix[p+2]=ab; }
      else if(onRoad){ rcPix[p]=pr; rcPix[p+1]=pg; rcPix[p+2]=pb; }   // pavement
      else      { rcPix[p]=dr; rcPix[p+1]=dg; rcPix[p+2]=db; }
      rcPix[p+3]=255; p+=4;
    }
  }
  if(!RC_DIRECT) rcCtx.putImageData(rcImg, 0, 0);   // RC_DIRECT: rcWalls puts it, walls and all
}

// ---- walls
// Every ring point is transformed into camera space once per frame, then each
// column is a ray-vs-segment solve. A column can hit several walls (the barrier
// is low, so the fence shows above it), so hits are drawn far to near.
const RC_HITS_MAX = 64;          // a grazing ray can cross a lot of one ring
const rcHitD = new Float32Array(RC_HITS_MAX);
const rcHitR = new Int32Array(RC_HITS_MAX);
const rcHitU = new Float32Array(RC_HITS_MAX);     // distance along the wall, for banding
const rcHitK = new Float32Array(RC_HITS_MAX);     // |segment|/|den|, for the top ribbon
const rcHitOrder = new Int32Array(RC_HITS_MAX);
const rcHitHide  = new Uint8Array(RC_HITS_MAX);     // fully covered by a nearer wall
// per-frame segment buckets (see rcWalls)
let rcSegR=new Int32Array(1024), rcSegI=new Int32Array(1024), rcSegJ=new Int32Array(1024);
let rcSegC0=new Int32Array(1024), rcSegC1=new Int32Array(1024);
let rcColN=null, rcColL=null, rcColF=null;
function rcGrowSegs(){
  const g=a=>{ const b=new Int32Array(a.length*2); b.set(a); return b; };
  rcSegR=g(rcSegR); rcSegI=g(rcSegI); rcSegJ=g(rcSegJ); rcSegC0=g(rcSegC0); rcSegC1=g(rcSegC1);
}

// One vertical strip of one colour, rows [y0, y1) of column x. The colour is
// shade(hex, f), exactly: RC_DIRECT writes the same integers into the buffer
// that the canvas would have parsed out of shade()'s 'rgb(...)' string.
const rcRGB = new Map();
function rcPacked(hex, f){
  let n = rcRGB.get(hex);
  if(n === undefined){ n = parseInt(hex.slice(1), 16); rcRGB.set(hex, n); }
  const r=clamp(((n>>16)&255)*f,0,255)|0, g=clamp(((n>>8)&255)*f,0,255)|0, b=clamp((n&255)*f,0,255)|0;
  return (0xff000000 | (b<<16) | (g<<8) | r) >>> 0;
}
function rcSpan(x, y0, y1, hex, f){
  if(RC_DIRECT){
    const c = rcPacked(hex, f);
    for(let p = y0*RC_W + x, e = y1*RC_W + x; p < e; p += RC_W) rcPix32[p] = c;
  } else {
    rcCtx.fillStyle = shade(hex, f);
    rcCtx.fillRect(x, y0, 1, y1-y0);
  }
}

// ---- whole-building occlusion (RC_OCCLUDE)
// Before any ray is cast, buildings are taken nearest first and a per-column
// line is kept: rcOcc[c] = the LOWEST a nearer building's top can be on screen
// in column c. A building is hidden if even its HIGHEST possible top is below
// that line in every column it spans - the same rule rcWalls' per-column hide
// uses, applied to the whole box before it costs anything.
//
// It is conservative on both sides, so it never drops anything visible:
//  - a building only joins the line once it is entirely nearer than the one
//    being tested (its far corner <= the tested one's near corner), so its
//    base is surely below the farther building's base and it covers it from
//    the ground up;
//  - its contribution is its top at the WORST distance in its own range, and
//    only over the columns whose centre rays surely cross it (a box is convex,
//    so every ray between its outermost corners does).
// Rings that straddle the camera plane, and anything that isn't a building
// (barrier, city wall), are never culled and never occlude.
let rcOcc = null;
const rcOccList = [], rcOccHeap = [];
function rcTopAt(h, perp){ return RC_HORIZON + (EYE_Z - h)*RC_VD/perp; }
function rcOccPush(r){
  const H = rcOccHeap; H.push(r);
  let i = H.length - 1;
  while(i > 0){ const pa = (i-1)>>1; if(H[pa].oF1 <= r.oF1) break; H[i] = H[pa]; i = pa; }
  H[i] = r;
}
function rcOccPop(){
  const H = rcOccHeap, top = H[0], last = H.pop();
  if(H.length){
    let i = 0;
    for(;;){
      const l = 2*i+1, rr = l+1; let m = i;
      const mv = () => (m===i ? last : H[m]).oF1;
      if(l < H.length && H[l].oF1 < mv()) m = l;
      if(rr < H.length && H[rr].oF1 < mv()) m = rr;
      if(m === i) break;
      H[i] = H[m]; i = m;
    }
    H[i] = last;
  }
  return top;
}
function rcOcclude(){
  if(!rcOcc || rcOcc.length !== RC_W) rcOcc = new Float32Array(RC_W);
  rcOcc.fill(1e9);
  const L = rcOccList; L.length = 0; rcOccHeap.length = 0;
  for(const r of rings){
    r.hid = false;
    if(!r.bldg) continue;
    let f0 = 1e9, f1 = -1e9, c0 = 1e9, c1 = -1e9, ok = true;
    for(let i=0; i<r.pts.length; i++){
      const f = ringCX[r.off+i];
      if(f <= 0.5){ ok = false; break; }
      const c = ringCY[r.off+i]/f*RC_VD + RC_W/2 - 0.5;
      if(f < f0) f0 = f; if(f > f1) f1 = f; if(c < c0) c0 = c; if(c > c1) c1 = c;
    }
    if(!ok) continue;
    r.oF0 = f0; r.oF1 = f1;
    r.oC0 = Math.max(0, Math.ceil(c0)); r.oC1 = Math.min(RC_W-1, Math.floor(c1));
    L.push(r);
  }
  L.sort((a, b) => a.oF0 - b.oF0);
  for(const r of L){
    // everything wholly nearer than this one now counts as cover
    while(rcOccHeap.length && rcOccHeap[0].oF1 <= r.oF0){
      const a = rcOccPop();
      // the lowest its top can sit: nearest corner if it is under the eye, else farthest
      const low = a.h <= EYE_Z ? rcTopAt(a.h, a.oF0) : rcTopAt(a.h, a.oF1);
      for(let c = a.oC0; c <= a.oC1; c++) if(low < rcOcc[c]) rcOcc[c] = low;
    }
    if(r.oC0 > r.oC1){ r.hid = true; continue; }        // no column's ray crosses it
    // the highest its top can reach: farthest corner if it is under the eye, else nearest
    const high = r.h <= EYE_Z ? rcTopAt(r.h, r.oF1) : rcTopAt(r.h, r.oF0);
    let hidden = true;
    for(let c = r.oC0; c <= r.oC1; c++) if(high < rcOcc[c]){ hidden = false; break; }
    if(hidden){ r.hid = true; continue; }
    rcOccPush(r);
  }
}

function rcWalls(camX, camY, bearing){
  const cb=Math.cos(-bearing), sb=Math.sin(-bearing);
  for(const r of rings){
    const pts=r.pts, off=r.off;
    for(let i=0;i<pts.length;i++){
      const dx=pts[i].x-camX, dy=pts[i].y-camY;
      // camera space: +y forward, +x right
      ringCX[off+i] = dx*cb - dy*sb;
      ringCY[off+i] = dx*sb + dy*cb;
    }
  }
  // camera looks along world `bearing`; rotating by -bearing puts forward on +x,
  // so swap into (right, forward) = (-y, x)
  for(let x=0;x<RC_W;x++){ rcZ[x]=1e9; rcLowD[x]=1e9; }
  rcLowAny=false;

  // Bucket every segment by the columns it can cover, so each column only
  // tests the walls actually in front of it. Testing every segment from every
  // column was fine for two barriers and a few roadside boxes; a city is
  // hundreds of plots, and almost all of them miss almost every column. The
  // range is padded a column each way and a segment crossing the camera plane
  // takes the whole screen, so the bucketing never drops a real hit - the
  // per-column solve below is exactly the one it always was.
  if(RC_OCCLUDE) rcOcclude(); else for(const r of rings) r.hid = false;
  let ns=0;
  for(let ri=0; ri<rings.length; ri++){
    const r=rings[ri], off=r.off, n=r.pts.length;
    if(r.hid) continue;                                // a whole building nothing can see
    const last = r.open ? n-1 : n;
    for(let i=0;i<last;i++){
      const j=r.open ? i+1 : (i+1)%n;
      const af=ringCX[off+i], bf=ringCX[off+j];
      if(af<=0.5 && bf<=0.5) continue;                 // wholly behind the camera
      let c0=0, c1=RC_W-1;
      if(af>0.5 && bf>0.5){
        const ca=ringCY[off+i]/af*RC_VD + RC_W/2 - 0.5, cb2=ringCY[off+j]/bf*RC_VD + RC_W/2 - 0.5;
        c0=Math.max(0, Math.floor(Math.min(ca,cb2))-1); c1=Math.min(RC_W-1, Math.ceil(Math.max(ca,cb2))+1);
        if(c0>c1) continue;                              // off the side of the view
      }
      if(ns>=rcSegR.length) rcGrowSegs();
      rcSegR[ns]=ri; rcSegI[ns]=i; rcSegJ[ns]=j; rcSegC0[ns]=c0; rcSegC1[ns]=c1; ns++;
    }
  }
  if(!rcColN || rcColN.length!==RC_W+1) rcColN=new Int32Array(RC_W+1);
  rcColN.fill(0);
  for(let s=0;s<ns;s++) for(let c=rcSegC0[s];c<=rcSegC1[s];c++) rcColN[c+1]++;
  for(let c=0;c<RC_W;c++) rcColN[c+1]+=rcColN[c];
  const total=rcColN[RC_W];
  if(!rcColL || rcColL.length<total) rcColL=new Int32Array(total*2);
  if(!rcColF || rcColF.length!==RC_W) rcColF=new Int32Array(RC_W);
  for(let c=0;c<RC_W;c++) rcColF[c]=rcColN[c];
  for(let s=0;s<ns;s++) for(let c=rcSegC0[s];c<=rcSegC1[s];c++) rcColL[rcColF[c]++]=s;

  for(let x=0;x<RC_W;x++){
    const drx=rcSin[x], dry=rcCos[x];      // ray dir in (right, forward)
    let nh=0;
    for(let q=rcColN[x], qe=rcColN[x+1]; q<qe; q++){
      const s=rcColL[q];
      {
        const ri=rcSegR[s], i=rcSegI[s], j=rcSegJ[s], off=rings[ri].off;
        // (right, forward): a point at relative angle +a sits right of centre,
        // matching the billboard and floor projections
        const axr=ringCY[off+i], axf=ringCX[off+i];
        const bxr=ringCY[off+j], bxf=ringCX[off+j];
        const ex=bxr-axr, ey=bxf-axf;
        const den=drx*ey - dry*ex;
        if(den>-1e-9 && den<1e-9) continue;
        // solving t*d = A + u*E for u gives this sign; getting it backwards
        // accepts hits on the segment's backward extension, which on a closed
        // ring of similar segments still looks plausible
        const u=(dry*axr - drx*axf)/den;
        if(u<0 || u>1) continue;
        const t = Math.abs(drx)>Math.abs(dry) ? (axr+u*ex)/drx : (axf+u*ey)/dry;
        if(t<=0.5) continue;
        // A full column keeps the NEAREST hits. It used to keep the first 64
        // found, in ring order - harmless with a few walls, but a deep city can
        // put more than that down one ray, and dropping the nearest of them is a
        // hole in the occlusion. Overflow is rare, so the scan for the farthest
        // only ever runs then.
        let slot = nh;
        if(nh>=RC_HITS_MAX){
          slot = 0;
          for(let h=1;h<RC_HITS_MAX;h++) if(rcHitD[h]>rcHitD[slot]) slot=h;
          if(t>=rcHitD[slot]) continue;
        } else nh++;
        rcHitD[slot]=t; rcHitR[slot]=ri;
        rcHitU[slot]=i+u;                                  // which bit of wall this is
        rcHitK[slot]=Math.sqrt(ex*ex+ey*ey)/Math.abs(den); // 1/|dot(dir, wallNormal)|
      }
    }
    if(!nh) continue;
    for(let i=0;i<nh;i++) rcHitOrder[i]=i;
    // track the nearest separately: the draw buffer can overflow, occlusion can't
    let near=1e9;
    for(let i=0;i<nh;i++) if(rcHitD[i]<near && !rings[rcHitR[i]].low) near=rcHitD[i];
    const nearPerp=near*rcCos[x];
    if(nearPerp>0.6) rcZ[x]=nearPerp;
    // insertion sort, far to near. nh is small.
    for(let i=1;i<nh;i++){
      const k=rcHitOrder[i]; const d=rcHitD[k]; let j=i-1;
      while(j>=0 && rcHitD[rcHitOrder[j]]<d){ rcHitOrder[j+1]=rcHitOrder[j]; j--; }
      rcHitOrder[j+1]=k;
    }
    const cosA=rcCos[x];
    // Occlusion, nearest first: every wall runs from its top down to its base,
    // and a farther wall's base is always higher on screen, so a farther wall
    // whose top is below a nearer wall's top is entirely hidden. Skipping those
    // matters now that far buildings draw a light per storey.
    let minTop=1e9;
    for(let hi=nh-1; hi>=0; hi--){
      const k=rcHitOrder[hi], perp=rcHitD[k]*cosA;
      if(perp<0.6){ rcHitHide[hi]=1; continue; }
      const top=RC_HORIZON + (EYE_Z-rings[rcHitR[k]].h)*RC_VD/perp;
      rcHitHide[hi] = top>=minTop ? 1 : 0;
      if(top<minTop) minTop=top;
    }
    for(let hi=0; hi<nh; hi++){
      if(rcHitHide[hi]) continue;
      const k=rcHitOrder[hi];
      const perp=rcHitD[k]*cosA;
      if(perp<0.6) continue;
      const r=rings[rcHitR[k]];
      const scale=RC_VD/perp;
      const base=RC_HORIZON + EYE_Z*scale;
      const top =RC_HORIZON + (EYE_Z-r.h)*scale;
      let y0=top|0, y1=base|0;
      if(y1<0 || y0>=RC_H) continue;
      if(y0<0) y0=0; if(y1>RC_H) y1=RC_H;
      if(y1<=y0) continue;
      const fog=Math.min(0.82, perp/1100);

      if(r.bldg){ rcBuildingColumn(x, r, rcHitU[k], perp, scale, y0, y1, fog, cosA*rcHitK[k]); continue; }

      // Vertical banding from the along-wall coordinate. This is the important
      // one: an untextured face shows nothing at all when you slide toward it,
      // so the only thing that moves is the silhouette - and a tilting
      // silhouette reads as rotation. Bands give honest lateral parallax.
      const band = (rcHitU[k]*2.6)|0;
      let f = 1 - fog*0.72;
      if(band & 1) f *= 0.80;
      // barrier posts anchored to the WORLD along-wall coordinate, so they stream
      // past as you drive forward (works for either orientation).
      if(!race){   // survival walls carry world-anchored posts; the loop uses plain banding
        const alongWall = (r.u0 != null ? r.u0 : ringCenter - RING_SPAN) + rcHitU[k]*RING_STEP;
        const postPhase = ((alongWall % POST_STEP)+POST_STEP) % POST_STEP;
        if(postPhase < 5) f *= 0.55;
      }
      rcSpan(x, y0, y1, r.col, f);

      // a kerb at the foot of the wall, so the base edge is legible too
      const kerb = Math.max(1, Math.round((y1-y0)*0.18));
      if(y1-kerb > y0) rcSpan(x, y1-kerb, y1, r.col, f*0.55);

      // The top surface, when the wall is shorter than the gunner. Its far edge
      // is one wall-thickness further along the ray, which is what turns a low
      // barrier into something you can see you are looking down onto.
      let yTop = top;                 // topmost row this column of wall covers
      if(r.h < EYE_Z){
        const dFar = perp + WALL_T*cosA*rcHitK[k];
        const yFar = RC_HORIZON + (EYE_Z-r.h)*RC_VD/dFar;
        yTop = yFar;                  // the top ribbon reaches higher than the face
        let r0=yFar|0, r1=top|0;
        if(r0<0) r0=0; if(r1>RC_H) r1=RC_H;
        if(r1>r0) rcSpan(x, r0, r1, r.top, (1 - fog*0.6) * ((band & 1) ? 0.88 : 1));
      }

      // A `low` ring is deliberately left out of rcZ (see `near` above): it is
      // knee-high, rcZ can only hide a billboard WHOLE, and hiding a sentry
      // because its boots are behind the kerb would be worse than the bug.
      // Record the kerb's front instead - depth, and the topmost row it covers -
      // and rcSprites clips the part of a farther sprite that falls below that
      // row. Hits are drawn far to near, so the last write is the nearest.
      // The row is stored as an integer, so neighbouring columns share a value
      // and the clip path merges into a handful of rectangles.
      if(r.low){
        rcLowD[x] = perp;
        rcLowY[x] = yTop < 0 ? 0 : (yTop > RC_H ? RC_H : (yTop|0));
        rcLowAny = true;
      }
    }
  }
  if(RC_DIRECT) rcCtx.putImageData(rcImg, 0, 0);   // floor and walls go up together
}

// One column of a building face: the wall, then its windows. Windows are what
// make a facade legible at all - and in the ascii view the lit ones are the
// brightest cells, so they become the '@'s.
//
// Lit windows are lights, so they have to survive distance. Two levels of
// detail, after ascii-city's near/far tiers:
//  - NEAR: this column covers less than a window pitch of wall, so it draws
//    real windows (lit and dark), and a window counts as hit if it overlaps the
//    strip of wall the column covers - point-sampling missed them on faces seen
//    at an angle, which is why lights only showed when looking square on.
//  - FAR: the column spans a window or more (distance or a grazing angle), so
//    it just asks "is the window here lit?" and draws only the lights, at least
//    one pixel each - far buildings become a speckle of city lights.
// Fog barely touches the lights: they glow, the wall around them doesn't.
// `slant` = cos(ray angle) / |cos(incidence)|: wall length per unit of
// perpendicular distance, per column, times RC_VD.
const WIN_A = 4, WIN_B = 9;          // window span inside each WIN_STEP of wall
// How loud the city lights are, 0..1: 0 = the original (no far lights, fog
// dims them 55%, ascii averages them away), 1 = every far light at full glow.
// All the light dials below hang off this one number.
let   LIGHTS_MIX = 0.5;
let   LIT_COLS = null;               // lit window colour by fog, rebuilt when the mix changes
let   LIT_32 = null;                 // ...the same colours packed, for RC_DIRECT
let   litColsMix = -1;
function litCols(){
  if(litColsMix !== LIGHTS_MIX){
    const dim = lerp(0.55, 0.2, LIGHTS_MIX);        // how much full fog dims a light
    LIT_COLS = Array.from({length:32}, (_,i) => shade('#e8b860', 1 - (i/32)*dim));
    LIT_32   = LIT_COLS.map((_,i) => rcPacked('#e8b860', 1 - (i/32)*dim));
    litColsMix = LIGHTS_MIX;
  }
  return LIT_COLS;
}
function rcBuildingColumn(x, r, hu, perp, scale, y0, y1, fog, slant){
  const seg = hu|0, along = (hu - seg)*r.len[seg];
  const f = (1 - fog*0.8) * r.fs[seg];
  rcSpan(x, y0, y1, r.col, f);
  // a darker plinth at street level, like the barrier's kerb
  const plinth = Math.max(1, Math.round(5*scale));
  if(y1-plinth > y0) rcSpan(x, y1-plinth, y1, r.col, f*0.6);

  const fk = (r.bldg && r.bldg.fsc) || 1, FH = FLOOR_H*fk, WS = WIN_STEP*fk, WA = WIN_A*fk, WB = WIN_B*fk;
  const pitch = scale*FH;                            // storey height in pixels
  if(pitch < 0.35) return;                           // storeys packed 3 to a pixel: silhouette
  const step = perp*slant/RC_VD;                     // wall length this column covers
  const far = step > WS*0.6 || pitch < 3;
  const b = r.bldg, wp = along % WS;
  let wi = (along / WS)|0;
  if(!far){
    // does [along - step/2, along + step/2] touch this pitch's window?
    const h = step/2;
    if(wp + h < WA || wp - h > WB){
      // not this one - but the strip may reach into a neighbour's window
      if(wp - h < WB - WS) wi -= 1;
      else if(wp + h > WS + WA) wi += 1;
      else return;                                   // between windows
    }
  }
  const nf = Math.floor((r.h - 6*fk) / FH);
  const li = (fog*31.99)|0;
  const litCol = litCols()[li], darkCol = far || RC_DIRECT ? null : shade(r.col, f*0.45);
  const lit32 = LIT_32[li], dark32 = far ? 0 : rcPacked(r.col, f*0.45);
  const stride = pitch < 1 ? Math.ceil(1/pitch) : 1; // one storey per pixel row, at most
  for(let fl=0; fl<nf; fl+=stride){
    const lit = hash3(b.seed*31 + seg, wi, fl + b.tier*101) < b.lit;
    if(far && !lit) continue;                        // far away only the lights read
    // ...and only a LIGHTS_MIX share of them, picked by hash so it never flickers
    if(far && hash3(b.seed*17 + seg, wi*3 + 1, fl) >= LIGHTS_MIX) continue;
    const zA = fl*FH + WA, zB = fl*FH + WB;
    let ya = (RC_HORIZON + (EYE_Z - zB)*scale)|0, yb = (RC_HORIZON + (EYE_Z - zA)*scale)|0;
    if(yb <= ya) yb = ya + 1;                        // a light is never thinner than a pixel
    if(yb <= 0) break;                               // storeys above the top of the view
    if(ya >= RC_H) continue;
    if(ya < y0) ya = y0; if(yb > y1) yb = y1;
    if(yb <= ya) continue;
    if(RC_DIRECT){
      const c = lit ? lit32 : dark32;
      for(let p = ya*RC_W + x, e = yb*RC_W + x; p < e; p += RC_W) rcPix32[p] = c;
    } else {
      rcCtx.fillStyle = lit ? litCol : darkCol;
      rcCtx.fillRect(x, ya, 1, yb-ya);
    }
  }
}

// ---- billboards
// Cars reuse the same low-poly meshes as the 2D half, re-baked at eye level
// instead of the axonometric angle, so both halves show the same vehicles.
const KY_FPS = 0.16, KZ_FPS = Math.sqrt(1 - 0.16*0.16);
const FPS_SHEETS = new Map();

// How sharp the car's first-person sheet is - see CAR_VSC in config.js. 1 while
// ASCII is on, because asciiBlit quantises the pane into glyphs and the detail
// cannot survive it, so holding a sharp sheet then is pure memory.
function carVsc(){ return asciiMode === 0 ? CAR_VSC : 1; }
// Pressing G changes what carVsc() returns, so the cached sheets are the wrong
// resolution from that moment. Dropping them keeps ONE set in memory instead of
// both, at the price of a rebake on the keypress.
function carSheetsReset(){
  FPS_SHEETS.clear();
  for(const c of cars) c.fps = null;
}
function bakeFpsSprites(c){
  const vsc = carVsc();
  const key = (c.mesh ?? c.model ?? 0)+'|'+c.color+'|'+vsc;
  const hit = FPS_SHEETS.get(key);
  if(hit) return hit;
  const sc = c.scale || 1;
  // vsc multiplies the frame AND the raster together, so at vsc 1 this is exactly
  // what it has always been and the draw divides it straight back out.
  const n=32, fw=Math.ceil(52*sc*vsc), fh=Math.ceil(52*sc*vsc), ax=fw/2, ay=Math.round(fh*0.62);
  const mesh = MODELS[(c.mesh ?? c.model ?? 0) % MODELS.length];
  const cvs=document.createElement('canvas');
  cvs.width=fw*n; cvs.height=fh*2;
  const g=cvs.getContext('2d');
  const scratch=document.createElement('canvas');
  scratch.width=fw*SS; scratch.height=fh*SS;
  const sctx=scratch.getContext('2d');
  for(let f=0;f<n;f++){
    for(let row=0;row<2;row++){
      sctx.putImageData(rasterCar(sctx, mesh, f/n*Math.PI*2, c.color, row===1,
                                  fw, fh, ax, ay, KY_FPS, KZ_FPS, vsc), 0, 0);
      g.drawImage(scratch, 0,0,scratch.width,scratch.height, f*fw, row*fh, fw, fh);
    }
  }
  const sheet={ cv:cvs, n, fw, fh, ax, ay, vsc };
  FPS_SHEETS.set(key, sheet);
  return sheet;
}

// ---- enemy cars in the gunner's pane
// Two numbers tie P2's view of an enemy to P1's, because the gunner was losing
// cars long before the driver did and ended up reading the bottom half of the
// screen instead of his own:
//
//  - WHEN it vanishes. The raycaster used to carry a car out to 1500 units,
//    far past the edge of the driving pane, so most of what P2 could see was
//    too small to shoot and nothing P1 could see was worth calling out. A car
//    now leaves the gunner's view at the frame edge of the driving pane, and
//    fades out over the last sliver rather than popping.
//  - HOW BIG it is until then. Angular size falls as 1/d and the ascii pass
//    then averages 2x3 pixels into one glyph, so at the far edge of the frame
//    a car was ~9 cells of mush. Distant cars are drawn larger than
//    perspective says - the same exaggeration a gun sight makes - easing in
//    from CAR_MAG_NEAR so nothing pops as a car closes. Nearer is still
//    bigger, just on a compressed curve.
const CAR_VIEW_M   = 28;    // half a car: P2 keeps it until P1 has fully lost it
const CAR_FADE     = 0.12;  // share of the frame, at the edge, spent fading out
const CAR_MAG_NEAR = 70;    // inside this, honest perspective

// how far the driving pane sees, and where a point sits in it: 0 at the camera,
// 1 at the edge of the frame. Same extents inView uses to cull the 2D half.
function p1Reach(){ return Math.max(VHW, vertical ? VIEW_HH : VHH/KY); }
function p1Edge(x, y){
  const dx = Math.abs(x-cam.x), dy = Math.abs(y-cam.y);
  return vertical
    ? Math.max(dx/(VHW+CAR_VIEW_M), dy/(VIEW_HH+CAR_VIEW_M))
    : Math.max(dx/(VHW+CAR_VIEW_M), dy*KY/(VHH+CAR_VIEW_M));
}
function carMag(perp){
  const far = Math.max(CAR_MAG_NEAR+1, p1Reach());
  const t = clamp((perp - CAR_MAG_NEAR)/(far - CAR_MAG_NEAR), 0, 1);
  return 1 + (CAR_MAG_MAX - 1)*t*t*(3 - 2*t);      // smoothstep: no kink at either end
}

let bbList=[];
function gatherBillboards(camX, camY, bearing){
  bbList.length=0;
  const lim = RC_FOV*0.5 + 0.30;
  const add=(x,y,z,kind,ref,e)=>{
    const dx=x-camX, dy=y-camY;
    const d=Math.sqrt(dx*dx+dy*dy);
    if(d<6 || d>1500) return;
    let b=Math.atan2(dy,dx)-bearing;
    b=((b+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;
    if(b<-lim || b>lim) return;
    bbList.push({d,b,z,kind,ref,e:e||0});
  };
  // on foot there is no driving pane to agree with: every car is honest, and the
  // one you parked is just another car in the street
  for(let i=onFoot?0:1;i<cars.length;i++){
    const c=cars[i]; if(c.dead) continue;
    const e = onFoot ? 0 : p1Edge(c.x, c.y);
    if(e > 1) continue;                           // off the driving pane: off this one too
    add(c.x, c.y, 0, 'car', c, e);
  }
  for(const f of foes) if(!f.dead) add(f.x, f.y, 0, 'foe', f);
  for(const p of pads) if(p.item) add(p.x,p.y,4,'pad',p);
  for(const m of mines) add(m.x,m.y,2,'mine',m);
  for(const s of shots) add(s.x,s.y,s.z,'shot',s);
  for(const p of fx) add(p.x,p.y,p.z, p.ring?'ring':'spark', p);
  bbList.sort((a,b)=>b.d-a.d);
  return bbList;
}

// The hit flash, for the ASCII pane only. The sheet's flash row is the car baked
// all-white, which is right in a pixel view and wrong in this one: the glyph a
// cell gets is chosen by its LUMINANCE, so a white car maxes every cell to '@'
// and the shape of the thing you are shooting disappears for the flash.
//
// So recolour instead of relighting. Canvas' 'color' blend takes hue+saturation
// from the fill and luminosity from what is already there, which is exactly the
// split this renderer draws from: every cell keeps the glyph it had, only the
// tint moves. The blend paints the transparent margin too, so the frame is
// masked back to the car's silhouette with 'destination-in' (the sprites are
// hard-edged, alpha 0 or 255, so that mask is exact).
//
// HIT_TINT is WHITE, which is the flash colour this always had and the one the
// driving pane still uses. White has no hue to hand over, so the blend leaves
// the car at its own per-pixel brightness with the colour taken out of it: the
// glyphs hold their shape and the tint goes grey, which ASC_LIFT then carries up
// towards white. Same flash as before, without the '@'s.
//
// Any strongly coloured tint works here too (magenta `#ff3cff` was the first
// try) - except a red one. asciiBlit reads a pixel with `pr > ASC_LIGHT_R` and
// `pr - pb > ASC_LIGHT_WARM` as a lit window and forces a bright glyph on its
// cell, so red trips that path and brings back the very '@'s this avoids. Grey
// sits at `pr - pb` of nil and never does.
const HIT_TINT = '#ffffff';
// `row` is the y of the strip the frame sits in, for a sheet that has more than
// one. A car sheet's normal frames are all in row 0, so it is omitted there; a
// foe sheet is one strip per walk pose, and a flashing sentry has to be
// recoloured from the pose it is actually showing.
//
// `lift` brightens the result, and is for the PIXEL panes only. The recolour
// above is the right flash for ASCII and a poor one for pixels: against a white
// tint the `color` blend only takes the colour OUT, and a sentry is already
// near-grey, so the flash all but vanishes. A car never had this problem because
// the pixel panes draw its baked white row and only ASCII recolours; a sentry
// has no baked row, so the one path has to serve both and the brightness is
// what has to differ. Pass 0 in ASCII - see the lift's own note below.
let hitCv=null, hitCtx=null;
function hitFrame(sp, f, row, lift){
  if(!hitCv){ hitCv=document.createElement('canvas'); hitCtx=hitCv.getContext('2d'); }
  if(hitCv.width!==sp.fw || hitCv.height!==sp.fh){ hitCv.width=sp.fw; hitCv.height=sp.fh; }
  const draw=()=>hitCtx.drawImage(sp.cv, f*sp.fw, row||0, sp.fw, sp.fh, 0, 0, sp.fw, sp.fh);
  hitCtx.globalCompositeOperation='source-over';
  hitCtx.clearRect(0, 0, sp.fw, sp.fh);
  draw();
  hitCtx.globalCompositeOperation='color';            // its hue, the car's brightness
  hitCtx.fillStyle=HIT_TINT;
  hitCtx.fillRect(0, 0, sp.fw, sp.fh);
  hitCtx.globalCompositeOperation='destination-in';   // back to the car's outline
  draw();
  if(lift){
    // 'source-atop' paints only where the frame is already opaque, so this stays
    // inside the silhouette the mask just cut - the sprites are hard-edged
    // (alpha 0 or 255), so that boundary is exact.
    //
    // NEVER do this for the ASCII pane. asciiBlit picks a glyph from a cell's
    // LUMINANCE, so lifting the silhouette maxes every cell to '@' and the shape
    // of the thing you are shooting disappears - which is the whole reason this
    // function recolours instead of relighting in the first place.
    hitCtx.globalCompositeOperation='source-atop';
    hitCtx.globalAlpha=lift;
    hitCtx.fillStyle=HIT_TINT;
    hitCtx.fillRect(0, 0, sp.fw, sp.fh);
    hitCtx.globalAlpha=1;
  }
  hitCtx.globalCompositeOperation='source-over';
  return hitCv;
}

// Clip a sprite against the kerb it is standing behind. `perp` is the sprite's
// depth, `sx` the column it stands on, `rad` a generous half-width in columns.
// Every column inside that span where rcWalls found a nearer low wall is cut at
// that wall's top row; everything outside the span is left whole, so too small
// a `rad` costs a pixel of accuracy at the sprite's edge and can never slice a
// sprite in half. Returns true if a clip was pushed - the caller restores.
//
// Why a clip and not a depth test: the kerb is WALK_BARRIER_H (7) tall and a
// sentry FOE.H (22), so standing right behind it only its boots are hidden.
// rcZ answers one question per column - "is this sprite behind a wall" - and
// both answers are wrong for a kerb, which is why `low` rings stay out of it.
function rcLowClip(perp, sx, rad){
  if(!rcLowAny) return false;
  let c0 = Math.floor(sx - rad), c1 = Math.ceil(sx + rad);
  if(c0 < 0) c0 = 0;
  if(c1 > RC_W) c1 = RC_W;
  let need = false;
  for(let x=c0; x<c1; x++) if(rcLowD[x] < perp){ need = true; break; }
  if(!need) return false;
  rcCtx.save();
  rcCtx.beginPath();
  if(c0 > 0)    rcCtx.rect(0, 0, c0, RC_H);          // outside the span: uncut
  if(c1 < RC_W) rcCtx.rect(c1, 0, RC_W-c1, RC_H);
  let x = c0;
  while(x < c1){
    const cut = rcLowD[x] < perp ? rcLowY[x] : RC_H;
    let e = x+1;
    while(e < c1 && (rcLowD[e] < perp ? rcLowY[e] : RC_H) === cut) e++;
    if(cut > 0) rcCtx.rect(x, 0, e-x, cut);
    x = e;
  }
  rcCtx.clip();
  return true;
}

const LAB_VOX = ["sentry@96", "sentry@64"];   // left column, right column
function labSpawnFoes(){
  // The city scatters sentries of its own now (citySentries, 2026-11-09) and
  // its hunters drive through them. The lab wants ONLY its row, at known
  // distances, with nothing walking across the comparison - so both are off
  // here. Z still drops one, and the GAME is where the AI is looked at.
  clearFoes(); enemiesOn = false;
  const w = walker, fx = Math.cos(w.a), fy = Math.sin(w.a), lx = -fy, ly = fx;
  // the same four distances twice, one carve each side, facing you
  [70, 130, 260, 520].forEach((d, i) => {
    LAB_VOX.forEach((v, c) => {
      // the bearing WIDENS with distance, so the far pairs sit further out on
      // screen instead of hiding behind the near ones
      const a = w.a + (c ? 1 : -1) * (0.18 + i*0.10);
      const x = w.x + Math.cos(a)*d, y = w.y + Math.sin(a)*d;
      spawnFoe(x, y, Math.atan2(w.y - y, w.x - x), v);
    });
  });
}
function rcSprites(camX, camY, bearing){
  const list=gatherBillboards(camX, camY, bearing);
  if(foes.length && !foeImg.n) foeImagesReady();
  for(const bb of list){
    const perp=bb.d*Math.cos(bb.b);
    if(perp<3) continue;
    const scale=RC_VD/perp;
    const sx=RC_W/2 + Math.tan(bb.b)*RC_VD;
    const ground=RC_HORIZON + EYE_Z*scale;
    const col=Math.round(sx);
    if(col<0 || col>=RC_W) continue;
    if(perp > rcZ[col]) continue;                 // behind a barrier
    const fog=Math.min(0.78, perp/1100);
    // ...and behind the kerb, which only takes the bottom of it
    const clipped = rcLowClip(perp, sx, (bb.kind==='car' ? 90 : 50)*scale);

    if(bb.kind==='car'){
      const c=bb.ref;
      // the cached sheet is stale the moment G changes what carVsc() wants
      let sp=c.fps;
      if(!sp || sp.vsc !== carVsc()) sp = c.fps = bakeFpsSprites(c);
      // pick the frame from the car's heading relative to the line of sight.
      // The bake's camera looks along -y, hence the quarter turn.
      const look=Math.atan2(bb.ref.y-camY, bb.ref.x-camX);
      const TAU=Math.PI*2;
      let yaw=c.angle - look - Math.PI/2;
      yaw=((yaw%TAU)+TAU)%TAU;
      const f=Math.round(yaw/TAU*sp.n)%sp.n;
      // magnified about the anchor (ax, 0.62*fh), which is the contact patch, so
      // the wheels stay on the true ground line and the sprite still sits at the
      // column the gun is actually pointing down
      // the sheet's own scale divides back out, so the car lands exactly where
      // and how big it did at vsc 1
      const s3=scale*(onFoot ? 1 : carMag(perp))/sp.vsc;
      const w=sp.fw*s3, h=sp.fh*s3;
      const dx=sx-sp.ax*s3, dy=ground-sp.ay*s3;
      rcCtx.globalAlpha=(1-fog*0.55) * clamp((1-bb.e)/CAR_FADE, 0, 1);
      // ascii recolours the hit; the pixel view keeps the white flash row, which
      // is what it shares with the driving pane
      if(c.hurtFlash>0 && asciiMode)
        rcCtx.drawImage(hitFrame(sp, f), 0, 0, sp.fw, sp.fh, dx, dy, w, h);
      else
        rcCtx.drawImage(sp.cv, f*sp.fw, c.hurtFlash>0 ? sp.fh : 0, sp.fw, sp.fh, dx, dy, w, h);
      rcCtx.globalAlpha=1;
    } else if(bb.kind==='foe'){
      drawFoeBillboard(bb.ref, sx, ground, scale, perp, camX, camY);
    } else if(bb.kind==='pad'){
      const s2=Math.max(1, 13*scale);
      rcCtx.fillStyle=ITEMS[bb.ref.item].col;
      rcCtx.globalAlpha=(1-fog)*0.9;
      rcCtx.fillRect(sx-s2/2, ground - bb.z*scale - s2, s2, s2);
      rcCtx.globalAlpha=1;
    } else if(bb.kind==='mine'){
      const s2=Math.max(1, 9*scale);
      rcCtx.fillStyle = (Math.floor(bb.ref.blink*6)%2 && bb.ref.arm<=0) ? '#f0503c' : '#3a3040';
      rcCtx.fillRect(sx-s2/2, ground-s2*0.6, s2, s2*0.6);
    } else if(bb.kind==='shot'){
      // cannon tracer halved (3 -> 1.5): leaving the gun, 8 units out, it was 55px
      // of a 90px pane. Missiles keep their size.
      const s2=Math.max(1, (bb.ref.kind==='missile'?8:1.5)*scale);
      // The player's own tracer is drawn leaving the gun rather than the
      // bodywork - the gun really is up on the ring mount, and at road height it
      // starts below the bottom of this pane and reads as a third of a second of
      // delay. This is a RENDER offset only: the shot's world z stays at the
      // front of the car, which is where the driving pane needs to draw it.
      // Easing linearly in distance keeps the tracer at a constant height below
      // the horizon, so it never outruns the visible band and blinks out.
      let bz = bb.z;
      if(bb.ref.owner===0)
        bz += (EYE_Z - bb.z) * clamp(1 - bb.d/SHOT_SETTLE, 0, 1);
      rcCtx.fillStyle = bb.ref.kind==='missile' ? '#ffcf6a' : '#ffe9a8';
      rcCtx.fillRect(sx-s2/2, ground - bz*scale - s2/2, s2, s2);
    } else if(bb.kind==='ring'){
      const p=bb.ref, k=p.t/p.life;
      const rr=lerp(p.r0,p.r1,k)*scale;
      rcCtx.globalAlpha=(1-k)*0.5;
      rcCtx.fillStyle='#ff9d3d';
      rcCtx.fillRect(sx-rr, ground - p.z*scale - rr*0.5, rr*2, rr);
      rcCtx.globalAlpha=1;
    } else {
      const p=bb.ref, k=p.t/p.life;
      const s2=Math.max(1, p.size*scale);
      rcCtx.globalAlpha=clamp(1-k,0,1)*(1-fog*0.5);
      rcCtx.fillStyle = Array.isArray(p.col) ? p.col[(p.x*7+p.y*3|0)%p.col.length] : p.col;
      rcCtx.fillRect(sx-s2/2, ground - p.z*scale - s2/2, s2, s2);
      rcCtx.globalAlpha=1;
    }
    if(clipped) rcCtx.restore();
  }
}

function drawGunnerView(){
  const me=cars[0];
  const bearing = me.angle + me.turret;
  // the gun sits just behind the cabin, so the muzzle is not inside the bodywork
  const camX = me.x - Math.cos(me.angle)*4;
  const camY = me.y - Math.sin(me.angle)*4;
  // survival walls follow the camera; the loop's rings are static (built at start)
  if(!race) buildConvoyRings(roadProject(camX, camY).s);
  rcBackground(camX, camY, bearing);
  rcWalls(camX, camY, bearing);
  rcSprites(camX, camY, bearing);

  const p=PANE_P2;
  ctx.save();
  ctx.imageSmoothingEnabled=false;
  const sh = cam.shake ? rnd(-cam.shake,cam.shake)*0.4*PX : 0;
  if(asciiMode) asciiBlit(p.x*PX, p.y*PX + sh);
  else ctx.drawImage(rcCv, 0,0,RC_W,RC_H, p.x*PX, p.y*PX + sh, p.w*PX, p.h*PX);
  ctx.restore();
}

// ---------------------------------------------------------------- ascii gunner view
// The trick from C:\proj\ascii-city: it draws into a character grid and blits
// every glyph from a pre-rendered atlas rather than calling fillText per cell.
// Here it runs as a post-process. The raycaster renders exactly as before, then
// its buffer is read back and averaged into cells, and each cell becomes one
// glyph: the glyph's density carries the brightness, its tint carries the
// colour. Render path only - nothing in the world knows this exists.
//
// Drawn on the CPU, in one go. This used to be one drawImage per cell from the
// atlas onto an offscreen canvas, then the tint multiplied over it and the
// result added onto the screen - three passes, ~9300 draw calls a frame at full
// screen. Measured in Chrome (2026-11-05) that was 25-55 ms a frame on its own,
// against ~3 ms for the raycast that feeds it: the on-foot view went choppy in
// ASCII and stayed smooth in plain 3D. Now every glyph's coverage is read out of
// the atlas once (ascInit), each frame's pixels are written straight into one
// ImageData, and it goes to the screen with a single putImageData.
//
// Same picture as the old passes, done as arithmetic per pixel:
//   glyph   = tint * coverage                     (white glyph x tint, 'multiply')
//   mode 1  = glyph                               (on black)
//   mode 2  = bg*(1-ASC_SOLID) + tint*ASC_SOLID   ascii-city's "solid glyphs"
//             + glyph, clamped                    ('lighter')
// where bg is the frame's backdrop colour the old passes drew over.
let asciiMode = 2;                  // 0 off, 1 ascii, 2 ascii on solid cells (G cycles)
const ASC_NAMES = ['NORMAL','ASCII','ASCII SOLID'];
const ASC_RAMP  = ' .:-=+*%#@';     // sparse -> dense
const ASC_CW = 2, ASC_CH = 3;       // raycaster pixels per character cell
// fitted to a measured convoy frame: median luminance 37, 90th pct 55, 99th 83,
// lit windows ~150. The old 14..150 span put 80% of cells on the two faintest glyphs.
const ASC_LIFT = 2.6;               // max tint boost; the glyph, not the tint, says how dark
const ASC_SOLID = 0.24;             // mode 2 background strength
const ASC_LIGHT_R = 120, ASC_LIGHT_WARM = 60;   // a pixel this red and this warm is a lit window
let ascKey='', ascCols=0, ascRows=0, ascGW=0, ascGH=0;
let ascAtlas=null;                  // the glyphs, white on clear, one per ramp step
let ascMask=null;                   // ...read back once as coverage, 0..255 per pixel
let ascOut=null, ascOut32=null;     // the frame being written, and a 32-bit view of it
let ascLast = null;                 // last frame's glyph indices, for the harness
const ASC_BG = [11, 8, 16];         // '#0b0810', what render() clears to under the view

function ascInit(){
  ascCols = Math.floor(RC_W/ASC_CW); ascRows = Math.floor(RC_H/ASC_CH);
  // device pixels per cell: RC is half the pane, so a cell is 2*ASC_CW*PX wide
  ascGW = Math.round(RC_PANE.w*PX/ascCols); ascGH = Math.round(RC_PANE.h*PX/ascRows);
  ascAtlas = document.createElement('canvas');
  ascAtlas.width = ascGW*ASC_RAMP.length; ascAtlas.height = ascGH;
  const a = ascAtlas.getContext('2d', { willReadFrequently:true });
  a.fillStyle = '#fff'; a.textAlign = 'center'; a.textBaseline = 'middle';
  a.font = 'bold ' + ascGH + 'px ui-monospace,"DejaVu Sans Mono",monospace';
  for(let i=1;i<ASC_RAMP.length;i++) a.fillText(ASC_RAMP[i], (i+0.5)*ascGW, ascGH*0.55);
  // coverage = the atlas's alpha, laid out glyph by glyph, row by row
  const ad = a.getImageData(0, 0, ascAtlas.width, ascGH).data;
  ascMask = new Uint8Array(ASC_RAMP.length*ascGW*ascGH);
  for(let gi=0; gi<ASC_RAMP.length; gi++)
    for(let y=0; y<ascGH; y++)
      for(let x=0; x<ascGW; x++)
        ascMask[(gi*ascGH + y)*ascGW + x] = ad[(y*ascAtlas.width + gi*ascGW + x)*4 + 3];
  ascOut = ctx.createImageData(ascCols*ascGW, ascRows*ascGH);
  ascOut32 = new Uint32Array(ascOut.data.buffer);
  ascLast = new Uint8Array(ascCols*ascRows);
  ascKey = RC_W+'x'+RC_H+'@'+PX;
}

function asciiBlit(dx, dy){
  if(ascKey !== RC_W+'x'+RC_H+'@'+PX) ascInit();
  const src = rcCtx.getImageData(0, 0, RC_W, RC_H).data;
  const n = ASC_RAMP.length - 1;
  const inv = 1/(ASC_CW*ASC_CH), span = 1/(ASC_HI - ASC_LO);
  const GW = ascGW, GH = ascGH, OW = ascCols*GW, out = ascOut32, mask = ascMask;
  const solid = asciiMode === 2, keep = 1 - ASC_SOLID;
  for(let cy=0; cy<ascRows; cy++){
    for(let cx=0; cx<ascCols; cx++){
      let r=0, g=0, b=0, nl=0, lr=0, lg=0, lb=0;
      for(let yy=0; yy<ASC_CH; yy++){
        let o = ((cy*ASC_CH + yy)*RC_W + cx*ASC_CW)*4;
        for(let xx=0; xx<ASC_CW; xx++){
          const pr=src[o], pg=src[o+1], pb=src[o+2];
          r+=pr; g+=pg; b+=pb;
          if(pr > ASC_LIGHT_R && pr - pb > ASC_LIGHT_WARM){ nl++; lr+=pr; lg+=pg; lb+=pb; }
          o+=4;
        }
      }
      r*=inv; g*=inv; b*=inv;
      const lum = 0.299*r + 0.587*g + 0.114*b;
      let t = (lum - ASC_LO)*span; t = t<0 ? 0 : t>1 ? 1 : t;
      let gi = Math.round(Math.pow(t, ASC_GAMMA)*n);
      // A light wins its cell. Averaged, one lit pixel among five dark ones is
      // a dim '=' and the skyline goes out; instead the cell takes the light's
      // colour and a bright glyph - '*' for one lit pixel at LIGHTS_MIX 1, '+'
      // at 0.5 - rising to '@' as more of the cell is lit.
      if(nl){ r=lr/nl; g=lg/nl; b=lb/nl; gi = Math.max(gi, Math.min(n, Math.round(3 + LIGHTS_MIX*2) + nl)); }
      ascLast[cy*ascCols + cx] = gi;
      // the cell's tint, rounded the way the old tint image stored it
      const m = Math.max(r, g, b, 1), lift = Math.min(ASC_LIFT, 235/m);
      const tr = Math.min(255, Math.round(r*lift)), tg = Math.min(255, Math.round(g*lift)), tb = Math.min(255, Math.round(b*lift));
      const br = solid ? Math.round(ASC_BG[0]*keep + tr*ASC_SOLID) : 0;
      const bg = solid ? Math.round(ASC_BG[1]*keep + tg*ASC_SOLID) : 0;
      const bb = solid ? Math.round(ASC_BG[2]*keep + tb*ASC_SOLID) : 0;
      let p = cy*GH*OW + cx*GW;
      if(!gi){
        const c = 0xff000000 | (bb<<16) | (bg<<8) | br;    // RGBA bytes, little-endian
        for(let yy=0; yy<GH; yy++, p+=OW) for(let xx=0; xx<GW; xx++) out[p+xx] = c;
        continue;
      }
      let k = gi*GW*GH;
      for(let yy=0; yy<GH; yy++, p+=OW){
        for(let xx=0; xx<GW; xx++, k++){
          const cov = mask[k];
          if(!cov){ out[p+xx] = 0xff000000 | (bb<<16) | (bg<<8) | br; continue; }
          let R = br + ((tr*cov + 127)/255|0), G = bg + ((tg*cov + 127)/255|0), B = bb + ((tb*cov + 127)/255|0);
          if(R>255) R=255; if(G>255) G=255; if(B>255) B=255;
          out[p+xx] = 0xff000000 | (B<<16) | (G<<8) | R;
        }
      }
    }
  }
  ctx.putImageData(ascOut, Math.round(dx), Math.round(dy));
}

// ---------------------------------------------------------------- the turret
// Three aim models now:
//  - the PAD's right stick points the gun where you push it (padAimAngle), and
//    holds that bearing when you let go. It takes priority whenever the pad is
//    the chosen input, which is also how the mouse-vs-pad fight is settled: one
//    of them owns the aim for the whole session, picked in OPTIONS.
//  - 2P is first-person, so the mouse turns the gun by its *movement* (locked
//    pointer, like Counter-Strike): move and it turns, stop and it holds. No drift.
//  - 1P is top-down, so the mouse is twin-stick: the gun points straight at the
//    cursor's world position. Keyboard arrows are the rate-based fallback for both.
const TURRET_RATE = 2.3;           // rad/s, keyboard traverse
const FPS_SENS = 0.0042;           // radians of gun traverse per unit of mouse movement (2P)
function updateTurret(c, dt){
  const TAU=Math.PI*2;
  // 1P only: in split-screen the gun belongs to P2's locked mouse, so a pad there
  // drives for P1 and leaves the turret alone rather than fighting over it
  const padGun = padMode() && numPlayers===1;
  const padAim = padGun ? padAimAngle() : null;
  if(padGun && !c.dead){
    // turret is stored RELATIVE to the car, so subtracting c.angle here means the
    // gun keeps pointing where you aimed it while the car slides around under it.
    // padAimAngle() is null with the stick at rest: then the bearing just stays.
    if(padAim != null) c.turret = padAim - c.angle;
  } else if(numPlayers===1 && mouseIn && !c.dead){
    // twin-stick: aim the gun at the world point under the cursor (z=0 ground)
    const wx = (mouseSX - VCX)/S + cam.x;
    const wy = (mouseSY - VCY)/(S*KY) + cam.y;
    c.turret = Math.atan2(wy - c.y, wx - c.x) - c.angle;
  } else {
    let t=0;
    if(held('ArrowLeft'))  t-=1;
    if(held('ArrowRight')) t+=1;
    c.turret = (c.turret||0) + t*TURRET_RATE*dt;
    if(numPlayers===2){ c.turret += aimDX*FPS_SENS; aimDX=0; }   // locked-mouse traverse
  }
  c.turret = ((c.turret%TAU)+TAU)%TAU;
  if(c.turret>Math.PI) c.turret -= TAU;
  // R1 is the machine gun, R2 the missile - both held, like the mouse buttons
  // they stand in for (each gun has its own cooldown, so holding is safe)
  if(held('ArrowUp') || mouseFire || (padMode() && padHeld('R1'))) fireCannon(c);
  if(held('ArrowDown') || mouseFire2 || (padMode() && padHeld('R2'))) fireMissile(c);
}

let aimDY=0;                       // locked-mouse vertical movement, on foot (look up/down)
let aimDX=0, mouseSX=0, mouseSY=0, mouseIn=false, mouseFire=false, mouseFire2=false;
function pointerLocked(){ return typeof document!=='undefined' && document.pointerLockElement===cv; }
function bindGunnerMouse(){
  cv.addEventListener('contextmenu', e=>e.preventDefault());
  cv.addEventListener('mousemove', e=>{
    const r=cv.getBoundingClientRect();
    mouseSX=(e.clientX-r.left)*(W/r.width);
    mouseSY=(e.clientY-r.top)*(H/r.height);
    mouseIn=true;
    // 2P: accumulate raw mouse movement while the pointer is locked (FPS aim)
    if((numPlayers===2 || onFoot) && pointerLocked()) aimDX += e.movementX||0;
    if(onFoot && pointerLocked()) aimDY += e.movementY||0;
  });
  cv.addEventListener('mouseleave', ()=>{ mouseIn=false; mouseFire=false; mouseFire2=false; });
  cv.addEventListener('mousedown', e=>{
    Snd.boot();
    // menus are keyboard-driven; a click just advances (title -> setup -> play)
    if(state!=='play'){
      if(state==='title') menuChoose();
      else if(state==='garage') garagePick();
      else if(state==='store') storeClick();
      else if(state==='comic') comicAdvance();
      else if(state==='over' && stage==='run') onPress('Enter');
      else if(state==='setup') startMatch(numPlayers);
      else if(state==='over') state='title';
      return;
    }
    // on foot: the first click grabs the pointer for mouse-look
    if(onFoot){
      if(cv.requestPointerLock && !pointerLocked()) cv.requestPointerLock();
      else if(true) walkFire();
      return;
    }
    // 2P grabs the pointer on first click, then clicks fire; 1P keeps the cursor visible
    if(numPlayers===2 && cv.requestPointerLock && !pointerLocked()){ cv.requestPointerLock(); }
    if(e.button===2) mouseFire2=true; else mouseFire=true;
  });
  cv.addEventListener('mouseup', e=>{ if(e.button===2) mouseFire2=false; else mouseFire=false; });
}

// ---------------------------------------------------------------- on foot (STREET)
// Out of the car, you are a point with a radius and a heading. You walk in the
// same world the car drives in: the road, over the low barrier, and in among
// the roadside buildings, which are solid. The view is the gunner's raycaster
// at full screen with the eye lowered to standing height, so everything the
// gunner sees - the city, the far skyline, the parked car - is already there.
//
// The car does not go anywhere while you are out (see updateCar: the handbrake
// goes on), and the driving camera stays on it, so getting back in drops you
// straight back into the view you left.
const CAR_HL = 19, CAR_HW = 10;      // the player's car as a box, for walking into it
let onFoot = false;
const walker = { x:0, y:0, a:0, pitch:0, hp:WALK_HP, bob:0, moving:0, t:0 };
// Looking up and down, after C:\proj\ascii-city: a "shift", not a tilt. The
// camera stays level and the horizon slides by RC_VD*tan(pitch), so every
// screen column is still a world-vertical plane - which is all this raycaster
// knows how to draw - and tall buildings don't splay outward as you look up
// at them (the bug ascii-city had with a real tilt). Its walking limits too.
let walkMsg = '', walkMsgT = 0;
let walkViewMsgT = 0, walkMs = 0;    // the view-distance readout, and what a walk frame costs
const walkBld = [];

function walkSay(m){ walkMsg = m; walkMsgT = 1.6; }

function walkReset(){
  if(onFoot && typeof document!=='undefined' && document.exitPointerLock && pointerLocked())
    document.exitPointerLock();
  onFoot = false; walkMsg = ''; walkMsgT = 0;
}

// circle against an axis-aligned box: push the point out along the short way.
// STREET's buildings all run along the road, so their quads are axis-aligned.
function pushOutBox(p, x0, y0, x1, y1, r){
  const cx = clamp(p.x, x0, x1), cy = clamp(p.y, y0, y1);
  let dx = p.x - cx, dy = p.y - cy;
  const d2 = dx*dx + dy*dy;
  if(d2 >= r*r) return false;
  if(d2 > 1e-8){
    const d = Math.sqrt(d2);
    p.x = cx + dx/d*r; p.y = cy + dy/d*r;
  } else {
    // centre inside the box: out through the nearest face
    const l = p.x - x0, rr = x1 - p.x, t = p.y - y0, b = y1 - p.y;
    const m = Math.min(l, rr, t, b);
    if(m===l) p.x = x0 - r; else if(m===rr) p.x = x1 + r;
    else if(m===t) p.y = y0 - r; else p.y = y1 + r;
  }
  return true;
}

function walkCollide(p){
  let hit = false;
  if(street){
    for(const c of cityChunks(p.y - WALK_R, p.y + WALK_R, p.x < 0 ? -1 : 1))
      for(const b of c.cores) if(circleBox(p, b.x0, b.y0, b.x1, b.y1, WALK_R, false)) hit = true;
  } else if(showBuildings){
    for(const b of survivalBuildings(p.y - 320, p.y + 320, walkBld)){
      let x0=1e9, y0=1e9, x1=-1e9, y1=-1e9;
      for(const c of b.q){ x0=Math.min(x0,c.x); x1=Math.max(x1,c.x); y0=Math.min(y0,c.y); y1=Math.max(y1,c.y); }
      if(pushOutBox(p, x0, y0, x1, y1, WALK_R)) hit = true;
    }
  }
  // the parked car, as a box in its own frame
  const c = cars[0];
  if(c && !c.dead){
    const ca = Math.cos(c.angle), sa = Math.sin(c.angle);
    const lp = { x: (p.x-c.x)*ca + (p.y-c.y)*sa, y: -(p.x-c.x)*sa + (p.y-c.y)*ca };
    if(pushOutBox(lp, -CAR_HL, -CAR_HW, CAR_HL, CAR_HW, WALK_R)){
      p.x = c.x + lp.x*ca - lp.y*sa; p.y = c.y + lp.x*sa + lp.y*ca;
      hit = true;
    }
  }
  const lim = street ? CITY_W - WALK_R : WALK_LIM;
  p.x = clamp(p.x, -lim, lim);
  return hit;
}

function updateWalker(dt){
  gunTick(dt);
  const w = walker;
  w.t += dt;
  walkMsgT = Math.max(0, walkMsgT - dt);
  // look: locked mouse, or the arrows
  let turn = 0;
  if(held('ArrowLeft'))  turn -= 1;
  if(held('ArrowRight')) turn += 1;
  if(padMode()) turn += padLookTurn()*(PAD.LOOK_RATE/WALK_TURN);   // the stick looks faster than the arrows
  w.a += turn*WALK_TURN*dt + aimDX*WALK_SENS; aimDX = 0;
  let tilt = 0;
  if(held('ArrowUp'))   tilt += 1;
  if(held('ArrowDown')) tilt -= 1;
  if(padMode()) tilt += padLookPitch();
  w.pitch = clamp(w.pitch + tilt*WALK_PITCH_RATE*dt - aimDY*WALK_SENS, WALK_PITCH_DOWN, WALK_PITCH_UP);
  aimDY = 0;
  const TAU = Math.PI*2;
  w.a = ((w.a % TAU) + TAU) % TAU;
  // move: W/S along the view, A/D strafe. Right of heading a is (-sin a, cos a).
  let f = 0, st = 0;
  if(held('KeyW')) f += 1;
  if(held('KeyS')) f -= 1;
  if(held('KeyD')) st += 1;
  if(held('KeyA')) st -= 1;
  // the pad walks on the left stick (up is -1, so f flips), L3 runs
  if(padMode()){ const s = padStick('L'); f -= s.y; st += s.x; }
  const n = Math.hypot(f, st);
  const run = held('ShiftLeft') || held('ShiftRight') || (padMode() && padHeld('L3'));
  w.moving = n > 0 ? 1 : 0;
  if(n > 0){
    // min(1,n)/n keeps the direction and lets a part-pushed stick walk slowly.
    // On the keyboard n is 1 or root-2 and min(1,n) is 1, so that path is unchanged.
    const spd = (run ? RUN_SPD : WALK_SPD)*Math.min(1, n)/n;
    const fx = Math.cos(w.a), fy = Math.sin(w.a);
    w.x += (fx*f - fy*st)*spd*dt;
    w.y += (fy*f + fx*st)*spd*dt;
    w.bob += dt*(run ? 13 : 9);
  }
  walkCollide(w);
  foeBlock(w);                     // foe.js: a sentry is solid, and will not let you past
  if(true && (held('Space') || (padMode() && padHeld('R1')))) walkFire();
}

// true's hook: the pistol (fpsgun.js)
function walkFire(){ gunFire(); }

function nearCar(){
  const c = cars[0];
  return c && !c.dead && Math.hypot(walker.x - c.x, walker.y - c.y) < ENTER_R;
}

function toggleOnFoot(){
  const me = cars[0];
  if(!me || me.dead) return;
  aimDX = 0; aimDY = 0;
  if(!onFoot){
    if(Math.abs(me.speed||0) > EXIT_SPEED){ walkSay('STOP THE CAR FIRST'); return; }
    // out of the driver's door (the car's left), or the right if that is blocked
    const lx = Math.sin(me.angle), ly = -Math.cos(me.angle);
    const off = CAR_HW + WALK_R + 4;
    let placed = false;
    for(const side of [1, -1]){
      const p = { x: me.x + lx*off*side, y: me.y + ly*off*side };
      const x0 = p.x, y0 = p.y;
      walkCollide(p);
      if(Math.hypot(p.x - x0, p.y - y0) < 1){ walker.x = p.x; walker.y = p.y; placed = true; break; }
    }
    if(!placed){ walkSay('NO ROOM TO OPEN THE DOOR'); return; }
    walker.a = me.angle; walker.pitch = 0; walker.bob = 0; walker.moving = 0; walker.hp = WALK_HP;
    onFoot = true; footN++; walkGraceT = 1.5;   // the hunters lose interest (aiCruise)
    mouseFire = false; mouseFire2 = false;
    Snd.engineOff(); Snd.hit();
    // a key press counts as a user gesture, so the mouse can be grabbed right away
    try{ if(cv.requestPointerLock && !pointerLocked()) cv.requestPointerLock(); }catch(e){}
    walkSay(pointerLocked() ? '' : 'CLICK TO LOOK WITH THE MOUSE');
  } else {
    if(!nearCar()){ walkSay('WALK BACK TO THE CAR'); return; }
    walkReset();
    Snd.hit();
  }
}

// first person, whole screen
function drawWalkView(){
  const t0 = performance.now();
  const w = walker;
  const eye0 = EYE_Z, hz0 = RC_HORIZON;
  EYE_Z = WALK_EYE + (w.moving ? Math.sin(w.bob)*0.7 : 0);   // a little head bob
  // look up = the horizon slides DOWN the screen (see WALK_PITCH_UP)
  RC_HORIZON = Math.round(hz0 + RC_VD*Math.tan(w.pitch));
  buildConvoyRings(w.y, w.x, w.y, w.a);
  rcBackground(w.x, w.y, w.a);
  rcWalls(w.x, w.y, w.a);
  rcSprites(w.x, w.y, w.a);
  if(true) gunDraw(w);                  // the gun in your hands, before the blit (ascii takes it too)
  EYE_Z = eye0; RC_HORIZON = hz0;
  const p = RC_PANE;
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  if(asciiMode) asciiBlit(p.x*PX, p.y*PX);
  else ctx.drawImage(rcCv, 0,0,RC_W,RC_H, p.x*PX, p.y*PX, p.w*PX, p.h*PX);
  ctx.restore();
  walkMs = lerp(walkMs, performance.now() - t0, 0.08);      // smoothed, so it reads
}

  ctx.save(); ctx.scale(PX,PX);

  if(stage === 'run'){

  ctx.fillRect(VW/2, VH/2-4, 1, 3); ctx.fillRect(VW/2, VH/2+2, 1, 3);
  ctx.globalAlpha=1;
  // where the car is: an arrow relative to where you face, and how far

  if(devMode){ ctx.textAlign='right'; ctx.fillStyle='#e0b73c'; ctx.fillText('DEV', 105, 10); ctx.textAlign='left'; }
  // dev: the sentry count. FOE_POP.MEAN is the knob the user will want to turn

  }
  if(c){
    const dx = c.x - walker.x, dy = c.y - walker.y, d = Math.hypot(dx, dy);
    const rel = Math.atan2(dy, dx) - walker.a;      // 0 = straight ahead, + = to the right
    const ax = 18, ay = 26;
    ctx.save(); ctx.translate(ax, ay); ctx.rotate(rel);   // triangle points up = straight ahead
    ctx.fillStyle = d < ENTER_R ? '#4ade80' : '#e0b73c';
    ctx.beginPath(); ctx.moveTo(0,-5); ctx.lineTo(3.5,3); ctx.lineTo(-3.5,3); ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.fillStyle='#e8d5b0'; ctx.fillText('CAR '+Math.round(d)+'m', 28, 22);
  }
  // prompts

  else if(walkMsgT > 0 && walkMsg) msg = walkMsg;
  if(msg){
