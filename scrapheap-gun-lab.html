<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scrapheap - GUN LAB</title>
<style>
  html,body{margin:0;height:100%;background:#0d0a10;overflow:hidden;
    font-family:ui-monospace,"DejaVu Sans Mono",monospace;color:#e8d5b0}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;
    box-shadow:0 0 0 2px #241a26,0 24px 60px rgba(0,0,0,.7)}
  #hint{position:fixed;left:10px;bottom:8px;font-size:11px;color:#5a4a5e;letter-spacing:.5px}
</style>

<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="hint">WASD drive &middot; ARROWS or mouse aim/fire &middot; SPACE boost &middot; V viewmodel &middot; Z sentry &middot; Q mine &middot; P / ESC pause &middot; M map &middot; O sound &middot; R resolution &middot; F fps &middot; I dev mode</div>
<script src="config.js"></script>
<script src="fpsgun.js"></script>
<script src="pad.js"></script>
<script src="assets/guns/guns-2d.js"></script>
<script src="assets/enemies/enemies-2d.js"></script>
<script src="assets/enemies/sentry-vox.js"></script>
<script src="assets/enemies/sentry-vox-64.js"></script>
<script src="foe.js"></script>
<!-- voxel cars for the GARAGE (tools/car_voxelize.py). A missing file just drops that car from the list. -->
<script src="assets/voxcars/aspen-64.js"></script>
<script src="assets/voxcars/sports-64.js"></script>
<script src="assets/voxcars/biome-64.js"></script>
<script>
"use strict";
// ---------------------------------------------------------------- constants
const VW = 640, VH = 360;        // 16:9, split into two panes of 640x180
const SCALES = [1, 2, 3];
let PX = 2;                      // canvas pixels per virtual unit (resolution)
let S = 1.6;                     // world scale of the driving pane; rescale() fixes this
let W = VW*PX, H = VH*PX;        // internal render resolution
// centre and half-extents of the pane currently being drawn in world space
let VCX = W/2, VCY = H*0.75, VHW = 400, VHH = 112;
let VIEW_HH = 500;               // vertical stage: world-y cull half-extent (biased view)
const KY = 0.62;                 // vertical squash -> axonometric ground plane
let ARENA_W = 1800, ARENA_H = 1400;
let arenaShape = 'rect';               // 'rect' or 'oval' bowl
const FRAG_LIMIT = 1e9;
const DT = 1/60;

// ---- Mad Max tunables ----------------------------------------------------
// Three stages share this engine, chosen by `stage`:
//  CONVOY - horizontal survival: forward +x, lateral y, gunner stacks on top.
//  ASCENT - vertical survival:   forward -y, lateral x, gunner to the right.
//  LOOP   - a race round a closed superellipse track (reused from the old loop
//           build's map): laps, positions, no forced scroll. The engine descends
//           from that race build, so this is its ancestor mode brought back.
//  STREET - (walk fork) ASCENT's road with no forced scroll and no enemies, solo
//           only. Stop the car, press E, and you get out and walk in first
//           person (the gunner's raycaster, full screen) - on the road and in
//           among the roadside buildings. E next to the car gets you back in.
// `vertical`/`race`/`street` are derived from `stage` in applyStage(); axis- and
// mode-dependent code branches on them.
let stage = 'run';               // 'run' (the game) | dev stages: 'convoy' | 'ascent' | 'loop' | 'street'
let vertical = false;            // ASCENT and STREET (forward is -y)
let race = false;                // LOOP only (closed-track race)
let street = false;              // STREET only (free drive, park, walk)
// Tunables live in config.js (loaded first). What's left here is runtime state.
let   CRUISE_BAND = 74;          // W/S trims your speed +/- this around the scroll pace (per stage)
let   FRONT_MAX = 210;           // how far ahead of the camera you may push (soft wall; per stage)
let   BACK_EDGE = 240;           // soft wall this far behind the camera (per stage)

const FENCE_OUT_C = 210;         // perimeter fence, outside the barrier, for the horizon
let   VCY_BIAS = 0.5;            // where the camera point sits down the pane (per stage)
let   numPlayers = 2;            // 1 = solo (drive + gun, one view), 2 = split-screen with a gunner

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d', { alpha:false });
cv.width = W; cv.height = H;
ctx.imageSmoothingEnabled = false;

function setRes(scale){ PX = scale; rescale(); }

// PX drives the canvas and both HUDs; S = PX*ZOOM2D drives every world-space
// coordinate in the driving pane. The gunner pane does its own projection.
function rescale(){
  layoutPanes();
  S = PX*ZOOM2D; W = VW*PX; H = VH*PX;
  cv.width = W; cv.height = H;
  ctx.imageSmoothingEnabled = false;
  VCX = (PANE_P1.x + PANE_P1.w/2)*PX;
  // the vertical stage sits the camera point low (VCY_BIAS) so you see up the road
  VCY = (PANE_P1.y + PANE_P1.h*VCY_BIAS)*PX;
  VHW = PANE_P1.w/(2*ZOOM2D);
  VHH = PANE_P1.h/(2*ZOOM2D);
  if(street){
    // vertical soft walls + cull follow the actual visible road height (biased view)
    const aheadV  = (VCY - PANE_P1.y*PX)/(KY*S);
    const behindV = ((PANE_P1.y+PANE_P1.h)*PX - VCY)/(KY*S);
    FRONT_MAX = Math.max(140, aheadV - 60);
    BACK_EDGE = Math.max(120, behindV - 40);
    VIEW_HH   = Math.max(aheadV, behindV) + 80;
  } else {
    // Convoy's forward axis is x and its camera sits centred, so both clamps
    // follow the visible half-width the same way the vertical stage's follow its
    // height. They used to be hardcoded at 210/240 against a 400-unit view, which
    // is what stopped the car a little past halfway to the screen edge with
    // nothing there to see - the "invisible walls".
    FRONT_MAX = Math.max(140, VHW - 60);
    BACK_EDGE = Math.max(120, VHW - 60);
  }
  makePatterns();
  if(race && track) makeTrack();                // loop paths bake S into their coords
  CAR2D.clear();                                // sheets bake S into their bitmaps
  clearFoeSheets();                             // ...and so do the foes' (foe.js)
  for(const c of cars) c.sprite = bakeCarSprites(c);
  resize();
}

function resize(){
  const s = Math.max(1, Math.floor(Math.min(innerWidth/W, innerHeight/H) * 100) / 100);
  cv.style.width = (W*s)+'px'; cv.style.height = (H*s)+'px';
}
addEventListener('resize', resize); resize();

// ---------------------------------------------------------------- utils
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];
function angDiff(a,b){ let d=(b-a)%(Math.PI*2); if(d>Math.PI)d-=Math.PI*2; if(d<-Math.PI)d+=Math.PI*2; return d; }
function shade(hex,f){
  const n=parseInt(hex.slice(1),16);
  const r=clamp(((n>>16)&255)*f,0,255)|0, g=clamp(((n>>8)&255)*f,0,255)|0, b=clamp((n&255)*f,0,255)|0;
  return 'rgb('+r+','+g+','+b+')';
}
function rrect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y); c.lineTo(x+w-r,y); c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r); c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h); c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r); c.quadraticCurveTo(x,y,x+r,y); c.closePath();
}

// ---------------------------------------------------------------- audio
const Snd = (function(){
  let ac=null, master=null, engGain=null, engOsc=null, engOsc2=null, on=true, started=false;
  function boot(){
    if(started) return; started=true;
    try{
      ac = new (window.AudioContext||window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value=0.32; master.connect(ac.destination);
      engGain = ac.createGain(); engGain.gain.value=0; engGain.connect(master);
      engOsc = ac.createOscillator(); engOsc.type='sawtooth'; engOsc.frequency.value=60;
      engOsc2 = ac.createOscillator(); engOsc2.type='square'; engOsc2.frequency.value=41;
      const f = ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=700; f.Q.value=3;
      engOsc.connect(f); engOsc2.connect(f); f.connect(engGain);
      engOsc.start(); engOsc2.start();
    }catch(e){ ac=null; }
  }
  function blip(freq, dur, type, vol, slide){
    if(!ac||!on) return;
    const o=ac.createOscillator(), g=ac.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(freq, ac.currentTime);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,slide), ac.currentTime+dur);
    g.gain.setValueAtTime(vol||0.25, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+dur);
    o.connect(g); g.connect(master); o.start(); o.stop(ac.currentTime+dur+0.02);
  }
  function noise(dur, vol, cutStart, cutEnd){
    if(!ac||!on) return;
    const n=(ac.sampleRate*dur)|0, buf=ac.createBuffer(1,n,ac.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const src=ac.createBufferSource(); src.buffer=buf;
    const f=ac.createBiquadFilter(); f.type='lowpass';
    f.frequency.setValueAtTime(cutStart||1800, ac.currentTime);
    f.frequency.exponentialRampToValueAtTime(cutEnd||120, ac.currentTime+dur);
    const g=ac.createGain(); g.gain.value=vol||0.4;
    src.connect(f); f.connect(g); g.connect(master); src.start();
  }
  // Soundtrack. A plain <audio> element rather than a decoded buffer: the file is
  // several megabytes, so this streams and loops it instead of holding the whole
  // thing in memory, and it costs no nodes in the graph. Autoplay stays blocked
  // until the page has had a user gesture, so play() is simply retried on later
  // frames - by the time a match is running, a key has been pressed to start it.
  let mus=null, musTried=false, musPending=false;
  const MUSIC_SRC = 'assets/Game.m4a.mp4', MUSIC_VOL = 0.5;
  function music(want){
    if(!musTried){
      musTried = true;
      try{ mus = new Audio(MUSIC_SRC); mus.loop = true; mus.preload = 'auto'; }
      catch(e){ mus = null; }              // no Audio here (headless): stay quiet
    }
    if(!mus) return;
    mus.volume = on ? MUSIC_VOL : 0;       // M mutes the track with everything else
    if(want){
      if(mus.paused && !musPending){
        musPending = true;
        const pr = mus.play();
        if(pr && pr.then) pr.then(()=>{musPending=false;}, ()=>{musPending=false;});
        else musPending = false;
      }
    } else if(!mus.paused || musPending){
      musPending = false; mus.pause(); mus.currentTime = 0;   // back to the top next run
    }
  }

  return {
    boot, music,
    toggle(){ on=!on; if(master) master.gain.value = on?0.32:0;
              if(mus) mus.volume = on?MUSIC_VOL:0; return on; },
    isOn(){ return on; },
    shot(){ blip(560,0.06,'square',0.16,180); },
    missile(){ noise(0.35,0.3,900,300); blip(180,0.3,'sawtooth',0.14,520); },
    boom(){ noise(0.55,0.75,2200,60); blip(90,0.4,'sawtooth',0.22,32); },
    hit(){ blip(200,0.05,'square',0.12,90); },
    pickup(){ blip(660,0.07,'square',0.16); setTimeout(()=>blip(990,0.09,'square',0.16),60); },
    crash(){ noise(0.18,0.4,1400,200); },
    mine(){ blip(1200,0.04,'square',0.1); },
    // boost: cutoff and pitch both RISE (noise()/blip() ramp either direction), so
    // it reads as winding up rather than as one more explosion
    boost(){ noise(0.5,0.3,500,2400); blip(140,0.45,'sawtooth',0.15,430); },
    engine(rpm, load){
      if(!ac||!engGain) return;
      engGain.gain.value = 0.05 + load*0.05;
      engOsc.frequency.value = 46 + rpm*118;
      engOsc2.frequency.value = 31 + rpm*79;
    },
    engineOff(){ if(engGain) engGain.gain.value=0; }
  };
})();

// ---------------------------------------------------------------- input
const keys = Object.create(null);
const held = k => !!keys[k];
// MOUSE or CONTROLLER, picked in OPTIONS and remembered. padMode() (pad.js) is
// what the game actually asks - it also wants a pad to be plugged in, so a saved
// 'pad' with nothing connected quietly stays on the mouse.
let inputMode = 'mouse';
try { const v = localStorage.getItem('scrapheap.input'); if(v==='mouse'||v==='pad') inputMode = v; } catch(e){}
function setInputMode(m){
  inputMode = m;
  try { localStorage.setItem('scrapheap.input', m); } catch(e){}
  syncHint();
}
addEventListener('keydown', e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();  // arrows are P2's gun
  Snd.boot();
  if(!keys[e.code]) onPress(e.code);
  keys[e.code]=true;
});
addEventListener('keyup', e=>{ keys[e.code]=false; });
addEventListener('blur', ()=>{ for(const k in keys) keys[k]=false; });

let showFps=false, paused=false;
// DEV MODE: your car takes no damage and pits spit it back out, so a stage can be
// sat in and looked at rather than survived. ON by default while this fork is
// being built - it is meant to be loud about it (badge on the hull plate, line on
// the menus), and `I` turns it off for a real run. Enemies are unaffected: they
// still take fire, still die, still score.
let devMode = DEV_MODE;
function onPress(code){
  // the map (M) takes the keyboard while it's open: M / ESC close, - / = zoom
  if(state==='play' && code===MAP_KEY){ toggleMap(); return; }
  if(mapOpen && state==='play'){
    if(code==='Escape') mapOpen = false;
    if(code==='Minus') MAP_ZOOM = Math.min(MAP_RADII.length-1, MAP_ZOOM+1);
    if(code==='Equal') MAP_ZOOM = Math.max(0, MAP_ZOOM-1);
    if(code===SOUND_KEY) Snd.toggle();
    return;
  }
  if(code==='KeyV' && onFoot){ gunCycleMethod(); return; }
  if(code==='KeyF') showFps=!showFps;
  if(code==='KeyI') devMode=!devMode;
  if(code==='KeyR') setRes(SCALES[(SCALES.indexOf(PX)+1)%SCALES.length]);
  if(code===SOUND_KEY) Snd.toggle();
  if(code==='KeyG'){ asciiMode = (asciiMode+1)%3; carSheetsReset(); }   // off -> ascii -> ascii on solid cells
  if(code==='KeyB'){ showBuildings = !showBuildings; if(race && track) buildRingsLoop(); }
  if(code==='KeyH'){ showFence = !showFence; if(race && track) buildRingsLoop(); }
  if(code==='KeyP' && state==='play') paused=!paused;
  if(code==='Space' && state==='play' && !onFoot) tryBoost(cars[0]);
  // Q drops a mine behind the car (mines come from pickups; the run starts with MINES_START)
  if(code===MINE_KEY && state==='play' && !onFoot && !paused && cars[0] && !cars[0].dead) dropMine(cars[0]);
  if(code==='KeyE' && state==='play' && street && !paused) toggleOnFoot();
  if(code===ENEMY_TOGGLE_KEY && state==='play' && !paused) toggleEnemies();
  // how far the walker sees (STREET, on foot): 9 nearer, 0 further
  if((code==='Digit9' || code==='Digit0') && state==='play' && onFoot){
    const i = VIEW_STEPS.indexOf(VIEW_D) + (code==='Digit0' ? 1 : -1);
    VIEW_D = VIEW_STEPS[clamp(i, 0, VIEW_STEPS.length-1)];
    walkViewMsgT = 2.5;
  }
  // the gunner camera's feel hangs on two numbers that are hard to guess
  // without looking at them, so make them adjustable in place
  if(code==='BracketLeft')  { if(onFoot) WALK_EYE = clamp(WALK_EYE-1, 8, 40); else EYE_Z = clamp(EYE_Z-2, 12, 70); }
  if(code==='BracketRight') { if(onFoot) WALK_EYE = clamp(WALK_EYE+1, 8, 40); else EYE_Z = clamp(EYE_Z+2, 12, 70); }
  if(code==='Minus')        setFov(Math.round(RC_FOV*180/Math.PI) - 5);
  if(code==='Equal')        setFov(Math.round(RC_FOV*180/Math.PI) + 5);
  // how much bigger than perspective a far enemy is drawn in the gunner's pane
  if(code==='Comma')        CAR_MAG_MAX = clamp(CAR_MAG_MAX-0.1, 1, 4);
  if(code==='Period')       CAR_MAG_MAX = clamp(CAR_MAG_MAX+0.1, 1, 4);

  // the intro comic: ENTER / SPACE next, ESC skips it
  if(state==='comic'){
    if(code==='Enter' || code==='NumpadEnter' || code==='Space'){ comicAdvance(); return; }
    if(code==='Escape'){ comicEnd(); return; }
  }
  // testing: straight to the city gate, from the menu or anywhere in a run
  if(code===SKIP_TO_CITY_KEY && (state==='title' || state==='play' || state==='over' || state==='comic') && !paused){ skipToCity(); return; }
  // the menu: ENTER / SPACE starts the run. The digits are dev shortcuts to the
  // stages this engine grew out of (not shown on the menu).
  if(state==='store'){
    if(storeLocked()) return;                       // keys still held from driving don't count
    if(code==='ArrowUp'||code==='KeyW')        storeMove(-1);
    else if(code==='ArrowDown'||code==='KeyS') storeMove(1);
    else if(code==='Enter'||code==='NumpadEnter') storeChoose();
    else if(code==='Escape'){ if(storeArmed) storeArmed = false; else storeIdx = STORE_ROWS.length - 1; }
    return;
  }
  // dev mode (I): K = Scrap Saints cash, J = open their garage here
  if(devMode && state==='play' && stage==='run' && !street){
    if(code==='KeyK'){ cash += SAINTS.DEV_CASH; saintsPay = { amt:SAINTS.DEV_CASH, t:1.8 }; }
    if(code==='KeyJ'){ openStore(); return; }
  }
  // Z drops a sentry 120 units ahead of you, facing back. The city places its own
  // now (citySentries), but one dropped by hand has no chunk, so it is never
  // culled and is still the quickest way to get a sentry in front of the camera.
  // X: voxel model <-> the flat picture, to compare them in place
  if(code==='KeyX' && state==='play'){ walkSay('FOE: ' + foeCycleRender()); return; }
  // Y: set every sentry marching in a straight line. Not the AI - this is how you
  // look at the RIG. The AI only writes `walk` on a sentry it has provoked, which
  // is what leaves this switch working.
  if(code==='KeyY' && state==='play'){
    const on = !foes.some(f => f.walk);
    for(const f of foes) f.walk = on;
    walkSay('SENTRIES ' + (on ? 'WALKING' : 'STOPPED'));
    return;
  }
  if(code==='KeyZ' && state==='play' && onFoot){
    spawnFoe(walker.x + Math.cos(walker.a)*120, walker.y + Math.sin(walker.a)*120, walker.a + Math.PI);
    return;
  }
  if(state==='options'){
    if(code==='ArrowUp'||code==='KeyW')        optMove(-1);
    else if(code==='ArrowDown'||code==='KeyS') optMove(1);
    // left/right set the two choices outright, enter toggles - either reads naturally
    else if(code==='ArrowLeft'||code==='ArrowRight'||code==='Enter'||code==='NumpadEnter'||code==='Space') optChoose();
    else if(code==='Escape') state='title';
    return;
  }
  if(state==='garage'){
    if(code==='ArrowLeft'||code==='KeyA') garageStep(-1);
    else if(code==='ArrowRight'||code==='KeyD') garageStep(1);
    else if(code==='Enter'||code==='NumpadEnter'||code==='Space') garagePick();
    else if(code==='Escape') state='title';
    return;
  }
  if(state==='title'){
    if(code==='Enter'||code==='NumpadEnter'||code==='Space'){ menuChoose(); return; }
    if(menuPop == null && (code==='ArrowUp'||code==='KeyW'))   { menuIdx = (menuIdx + MENU.length - 1) % MENU.length; return; }
    if(menuPop == null && (code==='ArrowDown'||code==='KeyS')) { menuIdx = (menuIdx + 1) % MENU.length; return; }
    if(code==='Digit1'||code==='Numpad1'){ stage='convoy'; state='setup'; }
    else if(code==='Digit2'||code==='Numpad2'){ stage='ascent'; state='setup'; }
    else if(code==='Digit3'||code==='Numpad3'){ stage='loop';   state='setup'; }
    else if(code==='Digit4'||code==='Numpad4'){ stage='street'; startMatch(1); }   // solo only: no setup
    return;
  }
  if(state==='setup'){
    if(code==='Digit1'||code==='Numpad1') startMatch(1);
    else if(code==='Digit2'||code==='Numpad2') startMatch(2);
    else if(code==='Enter'||code==='NumpadEnter'||code==='Space') startMatch(numPlayers);
    else if(code==='Escape') state='title';
    return;
  }
  // ESC never ends a run: in play it pauses (same as P). Leaving for the menu
  // takes a second, different key while paused - BACKSPACE - so a stray ESC is harmless.
  if(state==='play'){
    if(code==='Escape'){ paused = !paused; return; }
    if(code==='Backspace' && paused){ paused=false; state='title'; Snd.engineOff(); walkReset(); return; }
  }
  if(code==='Escape'){ state='title'; Snd.engineOff(); walkReset(); return; }
  if(state==='over' && stage==='run'){
    if(code==='Enter'||code==='NumpadEnter'){
      if(checkpoint && winner!=='gate') restartFromCheckpoint(); else startMatch(1);
    }
    return;
  }
  if(state==='over'){
    if(code==='Digit1'||code==='Numpad1') startMatch(1);
    else if(code==='Digit2'||code==='Numpad2') startMatch(2);
    else if(code==='Enter'||code==='NumpadEnter') startMatch(numPlayers);
    else if(code==='KeyT') state='title';        // T -> pick a different stage
  }
}

// ---------------------------------------------------------------- the pad, once a frame
// The Gamepad API is polled, so a frame of pad input has to be turned into the two
// things the game already understands: PRESSES, which go through onPress as key
// codes - so the title, garage, store and wreck screens need no pad code of their
// own and can never drift out of step with the keyboard - and HELD state, which is
// read where it is used (updateCar, updateTurret, updateWalker).
const PAD_MENU_STATES = { title:1, options:1, garage:1, store:1, setup:1, over:1, comic:1 };
function padTick(dt){
  padPoll(dt);                       // always: this is how a pad being plugged in is noticed
  if(!padConnected()) return;
  // SCREENS answer to the pad whenever one is plugged in, even in MOUSE mode -
  // otherwise picking up a pad would mean reaching for the keyboard to get to
  // OPTIONS and switch it on, which is the one thing you'd want the pad for.
  // Only the game itself is gated on the device OPTIONS picked.
  if(PAD_MENU_STATES[state] || (state==='play' && paused)){
    if(padRepeat('UP'))      onPress('ArrowUp');
    if(padRepeat('DOWN'))    onPress('ArrowDown');
    if(padRepeat('LEFT'))    onPress('ArrowLeft');
    if(padRepeat('RIGHT'))   onPress('ArrowRight');
    if(padPressed('CROSS'))  onPress('Enter');
    if(padPressed('CIRCLE')) onPress('Escape');
  }
  if(!padMode()) return;
  if(padPressed('START')) onPress('Escape');     // pause, and unpause again
  if(state !== 'play' || paused) return;
  // in the run, the taps only. Routed through onPress so each one keeps the same
  // guards as its key (a mine still refuses on foot, boost still refuses in a pit).
  if(onFoot){
    if(padPressed('CROSS')) onPress('KeyE');     // back in the car
    return;
  }
  if(padPressed('L1'))     onPress('Space');     // boost
  if(padPressed('SQUARE')) onPress(MINE_KEY);    // mine
  if(padPressed('CROSS'))  onPress('KeyE');      // out of the car (STREET only)
}

// ---------------------------------------------------------------- ground tile
let groundTile=null, dirtTile=null;

// tiles are built at the current render scale so they stay aligned to the world
let patS = 0;                       // the S the tiles were built at
function makePatterns(){

  a.strokeStyle='rgba(90,76,96,.16)'; a.lineWidth=S;

// ---------------------------------------------------------------- world state
let cars=[], shots=[], mines=[], fx=[], skids=[], pads=[], blocks=[];
let cam={x:0,y:0,shake:0}, state='title', winner=null, matchTime=0;
let mode='convoy', level=1, track=null, finishOrder=[], hazards=[], bowl=null;
const LAPS = 3;

// convoy runtime
let camV = CAM_V0;               // current forced scroll speed
let distance = 0;                // world units survived (the score)
let bestDist = 0;                // best run this session
let wave = 1;                    // difficulty tier, climbs with distance
let spawnT = 0;                  // seconds until the next enemy is injected
let nextId = 1;                  // player is 0; every spawned enemy gets a fresh id
let convoyKills = 0;             // enemies wrecked this run
function carById(id){ for(const c of cars) if(c.id===id) return c; return null; }

const PALETTE = [
  { name:'HOGG',   body:'#d94f2b' },
  { name:'VULTURE',body:'#57b7d6' },
  { name:'GRAVA',  body:'#8ad14a' },
  { name:'MANDIOCA',body:'#e0b73c' }
];

// Enemy types, one per model/colour the spawner already uses. Everything that
// makes them read differently hangs off here: how big they are, how tough, how
// fast relative to the pace of the road, and which end they come from.
//   1 VULTURE  blue    BATEDOR - 10% menor, rapido, frágil; vem por tras, ultrapassa
//                                 pelo lado e so entao parte pra cima de voce
//   2 GRAVA    green   SOLDADO - tamanho normal, o que persegue por tras
//   3 MANDIOCA yellow  TANQUE  - 10% maior, lento, derrapa, e explode
//
// `size` is the size we WANT relative to the player's car. The meshes are not the
// same size as each other to begin with (blue 35.5 wide, green 28, yellow 30.5),
// so asking for 0.9 directly would have left the blue one still looking the
// biggest. makeCar divides by the mesh's own width, so these numbers land on
// screen as written.

// natural width of a model's mesh, so `size` above can mean what it says
const MESH_W = {};
function meshWidth(m){
  const k = m % MODELS.length;
  if(MESH_W[k] == null){
    let x0=9e9, x1=-9e9;
    for(const f of MODELS[k]) for(const v of f.v){ if(v[0]<x0) x0=v[0]; if(v[0]>x1) x1=v[0]; }
    MESH_W[k] = x1-x0;
  }
  return MESH_W[k];
}

// ---------------------------------------------------------------- track
// Straight survival band OR the loop race track. TRK.HW is the corridor half-width
// (set per stage). LOOP is the reused superellipse map from the GUNNER build.
const LOOP = { N:72, A:780, B:470, HW:120, EXP:2.7 };
let TRK = { HW:ROAD_HW, WALL:11 };

// build the closed loop into `track` (only used by the LOOP stage). Same maths the
// engine was born with; A/B are the reused 700x540 map.
function makeTrack(){
  const N=LOOP.N, e=2/LOOP.EXP, pts=[];
  for(let i=0;i<N;i++){
    const t=i/N*Math.PI*2, ct=Math.cos(t), st=Math.sin(t);
    pts.push({ x: LOOP.A*Math.sign(ct)*Math.pow(Math.abs(ct),e),
               y: LOOP.B*Math.sign(st)*Math.pow(Math.abs(st),e) });
  }
  for(let i=0;i<N;i++){
    const p=pts[i], q=pts[(i+1)%N], r=pts[(i+N-1)%N];
    let tx=q.x-r.x, ty=q.y-r.y; const L=Math.hypot(tx,ty)||1;
    p.tx=tx/L; p.ty=ty/L; p.nx=-p.ty; p.ny=p.tx;
    p.ang=Math.atan2(q.y-p.y, q.x-p.x);
  }
  for(let i=0;i<N;i++){
    const a=pts[(i+N-2)%N], b=pts[i], c=pts[(i+2)%N];
    b.curve = Math.abs(angDiff(Math.atan2(b.y-a.y,b.x-a.x), Math.atan2(c.y-b.y,c.x-b.x)));
  }
  const outer=pts.map(p=>({x:p.x+p.nx*LOOP.HW, y:p.y+p.ny*LOOP.HW}));
  const inner=pts.map(p=>({x:p.x-p.nx*LOOP.HW, y:p.y-p.ny*LOOP.HW}));
  const loopP=(path,arr)=>{
    path.moveTo(arr[0].x*S, arr[0].y*KY*S);
    for(let i=1;i<arr.length;i++) path.lineTo(arr[i].x*S, arr[i].y*KY*S);
    path.closePath();
  };
  const road=new Path2D(); loopP(road,outer); loopP(road,inner);
  const rO=pts.map(p=>({x:p.x+p.nx*(LOOP.HW-11), y:p.y+p.ny*(LOOP.HW-11)}));
  const rI=pts.map(p=>({x:p.x-p.nx*(LOOP.HW-11), y:p.y-p.ny*(LOOP.HW-11)}));
  const roPath=new Path2D(); loopP(roPath,rO);
  const riPath=new Path2D(); loopP(riPath,rI);
  track = { pts, outer, inner, road, roPath, riPath, N };
  buildRingsLoop();                        // the first-person view casts against these
}

function trackProject(x,y){
  if(race){
    const pts=track.pts, N=track.N;
    let bi=0, bt=0, bd2=1e18, bpx=0, bpy=0, bnx=0, bny=0;
    for(let i=0;i<N;i++){
      const a=pts[i], b=pts[(i+1)%N];
      const ax=b.x-a.x, ay=b.y-a.y, L2=ax*ax+ay*ay;
      let t=((x-a.x)*ax+(y-a.y)*ay)/L2; t = t<0?0:t>1?1:t;
      const px=a.x+ax*t, py=a.y+ay*t, d2=(x-px)*(x-px)+(y-py)*(y-py);
      if(d2<bd2){ bd2=d2; bi=i; bt=t; bpx=px; bpy=py; const L=Math.sqrt(L2); bnx=-ay/L; bny=ax/L; }
    }
    const off=(x-bpx)*bnx+(y-bpy)*bny;
    return { i:bi, t:bt, px:bpx, py:bpy, nx:bnx, ny:bny, off, d:Math.sqrt(bd2), prog:(bi+bt)/N };
  }
  const q = roadProject(x, y);
  return { i:0, t:0, px:q.px, py:q.py, nx:q.nx, ny:q.ny, off:q.lat, d:Math.abs(q.lat), prog:q.s };
}
function trackPoint(prog, lat){
  if(race){
    const N=track.N; let f=(prog%1+1)%1*N;
    const i=Math.floor(f), t=f-i;
    const a=track.pts[i], b=track.pts[(i+1)%N];
    const x=lerp(a.x,b.x,t), y=lerp(a.y,b.y,t);
    const nx=lerp(a.nx,b.nx,t), ny=lerp(a.ny,b.ny,t);
    return { x:x+nx*(lat||0), y:y+ny*(lat||0), ang:a.ang, curve:a.curve };
  }
  const f = roadFrame(prog);
  return { x:f.x + f.nx*(lat||0), y:f.y + f.ny*(lat||0), ang:Math.atan2(f.ty, f.tx), curve:0 };
}

// ---------------------------------------------------------------- the road path
// Every survival road is ONE path, and everything on it - the scroll, the frame's
// soft walls, the spawner, the AI, the barriers, the roadside lots - works in
// path coordinates instead of asking "which way is up":
//   s   = distance along the middle of the road (forward is +s)
//   lat = offset to the RIGHT of travel (CONVOY: lat = y, ASCENT: lat = x)
// CONVOY is one straight along +x, ASCENT/STREET one straight along -y, and the
// RUN is leg 1 (+x), a quarter circle turning left, then leg 2 (-y) on x = 0,
// which is the line STREET's city is built around.
//
// Pieces: { s0, len } plus either a line { x0,y0, tx,ty } or an arc
// { cx,cy, r, th0, dir } (th = th0 + dir*(s-s0)/r). The first piece runs on
// backwards forever and the last forwards forever, so nothing falls off an end.
//
// The `+ 0` on every direction component turns -0 into 0: atan2(-0,-1) is -PI,
// not PI, and the old axis-based code used PI. Keeping the numbers bit-identical
// is what lets the headless oracle prove CONVOY and ASCENT didn't change.
let ROAD = null;
function rLine(x0, y0, tx, ty, s0, len){ return { line:true, x0, y0, tx:tx+0, ty:ty+0, s0, len }; }
function rArc(cx, cy, r, th0, dir, s0){ return { line:false, cx, cy, r, th0, dir, s0, len:Math.PI/2*r }; }
function makeRoad(kind){
  const P = [];
  if(kind === 'convoy') P.push(rLine(0, 0, 1, 0, 0, Infinity));
  else if(kind === 'run'){
    const R = RUN.CORNER_R, L1 = RUN.LEG1;
    P.push(rLine(-R - L1, 0, 1, 0, 0, L1));                // leg 1, left to right
    P.push(rArc(-R, -R, R, Math.PI/2, -1, L1));             // the bend: +x turns to -y
    P.push(rLine(0, -R, 0, -1, L1 + Math.PI/2*R, Infinity)); // leg 2, up the screen
  } else P.push(rLine(0, 0, 0, -1, 0, Infinity));           // ascent / street
  ROAD = { kind, pieces:P };
  if(kind === 'run'){
    ROAD.bendS0 = P[1].s0; ROAD.bendS1 = P[1].s0 + P[1].len;
    // the city starts on a chunk edge: leg 2's end, rounded on to the next one
    const R = RUN.CORNER_R;
    ROAD.gateY = Math.floor((-R - RUN.LEG2)/CITY_CH)*CITY_CH;
    ROAD.gateS = ROAD.bendS1 + (-R - ROAD.gateY);          // where leg 2 hands over to the city
  }
}
makeRoad('convoy');
function roadPiece(s){
  const P = ROAD.pieces;
  for(let i=0;i<P.length-1;i++) if(s < P[i].s0 + P[i].len) return P[i];
  return P[P.length-1];
}
// point, tangent t, right normal n (= (-ty, tx)) and curvature k at distance s.
// A lane at offset lat is (1 + k*lat) times as long as the middle of the road.
function roadFrame(s){
  const p = roadPiece(s), u = s - p.s0;
  if(p.line) return { x:p.x0 + p.tx*u, y:p.y0 + p.ty*u, tx:p.tx, ty:p.ty, nx:-p.ty + 0, ny:p.tx, k:0 };
  const th = p.th0 + p.dir*u/p.r, c = Math.cos(th), sn = Math.sin(th);
  const tx = -p.dir*sn, ty = p.dir*c;
  return { x:p.cx + p.r*c, y:p.cy + p.r*sn, tx, ty, nx:-ty, ny:tx, k:-p.dir/p.r };
}
function roadPoint(s, lat){
  const f = roadFrame(s);
  return { x:f.x + f.nx*lat, y:f.y + f.ny*lat };
}
// nearest point of the road's middle line: { s, lat, px,py (that point), t, n, k }
function roadProject(x, y){
  let best = null, bd = Infinity;
  const P = ROAD.pieces, last = P.length-1;
  for(let i=0;i<=last;i++){
    const p = P[i];
    let u;
    if(p.line){
      u = (x - p.x0)*p.tx + (y - p.y0)*p.ty;
      if(i > 0 && u < 0) u = 0;
      if(i < last && u > p.len) u = p.len;
    } else {
      u = angDiff(p.th0, Math.atan2(y - p.cy, x - p.cx))*p.dir*p.r;
      u = clamp(u, 0, p.len);
    }
    const f = roadFrame(p.s0 + u);
    const dx = x - f.x, dy = y - f.y, d2 = dx*dx + dy*dy;
    if(d2 < bd){ bd = d2; best = f; best.s = p.s0 + u; best.lat = dx*f.nx + dy*f.ny; }
  }
  best.px = best.x; best.py = best.y;
  return best;
}
// how much longer than the middle line the lane at `lat` is, here (1 on a straight)
function laneScale(k, lat){ return 1 + k*clamp(lat, -ROAD_HW, ROAD_HW); }

// anything the AI should steer around but bullets should pass over
function hazardAt(x,y,r){
  for(const h of hazards){
    if(Math.hypot(x-h.x, y-h.y) < h.r + (r||0)) return h;
  }
  return null;
}

function makeCar(id, isPlayer, x, y, angle, model){
  const pal = PALETTE[model % PALETTE.length];
  // survival only - the loop race's rivals stay plain cars, same size, same hull,
  // and emphatically not carrying explosives
  const t = (isPlayer || race) ? null : ENEMY_TYPE[model];
  const scale = t ? (meshWidth(0)*t.size)/meshWidth(model) : 1;
  const size  = t ? t.size : 1;      // on-screen size relative to the player's car
  const hp = isPlayer ? playerMaxHp() : ENEMY_HP_BASE*(t ? t.hp : 1);
  return {
    id, name:pal.name, isPlayer, model,
    mesh: isPlayer ? playerMesh() : model,   // which MODELS entry the bakes draw (the player's comes from the GARAGE)
    color:pal.body, dark:shade(pal.body,0.45), light:shade(pal.body,1.35),
    x, y, vx:0, vy:0, angle,
    etype: t ? t.kind : 'player',
    // the hitbox tracks the size you SEE, not the bake factor - that one is
    // divided by the mesh's own width, so it does not describe the car on screen
    scale, rad: 14*size, pace: t ? t.pace : 1,
    hp, maxHp:hp, frags:0, deaths:0,
    cool:0, mcool:0, minecool:0, missiles:2, minesLeft:1,
    gunHeat:0, gunRest:0,          // enemy submachine overheat (see fireCannon)
    dead:false, respawn:0, invuln:1.4,
    aiTimer:0, aiSteer:0, aiThrottle:1, aiBrake:false, wander:rnd(0,6),
    avoidDir:Math.random()<0.5?-1:1, orbitDir:Math.random()<0.5?-1:1, blockedT:0, closeT:0,
    contact:false, contactT:0, reverseT:0, revDir:-1, escapeAng:0, lastX:0, lastY:0, moveCheck:0,
    prog:x, lap:0, total:0, place:1, lineOff:0, finished:false, finishTime:0, offTrack:0,
    pitT:0, pitX:0, pitY:0, pitR:0, deathZ:0, deathClip:null,
    skidT:0, hurtFlash:0, lastHitBy:-1,
    // boost: boostT = burn left, boostCD = recharge left (only ticks once the burn
    // is done, so the gauge reads "seconds until I can boost again"), boostEase =
    // the smoothed 0..1 that lends the frame its extra room
    boostT:0, boostCD:0, boostEase:0,
    // convoy: role is 'player', 'charger' (barrels through from ahead) or 'pursuer' (chases from behind)
    role:isPlayer?'player':'charger', tActive:0,
    turret:0, fps:null
  };
}

// apply the stage's per-stage tunables (call before rescale so the layout/zoom take)
function applyStage(){
  vertical = (stage==='ascent' || stage==='street');
  race     = (stage==='loop');
  street   = (stage==='street');
  makeRoad(stage==='run' ? 'run' : vertical ? 'ascent' : 'convoy');
  cityLimitY = stage==='run' ? ROAD.gateY : Infinity;   // the run's city ends at the gate
  ZOOM2D    = vertical ? RUN.ZOOM_V : RUN.ZOOM_H;    // loop and convoy share the wider framing
  LAYOUT    = vertical ? 'side' : 'stack';
  // survival stages frame with a look-ahead along the road (see placeCam); STREET's
  // free camera still sits low on the screen the old way
  VCY_BIAS  = street ? RUN.VIEW_BIAS_V : 0.5;
  CRUISE_BAND = vertical ? RUN.CRUISE_BAND_V : RUN.CRUISE_BAND_H;
  TRK.HW    = race ? LOOP.HW : ROAD_HW;  // the loop corridor is narrower than the highway
}

// np = 1 (solo) or 2 (driver + gunner). One shared function so ESC->title->pick works.
function startMatch(np){
  numPlayers = (np===1||np===2) ? np : numPlayers;
  if(stage==='street' || stage==='run') numPlayers = 1;   // walking is a solo thing
  checkpoint = null; bannerT = 0; mapOpen = false; walkerDown = false; walkHurtT = 0; FLOW.ok = false;
  clearFoes(); clearFoeWorld();             // foe.js - and forget which ones you wrecked
  runUp = Object.assign({}, UPGRADES); cash = 0; saintsPay = null;   // restartFromCheckpoint puts its own back
  level=1; arenaShape='rect';
  cars=[]; shots=[]; mines=[]; fx=[]; skids=[]; blocks=[]; hazards=[]; finishOrder=[]; pads=[];
  applyStage();
  mode = race ? 'race' : 'convoy';
  // rescale (not just layoutPanes) so the projection globals match this stage's
  // zoom/layout/pane for THIS player count; then size the raycaster to that pane.
  rescale();
  if(numPlayers===2) rcInit();
  else if(street) rcInit(PANE_FULL);        // the walker's view is the whole screen
  walkReset();

  if(race){
    makeTrack();                              // bakes S into the loop paths (S is set now)
    if(!trackMask) buildTrackMask();          // the loop shape never changes, build once
    buildRacePads();
    for(let i=0;i<4;i++){
      const c = makeCar(i, i===0, 0, 0, 0, i);
      c.role='racer'; c.sprite = bakeCarSprites(c);
      cars.push(c);
    }
    // starting grid, two by two just behind the line
    cars.forEach((c,i)=>{
      const row=Math.floor(i/2), side=(i%2)?1:-1;
      const p=trackPoint(0.975 - row*0.016, side*52);
      c.x=p.x; c.y=p.y; c.angle=p.ang; c.lineOff=rnd(-34,34);
      const pr=trackProject(c.x,c.y); c.prog=pr.prog; c.lap=0; c.total=pr.prog-1;
      c.missiles=1; c.minesLeft=1; c.invuln=2.2;
    });
    cars[0].turret=0;
    cam.x=cars[0].x; cam.y=cars[0].y;
  } else {
    const f0 = roadFrame(0);
    const me = makeCar(0, true, f0.x, f0.y, Math.atan2(f0.ty, f0.tx), 0);   // faces forward
    me.sprite = bakeCarSprites(me);
    me.invuln = 2.4; me.missiles = 2; me.minesLeft = MINES_START; me.turret = 0;
    cars.push(me);
    // ammo + repair pads sit up the road ahead of you (both survival modes carry a gun)
    // STREET has nothing to fight yet, so no pads either (they come with STREET_ENEMIES)
    for(let i=0;i<(street && !STREET_ENEMIES ? 0 : 4);i++){
      const along = -(i+1)*260 + rnd(-40,40), lat = rnd(-ROAD_HW+30, ROAD_HW-30);
      const pp = roadPoint(-along, lat);
      pads.push({ x:pp.x, y:pp.y, item:null, timer:rnd(0,3), bob:0 });
    }
    camS=0; camLat=0; lookAhead=0; placeCam();
    if(ROAD.kind === 'run') prebakeSheets();
  }

  camV=CAM_V0; distance=0; wave=1; spawnT=0.8; nextId=race?4:1; convoyKills=0;
  cam.shake=0;
  matchTime=0; winner=null; paused=false;
  gunnerHit=0; gunnerKill=0;
  state='play';
}
// the headless harness prefers a no-arg entry point; drive the heavier 2P path
function startRun(){ startMatch(2); }

// pickup pads spaced around the loop (LOOP stage). Positions are progress/lateral.
function buildRacePads(){
  const spots=[[0.06,-60],[0.14,60],[0.28,0],[0.37,-60],[0.5,55],[0.62,-55],[0.74,0],[0.86,60]];
  for(const s of spots){ const p=trackPoint(s[0], s[1]); pads.push({ x:p.x, y:p.y, timer:rnd(0,3), item:null, bob:0 }); }
}

// ---------------------------------------------------------------- the wave spawner
// A rolling population injected just off-screen: chargers appear ahead and barrel
// back through the frame, pursuers appear behind and chase. Both are culled once
// they fall well out of view, so the road always feels populated without an
// ever-growing car list. Everything scales with `wave`, which climbs with distance.
function enemyCap(){
  const cap = Math.min(9, 3 + Math.floor(wave*0.9));
  return onLeg1() ? Math.max(1, Math.round(cap*LEG1.DENSITY)) : cap;
}
// the run's first leg (before the bend) has its own, gentler rules: LEG1 in config.js
function onLeg1(){ return ROAD && ROAD.kind === 'run' && camS < ROAD.bendS0; }
function pickWeighted(w){ let r = Math.random()*w.reduce((a,b)=>a+b,0); for(let i=0;i<w.length;i++){ r -= w[i]; if(r < 0) return i; } return w.length-1; }

function spawnEnemy(){
  const enemies = cars.length - 1;
  if(enemies >= enemyCap()) return;
  if(inQuiet(camS)) return;                       // the corner is a breather
  const aheadBias = clamp(0.72 - wave*0.03, 0.45, 0.72);   // more pursuers as it heats up
  const allBehind = onLeg1() && !LEG1.FROM_FRONT;
  const charger = !allBehind && Math.random() < aheadBias;
  // the side picks the type, not the other way round, so the ahead/behind mix
  // stays the tuned one: the front-runner is the yellow tanque, and blue and green
  // come up behind you. On leg 1 (LEG1.FROM_FRONT false) everything comes from
  // behind, the tanque included, in LEG1.BACK_MIX shares.
  const model = charger ? 3 : allBehind ? 1 + pickWeighted(LEG1.BACK_MIX) : (Math.random()<0.45 ? 1 : 2);
  const lat = rnd(-ROAD_HW+26, ROAD_HW-26);
  const reach = halfExtent(roadFrame(camS));                // how far up/along the road you see
  const spd = charger ? (150 + wave*6 + rnd(0,40)) : (camV + 40 + wave*3);
  // `along` is the forward coordinate: chargers spawn ahead, pursuers behind
  const along = charger ? (reach + rnd(70,280)) : -(reach*0.7 + rnd(60,220));
  if(ROAD.kind === 'run' && camS + along > ROAD.gateS - 150) return;
  // placed on the road at camS + along; a charger faces back down the road
  const f = roadFrame(camS + along);
  const c = makeCar(nextId++, false, f.x + f.nx*lat, f.y + f.ny*lat,
    charger ? Math.atan2(-f.ty + 0, -f.tx + 0) : Math.atan2(f.ty, f.tx), model);
  const v = charger ? -spd : spd;
  c.vx = v*f.tx + 0; c.vy = v*f.ty + 0;
  c.role = charger ? 'charger' : 'pursuer';
  c.missiles = charger ? 0 : (wave>3 && Math.random()<0.4 ? 1 : 0);
  c.invuln = 0.3; c.minesLeft = 0;
  c.sprite = bakeCarSprites(c);
  cars.push(c);
}

function updateSpawner(dt){
  if(!enemiesOn) return;
  wave = 1 + Math.floor(distance/WAVE_DIST);
  spawnT -= dt;
  if(spawnT<=0){
    spawnEnemy();
    spawnT = Math.max(SPAWN_GAP_MIN, SPAWN_GAP0 - wave*SPAWN_GAP_WAVE) * rnd(0.7,1.3)
           / (onLeg1() ? LEG1.DENSITY : 1);          // leg 1: arrivals that much further apart
  }
  // Rank the tail chasers by who is closest, so only PURSUE_SQUAD of them press
  // the attack and the overflow forms its own pack (see aiPursue).
  const tail = [];
  for(let i=1;i<cars.length;i++) if(!cars[i].dead && cars[i].etype==='soldado') tail.push(cars[i]);
  const me0 = cars[0];
  tail.sort((a,b)=>Math.hypot(a.x-me0.x,a.y-me0.y)-Math.hypot(b.x-me0.x,b.y-me0.y));
  for(let i=0;i<tail.length;i++){ tail[i].rank=i; tail[i].squad=(i/PURSUE_SQUAD)|0; }

  // cull anything well past the edges of the frame (never the player at index 0)
  const reach = halfExtent(roadFrame(camS));
  for(let i=cars.length-1;i>=1;i--){
    const c=cars[i];
    // fwd = signed forward distance from the camera anchor; lat = lateral offset
    const q = roadProject(c.x, c.y);
    const fwd = q.s - camS, lat = q.lat;
    if((c.dead && c.respawn<=0) || fwd > reach+460 || fwd < -(reach+340) || Math.abs(lat) > ROAD_HW+400){
      cars.splice(i,1);
    }
  }
}

// ---------------------------------------------------------------- the survival camera
// The camera ANCHOR is at camS along the road, camLat across it. Everything the
// game rules care about - the frame's soft walls, spawning, culling, pads - is
// measured from the anchor in road coordinates. What you SEE is centred
// `lookAhead` further along the road, which is ASCENT's "camera sits low so you
// see up the road" expressed in a way that turns with the road.
let camS = 0, camLat = 0, lookAhead = 0;
// 0 on a horizontal leg, 1 on a vertical one, eased through the run's bend
function legBlend(){
  if(ROAD.kind === 'run'){
    const t = clamp((camS - ROAD.bendS0)/(ROAD.bendS1 - ROAD.bendS0), 0, 1);
    return t*t*(3 - 2*t);
  }
  return ROAD.kind === 'convoy' ? 0 : 1;
}
// how far the view reaches from its centre along road direction f (world units)
function halfExtent(f){ return Math.min(VHW/Math.abs(f.tx), (VHH/KY)/Math.abs(f.ty)); }
// the corner of the run is a breather: no spawns near it
function inQuiet(s){
  return ROAD.kind === 'run' && s > ROAD.bendS0 - RUN.QUIET && s < ROAD.bendS1 + RUN.QUIET;
}
function placeCam(){
  if(race || street) return;
  const u = legBlend();
  const z = lerp(RUN.ZOOM_H, RUN.ZOOM_V, u);
  if(z !== ZOOM2D) setZoom(z);
  CRUISE_BAND = lerp(RUN.CRUISE_BAND_H, RUN.CRUISE_BAND_V, u);
  lookAhead = u*(RUN.VIEW_BIAS_V - 0.5)*PANE_P1.h/(ZOOM2D*KY);
  const f = roadFrame(camS), reach = halfExtent(f);
  FRONT_MAX = Math.max(140, reach + lookAhead - FRAME_FRONT_PAD);
  BACK_EDGE = Math.max(120, reach - lookAhead - lerp(FRAME_BACK_PAD_H, FRAME_BACK_PAD_V, u));
  VIEW_HH   = reach + Math.abs(lookAhead) + 80;
  cam.x = f.x + f.nx*camLat + f.tx*lookAhead;
  cam.y = f.y + f.ny*camLat + f.ty*lookAhead;
}
// change the driving pane's zoom without a full rescale (no canvas resize, no
// re-bake: car sheets and ground tiles are drawn scaled until the zoom settles)
function setZoom(z){
  ZOOM2D = z; S = PX*z;
  VHW = PANE_P1.w/(2*ZOOM2D);
  VHH = PANE_P1.h/(2*ZOOM2D);
}

// ---------------------------------------------------------------- the run: checkpoint + gate
// Reaching the bend earns the checkpoint: die anywhere after that and ENTER puts
// you back at the bend's exit with a full hull, an empty road and the scroll at
// the pace it had when you got there.
let checkpoint = null;
let bannerT = 0, bannerText = '';
let bannerSub = '';
function banner(t, sub){ bannerText = t; bannerSub = sub == null ? 'wreck after this and you restart here' : sub; bannerT = 2.6; }
function runEvents(){
  if(!checkpoint && camS >= ROAD.bendS0){
    checkpoint = { camV, wave, kills:convoyKills, cash, up:Object.assign({}, runUp) };
    banner('CHECKPOINT');
    Snd.pickup();
    openStore();                            // the Scrap Saints' garage
  }
  // the end of leg 2: into the city, and the Saints' second garage on the way in
  // (a restart at the city checkpoint goes through enterCity alone: no store)
  if(!street && roadProject(cars[0].x, cars[0].y).s >= ROAD.gateS){ enterCity(); openStore(); }
}
// No cut, no screen: the scroll stops, the camera starts following the car and
// the driving goes free. Everything chasing you carries on into the streets.
function enterCity(){
  street = true;
  checkpoint = { city:true, camV, wave, kills:convoyKills, cash, up:Object.assign({}, runUp) };
  if(RC_PANE !== PANE_FULL) rcInit(PANE_FULL);      // the walker's first-person view
  FLOW.t = 0; citySpawnT = 1.0; cityCamT = 0;
  banner('THE CITY', 'E  stop and get out      N  enemies on / off');
}
function restartFromCheckpoint(){
  const cp = checkpoint;
  startMatch(1);                            // a clean field and a fresh car...
  checkpoint = cp;                          // ...that keeps what it earned
  camS = cp.city ? ROAD.gateS + 80 : ROAD.bendS1; camLat = 0; distance = camS;
  camV = cp.camV; wave = cp.wave; convoyKills = cp.kills;
  // what you left the Saints' garage with: its levels, its cash, and a hull to match
  if(cp.up) runUp = Object.assign({}, cp.up);
  cash = cp.cash || 0;
  placeCam();
  const me = cars[0], f = roadFrame(camS);
  me.maxHp = me.hp = playerMaxHp();
  me.x = f.x; me.y = f.y; me.angle = Math.atan2(f.ty, f.tx);
  const v0 = cp.city ? 0 : camV;
  me.vx = f.tx*v0; me.vy = f.ty*v0; me.speed = v0;
  for(const pd of pads) recycleAhead(pd);
  if(cp.city){ enterCity(); checkpoint = cp; }
  else banner('CHECKPOINT');
}
// SKIP_TO_CITY_KEY: a fresh run that starts at the city gate, at the pace and
// wave you'd have got there with - the same path as the city checkpoint
function skipToCity(){
  stage = 'run'; menuPop = null;
  startMatch(1);
  checkpoint = { city:true, camV:CAM_VMAX, wave:1 + Math.floor(ROAD.gateS/WAVE_DIST), kills:0 };
  restartFromCheckpoint();
}
// both legs' car sheets up front, so nothing bakes mid-run (~30 ms a sheet)
function prebakeSheets(){
  const z0 = ZOOM2D;
  for(const z of [RUN.ZOOM_H, RUN.ZOOM_V]){
    ZOOM2D = z;
    for(let m=0;m<4;m++) bakeCarSprites(makeCar(-1, m===0, 0, 0, 0, m));
  }
  ZOOM2D = z0;
}

// ---------------------------------------------------------------- the city's enemies
// ENEMY_TOGGLE_KEY (N) clears every enemy car - and brings them back - in any
// part of the run.
let enemiesOn = true;
function toggleEnemies(){
  enemiesOn = !enemiesOn;
  if(!enemiesOn){
    cityFoesOff();                  // foe.js: and the sentries the city placed
    cityWalkersOff();               // ...and the movers
    for(let i=cars.length-1;i>=1;i--){
      const c = cars[i];
      particles(c.x, c.y, 8, 10, {col:[NEON.CYAN, NEON.MAGENTA], spd0:20, spd1:90, size:1, life0:0.2, life1:0.5});
      cars.splice(i, 1);
    }
    shots = shots.filter(s => s.owner === 0);
  } else { spawnT = 0.5; citySpawnT = 0.5; FLOW.t = 0; }
  banner(enemiesOn ? 'ENEMIES ON' : 'ENEMIES OFF', 'N  to switch them '+(enemiesOn ? 'off' : 'back on'));
}
// What they hunt: you, in the car or on foot.
function cityTarget(){ return onFoot ? walker : cars[0]; }

// How they find you through the streets. A grid around you is filled outward
// from your cell (breadth first) through everywhere a car fits; each enemy reads
// the grid where it stands and heads a few cells downhill. So they come at you
// down whatever street actually leads to you - side streets included - instead
// of grinding into the nearest building.
const FLOW = { n:CITY_FLOW_N, cell:CITY_FLOW_CELL, x0:0, y0:0, t:0, ok:false,
  d:new Int32Array(CITY_FLOW_N*CITY_FLOW_N), pass:new Uint8Array(CITY_FLOW_N*CITY_FLOW_N),
  q:new Int32Array(CITY_FLOW_N*CITY_FLOW_N) };
// can a car be here? streets, pavements and the highway; across the barrier only
// where a street opens it; never in (or scraping) a building or past a wall
function flowPassable(x, y){
  const L = cityLimitY;
  if(y >= L - 12) return Math.abs(x) < ROAD_HW - 14 && y < L + CITY_BACK - 14;
  const ax = Math.abs(x);
  if(ax >= CITY_W - 14) return false;
  if(Math.abs(ax - ROAD_HW) < 16) return barrierSpans(x < 0 ? -1 : 1, y - 16, y + 16).length === 0;
  const h = 10;
  return cityGround(x, y) < 3 && cityGround(x-h, y) < 3 && cityGround(x+h, y) < 3
      && cityGround(x, y-h) < 3 && cityGround(x, y+h) < 3;
}
function flowRebuild(){
  const T = cityTarget(), n = FLOW.n, cs = FLOW.cell, P = FLOW.pass, D = FLOW.d, Q = FLOW.q;
  FLOW.x0 = Math.round(T.x/cs - n/2)*cs; FLOW.y0 = Math.round(T.y/cs - n/2)*cs;
  for(let j=0;j<n;j++){
    const y = FLOW.y0 + (j + 0.5)*cs;
    for(let i=0;i<n;i++) P[j*n + i] = flowPassable(FLOW.x0 + (i + 0.5)*cs, y) ? 1 : 0;
  }
  D.fill(-1);
  const ti = clamp(((T.x - FLOW.x0)/cs)|0, 0, n-1), tj = clamp(((T.y - FLOW.y0)/cs)|0, 0, n-1);
  let h = 0, t = 0;
  D[tj*n + ti] = 0; Q[t++] = tj*n + ti;          // your own cell counts even against a wall
  while(h < t){
    const k = Q[h++], i = k % n, j = (k/n)|0, dk = D[k] + 1;
    if(i > 0   && P[k-1] && D[k-1] < 0){ D[k-1] = dk; Q[t++] = k-1; }
    if(i < n-1 && P[k+1] && D[k+1] < 0){ D[k+1] = dk; Q[t++] = k+1; }
    if(j > 0   && P[k-n] && D[k-n] < 0){ D[k-n] = dk; Q[t++] = k-n; }
    if(j < n-1 && P[k+n] && D[k+n] < 0){ D[k+n] = dk; Q[t++] = k+n; }
  }
  FLOW.ok = true;
}
// a point a few cells down the field from (x, y), or null off the grid / cut off
function flowNext(x, y){
  if(!FLOW.ok) return null;
  const n = FLOW.n, cs = FLOW.cell, D = FLOW.d;
  const i = ((x - FLOW.x0)/cs)|0, j = ((y - FLOW.y0)/cs)|0;
  if(i < 0 || j < 0 || i >= n || j >= n) return null;
  let k = j*n + i;
  for(let step=0; step<4; step++){
    const i0 = k % n, j0 = (k/n)|0;
    let best = D[k] >= 0 ? k : -1, bd = D[k] >= 0 ? D[k] : 1e9;
    for(let dj=-1; dj<=1; dj++) for(let di=-1; di<=1; di++){
      if(!di && !dj) continue;
      const ii = i0 + di, jj = j0 + dj;
      if(ii < 0 || jj < 0 || ii >= n || jj >= n) continue;
      const kk = jj*n + ii, d = D[kk];
      if(d < 0 || d >= bd) continue;
      // a diagonal only past two open sides, so the line never cuts a corner
      if(di && dj && (D[j0*n + ii] < 0 || D[jj*n + i0] < 0)) continue;
      bd = d; best = kk;
    }
    if(best < 0) return null;
    if(best === k) break;
    k = best;
  }
  return { x:FLOW.x0 + ((k % n) + 0.5)*cs, y:FLOW.y0 + (((k/n)|0) + 0.5)*cs };
}
// nothing solid on the straight line between two points
function cityClear(x0, y0, x1, y1){
  for(let i=1;i<6;i++){ const t = i/6; if(cityHitPoint(lerp(x0,x1,t), lerp(y0,y1,t))) return false; }
  return true;
}
// every type hunts the same way in the city; ENEMY_TYPE still sets size, speed, hp
function aiCity(c, dt){
  const T = cityTarget();
  const dx = T.x - c.x, dy = T.y - c.y, dist = Math.hypot(dx, dy);
  const aim = (dist < 170 && cityClear(c.x, c.y, T.x, T.y)) ? T : (flowNext(c.x, c.y) || T);
  const want = Math.atan2(aim.y - c.y, aim.x - c.x);
  const diff = angDiff(c.angle, want) + Math.sin(c.wander*1.7)*0.05;
  const spd = Math.abs(c.speed||0);
  c.aiSteer = clamp(diff*2.4, -1, 1);
  c.aiThrottle = 1;
  c.aiBrake = Math.abs(diff) > 0.9 && spd > 110;     // slow for the corners
  // wedged (throttle on, going nowhere): back off a moment, nose round to the path
  if(spd < 18){
    c.stuckT = (c.stuckT||0) + dt;
    if(c.stuckT > 0.9){ c.stuckT = 0; c.escapeAng = want; c.revDir = -1; c.reverseT = 0.7; }
  } else c.stuckT = 0;
  if(dist < 340 && Math.abs(angDiff(c.angle, Math.atan2(dy, dx))) < 0.12 && cityClear(c.x, c.y, T.x, T.y))
    fireCannon(c);
}
// Out of the car you are nobody: the hunters lose interest and just drive the
// city - down a street, a turn now and then at a junction, round at a dead end,
// keeping to the middle of the road. No aiming, no shooting. Get back in and
// they're on you again (aiCity).
function aiCruise(c, dt){
  const spd = Math.abs(c.speed||0), Q = Math.PI/2;
  // is there road for a car this far out along heading a?
  const open = (a, d) => flowPassable(c.x + Math.cos(a)*d*0.5, c.y + Math.sin(a)*d*0.5)
                      && flowPassable(c.x + Math.cos(a)*d,     c.y + Math.sin(a)*d);
  if(c.cruiseN !== footN){
    // just lost interest: pick a street direction - away from you if close
    c.cruiseN = footN; c.cruiseT = rnd(1.5, 3);
    const dx = c.x - walker.x, dy = c.y - walker.y;
    const a0 = Math.hypot(dx, dy) < 260 ? Math.atan2(dy, dx) : c.angle;
    const opts = [0, 1, 2, 3].map(k => k*Q).filter(a => open(a, 90));
    c.cruiseA = opts.length ? opts.reduce((b, a) => Math.abs(angDiff(a, a0)) < Math.abs(angDiff(b, a0)) ? a : b)
                            : Math.round(c.angle/Q)*Q;   // the streets run on a grid
  }
  c.cruiseT = (c.cruiseT||0) - dt;
  if(!open(c.cruiseA, 70)){
    const side = [c.cruiseA + Q, c.cruiseA - Q].filter(a => open(a, 90));
    c.cruiseA = side.length ? pick(side) : c.cruiseA + Math.PI;
    c.cruiseT = 1.5;
  } else if(c.cruiseT <= 0){
    c.cruiseT = rnd(1.2, 2.6);
    const side = [c.cruiseA + Q, c.cruiseA - Q].filter(a => open(a, 150));
    if(side.length && Math.random() < 0.35) c.cruiseA = pick(side);
  }
  // keep to the middle: lean away from whichever side has less room
  const room = sgn => { let d = 0; while(d < 60 && flowPassable(c.x + Math.cos(c.cruiseA + sgn*Q)*(d+10), c.y + Math.sin(c.cruiseA + sgn*Q)*(d+10))) d += 10; return d; };
  const centre = clamp((room(1) - room(-1))*0.006, -0.3, 0.3);
  const diff = angDiff(c.angle, c.cruiseA + centre);
  c.aiSteer = clamp(diff*2.0, -1, 1);
  c.aiThrottle = spd > CITY_CRUISE ? 0 : 0.8;
  c.aiBrake = Math.abs(diff) > 0.8 && spd > 70;
  // and they stop for a pedestrian in front of them
  const wx = walker.x - c.x, wy = walker.y - c.y, wd = Math.hypot(wx, wy);
  if(wd < 60 + spd*0.9 && Math.abs(angDiff(c.angle, Math.atan2(wy, wx))) < 0.7){ c.aiThrottle = 0; c.aiBrake = true; }
  if(spd < 15){
    c.stuckT = (c.stuckT||0) + dt;
    if(c.stuckT > 1.2){ c.stuckT = 0; c.cruiseA += Math.PI; c.escapeAng = c.cruiseA; c.revDir = -1; c.reverseT = 0.8; }
  } else c.stuckT = 0;
}
let citySpawnT = 0;
let cityCamT = 0;                   // seconds into the scroll -> follow handover
const cityCamOff = { x:0, y:0 }, cityCamF = { x:0, y:0 };
function citySpawner(dt){
  if(!enemiesOn) return;
  const T = cityTarget();
  for(let i=cars.length-1;i>=1;i--){
    const c = cars[i];
    if((c.dead && c.respawn <= 0) || Math.hypot(c.x - T.x, c.y - T.y) > CITY_CULL) cars.splice(i, 1);
  }
  citySpawnT -= dt;
  if(citySpawnT > 0 || cars.length - 1 >= CITY_ENEMIES) return;
  citySpawnT = CITY_SPAWN_GAP*rnd(0.7, 1.3);
  for(let tries=0; tries<16; tries++){
    const a = rnd(0, Math.PI*2), r = rnd(CITY_SPAWN_MIN, CITY_SPAWN_MAX);
    const x = T.x + Math.cos(a)*r, y = T.y + Math.sin(a)*r;
    if(cityGround(x, y) !== 1 || !flowPassable(x, y) || inView(x, y, 80)) continue;
    const c = makeCar(nextId++, false, x, y, Math.atan2(T.y - y, T.x - x), 1 + ((Math.random()*3)|0));
    c.role = 'city'; c.missiles = 0; c.minesLeft = 0; c.invuln = 0.3;
    cars.push(c);
    return;
  }
}
// on foot: rounds and bumpers hurt (dev mode: they don't)
let walkHurtT = 0, walkerDown = false;
let footN = 0, walkGraceT = 0;       // times you've got out; a moment's grace from bumpers
function hurtWalker(d){
  if(devMode || walkHurtT > 0 || walkGraceT > 0 || state !== 'play') return;
  walker.hp -= d; walkHurtT = 0.5;
  if(walker.hp <= 0){ walker.hp = 0; walkerDown = true; winner = null; state = 'over'; Snd.engineOff(); }
}
function cityStep(dt){
  bannerT = Math.max(0, bannerT - dt);
  walkHurtT = Math.max(0, walkHurtT - dt);
  walkGraceT = Math.max(0, walkGraceT - dt);
  // Both the hunters and a provoked sentry steer by the flow field. Out of the
  // car no hunter is interested in you, which used to mean nothing refilled it -
  // but a sentry you have SHOT is hunting you on foot, and it is the one thing
  // that needs the field with no hunter car around to ask for it.
  if(enemiesOn && ((cars.length > 1 && !onFoot) || foeMadN > 0)){
    FLOW.t -= dt;
    if(FLOW.t <= 0){ FLOW.t = CITY_FLOW_EVERY; flowRebuild(); }
  }
  citySpawner(dt);
  citySentries();                  // foe.js: scatter them by block, cull what you left
  cityWalkers();                   // ...and the SEPARATE moving population (FOE_WALK)
  foeRam();                        // ...and a car that drives into one
  if(onFoot) for(const c of cars){
    if(c.isPlayer || c.dead) continue;
    const d = Math.hypot(c.x - walker.x, c.y - walker.y), sp = Math.hypot(c.vx, c.vy);
    if(d < (c.rad||14) + WALK_R && sp > 30){
      if(sp > WALK_RUNOVER_MIN) hurtWalker(sp*WALK_RUNOVER);   // a slow nudge just shoves you
      const k = (c.rad||14) + WALK_R + 2 - d;           // and it throws you clear
      walker.x += (walker.x - c.x)/(d||1)*k; walker.y += (walker.y - c.y)/(d||1)*k;
    }
  }
}

// ---------------------------------------------------------------- projection
function toScreen(x,y,z){
  return { x: (x - cam.x)*S + VCX, y: ((y - cam.y)*KY - (z||0))*S + VCY };
}
function camOx(){ return -cam.x*S + VCX; }
function camOy(){ return -cam.y*KY*S + VCY; }

// ---------------------------------------------------------------- collision helpers
function trackCollide(e, radius, bounce){
  const pr = trackProject(e.x, e.y);
  e.proj = pr;
  const limit = TRK.HW - radius;
  if(pr.d > limit){
    const s = pr.off>0 ? 1 : -1;
    e.x = pr.px + pr.nx*s*limit;
    e.y = pr.py + pr.ny*s*limit;
    if(bounce){
      const vn = e.vx*pr.nx + e.vy*pr.ny;
      const sp = Math.abs(vn);
      e.vx -= pr.nx*vn*1.35; e.vy -= pr.ny*vn*1.35;
      e.vx*=0.9; e.vy*=0.9;
      return sp;
    }
    return 1;
  }
  return 0;
}

function blockCollide(e, radius, bounce){
  if(street) return cityCollide(e, radius, bounce);
  e.contact = false;
  if(mode==='race' || mode==='convoy'){
    const r = trackCollide(e, radius, bounce);
    if(r>0) e.contact = true;
    return r;
  }
  let hitSpeed = 0;
  for(const b of blocks){
    // barrels and dirt mounds are drawn round, so they collide round too
    if(b.type==='barrel' || b.type==='mound'){
      const R=b.w/2+radius;
      let dx=e.x-b.x, dy=e.y-b.y, d=Math.hypot(dx,dy);
      if(d<R){
        if(d<1e-4){ dx=1; dy=0; d=1; }
        const nx=dx/d, ny=dy/d;
        e.x=b.x+nx*R; e.y=b.y+ny*R;
        e.contact=true; e.hitBlock=b;
        if(bounce){
          const vn=e.vx*nx+e.vy*ny;
          if(vn<0){
            hitSpeed=Math.max(hitSpeed, Math.abs(vn));
            e.vx-=nx*vn*1.35; e.vy-=ny*vn*1.35;
            e.vx*=0.86; e.vy*=0.86;
          }
        }
      }
      continue;
    }
    const hw=b.w/2+radius, hh=b.h/2+radius;
    const dx=e.x-b.x, dy=e.y-b.y;
    if(Math.abs(dx)<hw && Math.abs(dy)<hh){
      const px=hw-Math.abs(dx), py=hh-Math.abs(dy);
      const sp=Math.hypot(e.vx,e.vy);
      if(px<py){
        e.x += dx>0?px:-px;
        if(bounce){ hitSpeed=Math.max(hitSpeed,Math.abs(e.vx)); e.vx*=-0.35; }
      } else {
        e.y += dy>0?py:-py;
        if(bounce){ hitSpeed=Math.max(hitSpeed,Math.abs(e.vy)); e.vy*=-0.35; }
      }
      if(bounce){ e.vx*=0.85; e.vy*=0.85; }
      e.contact = true; e.hitBlock = b;
      if(sp>0) hitSpeed=Math.max(hitSpeed, sp*0.5);
    }
  }
  const R = radius;
  if(arenaShape==='oval'){
    const A=ARENA_W/2-R, B=ARENA_H/2-R;
    const nx=e.x/A, ny=e.y/B, d=Math.hypot(nx,ny);
    if(d>1){
      e.x/=d; e.y/=d;
      let gx=e.x/(A*A), gy=e.y/(B*B);
      const gl=Math.hypot(gx,gy)||1; gx/=gl; gy/=gl;
      e.contact=true;
      if(bounce){
        const vn=e.vx*gx+e.vy*gy;
        hitSpeed=Math.max(hitSpeed,Math.abs(vn));
        e.vx-=gx*vn*1.4; e.vy-=gy*vn*1.4;
        e.vx*=0.88; e.vy*=0.88;
      }
    }
    return hitSpeed;
  }
  if(e.x < -ARENA_W/2+R){ e.x=-ARENA_W/2+R; e.contact=true; if(bounce){hitSpeed=Math.max(hitSpeed,Math.abs(e.vx)); e.vx*=-0.4;} }
  if(e.x >  ARENA_W/2-R){ e.x= ARENA_W/2-R; e.contact=true; if(bounce){hitSpeed=Math.max(hitSpeed,Math.abs(e.vx)); e.vx*=-0.4;} }
  if(e.y < -ARENA_H/2+R){ e.y=-ARENA_H/2+R; e.contact=true; if(bounce){hitSpeed=Math.max(hitSpeed,Math.abs(e.vy)); e.vy*=-0.4;} }
  if(e.y >  ARENA_H/2-R){ e.y= ARENA_H/2-R; e.contact=true; if(bounce){hitSpeed=Math.max(hitSpeed,Math.abs(e.vy)); e.vy*=-0.4;} }
  return hitSpeed;
}

function blockHitPoint(x,y,r){
  if(street) return cityHitPoint(x, y);
  if(mode==='race' || mode==='convoy'){
    if(race) return trackProject(x,y).d > TRK.HW - (r||0) ? true : null;
    return Math.abs(roadProject(x, y).lat) > TRK.HW - (r||0) ? true : null;
  }
  for(const b of blocks){
    if(b.type==='barrel' || b.type==='mound'){
      if(Math.hypot(x-b.x, y-b.y) < b.w/2+(r||0)) return b;
    } else if(Math.abs(x-b.x)<b.w/2+r && Math.abs(y-b.y)<b.h/2+r) return b;
  }
  if(arenaShape==='oval'){
    const A=ARENA_W/2-(r||0), B=ARENA_H/2-(r||0);
    if(Math.hypot(x/A, y/B) > 1) return true;
    return null;
  }
  if(x<-ARENA_W/2||x>ARENA_W/2||y<-ARENA_H/2||y>ARENA_H/2) return true;
  return null;
}

// ---------------------------------------------------------------- effects
function particles(x,y,z,n,opt){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=rnd(opt.spd0||20,opt.spd1||120);
    fx.push({ x,y,z:z||2, vx:Math.cos(a)*s, vy:Math.sin(a)*s, vz:rnd(opt.up0||10,opt.up1||70),
      life:rnd(opt.life0||0.3,opt.life1||0.8), t:0, col:opt.col, size:opt.size||2,
      grav:opt.grav==null?140:opt.grav, floor:opt.floor||0, clip:opt.clip||null });
  }
}
// 1 right on top of the camera, 0 past SHAKE.FAR. A blast you cannot see has
// no business moving the view; one under your bumper still hits full force.
function shakeFade(x, y){
  const d = Math.hypot(x - cam.x, y - cam.y);
  if(d <= SHAKE.NEAR) return 1;
  if(d >= SHAKE.FAR)  return 0;
  return 1 - (d - SHAKE.NEAR)/(SHAKE.FAR - SHAKE.NEAR);
}
function explode(x,y,power,owner,dmg,radius,opt){
  opt = opt || {};
  const z = opt.z || 0;                 // height of the blast above the floor plane
  const clip = opt.clip || null;        // confine the debris, e.g. to the mouth of a pit
  const tight = clip ? 0.4 : 1;         // a blast in a hole cannot throw debris across the arena
  // Both of these are scaled by how far the CAMERA is from the blast - see SHAKE
  // in config.js for why. Past SHAKE.FAR there is no kick and no bang at all: a
  // sentry being run over somewhere across the city is not an event you are in.
  // Nothing the player fires can reach that far anyway (a missile travels 190
  // units/s for 2.6 s = 494 units, a mine lands behind you), so this silences
  // only explosions you had nothing to do with and could not see.
  const fade = shakeFade(x, y);
  if(fade > 0) Snd.boom();
  cam.shake = Math.min(9, cam.shake + power*3*fade);
  fx.push({ ring:true, x, y, z:z+4, t:0, life:0.35, r0:6, r1:radius||58, clip });
  particles(x,y,z+6,18,{col:['#ffe9a8','#ff9d3d','#e04a20'],spd0:40*tight,spd1:200*tight,
    size:3,life0:0.25,life1:0.7,floor:z,clip,up1:70*tight});
  particles(x,y,z+6,10,{col:['#4a3f50','#6b5c72'],spd0:10*tight,spd1:60*tight,
    size:4,life0:0.5,life1:1.2,grav:20,floor:z,clip});
  const R = radius||58;
  for(const c of cars){
    if(c.dead) continue;
    const d=Math.hypot(c.x-x,c.y-y);
    if(d<R){
      const f=1-d/R;
      damage(c, (dmg||30)*f, owner);
      const a=Math.atan2(c.y-y,c.x-x);
      c.vx += Math.cos(a)*220*f; c.vy += Math.sin(a)*220*f;
    }
  }
  // The sentries take blast as well: the user's rule is that the car's weapons
  // kill them, and a missile or a mine is how a driver reaches one.
  //
  // `dmg` is read RAW here, not through the cars' `dmg||30` fallback above. A
  // wrecked car - and a wrecked sentry - passes 0 on purpose, and two things turn
  // on that: 0 must not splash the sentry standing next to it, and a 0-damage
  // blast must not PROVOKE it either, which would quietly break "shooting one
  // does not turn the others on you". foeDamage ignores a non-positive amount.
  if(foes.length) for(const f of foes){
    if(f.dead) continue;
    const d=Math.hypot(f.x-x,f.y-y);
    if(d<R) foeDamage(f, (dmg||0)*(1-d/R), owner);
  }
  for(const b of blocks){
    if(b.type==='barrel' && b.hp>0 && Math.hypot(b.x-x,b.y-y)<R+18){ b.hp-=40; if(b.hp<=0) popBarrel(b,owner); }
  }
}
function popBarrel(b, owner){
  b.hp=0;
  const i=blocks.indexOf(b); if(i>=0) blocks.splice(i,1);
  explode(b.x,b.y,0.8,owner,26,64);
}

// one predicate for "this car cannot be hurt right now": the post-spawn grace
// window, or dev mode on the player's car. Hazards read it too, so a pit never
// swallows a car that a shot could not scratch.
function untouchable(c){ return c.invuln>0 || (devMode && c.isPlayer); }

// ---- player upgrades (config.js 3b). Levels are clamped to 0..UPGRADE_MAX.
// The levels THIS run has (bought at the Scrap Saints' garage); a run starts from UPGRADES.
let runUp = Object.assign({}, UPGRADES);
let cash = 0;                        // Scrap Saints money, this run
let saintsPay = null;                // the "+$25" toast: { amt, t }
function upgradeLv(k){ return clamp(Math.round(runUp[k] || 0), 0, UPGRADE_MAX); }
function upgradeTotal(){ return ['armor','health','gun','missile','boost'].reduce((n,k)=>n+upgradeLv(k), 0); }
// share of each hit the armor takes away: 0 at level 0, ARMOR_MIN..ARMOR_MAX over levels 1..UPGRADE_MAX
function armorCutAt(lv){
  if(lv <= 0) return 0;
  return UPGRADE_MAX > 1 ? ARMOR_MIN + (ARMOR_MAX - ARMOR_MIN)*(lv - 1)/(UPGRADE_MAX - 1) : ARMOR_MAX;
}
function armorCut(){ return armorCutAt(upgradeLv('armor')); }
// a green square: a share of the hull you have, so it keeps its worth as HEALTH levels add up
function healPickup(c){ return Math.round(c.maxHp*HEAL_PICKUP); }
function playerMaxHp(){ return CAR_HP + HEALTH_PER_LEVEL*upgradeLv('health'); }
function gunDmgAt(lv){ return GUN_DMG + GUN_DMG_PER_LEVEL*lv; }
function missileDmgAt(lv){ return MISSILE_DMG*(1 + MISSILE_DMG_PER_LEVEL*lv); }
// BOOST upgrade: seconds of recharge. The 0.5 floor is insurance against a config
// edit (a cooldown of 0 would hand the player a boost that never ends).
function boostCoolAt(lv){ return Math.max(0.5, BOOST_COOL - BOOST_COOL_PER_LEVEL*lv); }
function boostCool(){ return boostCoolAt(upgradeLv('boost')); }
function gunDmg(c){ return gunDmgAt(c.isPlayer ? upgradeLv('gun') : 0); }
function missileDmg(c){ return missileDmgAt(c.isPlayer ? upgradeLv('missile') : 0); }

function damage(c, amount, ownerId){
  if(c.dead || untouchable(c)) return;
  if(c.isPlayer) amount *= 1 - armorCut();       // ARMOR upgrade
  c.hp -= amount;
  c.hurtFlash = 0.12;
  if(ownerId!=null && ownerId!==c.id) c.lastHitBy = ownerId;
  if(ownerId===0 && !c.isPlayer) gunnerHit = 0.18;      // crosshair hit marker
  if(c.hp<=0){
    c.hp=0; c.dead=true; c.respawn=2.6; c.deaths++;
    const dz = c.deathZ || 0, dclip = c.deathClip || null, sp = dclip ? 0.45 : 1;
    // the yellow one is a bomb on wheels - its wreck is the weapon
    const bomb = c.etype === 'tanque' && !dclip;
    // down a hole the blast cannot spread outward, so it spreads across the
    // lower plane instead and vents back up through the mouth
    explode(c.x, c.y, bomb?2.4:1.2, null, bomb?BOMB_DMG:0,
            dclip ? dclip.r*0.9 : (bomb?BOMB_R:10), {z:dz, clip:dclip});
    particles(c.x,c.y,dz+6,dclip?20:14,{col:[c.color,'#ffd27a','#3a3040'],
      spd0:60*sp,spd1:220*sp,size:3,life0:0.4,life1:1.0,floor:dz,clip:dclip});
    if(dclip){
      fx.push({ ring:true, x:dclip.x, y:dclip.y, z:dz+3, t:0, life:0.5,
                r0:dclip.r*0.25, r1:dclip.r*0.95, clip:dclip });
      particles(dclip.x,dclip.y,4,16,{col:['#6b5c72','#4a3f50','#8a5a3a'],
        spd0:6,spd1:44,size:4,life0:1.0,life1:1.9,grav:-34,up0:40,up1:96});
      particles(dclip.x,dclip.y,6,7,{col:['#ffb648','#e0742a'],
        spd0:8,spd1:38,size:3,life0:0.3,life1:0.6,grav:-90,up0:70,up1:150});
    }
    const killer = carById(c.lastHitBy);
    if(killer && killer!==c){
      killer.frags++;
      if(killer.isPlayer){
        gunnerKill = 1.1; convoyKills++;
        // the Scrap Saints pay for every piece of state property you wreck
        const pay = SAINTS.BOUNTY[c.etype] || 0;
        if(pay){ cash += pay; saintsPay = { amt: pay + (saintsPay && saintsPay.t > 0 ? saintsPay.amt : 0), t: 1.8 }; }
      }
    }
    else if(!dclip){ c.frags = Math.max(0, c.frags-1); }   // no penalty for a pit
  } else {
    Snd.hit();
  }
}

// ---------------------------------------------------------------- weapons
// the player's guns follow the gunner's traverse, not the nose of the car
function aimAngle(c){ return c.isPlayer ? c.angle + (c.turret||0) : c.angle; }

// The enemy submachine gun overheats. The AI held the trigger down for as long as
// it had a target, which gave the player no gaps to work in; a burst is now
// finite. GUN_BURST seconds of actual firing and the gun is out for GUN_REST,
// then it starts clean. Heat is counted per shot (each one occupies a `cool`
// slot), so it measures real trigger time rather than time spent near a target.
// The player's gun is deliberately untouched.
function fireCannon(c){
  if(c.cool>0) return;
  if(!c.isPlayer){
    if(c.gunRest>0) return;                       // still cooling off
    c.gunHeat += 0.14;                            // this shot's worth of trigger time
    if(c.gunHeat >= GUN_BURST){ c.gunHeat = 0; c.gunRest = GUN_REST; }
  }
  c.cool = 0.14;
  const aim = aimAngle(c);
  const fx0=Math.cos(aim), fy0=Math.sin(aim);
  const spread = c.isPlayer ? 0.02 : 0.05;
  const a = aim + rnd(-spread,spread);
  shots.push({ kind:'bullet', x:c.x+fx0*18, y:c.y+fy0*18, z:6,
    vx:Math.cos(a)*430 + c.vx*0.3, vy:Math.sin(a)*430 + c.vy*0.3,
    life:1.0, owner:c.id, dmg:gunDmg(c) });
  c.vx -= fx0*8; c.vy -= fy0*8;
  Snd.shot();
  particles(c.x+fx0*20,c.y+fy0*20,6,2,{col:['#ffe9a8'],spd0:10,spd1:40,size:1,life0:0.05,life1:0.12,grav:0});
}
function fireMissile(c){
  if(c.mcool>0 || c.missiles<=0) return;
  c.mcool = 0.85; c.missiles--;
  const aim = aimAngle(c);
  const fx0=Math.cos(aim), fy0=Math.sin(aim);
  shots.push({ kind:'missile', x:c.x+fx0*18, y:c.y+fy0*18, z:7,
    vx:fx0*190, vy:fy0*190, angle:aim, life:2.6, owner:c.id, dmg:missileDmg(c), smoke:0 });
  Snd.missile();
}
// SPACE. Refuses while a charge is still recharging, while the burn is already
// running, and while the car is wrecked or down a pit - so it can never be used to
// drive out of a hazard the pit is supposed to hold you in.
function tryBoost(c){
  if(!c || c.dead || c.pitT>0) return;
  if(c.boostT>0 || c.boostCD>0) return;
  c.boostT = BOOST_TIME; c.boostCD = c.isPlayer ? boostCool() : BOOST_COOL;
  Snd.boost();
  cam.shake = Math.min(9, cam.shake + 1.2);
}
function dropMine(c){
  if(c.minecool>0 || c.minesLeft<=0) return;
  c.minecool=0.5; c.minesLeft--;
  const fx0=Math.cos(c.angle), fy0=Math.sin(c.angle);
  mines.push({ x:c.x-fx0*20, y:c.y-fy0*20, owner:c.id, arm:0.6, life:16, blink:0 });
  Snd.mine();
}

// ---------------------------------------------------------------- car update
function updateCar(c, dt){
  c.cool=Math.max(0,c.cool-dt); c.mcool=Math.max(0,c.mcool-dt);
  c.gunRest=Math.max(0,c.gunRest-dt);
  c.minecool=Math.max(0,c.minecool-dt); c.invuln=Math.max(0,c.invuln-dt);
  c.ramT=Math.max(0,(c.ramT||0)-dt);
  c.hurtFlash=Math.max(0,c.hurtFlash-dt);
  // boost timers. The recharge waits for the burn to finish rather than running
  // through it, so 10 really is 10 seconds of not having it.
  c.boostT=Math.max(0,(c.boostT||0)-dt);
  if(c.boostT<=0) c.boostCD=Math.max(0,(c.boostCD||0)-dt);
  // fast in (~0.1s), slow out (~1.5s): the frame reels you back in after the burn
  c.boostEase = lerp(c.boostEase||0, c.boostT>0?1:0,
                     1-Math.pow(c.boostT>0?BOOST_EASE_IN:BOOST_EASE_OUT, dt));

  if(c.dead){
    c.respawn-=dt;
    // convoy is one life: enemies are culled once wrecked, the player ends the run
    if(mode==='convoy') return;
    if(c.respawn<=0){
      if(mode==='race'){
        const p=trackPoint(c.prog==null?0:c.prog, 0);
        c.x=p.x; c.y=p.y; c.angle=p.ang;
      } else {
        c.x=0; c.y=0; c.angle=0;
      }
      c.vx=c.vy=0;
      c.hp=c.maxHp; c.dead=false; c.invuln=1.6; c.missiles=Math.max(c.missiles,1); c.lastHitBy=-1;
      c.reverseT=0; c.pitT=0; c.deathZ=0; c.deathClip=null;
    }
    return;
  }

  if(c.pitT>0){
    c.pitT-=dt;
    const k=1-Math.pow(0.015,dt);
    c.x=lerp(c.x,c.pitX,k); c.y=lerp(c.y,c.pitY,k);
    c.vx*=0.86; c.vy*=0.86;
    c.angle+=2.6*dt;
    if(c.pitT<=0){
      c.pitT=0;
      c.deathZ = -PIT_DEPTH;
      c.deathClip = { x:c.pitX, y:c.pitY, r:c.pitR };
      damage(c, 9999, null);
      c.deathZ = 0; c.deathClip = null;
    }
    return;
  }

  let throttle=0, steer=0, brake=false;
  if(c.isPlayer && onFoot){
    // parked: nobody at the wheel. Handbrake on, so a car you jumped out of
    // rolling still pulls up rather than coasting off up the road.
    // A straight decay rather than throttle -1, which would drive a car rolling
    // backwards further into reverse.
    const k = Math.pow(0.04, dt);
    c.vx *= k; c.vy *= k;
    if(Math.hypot(c.vx, c.vy) < 2){ c.vx = 0; c.vy = 0; }
    brake = true;
  } else if(c.isPlayer){
    if(held('KeyA')) steer-=1;
    if(held('KeyD')) steer+=1;
    brake = held('ShiftLeft')||held('ShiftRight');
    // the pad: the left stick steers analog (A/D are a flat -1/+1), L2 drifts.
    // Clamped because the keyboard may be pushing the same way at the same time.
    if(padMode()){
      steer = clamp(steer + padSteer(), -1, 1);
      if(padHeld('L2')) brake = true;
    }
    if(race || street){
      // a real race (or STREET's free drive): you hold the throttle. W/S drive
      // and brake directly.
      if(held('KeyW')) throttle+=1;
      if(held('KeyS')) throttle-=1;
      if(padMode()) throttle = clamp(throttle + padThrottle(), -1, 1);
    } else {
      // survival: you sit at a cruise pace and W/S trim it within a band; your
      // position in the frame is the speed you chose.
      //
      const fwdNow = c.vx*Math.cos(c.angle) + c.vy*Math.sin(c.angle);
      // how far you are trimming the cruise pace: W/S are a flat +/-1, the pad's
      // left stick is analog, so it picks a place in the frame rather than an end
      let boost = held('KeyW') ? 1 : held('KeyS') ? -1 : 0;
      if(padMode() && !boost) boost = padThrottle();
      // The ceiling follows the scroll. It used to be a flat 240 while camV ramps
      // to CAM_VMAX = 214, so the FORWARD half of the band evaporated as a run
      // went on - W was worth +59 over the camera at the start and +7 by full
      // pace, while S kept its whole -85 throughout. That asymmetry is the "it
      // won't accelerate any more": late in a run the car brakes fine and will
      // not pull. Nothing else about the controller changes - it still measures
      // along the nose, still has no feed-forward, so the hand of it is the same.
      // the boost sits ON TOP of the band, so W+SPACE is the fastest thing there is
      const targetF = Math.max(60, camV + boost*CRUISE_BAND + (c.boostT>0?BOOST_ADD:0));
      throttle = clamp((targetF - fwdNow)/40, -1, 1);
      // Just been shunted from behind: coast instead of braking, or the regulator
      // scrubs the shove off within a couple of tenths and you never feel it.
      // Drag still bleeds it, so the boost fades on its own rather than stopping.
      if(c.ramT>0 && throttle<0) throttle = 0;
    }
    // the gun rides in every stage now (2P gunner, or the solo driver on mouse/arrows)
    updateTurret(c, dt);
  } else {
    aiThink(c, dt);
    throttle=c.aiThrottle; steer=c.aiSteer; brake=c.aiBrake;
  }

  const fx0=Math.cos(c.angle), fy0=Math.sin(c.angle);
  let fwd = c.vx*fx0 + c.vy*fy0;
  let lat = -c.vx*fy0 + c.vy*fx0;

  // ...and the top speed with it, or the raised ceiling above is unreachable: a
  // flat 232 against a 214 scroll leaves 18 units/s of headroom and the target
  // can never be met. The player only, and the survival stages only - enemies and
  // the loop race keep the fixed 232, since this is about the frame, not racing.
  // The player's top end rises with the scroll. An enemy's is its pace times the
  // standard 232, so a soldado is exactly the car it always was and the other two
  // sit 10% either side of it.
  //
  // This used to key off camV and skip any car whose pace was 1, which meant the
  // soldado kept a flat 232 while the batedor got camV*1.1 - 165 early in a run.
  // The quick one was comfortably the slowest of the three for most of a game.
  // the boost raises the ceiling with the target - a target above MAXF can never
  // be met, which is the same trap the comment above describes for the scroll
  const bst = (c.isPlayer && c.boostT>0) ? BOOST_ADD : 0;
  const MAXF = c.isPlayer ? (race || street ? CAR_TOP+bst : Math.max(CAR_TOP, camV + CRUISE_BAND + 12) + bst)
             : (race ? CAR_TOP : CAR_TOP*c.pace);
  const MAXR=95, ACC = bst ? BOOST_ACC : CAR_ACC;
  const SPIN_FREE = 60*Math.PI/180;   // past this you are being spun, not driving
  const SPIN_RIGHT = 2.2;             // rad/s the latched righting turns you back
  if(throttle>0) fwd += ACC*dt*throttle;
  else if(throttle<0) fwd += (fwd>0 ? -520 : -260)*dt*Math.abs(throttle);
  fwd -= fwd*0.7*dt;
  fwd = clamp(fwd, -MAXR, MAXF);

  // the big one is loose at the back: it washes out sideways and takes a moment to
  // gather itself up, which is what makes it something to dodge rather than fight
  const grip = brake ? 1.7 : (c.etype==='tanque' ? 3.4 : 6.4);
  lat -= lat*Math.min(1, grip*dt);

  const turnAuth = clamp(Math.abs(fwd)/70, 0, 1);
  c.angle += steer * 2.75 * dt * turnAuth * (fwd<0?-1:1) * (brake?1.25:1);

  // SPIN RECOVERY - survival stages, player only. See PROJECT.md 2026-09-24.
  //
  // Spun past broadside while the soft wall holds you, the car used to be
  // permanently undriveable: the wall rewrites world velocity every frame after
  // the physics step, so `fwd` stops meaning what the car is doing, and `fwd` is
  // what both the throttle controller and the steering sign are built on. Five
  // fixes aimed at those three - throttle model, authority floor, auto-recovery -
  // all failed, two of them made it worse.
  //
  // This one works on the HEADING instead, which is the one quantity the wall
  // never touches: it is kinematic, so no amount of velocity nonsense can stop
  // it. Past SPIN_FREE off the road axis the car rights itself, easing in over
  // the next SPIN_RAMP so there is no step at the threshold. Under SPIN_FREE
  // nothing happens at all, and you never drive a survival stage broadside on
